apiVersion: v2
name: longhorn-secrets
description: |
  ExternalSecrets for the Longhorn (Hetzner GPU nodes) storage UI — the
  oauth2-proxy Keycloak client credentials + cookie-signing secret. Leaf
  chart of the longhorn-auth App-of-Apps orchestrator (ADR-0093), lowest
  sync-wave so the Secret exists before longhorn-auth starts. References the
  `ssegning-aws` ClusterSecretStore (ADR-0018 in-chart ownership).
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - longhorn
  - secrets
  - external-secrets
maintainers:
  - name: ai-helm

dependencies:
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common
