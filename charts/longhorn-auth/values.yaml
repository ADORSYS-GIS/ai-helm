# longhorn-auth App-of-Apps orchestrator — renders two child Application CRs
# (longhorn-secrets + longhorn-auth). Follows the homepage/lightbridge
# canonical pattern (ADR-0019), trimmed to two children — see Chart.yaml.
#
# The Longhorn UI ships no authentication of its own AND grants full
# volume/node management (including delete) — longhorn-auth (a dedicated
# oauth2-proxy, reverse-proxy mode) is the front door and the sole gate,
# restricted to the `longhorn_roles` Keycloak claim (not any authenticated
# user — see ADR-0093).

# ────────────────────────────────────────────────────────────────────────
# Shared ArgoCD wiring for all child Applications. Same namespace as the
# Longhorn workload itself (longhorn-system) — auth colocated with what it
# protects, matching homepage's own-namespace convention.
# ────────────────────────────────────────────────────────────────────────
argocd:
  project: ai
  # OCI chart-float (ADR-0055) for the secrets leaf; $values ref (Source B)
  # for longhorn-auth's workload values, from ai-helm-values@main.
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  repoURL: https://github.com/adorsys-gis/ai-helm-values
  targetRevision: main
  destination:
    name: home-remote
    allowInCluster: false
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ────────────────────────────────────────────────────────────────────────
# longhorn-secrets child — the ExternalSecrets leaf chart (this repo).
# Lowest sync-wave: the oauth2-proxy client-id/secret/cookie must exist
# before longhorn-auth starts.
# ────────────────────────────────────────────────────────────────────────
secrets:
  enabled: true
  appName: longhorn-secrets
  chartName: longhorn-secrets   # OCI chart name
  releaseName: longhorn-secrets
  syncWave: "0"

# ────────────────────────────────────────────────────────────────────────
# longhorn-auth child — a dedicated oauth2-proxy instance (own Keycloak
# client `longhorn-proxy`, own cookie secret — not shared with any other
# app) gating the Longhorn UI via reverse-proxy mode, restricted to the
# `longhorn_roles` claim. Upstream chart, classic Helm repo, pinned — not
# floated.
# ────────────────────────────────────────────────────────────────────────
auth:
  enabled: true
  appName: longhorn-auth
  releaseName: longhorn-auth
  syncWave: "1"
  chart:
    repoURL: https://oauth2-proxy.github.io/manifests
    name: oauth2-proxy
    targetRevision: "10.7.0"
  # App-scoped deps (ingress Certificate) for the Longhorn UI front door —
  # routes longhorn.ai.camer.digital to THIS release's Service. No "app"
  # child exists in this orchestrator (unlike homepage) to carry it instead.
  depsOverlay: environments/prod/deps/longhorn-auth
