# CI / reference values for the upstream oauth2-proxy chart
# (https://oauth2-proxy.github.io/manifests, chart oauth2-proxy).
#
# This file serves TWO purposes:
# 1. Human reference copy — kept structurally in sync with the PRIVATE
#    ai-helm-values repo file at environments/prod/values/longhorn-auth.yaml
#    (NOT auto-linted: the top-level repo CI loop only picks up
#    charts/<chart>/ci/*-values.yaml, and this file is named *-auth.yaml).
# 2. Documentation of the exact chart schema decisions (config.existingSecret,
#    upstream/redirect via extraArgs, the role-restriction claim, no
#    chart-owned ingress).
#
# A DEDICATED instance for Longhorn (own Keycloak client `longhorn-proxy`,
# own cookie secret) — NOT shared with any other app (ADR-0093, mirrors the
# ADR-0089 homepage-auth shape — see that ADR + charts/lakefs git history for
# the "reverse-proxy mode" vs "ForwardAuth" lesson: reverse-proxy mode is
# required so oauth2-proxy never touches the upstream's own responses).
# Runs in full REVERSE-PROXY mode: the depsOverlay ingress routes ALL of the
# Longhorn hostname (`/`) to this release's Service
# `longhorn-auth-oauth2-proxy:80`, and oauth2-proxy proxies authenticated
# traffic to `upstream` (the in-cluster longhorn-frontend Service) while
# redirecting unauthenticated document requests to Keycloak. The Longhorn UI
# has NO native login of its own, so this is the sole auth gate.
#
# ⚠️ UNLIKE homepage-auth: this instance also restricts access to a specific
# Keycloak client role (`admin` on the `longhorn-proxy` client, mapped into
# the `longhorn_roles` claim — see charts/keycloak-baseline). The Longhorn UI
# grants full volume/node management including delete, so "any authenticated
# camer-digital user" would be too broad — oidc-groups-claim +
# allowed-group restrict it to users the operator explicitly grants the
# `admin` client role to.

config:
  existingSecret: longhorn-proxy-secret
  cookieName: "_longhorn_proxy"
  emailDomains:
    - "*"

extraArgs:
  provider: "keycloak-oidc"
  oidc-issuer-url: "https://auth.verif.fyi/realms/camer-digital"
  redirect-url: "https://longhorn.ai.camer.digital/oauth2/callback"
  upstream: "http://longhorn-frontend.longhorn-system.svc.cluster.local:80"
  reverse-proxy: "true"
  cookie-secure: "true"
  skip-provider-button: "true"
  set-xauthrequest: "true"
  silence-ping-logging: "true"
  # Role restriction (ADR-0093): the longhorn-proxy Keycloak client scope is
  # a DEFAULT client scope (charts/keycloak-baseline), so the longhorn_roles
  # claim is present in every token issued to this client without needing an
  # explicit --scope flag here. A user with no `admin` client role gets an
  # empty/absent claim and --allowed-group rejects the login.
  oidc-groups-claim: "longhorn_roles"
  allowed-group: "admin"

# No chart-owned ingress — the depsOverlay Ingress routes the whole
# hostname to this release's Service.
ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
