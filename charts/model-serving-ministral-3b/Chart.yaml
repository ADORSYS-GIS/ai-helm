apiVersion: v2
name: model-serving-ministral-3b
description: |
  Self-hosted LLM on the home GPU: Ministral-3B-Instruct-2410 AWQ served via
  vLLM (kserve/huggingfaceserver) with a Caddy auth-proxy sidecar. AWQ 4-bit
  quantized (3B params, ~2 GB) — fits a 32K context on a 6 GB GPU (RTX 1000
  Ada Laptop) with room for KV cache. Weights are pre-seeded into a PVC (no
  per-start HuggingFace download).

  Deployed via homeCluster (ADR-0017 exception) and federated into the Hetzner
  Envoy AI Gateway as an OpenAI backend. See ADR-0022 (federation) + ADR-0029
  (serving mode) + ADR-0030 (one STS via bjw-template).
type: application
version: 0.1.1
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - llm
  - vllm
  - mistral
  - ministral
  - awq
  - inference
  - gpu
maintainers:
  - name: ai-helm

dependencies:
  - name: bjw-template
    version: "4.6.2"
    repository: "file://../bjw-template"
    alias: modelServing
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common
