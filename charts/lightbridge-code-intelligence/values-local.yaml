# ── Config ────────────────────────────────────────────────────────────────────
config:
  appHandle: "lightbridge-ai"
  gitlab:
    enabled: true
    defaultApiUrl: "https://gitlab.com/api/v4"
    defaultBotHandle: "lightbridge-ai"
    projects:
      - projectId: 84194683
        accessToken: "glpat-mKe-gyD_gw7qwUFzf3J5UmM6MQpvOjEKdTpudmZwdg8.01.170fx2duq"
        webhookSecret: "my-secret"
      - projectId: 84143685
        accessToken: "glpat-dw0rI0H-PtZWWyxP4thqYWM6MQpvOjEKdTpvMDUyeA8.01.1717p69v9"
        webhookSecret: "a-secret"
  # OpenCode Task Configuration (ADR-0099 operator OpenCode overlay from ai-helm-values)
  model:
    deep:
      opencode:
        tools:
          task: true
        provider:
          eaig:
            models:
              file-scout:
                id: glm-4.7-flash
                name: "eaig file-scout (glm-4.7-flash)"
        agent:
          explore:
            tools:
              lightbridge_read_file: true
              lightbridge_vector_semantic_search: true
              lightbridge_graph_find_symbol: true
  reviewSystemPrompt: |
    # Role
    You are a senior code reviewer. You review THIS change (the diff), not the whole repository.
    Your job: find real bugs, security flaws, and broken assumptions before they reach production,
    and give an honest verdict a human can act on. You advise; the human merges.

    # Ground rules
    - Review only the diff. A problem in code this PR does not touch is NOT a finding on this PR.
    - Cite or don't claim. Every factual statement rests on a tool result. If you can't cite it,
      don't say it.
    - An empty tool result means "could not verify," never "absent." Confirm with `read_file`
      or say you couldn't verify it.
    - You are allowed to say "I don't know."

    # How to review
    1. Orient: read the diff and the PR description.
    2. Build a risk map: where could this break (auth, data, callers, concurrency, error paths)?
    3. Investigate high-risk areas with tool calls. State a hypothesis before each batch.
    4. For each confirmed problem, record a finding via `add_review_comment` with: severity
       (P0/P1/P2), file, line, the concrete failure mode, impact, cited evidence, and a fix.
    5. Refute your own P0/P1 blockers before finishing.
    6. Call `finish` exactly once with an honest verdict that reflects findings at every priority.

    # Severity
    - P0: must fix before merge (security, data loss, crash).
    - P1: should fix before merge (likely bug, broken contract).
    - P2: record but don't block (quality, maintainability).

    # Output
    - Record every real finding (including P2s) via `add_review_comment` — never narrate a
      finding in prose.
    - The verdict reflects findings at every priority; never reduce it to "no P0/P1 findings."
    - One channel per PR. Comment on the code, not the author.

# ── Metrics: OFF (no monitoring CRDs on minikube) ─────────────────────────────
metrics:
  serviceMonitors:
    enabled: false

# ── bjw-s controllers ─────────────────────────────────────────────────────────
lci:
  controllers:
    control-plane:
      containers:
        main:
          image:
            repository: lightbridge-control-plane
            tag: "local22"
          env:
            OIDC_ISSUER: "http://lightbridge-ci-keycloak:8080/realms/lightbridge"
            OIDC_AUDIENCE: "lightbridge-api"
            GITHUB_APP_HANDLE: "lightbridge-ai"
            DATABASE_URL:
              dependsOn: DB_PASSWORD
              value: "postgres://lightbridge:$(DB_PASSWORD)@lightbridge-ci-postgres:5432/lightbridge"
            NEO4J_URI:
              value: "bolt://lightbridge-ci-neo4j:7687"
            # OpenTelemetry tracing: send to Alloy (mirrors prod: control-plane → Alloy → Tempo).
            # Apply deploy/local/observability.yaml first to run Alloy + Tempo locally.
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observability.svc.cluster.local:4318"
            OTEL_TRACES_SAMPLER_ARG: "1.0"
            # Local-only: verbose OTLP + HTTP connection debug logs. Override prod's plain `info`.
            # opentelemetry_sdk/otlp=debug: batch flush events + export HTTP status.
            # reqwest=debug: logs each new TCP connection to alloy.observability.svc.cluster.local.
            RUST_LOG: "info,opentelemetry_sdk=debug,opentelemetry_otlp=debug,reqwest=debug"
    web:
      containers:
        main:
          image:
            repository: lightbridge-web
            tag: "local"
          env:
            OIDC_ISSUER: "http://lightbridge-ci-keycloak:8080/realms/lightbridge"
            OIDC_CLIENT_ID: "lightbridge-web"
            OIDC_REDIRECT_URI: "http://localhost:3000/api/auth/callback"
            OIDC_POST_LOGOUT_REDIRECT_URI: "http://localhost:3000"
            AUTH_BACKEND_URL: "http://lightbridge-ci-control-plane:8080"
            BETTER_AUTH_URL: "http://localhost:3000"

    dispatcher:
      containers:
        main:
          image:
            repository: lightbridge-control-plane
            tag: "local22"
          env:
            DATABASE_URL:
              dependsOn: DB_PASSWORD
              value: "postgres://lightbridge:$(DB_PASSWORD)@lightbridge-ci-postgres:5432/lightbridge"
            AGENT_CA_SECRET: ""
            AGENT_RUNNER_IMAGE: "lightbridge-agent-runner:local"
            AGENT_REVIEW_RUNNER_IMAGE: "lightbridge-agent-review:local"
            # OpenTelemetry tracing: send to Alloy (mirrors prod: dispatcher → Alloy → Tempo).
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.observability.svc.cluster.local:4318"
            OTEL_TRACES_SAMPLER_ARG: "1.0"
            # Local-only: verbose OTLP + HTTP connection debug logs.
            RUST_LOG: "info,opentelemetry_sdk=debug,opentelemetry_otlp=debug,reqwest=debug"

    reconciler:
      containers:
        main:
          image:
            repository: lightbridge-control-plane
            tag: "local22"
          env:
            DATABASE_URL:
              dependsOn: DB_PASSWORD
              value: "postgres://lightbridge:$(DB_PASSWORD)@lightbridge-ci-postgres:5432/lightbridge"

    neo4j:
      containers:
        main:
          probes:
            liveness:
              spec:
                initialDelaySeconds: 90
                periodSeconds: 20
                failureThreshold: 6
            readiness:
              spec:
                initialDelaySeconds: 30