# Local / minikube values for lightbridge-code-intelligence.
#
# Mirrors the docker-compose setup (compose.yaml + deploy/keycloak/realm-lightbridge.json):
#   - Postgres+pgvector (lightbridge/lightbridge/lightbridge)
#   - Neo4j (neo4j/lightbridge)
#   - Keycloak 26 (admin/admin, imports the `lightbridge` realm)
#   - Jaeger (in-cluster OTLP collector & quick query UI)
#   - Alloy + Tempo (full prod-like OTLP pipeline: control-plane → Alloy → Tempo)
#   - Control plane + web run against those deps
#
# Prerequisites (one-time setup, run before deploy-local.sh):
#   kubectl apply -f deploy/local/observability.yaml         # Alloy + Tempo in observability ns
#   kubectl apply -f deploy/local/alloy-internal-ca-placeholder.yaml  # empty CA secret for volume mount
#
# Usage:
#   minikube image load lightbridge-control-plane:local
#   minikube image load lightbridge-web:local
#   minikube image load lightbridge-agent-runner:local
#   minikube image load lightbridge-agent-review:local
#   helm upgrade --install lightbridge-ci charts/lightbridge-code-intelligence \
#     --namespace converse --create-namespace \
#     --values charts/lightbridge-code-intelligence/values.yaml \
#     --values charts/lightbridge-code-intelligence/values-local.yaml
#
# Then access:
#   1. Add to /etc/hosts:  127.0.0.1  lightbridge-ci-keycloak
#   2. kubectl port-forward -n converse svc/lightbridge-ci-keycloak 8080:8080
#   3. kubectl port-forward -n converse svc/lightbridge-ci-web 3000:3000
#   4. kubectl port-forward -n converse svc/lightbridge-ci-jaeger 16686:16686
#   5. kubectl port-forward -n observability svc/alloy 12345:12345  # Alloy admin UI
#   6. kubectl port-forward -n observability svc/tempo 3200:3200    # Tempo query API
#   → Keycloak admin: http://localhost:8080  (admin/admin)
#   → Web:            http://localhost:3000  (login: dev / password)
#   → Jaeger UI:      http://localhost:16686
#   → Alloy UI:       http://localhost:12345
#   → Tempo:          http://localhost:3200/ready

# ── Local Keycloak (replaces the external IdP) ────────────────────────────────
keycloak:
  enabled: true
  serviceType: ClusterIP
  oidcIssuer: "http://lightbridge-ci-keycloak:8080/realms/lightbridge"

# ── Local Postgres+pgvector (replaces the CNPG cluster) ──────────────────────
postgres:
  enabled: true

# ── Local Jaeger OTLP Collector + UI ─────────────────────────────────────────
jaeger:
  enabled: true
  serviceType: ClusterIP

