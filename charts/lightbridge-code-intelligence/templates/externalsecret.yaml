{{- $store := .Values.secrets.secretStore }}
{{- $refresh := .Values.secrets.refreshInterval }}
{{- $key := .Values.secrets.remoteKey }}
{{- $codeintelKey := .Values.secrets.codeintelKey }}
{{- $wave := .Values.syncWave.secrets | quote }}
# App-owned secrets pulled from the ssegning-aws ClusterSecretStore. Target Secret names
# are `<release>-{github,auth,neo4j-auth}` so the bjw workloads can secretKeyRef them.
# (The codeintel DB role password lives in charts/lightbridge-db, since CNPG needs it at
# DB-sync-wave to set the managed role.)
#
# The `-github` secret carries the registered GitHub App's credentials (App ID + RSA private
# key + webhook signing secret), all sourced from the dedicated `prod/codeintel/env` SM secret
# (`$codeintelKey`). The control plane uses App ID + private key to mint installation tokens
# (read repo contents, post reviews) and the webhook secret to verify `X-Hub-Signature-256`.
#
# The store coordinates are DEPLOYMENT-SPECIFIC and empty in the chart defaults (ADR-0057); the
# real values come from ai-helm-values. Guard the whole file on `$store` so a defaults-only render
# (helm lint / chart CI) emits ZERO ExternalSecrets instead of malformed ones with empty
# `secretStoreRef.name` / `remoteRef.key` / `property`. With the prod override `$store` is set, so
# every ExternalSecret below renders exactly as before (render-neutral).
{{- if $store }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-github
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-github
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.githubWebhookProperty }}
    - secretKey: app-id
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.githubAppIdProperty }}
    - secretKey: app-private-key
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.githubAppPrivateKeyProperty }}
{{- if and .Values.secrets.gitlabAdorsysSolutionsAccessTokenProperty .Values.secrets.gitlabAdorsysSolutionsWebhookSecretProperty }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-gitlab
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-gitlab
    creationPolicy: Owner
  data:
    - secretKey: adorsys-solutions-access-token
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.gitlabAdorsysSolutionsAccessTokenProperty }}
    - secretKey: adorsys-solutions-webhook-secret
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.gitlabAdorsysSolutionsWebhookSecretProperty }}
{{- end }}
{{- if .Values.secrets.a2aPushTokenKeyProperty }}
---
# A2A push-notification token-signing key (RFC-0006 Phase 3, ADR-0079 §3). The `notifier` role uses
# it to encrypt each push-config's webhook auth token at rest. Sourced from the dedicated codeintel
# bucket (`$codeintelKey`), like the GitHub App creds. Gated on the property name being set, so a
# defaults-only render — or an env that hasn't migrated the SM property yet — emits nothing instead of
# a malformed ExternalSecret. The 32-byte VALUE is an operator prereq in the SM bucket, never here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-a2a-push
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-a2a-push
    creationPolicy: Owner
  data:
    - secretKey: push-token-key
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.a2aPushTokenKeyProperty }}
{{- end }}
{{- /* TRANSITIONAL: the `-auth` secret feeds the outgoing better-auth web image. The OIDC web
       image (ADR-0014) is a PUBLIC client (PKCE, no client secret); drop this once it's live. */}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-auth
    creationPolicy: Owner
  data:
    - secretKey: better-auth-secret
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.secrets.betterAuthProperty }}
{{- if (index .Values "lci" "controllers" "neo4j") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-neo4j-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-neo4j-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.secrets.neo4jPasswordProperty }}
{{- end }}
{{- if .Values.agents.enabled }}
{{- if .Values.secrets.runnerTokenSigningKeyProperty }}
---
# Per-task runner-token signing key (lightbridge-code-intelligence#243, ADR-0092) — control-plane's
# own secret: `serve` verifies with it, `dispatcher` mints a fresh, task-scoped token with it and
# injects ONLY the minted token (never this key) into each Job's AGENT_RUNNER_TOKEN env. Never read
# by the Job itself. Supersedes the old shared AGENT_RUNNER_TOKEN bearer secret (purged from this
# chart in the same change — the hard cutover in #410 already stopped any code from reading it).
# Gated on the property
# name being set — same "defaults-only render stays render-neutral" reasoning as the a2a-push secret
# above — so an environment that hasn't provisioned the SM property yet gets no ExternalSecret instead
# of one with an empty `property:`. The 32+ byte VALUE is an operator prereq in the SM bucket, never
# generated or stored here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-runner-signing
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-runner-signing
    creationPolicy: Owner
  data:
    - secretKey: signing-key
      remoteRef:
        key: {{ $codeintelKey }}
        property: {{ .Values.secrets.runnerTokenSigningKeyProperty }}
{{- end }}
---
# The per-Job config Secret, in the AGENTS namespace (the Job's secretKeyRef target — see the app
# repo's k8s.rs). Base URLs + the embeddings model are stable literals; the API key reuses the eaig
# gateway key (`converse_openai_api_key`). The LLM (review) keys are added ONLY when review is
# enabled — otherwise this ExternalSecret never references `agent_llm_model`, so a missing SM
# property can't fail the sync and take embeddings (= indexing) down with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightbridge-agent-secrets
  namespace: {{ .Values.agents.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: lightbridge-agent-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # EmbeddingsClient appends `/v1/embeddings`, so NO trailing /v1 here (ADR-0018).
        embeddings-base-url: {{ .Values.agents.embeddings.baseUrl | quote }}
        embeddings-model: {{ .Values.agents.embeddings.model | quote }}
        embeddings-api-key: "{{ `{{ .openaiKey }}` }}"
{{- if .Values.agents.llm.enabled }}
        # OpenCode's @ai-sdk/openai-compatible posts to `{baseURL}/chat/completions`, so DO include
        # /v1 (ADR-0021). Only present when review is enabled. Model + base URL are chart literals;
        # the key reuses the gateway key (no SM property for the model).
        llm-base-url: {{ .Values.agents.llm.baseUrl | quote }}
        llm-api-key: "{{ `{{ .openaiKey }}` }}"
        llm-model: {{ .Values.agents.llm.model | quote }}
{{- end }}
  data:
    - secretKey: openaiKey
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.secrets.openaiKeyProperty }}
{{- if and .Values.agents.pullSecretName .Values.secrets.ghcrUsernameProperty .Values.secrets.ghcrTokenProperty }}
---
# GHCR pull secret in the AGENTS namespace (private-image cutover). The runner images
# (ghcr.io/adorsys-gis/*) are private, and the Jobs the dispatcher launches here get NO bjw
# defaultPodOptions (they're built imperatively in the app repo's k8s.rs), so the pull credential must
# live in THIS namespace and be attached to the agent SA (agents-rbac.yaml) — pull secrets are
# namespace-scoped, so the `converse` copy the bjw controllers use can't serve these Jobs. Same
# dockerconfigjson shape + same PAT the rest of the platform uses (github_username/github_token in the
# remoteKey bucket, keyed on the ghcr.io HOST so it also covers the adorsys-gis org). Gated on the two GHCR
# property names being set, so a defaults-only render (helm lint) emits nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.agents.pullSecretName }}
  namespace: {{ .Values.agents.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.agents.pullSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.secrets.ghcrUsernameProperty }}
    - secretKey: token
      remoteRef:
        key: {{ $key }}
        property: {{ .Values.secrets.ghcrTokenProperty }}
{{- end }}
{{- end }}
{{- end }}{{/* if $store */}}
