{{- /*
Two ConfigMaps:
  1. nginx-config — custom default.conf so the served file gets the
     right Content-Type (no file extension on the well-known URL).
  2. content — the well-known JSON itself, materialised at the path
     the deployment volume-mounts.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen       8080;
      server_name  _;

      # The well-known file is mounted under /usr/share/nginx/html/opencode/...
      # This custom server block REPLACES the stock default.conf (which set
      # `root /usr/share/nginx/html`), so we must set root again — otherwise
      # try_files resolves against nginx's compiled-in default root
      # (/etc/nginx/html) and the file is never found → 404.
      root /usr/share/nginx/html;

      # The well-known file has no extension; force JSON Content-Type.
      types { application/json json; }
      default_type application/json;

      # Health probe.
      location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
      }

      # Exact-match for the opencode well-known endpoint.
      # File lives at /usr/share/nginx/html/opencode/.well-known/opencode
      # (mounted by the Deployment from the content ConfigMap).
      location = /opencode/.well-known/opencode {
        add_header Cache-Control "no-store" always;
        try_files /opencode/.well-known/opencode =404;
      }

      # TEMPORARY OpenCode v1 bridge (ADR-0142): a v1 client runs
      # `opencode auth login https://ai.camer.digital/opencode-v1`. Its file
      # is the `opencode-v1` key of the same content ConfigMap, so it sits
      # beside the v2 file in the one mounted directory. Remove with the bridge.
      location = /opencode-v1/.well-known/opencode {
        add_header Cache-Control "no-store" always;
        try_files /opencode/.well-known/opencode-v1 =404;
      }

      # Everything else 404s — this nginx serves exactly these endpoints.
      location / {
        return 404;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-content
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
data:
  # The well-known JSON. Render the structured `wellKnown` value as JSON
  # (compact, deterministic) so a YAML→JSON drift in the values doesn't
  # change the serialized output. Auto-derive reasoning models from the catalog.
  opencode: |
    {{- $wk := .Values.wellKnown | deepCopy -}}
    {{- $reasoning := include "wellknown.reasoning" .Values.models | fromJson -}}
    {{- $models := dict -}}
    {{- /* OpenCode v2 model shape: per-model `settings` (v1 `options`) and
           `variants` as an id-keyed LIST (v1: a map keyed by variant name).
           Same shape OpenCode's own v1→v2 normaliser produces. The default
           effort is `settings`; each `reasoningLevels` entry becomes one
           variant whose id AND effort are that level string (ADR-0143). The
           validation lives in the `wellknown.reasoning` helper, shared with
           the v1 block below. */ -}}
    {{- range $name, $r := $reasoning -}}
      {{- $m := dict "settings" (dict "reasoningEffort" $r.effort) -}}
      {{- if $r.levels -}}
        {{- $variants := list -}}
        {{- range $r.levels -}}
          {{- $variants = append $variants (dict "id" . "settings" (dict "reasoningEffort" .)) -}}
        {{- end -}}
        {{- $_ := set $m "variants" $variants -}}
      {{- end -}}
      {{- $_ := set $models $name $m -}}
    {{- end -}}
    {{- if $models -}}
      {{- $prov := index $wk.config.providers "camer-digital" -}}
      {{- $_ := set $prov "models" $models -}}
    {{- end -}}
    {{- $wk | toJson | nindent 4 }}
  # TEMPORARY OpenCode v1 bridge (ADR-0142). The frozen pre-cutover descriptor
  # (files/wellknown-v1.yaml), with the same catalog-derived reasoning caps in
  # the v1 model shape: per-model `options`, `variants` as a name-keyed MAP.
  # The reasoning block is the current one (ADR-0143, shared `wellknown.reasoning`
  # validation); only the v1 output shape differs. Remove with the bridge.
  opencode-v1: |
    {{- $v1 := (.Files.Get "files/wellknown-v1.yaml" | fromYaml).wellKnown -}}
    {{- $v1reasoning := include "wellknown.reasoning" .Values.models | fromJson -}}
    {{- $v1models := dict -}}
    {{- range $name, $r := $v1reasoning -}}
      {{- $m := dict "options" (dict "reasoningEffort" $r.effort) -}}
      {{- if $r.levels -}}
        {{- $variants := dict -}}
        {{- range $r.levels -}}
          {{- $_ := set $variants . (dict "reasoningEffort" .) -}}
        {{- end -}}
        {{- $_ := set $m "variants" $variants -}}
      {{- end -}}
      {{- $_ := set $v1models $name $m -}}
    {{- end -}}
    {{- if $v1models -}}
      {{- $_ := set (index $v1.config.provider "camer-digital") "models" $v1models -}}
    {{- end -}}
    {{- $v1 | toJson | nindent 4 }}
