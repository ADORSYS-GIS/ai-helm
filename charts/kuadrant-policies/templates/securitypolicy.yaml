{{- if .Values.securityPolicies }}
{{- range $name, $config := .Values.securityPolicies }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "common.names.name" $ }}-{{ $name }}
  namespace: {{ include "common.names.namespace" $ }}
  labels:
    {{ include "common.labels.standard" $ | nindent 4 }}
spec:
  # Attach the ext_authz (Authorino) filter to one targetRef PER listener
  # section. Historically hardcoded to `api-https` only, which left the
  # `api-internal` listener with NO ext_authz — so LibreChat (and every other
  # in-cluster caller on core-gateway-internal) bypassed Authorino entirely:
  # the `internal` AuthConfig never ran, no x-oidc-*/x-account-id were stamped,
  # and all internal traffic showed up `unstamped:*` on the per-user board (and
  # the internal apiKey was not actually enforced). Drive the listener list from
  # `$config.sectionNames` (default ["api-https"] for back-compat) so `main`
  # can cover both listeners with one policy — one Authorino selects the
  # main/internal/catch-all AuthConfig by Host.
  targetRefs:
  {{- range $sectionName := ($config.sectionNames | default (list "api-https")) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $config.gatewayName }}
      sectionName: {{ $sectionName }}
  {{- end }}
  extAuth:
    {{- /*
    lightbridge-authz ADR-0034 §1.1: `failOpen` decides what Envoy does when Authorino is
    unreachable or too slow — `false` (the CRD default) denies with a 5xx, `true` waves the
    request through unauthenticated. It has always been false here by omission; this makes it
    settable so the values repo can ASSERT it rather than inherit it, which matters now that a
    budget lookup rides the same ext_authz step: the entire value of that enforcement evaporates
    if a slow Authorino means "allow".

    Rendered ONLY when explicitly set, so a chart with no value in the values repo produces
    byte-identical output to before this landed. Set it to `false` in ai-helm-values, in the same
    change that enables the budget limiter; do not default it here, because a default that
    silently matches the CRD's is exactly the kind of "assertion" that stops being one the day
    upstream changes its mind.
    */}}
    {{- if hasKey $config "failOpen" }}
    failOpen: {{ $config.failOpen }}
    {{- end }}
    grpc:
      backendRefs:
        - name: {{ $config.authorinoService }}
          port: 50051
          kind: Service
          weight: 1
          group: ''
{{- end }}
{{- end }}
