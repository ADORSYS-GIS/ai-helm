{{- if .Values.instances }}
{{- range $name, $config := .Values.instances }}
---
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: {{ include "common.names.name" $ }}-{{ $name }}
  namespace: {{ include "common.names.namespace" $ }}
  labels:
    {{ include "common.labels.standard" $ | nindent 4 }}
spec:
  {{- with $config.supersedingHostSubsets }}
  # Allow an AuthConfig whose hosts are a SUPERSET of another's (e.g. a "*"
  # catch-all alongside specific-host configs) — the MOST-SPECIFIC host wins.
  # Required for the deny-all catch-all AuthConfig (ADR-0021).
  supersedingHostSubsets: {{ . }}
  {{- end }}
  {{- with $config.authConfigLabelSelectors }}
  # Which AuthConfigs this instance reconciles (a k8s label selector, passed
  # to Authorino as --auth-config-label-selector). Unset = every AuthConfig it
  # can see. home-remote is shared with vymalo/another-gitops, whose own
  # Authorino serves AuthConfigs labelled another.vymalo.com/authorino=another;
  # a `notin` selector keeps this instance off them while still matching every
  # AuthConfig of ours (none carry that label).
  authConfigLabelSelectors: {{ . | quote }}
  {{- end }}
  {{- with $config.replicas }}
  # HA: every request to the gateway hits Authorino (JWT verify + metadata
  # + authorization), so run more than one replica — no single point of
  # failure or throughput bottleneck under thousands of concurrent clients.
  replicas: {{ . }}
  {{- end }}
  listener:
    {{- toYaml $config.listener | nindent 4 }}
  oidcServer:
    {{- toYaml $config.oidcServer | nindent 4 }}
  volumes:
    {{- toYaml $config.volumes | nindent 4 }}
{{- end }}
{{- end }}
