workflow:
  serviceAccountName: argo-workflow
training:
  image: ghcr.io/adorsys-gis/webank-train-gpu@sha256:c1774729a3bf86c1a1cd231a3d06293bf35c950bfec061726e4aa42ea24cf0e7
  lakefs:
    endpoint: http://lakefs.mlops.svc.cluster.local:80
  otel:
    endpoint: http://alloy.observability.svc.cluster.local:4318
  gpu:
    nodeSelector: { nvidia.com/gpu.present: "true" }
    resourceName: nvidia.com/gpu
    runtimeClassName: nvidia
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  datasetBuild:
    image: ghcr.io/adorsys-gis/webank-dataset-gpu@sha256:c4ddb832deda7854bb617d422acca099001a6ec2aea1d585b8e460a53e4f6edf
models:
  - id: document-detector
    trainer: document-detector
    datasetBuild:
      # Only model kept `enabled: true` in this CI fixture so `helm
      # template`/`helm lint` still render-cover the dataset-build
      # WorkflowTemplate branch itself, not just its default-off state.
      enabled: true
      target:
        repository: ds-document-detector
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-document-detector
      source: { strategy: hermetic-synthetic }
    lakefs:
      dataset:
        repository: ds-document-detector
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-document-detector
      model: { repository: model-document-detector, branch: main, storageNamespace: s3://governed-ci/models/model-document-detector }
  - id: document-recognizer
    trainer: document-recognizer
    datasetBuild:
      target:
        repository: ds-document-recognizer
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-document-recognizer
      source: { strategy: hermetic-synthetic }
    lakefs:
      dataset: { repository: ds-document-recognizer, branch: main }
      model: { repository: model-document-recognizer, branch: main, storageNamespace: s3://governed-ci/models/model-document-recognizer }
  - id: face-detector
    trainer: face-detector
    datasetBuild:
      target:
        repository: ds-face-detector
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-face-detector
      source: { strategy: hermetic-synthetic }
    lakefs:
      dataset: { repository: ds-face-detector, branch: main }
      model: { repository: model-face-detector, branch: main, storageNamespace: s3://governed-ci/models/model-face-detector }
  - id: sface
    trainer: sface
    datasetBuild:
      target:
        repository: ds-sface
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-sface
      source:
        strategy: governed-lakefs
        repository: source-sface-consented
        branch: main
    lakefs:
      dataset: { repository: ds-sface, branch: main }
      model: { repository: model-sface, branch: main, storageNamespace: s3://governed-ci/models/model-sface }
  - id: pad-liveness
    trainer: pad-liveness-pending
    datasetBuild:
      target:
        repository: ds-pad-liveness
        branch: main
        storageNamespace: s3://governed-ci/datasets/ds-pad-liveness
      source:
        strategy: governed-lakefs
        repository: source-pad-liveness-consented
        branch: main
    lakefs:
      dataset: { repository: ds-pad-liveness, branch: main }
      model: { repository: model-pad-liveness, branch: main, storageNamespace: s3://governed-ci/models/model-pad-liveness }
