# Environment-neutral structure for Webank's public dataset-build and training
# WorkflowTemplates. Environment literals belong in ai-helm-values; this chart
# fails closed when they are absent.
# Deployment literals belong in ai-helm-values; this chart fails closed when
# they are absent, so ArgoCD cannot silently install an unsafe default.
workflow:
  activeDeadlineSeconds: 21600
  ttlSecondsAfterCompletion: 259200
  serviceAccountName: argo-workflow
  imagePullSecrets: []

training:
  image: ""
  lakefs:
    endpoint: ""
    secretName: lakefs-proxy-admin
    accessKey: access-key-id
    secretKey: secret-access-key
  otel:
    endpoint: ""
  # Every dataset-build and training template uses this GPU-node placement and
  # resource profile: `nvidia.com/gpu.present=true` (the live GPU node label,
  # matching charts/inference's `defaults.gpu` — see ADR-0114), an
  # `nvidia.com/gpu:NoSchedule` (Exists) toleration matching the live node
  # taint, and a positive nvidia.com/gpu limit. Dataset construction receives
  # the same reviewed CPU, memory, and GPU allocation as candidate training.
  #
  # ⚠️ Prior to ADR-0114 this contract was `role: gpu`, which no node in the
  # cluster has ever carried — every GPU-requesting workflow pod was
  # unschedulable (`0/9 nodes are available: 4 didn't match node
  # affinity/selector, 5 had untolerated taints`) regardless of GPU
  # availability. Verified live 2026-08-02.
  gpu:
    nodeSelector: {}
    tolerations: []
    priorityClassName: ""
    resources:
      requests: { cpu: "4", memory: 16Gi }
      limits: { cpu: "8", memory: 16Gi, nvidia.com/gpu: 1 }
  documentDetector:
    stemChannels: 32
    epochs: 10
    batchSize: 1
    learningRate: 0.001
    shrinkRatio: 0.6

# One entry produces exactly two public WorkflowTemplates: `<id>-dataset-build`
# and `<id>-train`. Each entry must also bind a fixed `lakefs.dataset` and
# `lakefs.model` destination; values never provide executable shell text.
models: []
