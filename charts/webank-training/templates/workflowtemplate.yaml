{{- $workflow := .Values.workflow -}}
{{- $training := .Values.training -}}
{{- $lakefs := $training.lakefs -}}
{{- $detector := $training.documentDetector -}}
{{- if not $training.image }}{{ fail "webank-training: training.image must be an immutable image digest" }}{{- end }}
{{- if not (contains "@sha256:" $training.image) }}{{ fail "webank-training: training.image must be digest-pinned" }}{{- end }}
{{- if not $lakefs.endpoint }}{{ fail "webank-training: training.lakefs.endpoint is required" }}{{- end }}
{{- if not $training.otel.endpoint }}{{ fail "webank-training: training.otel.endpoint is required" }}{{- end }}
{{- if not $workflow.serviceAccountName }}{{ fail "webank-training: workflow.serviceAccountName is required" }}{{- end }}
{{- if eq (len .Values.models) 0 }}{{ fail "webank-training: models must declare the public model workflow catalogue" }}{{- end }}
{{- if eq (len $training.gpu.nodeSelector) 0 }}{{ fail "webank-training: GPU-capable templates require a non-empty training.gpu.nodeSelector" }}{{- end }}
{{- if not ($training.gpu.runtimeClassName | default "") }}{{ fail "webank-training: GPU-capable templates require training.gpu.runtimeClassName" }}{{- end }}
{{- $gpuResourceName := required "webank-training: training.gpu.resourceName is required" $training.gpu.resourceName -}}
{{- $gpuLimit := index $training.gpu.resources.limits $gpuResourceName | default 0 -}}
{{- if lt (int $gpuLimit) 1 }}{{ fail (printf "webank-training: GPU-capable templates require limits.%s >= 1" $gpuResourceName) }}{{- end }}
{{- $gpuRequest := index $training.gpu.resources.requests $gpuResourceName | default 0 -}}
{{- if lt (int $gpuRequest) 1 }}{{ fail (printf "webank-training: GPU-capable templates require requests.%s >= 1" $gpuResourceName) }}{{- end }}
{{- if eq (len $training.gpu.tolerations) 0 }}{{ fail "webank-training: GPU-capable templates require at least one training.gpu.toleration" }}{{- end }}
{{- range $model := .Values.models }}
{{- $id := required "webank-training: models[].id is required" $model.id -}}
{{- $materializer := required (printf "webank-training: %s datasetMaterializer is required" $id) $model.datasetMaterializer -}}
{{- $trainer := required (printf "webank-training: %s trainer is required" $id) $model.trainer -}}
{{- $modelLakefs := required (printf "webank-training: %s lakefs is required" $id) $model.lakefs -}}
{{- $datasetLakefs := required (printf "webank-training: %s lakefs.dataset is required" $id) $modelLakefs.dataset -}}
{{- $candidateLakefs := required (printf "webank-training: %s lakefs.model is required" $id) $modelLakefs.model -}}
{{- $datasetRepository := required (printf "webank-training: %s lakefs.dataset.repository is required" $id) $datasetLakefs.repository -}}
{{- $datasetBranch := required (printf "webank-training: %s lakefs.dataset.branch is required" $id) $datasetLakefs.branch -}}
{{- $datasetStorageNamespace := "" -}}
{{- if eq $id "document-detector" }}{{- $datasetStorageNamespace = required "webank-training: document-detector lakefs.dataset.storageNamespace is required for hermetic bootstrap" $datasetLakefs.storageNamespace }}{{- end }}
{{- $candidateRepository := required (printf "webank-training: %s lakefs.model.repository is required" $id) $candidateLakefs.repository -}}
{{- $candidateBranch := required (printf "webank-training: %s lakefs.model.branch is required" $id) $candidateLakefs.branch -}}
{{- if ne $datasetRepository (printf "ds-%s" $id) }}{{ fail (printf "webank-training: %s dataset repository must be ds-%s" $id $id) }}{{- end }}
{{- if ne $candidateRepository (printf "model-%s" $id) }}{{ fail (printf "webank-training: %s model repository must be model-%s" $id $id) }}{{- end }}
{{- if ne $datasetBranch "main" }}{{ fail (printf "webank-training: %s dataset branch must be main" $id) }}{{- end }}
{{- if ne $candidateBranch "main" }}{{ fail (printf "webank-training: %s model branch must be main" $id) }}{{- end }}
{{- if not (has $materializer (list "materialize-document-detector-descriptor" "materialize-document-recognizer-descriptor" "materialize-face-detector-descriptor" "materialize-sface-descriptor" "materialize-pad-descriptor")) }}{{ fail (printf "webank-training: %s has an unknown dataset materializer" $id) }}{{- end }}
{{- if not (has $trainer (list "document-detector" "document-recognizer" "face-detector" "sface" "pad-liveness-pending")) }}{{ fail (printf "webank-training: %s has an unknown trainer" $id) }}{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ printf "webank-%s-dataset-build" $id | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/part-of: webank-models
    app.kubernetes.io/component: dataset-build
    webank.io/model: {{ $id | quote }}
  annotations:
    webank.io/adr: "0034"
    webank.io/dataset-contract: "0006"
{{- if eq $id "document-detector" }}
    webank.io/materialization: "hermetic-synthetic-bootstrap"
{{- else }}
    webank.io/materialization: "metadata-descriptor"
{{- end }}
    webank.io/dataset-lakefs-repository: {{ $datasetRepository | quote }}
    webank.io/dataset-lakefs-branch: {{ $datasetBranch | quote }}
spec:
  entrypoint: build
  activeDeadlineSeconds: {{ $workflow.activeDeadlineSeconds }}
  ttlStrategy:
    secondsAfterCompletion: {{ $workflow.ttlSecondsAfterCompletion }}
  serviceAccountName: {{ $workflow.serviceAccountName | quote }}
  {{- with $workflow.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if ne $id "document-detector" }}
  arguments:
    parameters:
      - name: lakefs_ref
        description: >-
          Required immutable 64-character LakeFS commit named by the governed
          manifest and readiness attestation. Branches and moving tags fail closed.
    artifacts:
      - name: source
      - name: manifest
      - name: readiness
{{- end }}
  templates:
    - name: build
{{- if ne $id "document-detector" }}
      inputs:
        artifacts:
          - name: source
            path: /workspace/input/source.json
          - name: manifest
            path: /workspace/input/source-manifest.json
          - name: readiness
            path: /workspace/input/readiness.json
{{- end }}
      podSpecPatch: |
        runtimeClassName: {{ $training.gpu.runtimeClassName | quote }}
      nodeSelector:
        {{- toYaml $training.gpu.nodeSelector | nindent 8 }}
      {{- with $training.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $training.gpu.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      container:
        image: {{ $training.image | quote }}
        command: ["sh", "-ceu"]
        args:
          - |
{{- if eq $id "document-detector" }}
            BASE_REF="$(cargo xtask training-data bootstrap-document-detector-repository \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE")"
            /opt/webank-document-detector-dataset/venv/bin/python \
              -m webank_document_detector_dataset.cli bootstrap \
              --output /workspace/output/document-detector-bootstrap \
              --lakefs-ref "$BASE_REF" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --code-revision "$WEBANK_SOURCE_REVISION" \
              --policy /opt/webank-document-detector-dataset/bootstrap-policy.json
            cargo xtask training-data push \
              --destination training-data-lake \
              --path /workspace/output/document-detector-bootstrap/document-detector-training-v1.tar \
              --manifest /workspace/output/document-detector-bootstrap/governance/source-manifest.json \
              --lakefs-ref "$BASE_REF" \
              --readiness /workspace/output/document-detector-bootstrap/governance/readiness.json \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY"
{{- else }}
            cargo xtask training-data {{ $materializer }} \
              --source /workspace/input/source.json \
              --manifest /workspace/input/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/input/readiness.json \
              --output /workspace/output/{{ $id }}-descriptor.json
            cargo xtask training-data push \
              --destination training-data-lake \
              --path /workspace/output/{{ $id }}-descriptor.json \
              --manifest /workspace/input/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/input/readiness.json \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY"
{{- end }}
        env:
{{- if ne $id "document-detector" }}
          - name: LAKEFS_REF
            value: "{{`{{workflow.parameters.lakefs_ref}}`}}"
{{- end }}
          - name: WEBANK_LAKEFS_ENDPOINT
            value: {{ $lakefs.endpoint | quote }}
          - name: WEBANK_DATASET_LAKEFS_REPOSITORY
            value: {{ $datasetRepository | quote }}
          - name: WEBANK_DATASET_LAKEFS_BRANCH
            value: {{ $datasetBranch | quote }}
{{- if eq $id "document-detector" }}
          - name: WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE
            value: {{ $datasetStorageNamespace | quote }}
{{- end }}
          - name: LAKEFS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.accessKey | quote }} } }
          - name: LAKEFS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.secretKey | quote }} } }
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ $training.otel.endpoint | quote }}
          - name: OTEL_SERVICE_NAME
            value: {{ printf "webank-%s-dataset-build" $id | quote }}
        resources:
          {{- toYaml $training.gpu.resources | nindent 10 }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ printf "webank-%s-train" $id | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/part-of: webank-models
    app.kubernetes.io/component: candidate-training
    webank.io/model: {{ $id | quote }}
  annotations:
    webank.io/adr: "0034"
    webank.io/observability-adr: "0035"
    webank.io/dataset-lakefs-repository: {{ $datasetRepository | quote }}
    webank.io/dataset-lakefs-branch: {{ $datasetBranch | quote }}
    webank.io/model-lakefs-repository: {{ $candidateRepository | quote }}
    webank.io/model-lakefs-branch: {{ $candidateBranch | quote }}
{{- if eq $trainer "pad-liveness-pending" }}
    webank.io/execution-state: "blocked-by-pad-training-harness"
{{- end }}
spec:
  entrypoint: train
  activeDeadlineSeconds: {{ $workflow.activeDeadlineSeconds }}
  ttlStrategy:
    secondsAfterCompletion: {{ $workflow.ttlSecondsAfterCompletion }}
  serviceAccountName: {{ $workflow.serviceAccountName | quote }}
  {{- with $workflow.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  arguments:
    parameters:
{{- if eq $trainer "document-detector" }}
      - name: dataset_ref
        description: >-
          Required immutable 64-character commit in this template's fixed
          ds-document-detector LakeFS repository; branches and moving tags fail closed.
      - name: dataset_version
        description: >-
          Required dataset version directory committed by the dataset-build workflow.
{{- else if ne $trainer "pad-liveness-pending" }}
      - name: lakefs_ref
        description: Required immutable 64-character LakeFS commit for the dataset artifacts.
{{- end }}
      - name: run_name
        value: {{ printf "%s-{{workflow.name}}" $id | quote }}
        description: Optional operator label; defaults to the unique Argo workflow name.
{{- if and (ne $trainer "document-detector") (ne $trainer "pad-liveness-pending") }}
    artifacts:
      - name: dataset
      - name: manifest
      - name: readiness
{{- end }}
  templates:
    - name: train
{{- if and (ne $trainer "document-detector") (ne $trainer "pad-liveness-pending") }}
      inputs:
        artifacts:
          - name: dataset
            path: /workspace/dataset
          - name: manifest
            path: /workspace/governance/source-manifest.json
          - name: readiness
            path: /workspace/governance/readiness.json
{{- end }}
      podSpecPatch: |
        runtimeClassName: {{ $training.gpu.runtimeClassName | quote }}
      nodeSelector:
        {{- toYaml $training.gpu.nodeSelector | nindent 8 }}
      {{- with $training.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $training.gpu.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      container:
        image: {{ $training.image | quote }}
        command: ["sh", "-ceu"]
        args:
          - |
{{- if eq $trainer "document-detector" }}
            DATASET_URI="lakefs://${WEBANK_DATASET_LAKEFS_REPOSITORY}/${DATASET_REF}/${DATASET_VERSION}"
            cargo xtask training-data checkout-document-detector \
              --dataset-uri "$DATASET_URI" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --output /workspace/document-detector
            cargo xtask document-detector-train \
              --data /workspace/document-detector/dataset \
              --output "$CANDIDATE_PATH" \
              --stem-channels {{ $detector.stemChannels }} \
              --epochs {{ $detector.epochs }} \
              --batch-size {{ $detector.batchSize }} \
              --learning-rate {{ $detector.learningRate }} \
              --shrink-ratio {{ $detector.shrinkRatio }}
            . /workspace/document-detector/governance/lineage.env
            cargo xtask training-data push \
              --destination training-data-lake \
              --path "$CANDIDATE_PATH" \
              --manifest /workspace/document-detector/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_SOURCE_REF" \
              --readiness /workspace/document-detector/governance/readiness.json \
              --lakefs-branch "$WEBANK_MODEL_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY"
{{- else if eq $trainer "document-recognizer" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask distill-recognizer \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data push \
              --destination training-data-lake \
              --path "$CANDIDATE_PATH" \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json \
              --lakefs-branch "$WEBANK_MODEL_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY"
{{- else if eq $trainer "face-detector" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask face-detector-train \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data push \
              --destination training-data-lake \
              --path "$CANDIDATE_PATH" \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json \
              --lakefs-branch "$WEBANK_MODEL_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY"
{{- else if eq $trainer "sface" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask sface-train \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data push \
              --destination training-data-lake \
              --path "$CANDIDATE_PATH" \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json \
              --lakefs-branch "$WEBANK_MODEL_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY"
{{- else }}
            echo "PAD liveness candidate training is unavailable: the governed PAD dataset descriptor exists, but no PAD optimizer/trainer has landed. Refusing to fabricate a candidate." >&2
            exit 2
{{- end }}
        env:
{{- if eq $trainer "document-detector" }}
          - name: DATASET_REF
            value: "{{`{{workflow.parameters.dataset_ref}}`}}"
          - name: DATASET_VERSION
            value: "{{`{{workflow.parameters.dataset_version}}`}}"
{{- else if ne $trainer "pad-liveness-pending" }}
          - name: LAKEFS_REF
            value: "{{`{{workflow.parameters.lakefs_ref}}`}}"
{{- end }}
          - name: CANDIDATE_PATH
            value: {{ printf "/workspace/candidate-%s-{{workflow.name}}.safetensors" $id | quote }}
          - name: TRAINING_RUN_ID
            value: "{{`{{workflow.parameters.run_name}}`}}"
          - name: WEBANK_LAKEFS_ENDPOINT
            value: {{ $lakefs.endpoint | quote }}
          - name: WEBANK_DATASET_LAKEFS_REPOSITORY
            value: {{ $datasetRepository | quote }}
          - name: WEBANK_DATASET_LAKEFS_BRANCH
            value: {{ $datasetBranch | quote }}
          - name: WEBANK_MODEL_LAKEFS_REPOSITORY
            value: {{ $candidateRepository | quote }}
          - name: WEBANK_MODEL_LAKEFS_BRANCH
            value: {{ $candidateBranch | quote }}
          - name: LAKEFS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.accessKey | quote }} } }
          - name: LAKEFS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.secretKey | quote }} } }
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ $training.otel.endpoint | quote }}
          - name: OTEL_SERVICE_NAME
            value: {{ printf "webank-%s-train" $id | quote }}
        resources:
          {{- toYaml $training.gpu.resources | nindent 10 }}
{{- end }}
