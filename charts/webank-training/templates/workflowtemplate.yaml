{{- $workflow := .Values.workflow -}}
{{- $training := .Values.training -}}
{{- $lakefs := $training.lakefs -}}
{{- $detector := $training.documentDetector -}}
{{- if not $training.image }}{{ fail "webank-training: training.image must be an immutable image digest" }}{{- end }}
{{- if not (contains "@sha256:" $training.image) }}{{ fail "webank-training: training.image must be digest-pinned" }}{{- end }}
{{- if not $training.datasetBuild.image }}{{ fail "webank-training: training.datasetBuild.image must be an immutable image digest" }}{{- end }}
{{- if not (contains "@sha256:" $training.datasetBuild.image) }}{{ fail "webank-training: training.datasetBuild.image must be digest-pinned" }}{{- end }}
{{- if not $lakefs.endpoint }}{{ fail "webank-training: training.lakefs.endpoint is required" }}{{- end }}
{{- if not $training.otel.endpoint }}{{ fail "webank-training: training.otel.endpoint is required" }}{{- end }}
{{- if not $workflow.serviceAccountName }}{{ fail "webank-training: workflow.serviceAccountName is required" }}{{- end }}
{{- if eq (len .Values.models) 0 }}{{ fail "webank-training: models must declare the public model workflow catalogue" }}{{- end }}
{{- if eq (len $training.gpu.nodeSelector) 0 }}{{ fail "webank-training: GPU-capable templates require a non-empty training.gpu.nodeSelector" }}{{- end }}
{{- if not ($training.gpu.runtimeClassName | default "") }}{{ fail "webank-training: GPU-capable templates require training.gpu.runtimeClassName" }}{{- end }}
{{- $gpuResourceName := required "webank-training: training.gpu.resourceName is required" $training.gpu.resourceName -}}
{{- $gpuLimit := index $training.gpu.resources.limits $gpuResourceName | default 0 -}}
{{- if lt (int $gpuLimit) 1 }}{{ fail (printf "webank-training: GPU-capable templates require limits.%s >= 1" $gpuResourceName) }}{{- end }}
{{- $gpuRequest := index $training.gpu.resources.requests $gpuResourceName | default 0 -}}
{{- if lt (int $gpuRequest) 1 }}{{ fail (printf "webank-training: GPU-capable templates require requests.%s >= 1" $gpuResourceName) }}{{- end }}
{{- if eq (len $training.gpu.tolerations) 0 }}{{ fail "webank-training: GPU-capable templates require at least one training.gpu.toleration" }}{{- end }}
{{- range $model := .Values.models }}
{{- $id := required "webank-training: models[].id is required" $model.id -}}
{{- $trainer := required (printf "webank-training: %s trainer is required" $id) $model.trainer -}}
{{- $datasetBuild := required (printf "webank-training: %s datasetBuild is required" $id) $model.datasetBuild -}}
{{- /*
Interim governance gate (webank-models issue #482, ADR-0046). Historically,
no dataset-build publish call in this template ran a readiness-gate step,
because dataset-build produced none of the /workspace/governance/* evidence
the gate needs to check, so a `datasetBuild.enabled` entry stayed default-OFF
until its path could satisfy the gate. As of this change, the three
hermetic-synthetic builders (document-detector, document-recognizer,
face-detector) write a real governance/source-manifest.json and
governance/readiness.json next to their raw output, and each of their
dataset-build DAGs below runs `cargo xtask training-data readiness-gate`
against those files before packing/publishing (ADR-0046's accepted option
(c); webank-models#482). `sface` and `pad-liveness` use the governed-lakefs
strategy and remain out of scope: they have no consented source data and stay
ungated. `datasetBuild.enabled` still guards whether a model's
`<id>-dataset-build` WorkflowTemplate renders at all; this does not touch the
*-train templates, which were already gated.
*/ -}}
{{- $datasetBuildEnabled := $datasetBuild.enabled | default false -}}
{{- /*
`default` treats Go zero values (including `false`) as absent, so a naive
`$datasetBuild.publishToLakefsDefault | default $training.datasetBuild
.publishToLakefsDefault` would silently discard an explicit per-model
`false` override and always fall back to the chart-wide default -- exactly
the config this parameter exists to allow. `hasKey` distinguishes "the key
is absent" from "the key is present and false".
*/ -}}
{{- $publishToLakefsDefault := $training.datasetBuild.publishToLakefsDefault -}}
{{- if hasKey $datasetBuild "publishToLakefsDefault" -}}
{{- $publishToLakefsDefault = $datasetBuild.publishToLakefsDefault -}}
{{- end -}}
{{- $datasetTarget := required (printf "webank-training: %s datasetBuild.target is required" $id) $datasetBuild.target -}}
{{- $datasetSource := required (printf "webank-training: %s datasetBuild.source is required" $id) $datasetBuild.source -}}
{{- $sourceStrategy := required (printf "webank-training: %s datasetBuild.source.strategy is required" $id) $datasetSource.strategy -}}
{{- $modelLakefs := required (printf "webank-training: %s lakefs is required" $id) $model.lakefs -}}
{{- $datasetLakefs := required (printf "webank-training: %s lakefs.dataset is required" $id) $modelLakefs.dataset -}}
{{- $candidateLakefs := required (printf "webank-training: %s lakefs.model is required" $id) $modelLakefs.model -}}
{{- $datasetRepository := required (printf "webank-training: %s lakefs.dataset.repository is required" $id) $datasetLakefs.repository -}}
{{- $datasetBranch := required (printf "webank-training: %s lakefs.dataset.branch is required" $id) $datasetLakefs.branch -}}
{{- $datasetTargetRepository := required (printf "webank-training: %s datasetBuild.target.repository is required" $id) $datasetTarget.repository -}}
{{- $datasetTargetBranch := required (printf "webank-training: %s datasetBuild.target.branch is required" $id) $datasetTarget.branch -}}
{{- $datasetStorageNamespace := required (printf "webank-training: %s datasetBuild.target.storageNamespace is required" $id) $datasetTarget.storageNamespace -}}
{{- $candidateRepository := required (printf "webank-training: %s lakefs.model.repository is required" $id) $candidateLakefs.repository -}}
{{- $candidateBranch := required (printf "webank-training: %s lakefs.model.branch is required" $id) $candidateLakefs.branch -}}
{{- $candidateStorageNamespace := required (printf "webank-training: %s lakefs.model.storageNamespace is required" $id) $candidateLakefs.storageNamespace -}}
{{- if ne $datasetRepository (printf "ds-%s" $id) }}{{ fail (printf "webank-training: %s dataset repository must be ds-%s" $id $id) }}{{- end }}
{{- if ne $datasetTargetRepository $datasetRepository }}{{ fail (printf "webank-training: %s datasetBuild target must match its training dataset repository" $id) }}{{- end }}
{{- if ne $candidateRepository (printf "model-%s" $id) }}{{ fail (printf "webank-training: %s model repository must be model-%s" $id $id) }}{{- end }}
{{- if ne $datasetBranch "main" }}{{ fail (printf "webank-training: %s dataset branch must be main" $id) }}{{- end }}
{{- if ne $datasetTargetBranch $datasetBranch }}{{ fail (printf "webank-training: %s datasetBuild target must match its training dataset branch" $id) }}{{- end }}
{{- if ne $candidateBranch "main" }}{{ fail (printf "webank-training: %s model branch must be main" $id) }}{{- end }}
{{- if not (has $sourceStrategy (list "hermetic-synthetic" "governed-lakefs")) }}{{ fail (printf "webank-training: %s has an unknown dataset source strategy" $id) }}{{- end }}
{{- if eq $sourceStrategy "hermetic-synthetic" }}
{{- if not (has $id (list "document-detector" "document-recognizer" "face-detector")) }}{{ fail (printf "webank-training: %s cannot use hermetic-synthetic" $id) }}{{- end }}
{{- if or ($datasetSource.repository | default "") ($datasetSource.branch | default "") }}{{ fail (printf "webank-training: %s hermetic source must not declare a LakeFS route" $id) }}{{- end }}
{{- else }}
{{- if not (has $id (list "sface" "pad-liveness")) }}{{ fail (printf "webank-training: %s must not use a governed biometric source" $id) }}{{- end }}
{{- $sourceRepository := required (printf "webank-training: %s governed source repository is required" $id) $datasetSource.repository -}}
{{- $sourceBranch := required (printf "webank-training: %s governed source branch is required" $id) $datasetSource.branch -}}
{{- if ne $sourceBranch "main" }}{{ fail (printf "webank-training: %s governed source branch must be main" $id) }}{{- end }}
{{- if or (eq $sourceRepository $datasetTargetRepository) (eq $sourceRepository $candidateRepository) }}{{ fail (printf "webank-training: %s governed source repository must be distinct from its targets" $id) }}{{- end }}
{{- end }}
{{- if not (has $trainer (list "document-detector" "document-recognizer" "face-detector" "sface" "pad-liveness-pending")) }}{{ fail (printf "webank-training: %s has an unknown trainer" $id) }}{{- end }}
{{- if $datasetBuildEnabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ printf "webank-%s-dataset-build" $id | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/part-of: webank-models
    app.kubernetes.io/component: dataset-build
    webank.io/model: {{ $id | quote }}
  annotations:
    webank.io/adr: "0034"
    webank.io/dataset-contract: "0006"
    webank.io/materialization: {{ ternary "hermetic-synthetic-bootstrap" "governed-lakefs" (eq $sourceStrategy "hermetic-synthetic") | quote }}
    webank.io/source-strategy: {{ $sourceStrategy | quote }}
    webank.io/dataset-lakefs-repository: {{ $datasetTargetRepository | quote }}
    webank.io/dataset-lakefs-branch: {{ $datasetTargetBranch | quote }}
{{- if eq $sourceStrategy "governed-lakefs" }}
    webank.io/source-lakefs-repository: {{ $datasetSource.repository | quote }}
    webank.io/source-lakefs-branch: {{ $datasetSource.branch | quote }}
{{- end }}
spec:
  entrypoint: build
  activeDeadlineSeconds: {{ $workflow.activeDeadlineSeconds }}
  ttlStrategy:
    secondsAfterCompletion: {{ $workflow.ttlSecondsAfterCompletion }}
  serviceAccountName: {{ $workflow.serviceAccountName | quote }}
  {{- with $workflow.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
Dataset-build knobs (webank-models#507 sharding, ai-helm proposition
0037-019220). Scoped to the three hermetic-synthetic ids only: sface and
pad-liveness stay on the untouched governed-lakefs path below, per that
proposition's explicit hard constraint. Every default is a Helm value, never
a template literal, so an environment's own values file is the reviewed
record of what a bare `argo submit` actually does; `-p name=value` overrides
one run without touching the chart.
*/}}
{{- if eq $sourceStrategy "hermetic-synthetic" }}
  arguments:
    parameters:
      - name: publish_to_lakefs
        value: {{ $publishToLakefsDefault | quote }}
        description: >-
          Whether this run commits its packed, readiness-gated bundle to
          LakeFS. "false" still produces and validates the local bundle, then
          stops before the publish call -- nothing is written to LakeFS.
{{- if eq $id "document-recognizer" }}
      - name: shard_rows
        value: {{ $training.documentRecognizer.shardRows | quote }}
        description: >-
          Max rows per ds-<index>.safetensors shard (webank-models
          --shard-rows / WEBANK_RECOGNIZER_SHARD_ROWS on
          materialize-synthetic-source; requires webank-models#507 merged and
          this template's datasetBuild.image bumped to a build that reads it
          -- inert (silently ignored) on an older image). Larger shards trade
          lower per-shard overhead for more RAM per load_shard call.
      - name: samples
        value: {{ $training.documentRecognizer.samples | quote }}
        description: >-
          Synthetic OCR lines to generate (webank_document_recognizer_dataset
          --samples, 1..10000). Lower this for a fast local iteration run;
          the default reproduces the reviewed dataset size.
{{- end }}
{{- end }}
  templates:
    - name: build
      podSpecPatch: |
        runtimeClassName: {{ $training.gpu.runtimeClassName | quote }}
      nodeSelector:
        {{- toYaml $training.gpu.nodeSelector | nindent 8 }}
      {{- with $training.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $training.gpu.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        fsGroup: 10001
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: {{ $training.datasetBuild.workspaceSizeLimit | quote }}
      container:
        image: {{ $training.datasetBuild.image | quote }}
        command: ["sh", "-ceu"]
        args:
          - |
{{- if eq $id "document-detector" }}
            BASE_REF="$(cargo xtask training-data bootstrap-model-repository \
              --model document-detector \
              --role dataset \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE")"
            /opt/webank-document-detector-dataset/venv/bin/python \
              -m webank_document_detector_dataset.cli bootstrap \
              --output /workspace/output/document-detector-bootstrap \
              --lakefs-ref "$BASE_REF" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --code-revision "$WEBANK_SOURCE_REVISION" \
              --policy /opt/webank-document-detector-dataset/bootstrap-policy.json
            cargo xtask training-data readiness-gate \
              --manifest /workspace/output/document-detector-bootstrap/governance/source-manifest.json \
              --lakefs-ref "$BASE_REF" \
              --readiness /workspace/output/document-detector-bootstrap/governance/readiness.json
            if [ "$WEBANK_PUBLISH_TO_LAKEFS" = "true" ]; then
              cargo xtask training-data fixed-dataset publish \
                --model document-detector \
                --bundle /workspace/output/document-detector-bootstrap/document-detector-training-v1.tar \
                --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
                --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
                --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
                --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE" \
                --manifest /workspace/output/document-detector-bootstrap/governance/source-manifest.json \
                --readiness /workspace/output/document-detector-bootstrap/governance/readiness.json \
                --lakefs-ref "$BASE_REF"
            else
              echo "publish_to_lakefs=false: bundle produced and readiness-gated locally; skipping LakeFS publish." >&2
            fi
{{- else if eq $id "document-recognizer" }}
            BASE_REF="$(cargo xtask training-data bootstrap-model-repository \
              --model document-recognizer \
              --role dataset \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE")"
            PYTHONPATH=/opt/webank-document-recognizer-dataset/src \
              /opt/webank-document-detector-dataset/venv/bin/python \
              -m webank_document_recognizer_dataset \
              --output /workspace/output/document-recognizer-raw \
              --lakefs-ref "$BASE_REF" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --code-revision "$WEBANK_SOURCE_REVISION" \
              --samples "$WEBANK_RECOGNIZER_SAMPLES"
            cargo xtask training-data readiness-gate \
              --manifest /workspace/output/document-recognizer-raw/governance/source-manifest.json \
              --lakefs-ref "$BASE_REF" \
              --readiness /workspace/output/document-recognizer-raw/governance/readiness.json
            cargo xtask training-data materialize-synthetic-source \
              --model document-recognizer \
              --source /workspace/output/document-recognizer-raw \
              --output /workspace/output/document-recognizer-materialized
            cargo xtask training-data fixed-dataset pack \
              --model document-recognizer \
              --input /workspace/output/document-recognizer-materialized \
              --output /workspace/output/document-recognizer-training-bundle.tar
            if [ "$WEBANK_PUBLISH_TO_LAKEFS" = "true" ]; then
              cargo xtask training-data fixed-dataset publish \
                --model document-recognizer \
                --bundle /workspace/output/document-recognizer-training-bundle.tar \
                --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
                --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
                --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
                --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE" \
                --manifest /workspace/output/document-recognizer-raw/governance/source-manifest.json \
                --readiness /workspace/output/document-recognizer-raw/governance/readiness.json \
                --lakefs-ref "$BASE_REF"
            else
              echo "publish_to_lakefs=false: bundle produced and readiness-gated locally; skipping LakeFS publish." >&2
            fi
{{- else if eq $id "face-detector" }}
            BASE_REF="$(cargo xtask training-data bootstrap-model-repository \
              --model face-detector \
              --role dataset \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE")"
            PYTHONPATH=/opt/webank-face-detector-dataset/src \
              /opt/webank-document-detector-dataset/venv/bin/python \
              -m webank_face_detector_dataset \
              --output /workspace/output/face-detector-raw \
              --lakefs-ref "$BASE_REF" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --code-revision "$WEBANK_SOURCE_REVISION"
            cargo xtask training-data readiness-gate \
              --manifest /workspace/output/face-detector-raw/governance/source-manifest.json \
              --lakefs-ref "$BASE_REF" \
              --readiness /workspace/output/face-detector-raw/governance/readiness.json
            cargo xtask training-data materialize-synthetic-source \
              --model face-detector \
              --source /workspace/output/face-detector-raw \
              --output /workspace/output/face-detector-materialized
            cargo xtask training-data fixed-dataset pack \
              --model face-detector \
              --input /workspace/output/face-detector-materialized \
              --output /workspace/output/face-detector-training-bundle.tar
            if [ "$WEBANK_PUBLISH_TO_LAKEFS" = "true" ]; then
              cargo xtask training-data fixed-dataset publish \
                --model face-detector \
                --bundle /workspace/output/face-detector-training-bundle.tar \
                --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
                --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
                --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
                --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE" \
                --manifest /workspace/output/face-detector-raw/governance/source-manifest.json \
                --readiness /workspace/output/face-detector-raw/governance/readiness.json \
                --lakefs-ref "$BASE_REF"
            else
              echo "publish_to_lakefs=false: bundle produced and readiness-gated locally; skipping LakeFS publish." >&2
            fi
{{- else }}
            SOURCE_REF="$(cargo xtask training-data resolve-governed-source-branch \
              --model {{ $id }} \
              --lakefs-branch "$WEBANK_SOURCE_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_SOURCE_LAKEFS_REPOSITORY")"
            cargo xtask training-data checkout-governed-source \
              --model {{ $id }} \
              --source-ref "$SOURCE_REF" \
              --output /workspace/output/{{ $id }}-source \
              --lakefs-branch "$WEBANK_SOURCE_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_SOURCE_LAKEFS_REPOSITORY"
            cargo xtask training-data materialize-governed-source \
              --model {{ $id }} \
              --source-ref "$SOURCE_REF" \
              --source /workspace/output/{{ $id }}-source \
              --output /workspace/output/{{ $id }}-materialized
            cargo xtask training-data fixed-dataset pack \
              --model {{ $id }} \
              --input /workspace/output/{{ $id }}-materialized \
              --output /workspace/output/{{ $id }}-training-bundle.tar
            cargo xtask training-data fixed-dataset publish \
              --model {{ $id }} \
              --bundle /workspace/output/{{ $id }}-training-bundle.tar \
              --lakefs-branch "$WEBANK_DATASET_LAKEFS_BRANCH" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_DATASET_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE"
{{- end }}
        env:
          - name: WEBANK_LAKEFS_ENDPOINT
            value: {{ $lakefs.endpoint | quote }}
          - name: WEBANK_DATASET_LAKEFS_REPOSITORY
            value: {{ $datasetTargetRepository | quote }}
          - name: WEBANK_DATASET_LAKEFS_BRANCH
            value: {{ $datasetTargetBranch | quote }}
          - name: WEBANK_DATASET_LAKEFS_STORAGE_NAMESPACE
            value: {{ $datasetStorageNamespace | quote }}
          - name: WEBANK_DATASET_SOURCE_STRATEGY
            value: {{ $sourceStrategy | quote }}
{{- if eq $sourceStrategy "hermetic-synthetic" }}
          - name: WEBANK_PUBLISH_TO_LAKEFS
            value: "{{`{{workflow.parameters.publish_to_lakefs}}`}}"
{{- end }}
{{- if eq $id "document-recognizer" }}
          # Consumed directly by materialize-synthetic-source's own `env =
          # "WEBANK_RECOGNIZER_SHARD_ROWS"` clap attribute (webank-models#507)
          # -- no --shard-rows CLI flag needed here. An image built before
          # that PR merges simply never reads this var, so setting it ahead
          # of the image bump is inert, not breaking.
          - name: WEBANK_RECOGNIZER_SHARD_ROWS
            value: "{{`{{workflow.parameters.shard_rows}}`}}"
          - name: WEBANK_RECOGNIZER_SAMPLES
            value: "{{`{{workflow.parameters.samples}}`}}"
{{- end }}
{{- if eq $sourceStrategy "governed-lakefs" }}
          - name: WEBANK_SOURCE_LAKEFS_REPOSITORY
            value: {{ $datasetSource.repository | quote }}
          - name: WEBANK_SOURCE_LAKEFS_BRANCH
            value: {{ $datasetSource.branch | quote }}
{{- end }}
          - name: LAKEFS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.accessKey | quote }} } }
          - name: LAKEFS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.secretKey | quote }} } }
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ $training.otel.endpoint | quote }}
          - name: OTEL_SERVICE_NAME
            value: {{ printf "webank-%s-dataset-build" $id | quote }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          {{- toYaml $training.datasetBuild.resources | nindent 10 }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ printf "webank-%s-train" $id | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/part-of: webank-models
    app.kubernetes.io/component: candidate-training
    webank.io/model: {{ $id | quote }}
  annotations:
    webank.io/adr: "0034"
    webank.io/observability-adr: "0035"
    webank.io/dataset-lakefs-repository: {{ $datasetRepository | quote }}
    webank.io/dataset-lakefs-branch: {{ $datasetBranch | quote }}
    webank.io/model-lakefs-repository: {{ $candidateRepository | quote }}
    webank.io/model-lakefs-branch: {{ $candidateBranch | quote }}
{{- if eq $trainer "pad-liveness-pending" }}
    webank.io/execution-state: "blocked-by-pad-training-harness"
{{- end }}
spec:
  entrypoint: train
  activeDeadlineSeconds: {{ $workflow.activeDeadlineSeconds }}
  ttlStrategy:
    secondsAfterCompletion: {{ $workflow.ttlSecondsAfterCompletion }}
  serviceAccountName: {{ $workflow.serviceAccountName | quote }}
  {{- with $workflow.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  arguments:
    parameters:
{{- if eq $trainer "document-detector" }}
      - name: dataset_ref
        description: >-
          Required immutable 64-character commit in this template's fixed
          ds-document-detector LakeFS repository; branches and moving tags fail closed.
      - name: dataset_version
        description: >-
          Required dataset version directory committed by the dataset-build workflow.
{{- else if ne $trainer "pad-liveness-pending" }}
      - name: lakefs_ref
        description: Required immutable 64-character LakeFS commit for the dataset artifacts.
{{- end }}
      - name: run_name
        value: {{ printf "%s-{{workflow.name}}" $id | quote }}
        description: Optional operator label; defaults to the unique Argo workflow name.
{{- if and (ne $trainer "document-detector") (ne $trainer "pad-liveness-pending") }}
    artifacts:
      - name: dataset
      - name: manifest
      - name: readiness
{{- end }}
  templates:
    - name: train
{{- if and (ne $trainer "document-detector") (ne $trainer "pad-liveness-pending") }}
      inputs:
        artifacts:
          - name: dataset
            path: /workspace/dataset
          - name: manifest
            path: /workspace/governance/source-manifest.json
          - name: readiness
            path: /workspace/governance/readiness.json
{{- end }}
      podSpecPatch: |
        runtimeClassName: {{ $training.gpu.runtimeClassName | quote }}
      nodeSelector:
        {{- toYaml $training.gpu.nodeSelector | nindent 8 }}
      {{- with $training.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $training.gpu.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        fsGroup: 10001
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: {{ $training.workspaceSizeLimit | quote }}
      container:
        image: {{ $training.image | quote }}
        command: ["sh", "-ceu"]
        args:
          - |
{{- if eq $trainer "document-detector" }}
            DATASET_URI="lakefs://${WEBANK_DATASET_LAKEFS_REPOSITORY}/${DATASET_REF}/${DATASET_VERSION}"
            cargo xtask training-data checkout-document-detector \
              --dataset-uri "$DATASET_URI" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --output /workspace/document-detector
            cargo xtask document-detector-train \
              --data /workspace/document-detector/dataset \
              --output "$CANDIDATE_PATH" \
              --stem-channels {{ $detector.stemChannels }} \
              --epochs {{ $detector.epochs }} \
              --batch-size {{ $detector.batchSize }} \
              --learning-rate {{ $detector.learningRate }} \
              --shrink-ratio {{ $detector.shrinkRatio }}
            . /workspace/document-detector/governance/lineage.env
            cargo xtask training-data fixed-candidate publish \
              --model document-detector \
              --artifact "$CANDIDATE_PATH" \
              --dataset-ref "$LAKEFS_SOURCE_REF" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_MODEL_LAKEFS_STORAGE_NAMESPACE"
{{- else if eq $trainer "document-recognizer" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask distill-recognizer \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data fixed-candidate publish \
              --model document-recognizer \
              --artifact "$CANDIDATE_PATH" \
              --dataset-ref "$LAKEFS_REF" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_MODEL_LAKEFS_STORAGE_NAMESPACE"
{{- else if eq $trainer "face-detector" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask face-detector-train \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data fixed-candidate publish \
              --model face-detector \
              --artifact "$CANDIDATE_PATH" \
              --dataset-ref "$LAKEFS_REF" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_MODEL_LAKEFS_STORAGE_NAMESPACE"
{{- else if eq $trainer "sface" }}
            cargo xtask training-data readiness-gate \
              --manifest /workspace/governance/source-manifest.json \
              --lakefs-ref "$LAKEFS_REF" \
              --readiness /workspace/governance/readiness.json
            cargo xtask sface-train \
              --data /workspace/dataset \
              --output "$CANDIDATE_PATH" \
              --epochs 10
            cargo xtask training-data fixed-candidate publish \
              --model sface \
              --artifact "$CANDIDATE_PATH" \
              --dataset-ref "$LAKEFS_REF" \
              --lakefs-endpoint "$WEBANK_LAKEFS_ENDPOINT" \
              --lakefs-repository "$WEBANK_MODEL_LAKEFS_REPOSITORY" \
              --lakefs-storage-namespace "$WEBANK_MODEL_LAKEFS_STORAGE_NAMESPACE"
{{- else }}
            echo "PAD liveness candidate training is unavailable: the governed PAD dataset descriptor exists, but no PAD optimizer/trainer has landed. Refusing to fabricate a candidate." >&2
            exit 2
{{- end }}
        env:
{{- if eq $trainer "document-detector" }}
          - name: DATASET_REF
            value: "{{`{{workflow.parameters.dataset_ref}}`}}"
          - name: DATASET_VERSION
            value: "{{`{{workflow.parameters.dataset_version}}`}}"
{{- else if ne $trainer "pad-liveness-pending" }}
          - name: LAKEFS_REF
            value: "{{`{{workflow.parameters.lakefs_ref}}`}}"
{{- end }}
          - name: CANDIDATE_PATH
            value: {{ printf "/workspace/candidate-%s-{{workflow.name}}.safetensors" $id | quote }}
          - name: TRAINING_RUN_ID
            value: "{{`{{workflow.parameters.run_name}}`}}"
          - name: WEBANK_LAKEFS_ENDPOINT
            value: {{ $lakefs.endpoint | quote }}
          - name: WEBANK_DATASET_LAKEFS_REPOSITORY
            value: {{ $datasetRepository | quote }}
          - name: WEBANK_DATASET_LAKEFS_BRANCH
            value: {{ $datasetBranch | quote }}
          - name: WEBANK_MODEL_LAKEFS_REPOSITORY
            value: {{ $candidateRepository | quote }}
          - name: WEBANK_MODEL_LAKEFS_STORAGE_NAMESPACE
            value: {{ $candidateStorageNamespace | quote }}
          - name: LAKEFS_ACCESS_KEY_ID
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.accessKey | quote }} } }
          - name: LAKEFS_SECRET_ACCESS_KEY
            valueFrom: { secretKeyRef: { name: {{ $lakefs.secretName | quote }}, key: {{ $lakefs.secretKey | quote }} } }
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ $training.otel.endpoint | quote }}
          - name: OTEL_SERVICE_NAME
            value: {{ printf "webank-%s-train" $id | quote }}
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          {{- toYaml $training.gpu.resources | nindent 10 }}
{{- end }}
