# z-image-proxy — injects response_format: b64_json into LocalAI image requests.
#
# ⚠️ DEPLOYMENT-SPECIFIC: `upstream` is left empty here; real values come from
# ai-helm-values (environments/prod/values/z-image-proxy.yaml). With empty
# defaults the chart renders a no-op ConfigMap — see ci/lint-values.yaml.

# The LocalAI service to proxy to.
# e.g. http://z-image-turbo.inference.svc.cluster.local:8080
upstream: ""

# Port the proxy listens on (Service + container).
port: 8080

# Resolver used by ngx.fetch / variable proxy_pass to resolve the upstream
# hostname at REQUEST time. Must be the cluster DNS IP (kube-dns ClusterIP),
# NOT a hostname: nginx resolves a hostname here at startup, which races with
# DNS readiness in Kubernetes and crash-loops the pod ("host not found in
# resolver"). Set to your cluster's kube-dns ClusterIP (here: 10.43.0.10).
resolver: "10.43.0.10 valid=30s ipv6=off"

# Max size of the upstream b64_json image response. The two values MUST agree:
#   - maxResponseBodySize      → nginx `js_fetch_max_response_buffer_size` (size string)
#   - maxResponseBodySizeBytes → ngx.fetch `max_response_body_size` option (bytes)
# 16 MiB comfortably covers a 1024×1024 b64 image (~1–4 MB); raise if needed.
maxResponseBodySize: "16m"
maxResponseBodySizeBytes: 16777216

# Image size the proxy forces on every generation request. LibreChat's
# image_gen_oai tool sends size:'auto' (or the agent's 256x256), which LocalAI
# rejects and falls back to 512x512. Pinning this gives consistent resolution.
targetSize: "1024x1024"

image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 128Mi   # buffers the b64_json response in worker memory (see maxResponseBodySize)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101   # nginx user in nginxinc/nginx-unprivileged
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Namespace allowed to call this proxy (for the CiliumNetworkPolicy ingress rule).
allowFromNamespace: "converse"
