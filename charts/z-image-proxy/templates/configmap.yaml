apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "z-image-proxy.labels" . | nindent 4 }}
data:
  # njs script: inject response_format:b64_json into image generation requests.
  # Runs entirely in nginx worker memory — no subprocess, no Python, no extra
  # latency beyond a JSON parse + stringify of a small request body (<1 KB).
  inject.js: |
    function injectResponseFormat(r) {
      var body = r.requestText;
      var obj;
      try {
        obj = JSON.parse(body);
      } catch (e) {
        // Not JSON — pass through unchanged
        r.internalRedirect('@upstream');
        return;
      }
      // Only inject if the client didn't already set it
      if (!obj.response_format) {
        obj.response_format = 'b64_json';
      }
      r.requestText = JSON.stringify(obj);
      r.internalRedirect('@upstream');
    }
    export default { injectResponseFormat };

  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    load_module modules/ngx_http_js_module.so;

    events { worker_connections 64; }

    http {
      access_log /dev/stdout combined;
      client_max_body_size 4m;      # image request bodies are tiny
      client_body_temp_path /tmp/nginx-client-body;
      proxy_temp_path       /tmp/nginx-proxy;

      js_path /etc/nginx/njs/;
      js_import inject from inject.js;

      server {
        listen {{ .Values.port }};

        # ── Image generation: inject response_format: b64_json ──────────────
        location = /v1/images/generations {
          js_content inject.injectResponseFormat;
        }

        # ── Everything else: pass through unchanged ─────────────────────────
        location @upstream {
          proxy_pass {{ .Values.upstream }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 120s;  # generation takes up to ~35 s
          proxy_send_timeout 120s;
        }

        location / {
          proxy_pass {{ .Values.upstream }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
        }
      }
    }
