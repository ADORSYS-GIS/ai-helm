apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "z-image-proxy.labels" . | nindent 4 }}
data:
  # njs script: inject response_format:b64_json into image generation requests.
  #
  # Why a full js_content + ngx.fetch handler (not js_body_filter / r.requestText):
  #   - njs has NO directive that rewrites the REQUEST body before proxy_pass.
  #     js_body_filter is a RESPONSE body filter; r.requestText is a read-only
  #     getter (assignment throws in strict mode). So the only reliable way to
  #     change what the upstream receives is to read the body, modify it, and
  #     re-POST it ourselves with ngx.fetch().
  #   - The upstream response (a b64_json image, up to a few MB) is buffered in
  #     worker memory and passed through unchanged. Buffer caps are raised via
  #     js_fetch_max_response_buffer_size (nginx) + max_response_body_size (fetch).
  inject.js: |
    async function injectResponseFormat(r) {
      // Read the client request body (r.requestText is available in js_content).
      var raw = r.requestText || '{}';
      var obj;
      try {
        obj = JSON.parse(raw);
      } catch (e) {
        r.return(400, JSON.stringify({
          error: { message: 'invalid JSON request body', type: 'invalid_request_error' }
        }));
        return;
      }

      // Inject response_format: b64_json only if the client didn't already set it.
      if (!obj.response_format) {
        obj.response_format = 'b64_json';
      }

      // Force the image size. LibreChat's image_gen_oai tool sends size:'auto'
      // (or the agent's 256x256), which LocalAI rejects with "Invalid size,
      // using default 512x512". Pin it to the target so we get the resolution
      // we want (1024x1024) instead of the 512x512 fallback.
      obj.size = '{{ .Values.targetSize }}';

      // Forward the modified body to the upstream, preserving auth + content type.
      var reply;
      try {
        reply = await ngx.fetch('{{ .Values.upstream }}/v1/images/generations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': r.headersIn.Authorization || ''
          },
          body: JSON.stringify(obj),
          max_response_body_size: {{ .Values.maxResponseBodySizeBytes | int }}
        });
      } catch (e) {
        r.return(502, JSON.stringify({
          error: { message: 'upstream error: ' + e, type: 'upstream_error' }
        }));
        return;
      }

      // Pass the upstream response through unchanged (status + body).
      // The OpenAI SDK only parses the body as JSON when Content-Type is
      // application/json; r.return() defaults to text/plain, which made the
      // SDK return the raw string and resp.data undefined. Set it explicitly.
      r.headersOut['Content-Type'] = 'application/json';
      var text = await reply.text();
      r.return(reply.status, text);
    }
    export default { injectResponseFormat };

  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

    events { worker_connections 64; }

    http {
      access_log /dev/stdout combined;
      client_max_body_size 4m;      # image request bodies are tiny
      # All temp paths under /tmp (writable emptyDir) — root FS is read-only.
      client_body_temp_path /tmp/nginx-client-body;
      proxy_temp_path       /tmp/nginx-proxy;
      fastcgi_temp_path     /tmp/nginx-fastcgi;
      uwsgi_temp_path       /tmp/nginx-uwsgi;
      scgi_temp_path        /tmp/nginx-scgi;

      js_path /etc/nginx/njs/;
      js_import inject from inject.js;

      # ngx.fetch resolves the upstream hostname via this resolver (cluster DNS).
      resolver {{ .Values.resolver }};

      # b64_json image responses can be several MB — raise the fetch buffer cap.
      js_fetch_max_response_buffer_size {{ .Values.maxResponseBodySize }};

      server {
        listen {{ .Values.port }};

        # ── Liveness/readiness ────────────────────────────────────────────────
        location = /healthz {
          return 200 'ok';
        }

        # ── Image generation: inject response_format: b64_json ───────────────
        location = /v1/images/generations {
          js_content inject.injectResponseFormat;
        }

        # ── Everything else: pass through unchanged ─────────────────────────
        # Use a variable in proxy_pass so the upstream hostname is resolved at
        # request time via the `resolver` above. A static hostname here is
        # resolved at nginx startup and fails with "host not found in upstream"
        # in Kubernetes (ndots/search-domain handling).
        location / {
          set $upstream {{ .Values.upstream }};
          proxy_pass $upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 120s;  # generation takes up to ~35 s
          proxy_send_timeout 120s;
        }
      }
    }
