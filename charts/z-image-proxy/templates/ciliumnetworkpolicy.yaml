{{- if .Values.upstream }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "z-image-proxy.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "z-image-proxy.selectorLabels" . | nindent 6 }}
  ingress:
    # Allow the image-gen caller (LibreChat in the converse namespace)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.allowFromNamespace | quote }}
  egress:
    # DNS so ngx.fetch / variable proxy_pass can resolve the upstream hostname
    # at request time (the proxy is in a default-deny egress namespace).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Allow outbound to z-image-turbo (same namespace, any pod)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
