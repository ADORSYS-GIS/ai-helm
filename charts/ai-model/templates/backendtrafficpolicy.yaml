{{- /*
BackendTrafficPolicy — per-model rate limiting (ADR-0021).

Up to THREE rule families per plan, all composed (Envoy denies if ANY matched
bucket is exhausted). ⚠️ Families 1 and 2 render for NO plan as of 2026-08-01 —
every `burst:` block is commented out in charts/ai-models/values.yaml, so
per-minute limiting is off fleet-wide and the gateway-wide shared monthly budget
is the only cap left. The logic here is intact and deliberately untouched:
uncommenting a plan's `burst:` restores its rules with no template change (but
re-read the ordering note in that file first — once `tiers`/`projectEnvelope`
are populated, doing so shifts THEIR indices). See the $hasRules guard below,
which drops the whole rateLimit block when no family renders at all.

  1. burst requests/min — keyed on x-account-id + x-billing-plan (per user per model).
                          DISABLED (no plan sets burst.requestsPerMin).
  2. burst tokens/min   — keyed on x-account-id + x-billing-plan, cost = the llm_total_token
                          response metadata (TotalToken) the AIGatewayRoute emits.
                          DISABLED (no plan sets burst.tokensPerMin).
  3. monthly budget     — micro-USD, cost = llm_custom_total_cost. Emitted ONLY
                          for plans that carry a budget → service/internal stay
                          uncapped. ⚠️ CAVEAT: because this BTP targets the
                          per-model HTTPRoute, Envoy Gateway namespaces the
                          counter PER ROUTE — so despite the model-agnostic
                          descriptor this budget is enforced PER MODEL, not shared
                          (a heavy user held ~29 separate counters, #532). The
                          shared fix moves this rule to the gateway-wide BTP with
                          `shared: true` (charts/core-gateway); when
                          `.Values.sharedBudget.enabled` this per-model rule is
                          DROPPED and the policy instead merges
                          (`mergeType: StrategicMerge`) with that gateway budget.

x-billing-plan (stamped by the AuthConfig from Keycloak's billing_plan claim (from group attribute)) selects the plan.

Every `unit: Month` rule below (plan budget, tier budget, project envelope) also
keys on x-billing-period — a calendar "YYYY-MM" marker stamped gateway-wide by
the core-gateway chart's Lua EnvoyExtensionPolicy (ADR-0111). Envoy Gateway's
`unit: Month` is actually a fixed 30-day (2,592,000s) epoch window, not a true
calendar month, so without this the budget window drifts off-calendar by ~5
days/year. Folding the marker into the key makes a fresh counter start every
1st automatically; the old key just ages out on its existing 30-day TTL.

Budget per plan = global plan default (.Values.plans.<plan>.monthlyBudgetUsd).
Burst (rules 1+2) is always per-model; comes from .Values.plans.<plan>.burst.

⚠️⚠️ `.Values.plans` is an ORDERED, APPEND-ONLY LIST — `{id, monthlyBudgetUsd?,
burst}` — NOT a map. Each entry's INDEX becomes the `rule/N` in the Lyft
ratelimit redis key, and the plan name itself is masked (Exact match ⇒
constant), so the index is the ONLY carrier of plan identity. A map here
silently reorders on any key insertion (Helm sorts map keys), which orphans
every account's accumulated spend mid-window and hands out a fresh,
unthrottled counter — a confirmed, live incident in charts/core-gateway
(ADR-0084). NEVER reorder, insert, or remove a `plans` entry; new plans are
always appended at the tail. See ADR-0084/ADR-0110.

Two more rule families compose alongside the plan rules (ai-helm#570,
ADR-0110), rendered AFTER them so they never disturb a plan rule's index:

  4. quota tiers        — `.Values.tiers`, the SAME ordered-list shape/contract
                          as `plans`, one rule per tier keyed on x-project-id +
                          x-account-id (Distinct) + x-quota-tier (Exact). A
                          per-member-in-project budget, delegated by a project
                          lead (`lightbridge-authz` `project_members.quota_tier`).
                          Always per-model (not gated by `sharedBudget` — that
                          lever is specific to the #532 plan-budget cutover and
                          orthogonal to this new axis).
  5. project envelope   — `.Values.projectEnvelope`, a SINGLE static rule (no
                          list, no ordering hazard) keyed on x-project-id
                          (Distinct) + x-project-quota (Exact), a per-project
                          ceiling composing with the per-member tier above.

`x-project-id` / `x-quota-tier` / `x-project-quota` are not yet stamped by any
AuthConfig (separate, not-yet-built Authorino wiring) — with `tiers: []` /
`projectEnvelope: {}` (the defaults) neither rule family renders, so a caller
with no project context falls through to the plan rules unchanged.

⚠️ Every clientSelectors header spells out `invert: false` explicitly, even
though it's the zero value. The BackendTrafficPolicy CRD schema declares
`default: false` for this field, so the k8s API server stamps it onto the
LIVE object on every apply regardless of what we send — omitting it here
made ArgoCD's diff perpetually see "live has extra fields" and every model
Application showed a permanent, cosmetic OutOfSync. Spelling it out here
makes the rendered manifest match what the API server actually stores.
*/ -}}
{{- $modelName := .Values.modelName -}}
{{- $plans := .Values.plans -}}
{{- $tiers := .Values.tiers | default list -}}
{{- $projectEnvelope := .Values.projectEnvelope | default dict -}}
{{- $costKey := "llm_custom_total_cost" -}}
{{- /* Image models have no meaningfull token counting (llm_total_token = 0 always),
      so we skip the tokens/min rate-limit rule and only keep requests/min + budget. */ -}}
{{- $isImage := eq (.Values.kind | default "text") "image" -}}
{{- /* Shared-budget cutover (#532): when enabled, the monthly-budget rule below
       is DROPPED (it moves to the gateway-wide BTP with `shared: true`) and this
       per-model policy MERGES with that gateway policy instead of overriding it,
       so it keeps its per-model burst + timeout while inheriting the one shared
       budget counter. Requires Envoy Gateway ≥ v1.8.2 (see core-gateway BTP).
       Defaults off → unchanged per-model behaviour. */ -}}
{{- $sharedBudget := (.Values.sharedBudget | default dict).enabled -}}
{{- /* ⚠️ EVERY rule family below is optional, and as of 2026-08-01 ALL of them
       are absent at once on the live fleet: the plan `burst:` blocks are
       commented out in charts/ai-models/values.yaml (families 1+2), families 4+5
       need `tiers`/`projectEnvelope`, still empty, and `sharedBudget.enabled`
       drops family 3. `rateLimit.global.rules` is a REQUIRED, minItems-1 list in
       the BackendTrafficPolicy CRD, so rendering the block with an empty list
       gets the whole policy rejected by the API server — which would take the
       per-model upstream TIMEOUT down with it, a far bigger blast radius than
       the rate limits. Pre-compute whether anything renders and omit the
       `rateLimit:` block entirely when nothing does; the gateway-wide BTP's
       shared budget still applies via the StrategicMerge above. */ -}}
{{- $hasRules := false -}}
{{- range $i, $plan := $plans }}
  {{- /* Same `id` guard as the rules loop below, repeated here because that loop
         is skipped entirely when no rule renders — a malformed plans entry must
         still fail the render, not pass silently. */}}
  {{- if not $plan.id }}{{ fail (printf "ai-model plans[%d]: `id` is required (plans is an ordered list of {id, monthlyBudgetUsd?, burst}, not a map — see values.yaml)" $i) }}{{ end }}
  {{- $b := default dict $plan.burst }}
  {{- if $b.requestsPerMin }}{{ $hasRules = true }}{{ end }}
  {{- if and (not $isImage) $b.tokensPerMin }}{{ $hasRules = true }}{{ end }}
  {{- if and (not $sharedBudget) $plan.monthlyBudgetUsd }}{{ $hasRules = true }}{{ end }}
{{- end }}
{{- range $tier := $tiers }}
  {{- $tb := default dict $tier.burst }}
  {{- if $tb.requestsPerMin }}{{ $hasRules = true }}{{ end }}
  {{- if and (not $isImage) $tb.tokensPerMin }}{{ $hasRules = true }}{{ end }}
  {{- if $tier.monthlyBudgetUsd }}{{ $hasRules = true }}{{ end }}
{{- end }}
{{- if $projectEnvelope.monthlyBudgetUsd }}{{ $hasRules = true }}{{ end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $modelName }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $modelName }}
  {{- if $sharedBudget }}
  # Merge with the gateway-wide BTP (which carries the shared budget) rather than
  # fully overriding it (EG default). Without this the route would drop the
  # gateway's shared-budget rule. StrategicMerge combines the rate-limit rule
  # lists (gateway budget + this policy's burst).
  mergeType: StrategicMerge
  # Merging also inherits the gateway policy's retry (numRetries: 1). Model routes
  # deliberately DON'T retry LLM calls (amplifies load on stressed backends, and
  # risks double-charging a partial generation) — so neutralise it back to 0.
  retry:
    numRetries: 0
  {{- end }}
  {{- /*
  Per-model upstream timeout.
  */ -}}
  {{- $t := .Values.timeout | default dict }}
  timeout:
    http:
      requestTimeout: {{ $t.requestTimeout | default "600s" | quote }}
      {{- with $t.connectionIdleTimeout }}
      connectionIdleTimeout: {{ . | quote }}
      {{- end }}
  {{- if $hasRules }}
  rateLimit:
    type: Global
    global:
      rules:
        {{- /* ── plan rules: `plans` is an ordered list, NOT a map — see the
               header comment. APPEND ONLY. ── */}}
        {{- range $i, $plan := $plans }}
        {{- if not $plan.id }}{{ fail (printf "ai-model plans[%d]: `id` is required (plans is an ordered list of {id, monthlyBudgetUsd?, burst}, not a map — see values.yaml)" $i) }}{{ end }}
        {{- $burst := default dict $plan.burst }}
        {{- /* ── 1. burst: requests/min (per-user per model) ── */}}
        {{- with $burst.requestsPerMin }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  name: x-ai-eg-model
                  type: Exact
                  value: {{ $modelName | quote }}
          limit:
            requests: {{ int64 . }} # rule/{{ $i }} · {{ $plan.id }} burst req/min per model
            unit: Minute
          cost:
            request:
              from: Number
              number: 1
        {{- end }}
        {{- /* ── 2. burst: tokens/min (per-user per model) — SKIPPED for image models ── */}}
        {{- if not $isImage }}{{ with $burst.tokensPerMin }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  name: x-ai-eg-model
                  type: Exact
                  value: {{ $modelName | quote }}
          limit:
            requests: {{ int64 . }} # rule/{{ $i }} · {{ $plan.id }} burst tokens/min per model
            unit: Minute
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
        {{- end }}{{ end }}
        {{- /* ── 3. monthly budget (per-model unless sharedBudget.enabled → moved to gateway BTP) ── */}}
        {{- $budgetUsd := $plan.monthlyBudgetUsd }}
        {{- if not $sharedBudget }}
        {{- with $budgetUsd }}
        {{- $limit := mulf . 1000000 | int64 }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  # ADR-0111: calendar billing-month marker (stamped gateway-wide
                  # by the core-gateway Lua EnvoyExtensionPolicy) folded into the
                  # key so the counter rotates on the 1st instead of drifting on
                  # Envoy Gateway's fixed 30-day `unit: Month` epoch window.
                  name: x-billing-period
                  type: Distinct
          limit:
            requests: {{ $limit }} # rule/{{ $i }} · {{ $plan.id }} monthly budget ${{ . }} — PER MODEL (see caveat; shared version is the gateway BTP)
            unit: Month
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: {{ $costKey }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- /* ── quota tiers (ai-helm#570, ADR-0110): SAME append-only-list
               contract as `plans`, rendered strictly after it so introducing
               a tier never shifts a plan rule's index. Always per-model
               (not gated by sharedBudget — that lever is specific to the
               #532 plan-budget cutover). ── */}}
        {{- range $i, $tier := $tiers }}
        {{- if not $tier.id }}{{ fail (printf "ai-model tiers[%d]: `id` is required (tiers is an ordered list of {id, monthlyBudgetUsd?, burst}, not a map — see values.yaml)" $i) }}{{ end }}
        {{- $tierBurst := default dict $tier.burst }}
        {{- /* ── 4a. tier burst: requests/min (per member per model) ── */}}
        {{- with $tierBurst.requestsPerMin }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-project-id
                  type: Distinct
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-quota-tier
                  type: Exact
                  value: {{ $tier.id | quote }}
                - invert: false
                  name: x-ai-eg-model
                  type: Exact
                  value: {{ $modelName | quote }}
          limit:
            requests: {{ int64 . }} # tier-rule/{{ $i }} · {{ $tier.id }} burst req/min per member per model
            unit: Minute
          cost:
            request:
              from: Number
              number: 1
        {{- end }}
        {{- /* ── 4b. tier burst: tokens/min (per member per model) — SKIPPED for image models ── */}}
        {{- if not $isImage }}{{ with $tierBurst.tokensPerMin }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-project-id
                  type: Distinct
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-quota-tier
                  type: Exact
                  value: {{ $tier.id | quote }}
                - invert: false
                  name: x-ai-eg-model
                  type: Exact
                  value: {{ $modelName | quote }}
          limit:
            requests: {{ int64 . }} # tier-rule/{{ $i }} · {{ $tier.id }} burst tokens/min per member per model
            unit: Minute
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
        {{- end }}{{ end }}
        {{- /* ── 4c. tier monthly budget (per member per model, always — not
               gated by sharedBudget) ── */}}
        {{- with $tier.monthlyBudgetUsd }}
        {{- $tierLimit := mulf . 1000000 | int64 }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-project-id
                  type: Distinct
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-quota-tier
                  type: Exact
                  value: {{ $tier.id | quote }}
                - invert: false
                  # ADR-0111: see the plan-budget rule above — same fix.
                  name: x-billing-period
                  type: Distinct
          limit:
            requests: {{ $tierLimit }} # tier-rule/{{ $i }} · {{ $tier.id }} monthly budget ${{ . }} per member per model
            unit: Month
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: {{ $costKey }}
        {{- end }}
        {{- end }}
        {{- /* ── 5. project envelope (ai-helm#570, ADR-0110): a SINGLE static
               rule (no list, no ordering hazard) enforcing a per-project
               ceiling alongside the per-member tier above. ── */}}
        {{- with $projectEnvelope.monthlyBudgetUsd }}
        {{- $envelopeLimit := mulf . 1000000 | int64 }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-project-id
                  type: Distinct
                - invert: false
                  name: x-project-quota
                  type: Exact
                  value: {{ $projectEnvelope.projectQuota | default "" | quote }}
                - invert: false
                  # ADR-0111: see the plan-budget rule above — same fix.
                  name: x-billing-period
                  type: Distinct
          limit:
            requests: {{ $envelopeLimit }} # project envelope ${{ . }} per project per model
            unit: Month
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: {{ $costKey }}
        {{- end }}
  {{- end }}
