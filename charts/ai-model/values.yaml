# A single model. Instantiated per-model by charts/ai-models's
# ApplicationSet. ADR-0012 explains the split.

# Required ─────────────────────────────────────────────────────────────────
# Name of the model — used as the AIGatewayRoute / BackendTrafficPolicy
# object name AND as the `x-ai-eg-model` header value the gateway matches on.
modelName: ""

# Kind of model: text | multimodal | embedding | reranker. Informational;
# not consumed by template logic today but kept for downstream observability.
kind: text

# Required: backendsInventory provides the resourceName lookup for each
# backend ref. Mirrors the parent's `backends:` map. Without it, AIGatewayRoute
# can't resolve a backend's Service name.
backendsInventory: {}
# Example:
#   fw-01:
#     resourceName: fw-backend-01-svc
#   deepinfra-01:
#     resourceName: deepinfra-backend-01-svc

# Required: the upstream backends + priorities this model routes to.
backends: {}
# Example:
#   fw-01:
#     ref: fw-01
#     priority: 0
#     modelNameOverride: "accounts/fireworks/models/glm-5p1"
#     # weight: 1
#     # enabled: true   (default)

# Required: which Gateway this route attaches to.
gatewayRef:
  name: ""
  namespace: ""
  # Optional: pin the AIGatewayRoute to a specific Gateway listener (e.g.
  # "api-https") so it's HTTPS-only. Empty = attach to all listeners.
  sectionName: ""

# Optional: skip the external (api-https) parentRef entirely, so the model's
# AIGatewayRoute attaches only to gatewayRef.internalSectionName. Use this to
# block a model on the public host (api.ai.camer.digital) while keeping it
# reachable for in-cluster callers (e.g. LibreChat) on the internal plane.
# Requires gatewayRef.internalSectionName to be set — see aigatewayroute.yaml.
disableExternal: false

# Required: pricing strategy. Drives the cost CEL expression rendered by
# AIGatewayRoute. See _helpers.tpl for the supported strategies
# (weighted, tieredWeighted, flat).
pricing: {}
# Example weighted:
#   strategy: weighted
#   standard:
#     inputPer1M: 0.60
#     cachedInputPer1M: 0.12
#     outputPer1M: 2.08

# Optional minimum-backends invariant (HA safety). Default 2.
minBackends: 2

# Per-model upstream timeout (Envoy Gateway BackendTrafficPolicy
# spec.timeout.http). The AIGatewayRoute default is 60s, which is too short
# for large prompts or long generations — 600s rides a cold start + a full
# generation comfortably. Override per model if needed.
timeout:
  requestTimeout: 600s
  connectionIdleTimeout: 1h

# Optional: per-model rate-limit overrides (a DIFFERENT, currently-unconsumed
# key from the `plans`/`tiers` lists below — reserved for a future per-model
# `{ free: 10, pro: 50 }`-style override; do not confuse the two). When absent,
# the model inherits from `plans` below.
# Example:
#   free: 10
#   pro: 50
rateLimitBudgeting: {}

# Required: monthly-budget + burst defaults across plans (in USD / per-minute
# counts). `plans` is an ORDERED, APPEND-ONLY LIST of
# {id, monthlyBudgetUsd?, burst}, NOT a map (ADR-0084/0085) — each entry's
# INDEX becomes the `rule/N` in the Lyft ratelimit redis key, and the plan
# name itself is masked (Exact match ⇒ constant), so the index is the ONLY
# carrier of plan identity. A new plan is always APPENDED at the tail; never
# reorder, insert, or remove an entry — doing so mid-window silently orphans
# every account's accumulated spend under the old index and starts a fresh,
# unthrottled counter (ADR-0084's confirmed 2026-07-16 incident).
plans: []
# Example (append-only order — see comment above):
#   - id: free
#     monthlyBudgetUsd: 30
#     burst:
#       requestsPerMin: 200
#       tokensPerMin: 1000000
#   - id: pro
#     monthlyBudgetUsd: 200
#     burst:
#       requestsPerMin: 400
#       tokensPerMin: 2000000

# `tiers` is the SAME shape as `plans`, for per-member-in-project quota tiers
# (ai-helm#570) — a separate, independently-ordered append-only list, rendered
# strictly AFTER the plans rules so introducing/reordering tiers can never
# shift a plan rule's index. Empty by default: no tiers configured means no
# tier rules render, so any caller with no `x-quota-tier` context falls
# through to the plan rules unchanged.
tiers: []
# Example:
#   - id: t-xs
#     monthlyBudgetUsd: 5
#     burst:
#       requestsPerMin: 60
#       tokensPerMin: 200000
#   - id: t-m
#     monthlyBudgetUsd: 50
#     burst:
#       requestsPerMin: 200
#       tokensPerMin: 1000000

# `projectEnvelope` is a single static rule (no list, no ordering hazard)
# enforcing a per-project ceiling alongside the per-member tier. Unset by
# default (no rule rendered).
projectEnvelope: {}
# Example:
#   monthlyBudgetUsd: 500
#   projectQuota: standard

# Shared cross-model monthly budget cutover (#532). When enabled, this per-model
# BTP drops its monthly-budget rule and merges (StrategicMerge) with the
# gateway-wide BTP that carries ONE `shared: true` budget counter across all
# models. Keep FALSE until Envoy Gateway ≥ v1.8.2 (bug #9244), then flip this and
# core-gateway `backendTrafficPolicy.monthlyBudget.enabled` together.
sharedBudget:
  enabled: false
