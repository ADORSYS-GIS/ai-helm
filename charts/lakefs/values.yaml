# lakefs App-of-Apps orchestrator — renders FOUR child Application CRs
# (lakefs-secrets + lakefs-app + lakefs-proxy + lakefs-auth). Follows the
# lightbridge canonical pattern (ADR-0019). The chart owns no workload
# resources; it owns the child Applications.
#
# Keycloak SSO for LakeFS (ADR-0090). LakeFS OSS 1.83 has NO usable native
# OIDC — the `auth.oidc.*` provider keys are rejected outright at startup
# ("has invalid keys: enabled, client_id, url, callback_base_url"); that
# provider is Enterprise/"Fluffy" only. The earlier attempt to gate LakeFS with
# a bare oauth2-proxy was also dropped, because it only stacked a second login
# in front of LakeFS's own. The shape that actually works (validated
# end-to-end, incl. a real browser login) inserts a shim between the two:
#
#   browser → lakefs-auth (oauth2-proxy, Keycloak OIDC, reverse-proxy mode)
#           → lakefs-proxy (charts/lakefs-proxy — the SSO shim)
#           → lakefs (upstream chart, ingress DISABLED)
#
# oauth2-proxy authenticates the human and sets `X-Auth-Request-Email`;
# lakefs-proxy sees an authenticated request with no `internal_auth_session`
# cookie, logs into LakeFS as the bootstrap admin, RELAYS LakeFS's own
# `Set-Cookie` (a Go securecookie value — it cannot be hand-minted), 302s back,
# and thereafter transparently reverse-proxies.
#
# ⚠️ Accepted, documented limitation: LakeFS OSS with `rbac: none` is
# single-user (verified — it refuses to create additional users), so all SSO
# users share the ONE `admin` LakeFS identity. Authentication is genuinely
# per-Keycloak-user; in-LakeFS authorization and audit are shared. See ADR-0090.
#
# LakeFS has its OWN dedicated CNPG cluster (charts/mlops-db, mlops ns) —
# ADR-0123 supersedes ADR-0085 decision #3 (which put LakeFS on the shared
# lightbridge-main-db cluster instead) after an incident where an unrelated
# converse-namespace tenant's connection load exhausted that shared cluster
# and took LakeFS's metadata store down with it. The cluster is named/scoped
# for the whole `mlops` namespace, not LakeFS specifically — MLflow gets a
# role + database on it too (provisioned, pending a separately-cleared data
# migration before its connection actually cuts over — see ADR-0123). It's a
# child of THIS orchestrator only because charts/lakefs already carried the
# scaffolded-but-disabled `db` slot it fills; ownership isn't LakeFS-only,
# same as lightbridge-main-db being a child of `charts/lightbridge` doesn't
# make Lightbridge the owner of coder's/governance's data.

# ────────────────────────────────────────────────────────────────────────
# Shared ArgoCD wiring for all child Applications.
# ────────────────────────────────────────────────────────────────────────
argocd:
  project: ai
  # OCI chart-float (ADR-0055). Two sources of truth:
  #  • chartRegistry/chartVersionRange — the secrets/auth leaf charts float
  #    from OCI (full chart path in repoURL + chart "."; template builds
  #    `<chartRegistry>/<chartName>`).
  #  • repoURL/targetRevision — the app child's cert/deps overlay (Source B) +
  #    $values ref (Source C), from ai-helm-values @ main (where environments/ lives).
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  repoURL: https://github.com/adorsys-gis/ai-helm-values
  targetRevision: main
  destination:
    name: home-remote
    allowInCluster: false
    namespace: mlops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ────────────────────────────────────────────────────────────────────────
# lakefs-secrets child — the ExternalSecrets leaf chart (this repo).
# Lowest sync-wave: DB URL + S3 creds + auth encrypt key + OIDC creds must
# exist before the auth proxy and the app start.
# ────────────────────────────────────────────────────────────────────────
secrets:
  enabled: true
  appName: lakefs-secrets
  chartName: lakefs-secrets   # OCI chart name
  releaseName: lakefs-secrets
  syncWave: "0"

# ────────────────────────────────────────────────────────────────────────
# db child — the shared mlops CNPG cluster (charts/mlops-db, this repo,
# RENAMED from lakefs-db — it now also provisions MLflow's role/database
# ahead of a separately-cleared cutover, ADR-0123). Was disabled (LakeFS
# shared lightbridge-main-db, ADR-0085); the incident that ADR-0123 documents
# is why it's enabled now. Lowest non-secrets wave — after lakefs-secrets (0,
# provisions its own S3/OIDC creds — NOT the DB role, which this chart
# provisions itself) and before lakefs-app (2, the app needs the DB to exist
# first). appName/releaseName use `mlops-db`, not `lakefs-db`, so the
# rendered Application/release names match what they actually are now.
# ────────────────────────────────────────────────────────────────────────
db:
  enabled: true
  appName: mlops-db
  chartName: mlops-db   # OCI chart name
  releaseName: mlops-db
  syncWave: "1"
  # Ignore the CNPG operator's defaulted fields on the Cluster so it doesn't
  # sit permanently OutOfSync — same reasoning/pattern as charts/lightbridge's
  # db.ignoreDifferences (the operator, field manager `manager`, adds
  # affinity/bootstrap/probes/primaryUpdateStrategy/… the chart never
  # declares).
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager

# ────────────────────────────────────────────────────────────────────────
# lakefs-proxy child — the SSO shim (ADR-0090), this repo's own leaf chart,
# OCI-floated. Sits BETWEEN lakefs-auth and lakefs: it converts "oauth2-proxy
# says this browser is authenticated" into a real LakeFS session by logging in
# as the bootstrap admin and relaying LakeFS's own Set-Cookie.
#
# Wave 3 — after lakefs-app (wave 2), because the shim is useless until LakeFS
# exists to log into, and before lakefs-auth (wave 4), the front door.
# ────────────────────────────────────────────────────────────────────────
proxy:
  enabled: true
  appName: lakefs-proxy
  chartName: lakefs-proxy   # OCI chart name
  releaseName: lakefs-proxy
  syncWave: "3"

# ────────────────────────────────────────────────────────────────────────
# lakefs-auth child — a dedicated oauth2-proxy instance (own Keycloak client
# `lakefs-proxy`, own cookie secret — NOT shared with mlflow-auth) in full
# REVERSE-PROXY mode. Its `--upstream` is the lakefs-proxy Service, not LakeFS
# directly (ADR-0090) — an oauth2-proxy pointed straight at LakeFS only stacks
# a second login, which is why the earlier attempt was reverted.
#
# Upstream chart, classic Helm repo, pinned — not floated. Wave 4: the front
# door goes up last, once its upstream chain is in place.
# ────────────────────────────────────────────────────────────────────────
auth:
  enabled: true
  appName: lakefs-auth
  releaseName: lakefs-auth
  syncWave: "4"
  chart:
    repoURL: https://oauth2-proxy.github.io/manifests
    name: oauth2-proxy
    targetRevision: "10.7.0"

# ────────────────────────────────────────────────────────────────────────
# lakefs-app child — the upstream LakeFS workload (Helm chart, deployed as
# an ArgoCD source — NOT a Helm dependency, so ArgoCD pulls it directly) +
# the ingress TLS Certificate and the front-door Ingress via the kustomize
# overlay. The chart owns NO ingress of its own (ADR-0090): all traffic for
# the hostname enters through lakefs-auth, and a second chart-owned ingress
# straight to the Service would bypass the SSO gate. releaseName stays
# `lakefs` so workload resource names match what lakefs-proxy's LAKEFS_URL and
# the CiliumNetworkPolicies expect.
# ────────────────────────────────────────────────────────────────────────
app:
  enabled: true
  appName: lakefs-app
  releaseName: lakefs
  syncWave: "2"
  # Upstream LakeFS chart — classic Helm repo (NOT OCI), pinned to a stable
  # version (not floated like the secrets/auth leaves).
  chart:
    repoURL: https://charts.lakefs.io
    name: lakefs
    targetRevision: "1.12.13"
  # App-scoped deps (ingress Certificate, the front-door Ingress → the
  # lakefs-auth oauth2-proxy Service, and the three CiliumNetworkPolicies) —
  # kustomize overlay in ai-helm-values, added as a second source (issuer
  # patched per env). ADR-0018 pattern.
  depsOverlay: environments/prod/deps/lakefs
