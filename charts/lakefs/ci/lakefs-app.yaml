# CI / reference values for the upstream LakeFS chart (https://charts.lakefs.io).
#
# This file serves TWO purposes:
# 1. Human reference copy — kept structurally in sync with the PRIVATE
#    ai-helm-values repo file at environments/prod/values/lakefs-app.yaml
#    (NOT auto-linted: the top-level repo CI loop only picks up
#    charts/<chart>/ci/*-values.yaml, and this file is named *-app.yaml).
# 2. Documentation of the exact chart schema decisions (existingSecret +
#    secretKeys, S3 blockstore via extraEnvVars, no chart-owned ingress).
#
# Metadata DB: the dedicated mlops-main-db CNPG cluster (mlops ns,
# charts/mlops-db), via the `lakefs` managed role/Database — ADR-0123,
# supersedes the earlier lightbridge-main-db (converse ns) placement after
# an incident where an unrelated shared-cluster tenant exhausted its
# connections and took LakeFS down with it. Blockstore: Hetzner Object
# Storage (S3-compatible), prefix `lakefs/` inside the shared
# ssegning-k8s-state bucket, reusing the platform's existing S3 credentials
# (same material CNPG backups + LibreChat's S3 file storage use).
#
# Auth: LakeFS OSS has no usable native OIDC (Enterprise/"Fluffy" only —
# `auth.oidc.*` is rejected at startup, ADR-0085/ADR-0090). Keycloak SSO comes
# from a two-hop chain in front of this workload:
#   browser → lakefs-auth (oauth2-proxy, reverse-proxy mode)
#           → lakefs-proxy (the SSO shim, charts/lakefs-proxy)
#           → lakefs (this chart)
# The shim logs into LakeFS as the bootstrap admin on the authenticated user's
# behalf and relays LakeFS's own session cookie. LakeFS OSS with `rbac: none`
# is single-user, so all SSO users share the one `admin` identity — see the
# ADR-0090 consequences.

# Single Secret (ESO-provisioned by charts/lakefs-secrets, key `lakefs-app-secret`)
# carrying both sensitive values the chart natively supports pulling from an
# existing Secret.
existingSecret: lakefs-app-secret
secretKeys:
  authEncryptSecretKey: auth_encrypt_secret_key
  databaseConnectionString: database_connection_string

lakefsConfig: |
  database:
    type: postgres
    # Incident (2026-08-08/09): lightbridge-main-db is a SHARED CNPG cluster
    # (converse ns, ADR-0085) with no PgBouncer in front of it. LakeFS's
    # unconfigured client fell back to the binary's own default pool
    # (max_open_connections=25, max_idle_connections=25 — confirmed from the
    # pod's own "Config loaded" startup log line, not guessed), which alone
    # is a quarter of CNPG's default max_connections=100 and, combined with
    # every other tenant's own pool (coder/mlflow/governance/codeintel/
    # grafana_ro), exhausted it: `FATAL: sorry, too many clients already`
    # (SQLSTATE 53300). LakeFS then fell back to rendering its first-run
    # /setup page and returned repository-not-found/auth errors.
    # Capped hard here — LakeFS's KV access pattern is short, low-concurrency
    # point reads/writes, not a connection-heavy workload — so it can never
    # again be the tenant that exhausts the shared cluster. Key names verified
    # against the same startup log (`database.postgres.max_open_connections`,
    # `database.postgres.max_idle_connections`), not guessed against docs.
    postgres:
      max_open_connections: 5
      max_idle_connections: 2
  blockstore:
    type: s3
    s3:
      region: us-east-1
      endpoint: https://nbg1.your-objectstorage.com
      # Hetzner Object Storage (Ceph-RGW) needs path-style addressing —
      # virtual-hosted-style DNS isn't set up for this endpoint.
      force_path_style: true

# S3 access key/secret aren't part of the chart's existingSecret/secretKeys
# mechanism (no such key listed upstream) — the AWS SDK's standard env var
# fallback (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) picks these up.
# Same platform S3 credentials every other Hetzner Object Storage consumer
# uses (prod/meta/test-app), surfaced by charts/lakefs-secrets as `lakefs-s3-creds`.
extraEnvVars:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: lakefs-s3-creds
        key: access_key_id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: lakefs-s3-creds
        key: secret_access_key
  # Default storage namespace for newly-created repositories (a `lakefs/`
  # prefix inside the shared bucket) — set via env since lakefsConfig has no
  # dedicated key for this (it's a per-repository default, not a blockstore
  # setting).
  - name: LAKEFS_BLOCKSTORE_DEFAULT_NAMESPACE_PREFIX
    value: "s3://ssegning-k8s-state/lakefs"

replicaCount: 1

# GitOps-clean rollout trigger. This chart's Deployment computes
# checksum/config from the ConfigMap only (verified from the upstream
# template source) — a Secret-only value change (e.g. the ADR-0123 DB
# cutover's database_connection_string) does not trigger a rollout on its
# own, and nothing here opts into Stakater Reloader either. Bump this dated,
# otherwise-inert entry whenever such a change needs an explicit rollout.
podAnnotations:
  ai-helm.adorsys-gis.github.io/rollout-trigger: "2026-08-09-mlops-db-cutover"

# Chart defaults (delay=0s, period=10s, failureThreshold=3 => killed after
# only 30s) are too tight for LakeFS's first-boot DB migration — the pod
# was being SIGKILLed (exit 137, "failed liveness probe") before it ever
# bound :8000. Found live during ADR-0085 verification. Round 1
# (initialDelaySeconds=20, failureThreshold=6, ~80s) still wasn't enough —
# still got killed mid-migration ("postgres get: context canceled").
# Round 2: more generous margin, ~150s.
readinessProbe:
  # This chart's readinessProbe template has no initialDelaySeconds field
  # (silently dropped if set) — periodSeconds/failureThreshold still give
  # the same grace window.
  periodSeconds: 10
  failureThreshold: 12
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 12

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 80

# The LakeFS chart owns NO ingress (ADR-0090). All external traffic for
# lakefs.mlops.ai.camer.digital enters through the lakefs-auth oauth2-proxy
# (reverse-proxy mode) via the Ingress shipped in the depsOverlay
# (environments/base/deps/lakefs/ingress.yaml), which routes `/` → the
# oauth2-proxy Service; oauth2-proxy proxies to lakefs-proxy (the SSO shim),
# which in turn proxies to this chart's in-cluster `lakefs` Service.
# Re-enabling this chart's own ingress would publish a second, unauthenticated
# route straight to LakeFS and bypass the SSO gate entirely.
#
# The TLS Certificate (lakefs-tls) is still issued by the depsOverlay
# (environments/base/deps/lakefs/certificate.yaml) — that Ingress references
# the resulting secret.
ingress:
  enabled: false
