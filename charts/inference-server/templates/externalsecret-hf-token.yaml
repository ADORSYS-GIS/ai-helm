{{- /*
HuggingFace token for the seed Job. Lifts the anonymous Hub rate limit that
otherwise stalls a multi-GB download partway through, and is mandatory for
gated repos.

Wave -2: before the PVC (-1) and the seed Job (0). If the property is missing
from the store the ExternalSecret sits in SecretSyncedError and the seed Job's
env binding blocks the pod in ContainerCreating — deliberately, so a tokenless
pod never starts and half-downloads (the same optional-secret race that bit the
MCP proxies; see CLAUDE.md).
*/ -}}
{{- include "inference-server.validate" . -}}
{{- if and .Values.hfToken.enabled .Values.hfToken.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.hfToken.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.hfToken.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.hfToken.externalSecret.secretStore | default "ssegning-aws" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.hfToken.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.hfToken.dataKey }}
      remoteRef:
        key: {{ required "hfToken.externalSecret.key is required" .Values.hfToken.externalSecret.key | quote }}
        property: {{ required "hfToken.externalSecret.property is required" .Values.hfToken.externalSecret.property | quote }}
{{- end }}
