{{- /*
Scrape the engine's own metrics. llama.cpp exposes /metrics behind `--metrics`;
vLLM exposes it natively. Alloy discovers ServiceMonitors cluster-wide (see the
alloy child in charts/observability), so this is all that is needed to get
tokens/s, queue depth, KV-cache utilisation and request latency into Mimir.

The Service is rendered by bjw (service.main), named after the model, and the
port is named `http` — see the orchestrator's expansion.
*/ -}}
{{- include "inference-server.validate" . -}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      ai-helm.adorsys-gis.github.io/model: {{ .Values.model.name }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | default "10s" }}
      # The engine reports metrics about ITSELF, so there are no foreign labels
      # to preserve — unlike kube-state-metrics, which needs honorLabels (CLAUDE.md).
      {{- if .Values.apiKey.enabled }}
      # ⚠️ Hardening (ADR-0097) covers /metrics too. llama-server exempts /health
      # from the API key — so probes keep working and the pod stays Ready — but
      # NOT /metrics, so an unauthenticated scrape gets a 401 and the metrics
      # vanish silently while everything else looks healthy. The only visible
      # symptom is a `unauthorized: Invalid API Key` line in the model's log at
      # exactly the scrape interval. Give the scraper the same key.
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.apiKey.secretName | quote }}
          key: {{ .Values.apiKey.dataKey | quote }}
      {{- end }}
{{- end }}
