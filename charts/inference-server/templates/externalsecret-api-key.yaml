{{- /*
Optional static API key enforced by the engine itself (llama.cpp
`--api-key-file`, vLLM `VLLM_API_KEY`).

OFF by default and it should stay that way. Under ADR-0095 the model has no
route off the cluster at all, and templates/ciliumnetworkpolicy.yaml restricts
ingress to the gateway — a stronger control than a shared static secret, and one
that cannot leak. This exists only as an escape hatch for a future model that
must be reachable from somewhere other than the gateway.

Wave -2: before the pod.
*/ -}}
{{- include "inference-server.validate" . -}}
{{- if and .Values.apiKey.enabled .Values.apiKey.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.apiKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.apiKey.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.apiKey.externalSecret.secretStore | default "ssegning-aws" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.apiKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.apiKey.dataKey }}
      remoteRef:
        key: {{ required "apiKey.externalSecret.key is required" .Values.apiKey.externalSecret.key | quote }}
        property: {{ required "apiKey.externalSecret.property is required" .Values.apiKey.externalSecret.property | quote }}
{{- end }}
