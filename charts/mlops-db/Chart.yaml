apiVersion: v2
name: mlops-db
description: |
  Dedicated CloudNativePG Cluster (mlops-main-db) for the mlops namespace's
  own tenants — LakeFS's metadata KV store, and (pending a separate,
  explicitly-cleared data migration) MLflow's backend tracking store — plus
  its own barman-cloud ObjectStore, ScheduledBackup and PodMonitor. Leaf
  chart of the lakefs App-of-Apps orchestrator (ADR-0019; it needed a home,
  and charts/lakefs already carried the scaffolded-but-disabled `db` child
  this fills — see that chart's values.yaml for why the placement isn't
  LakeFS-only despite it). Gives mlops's own tenants a failure domain
  isolated from the shared lightbridge-main-db cluster other unrelated
  converse-namespace tenants share — see ADR-0123 (supersedes ADR-0085
  decision #3 for LakeFS now, and for MLflow once its data migration is
  cleared and executed).
type: application
version: 0.1.0
appVersion: "1.0.0"
