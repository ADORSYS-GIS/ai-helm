  # --- Lightbridge Backend ---
  # Lightbridge App-of-Apps orchestrator (ADR-0019, mirrors `coder`). Replaces
  # the old flat single-Application app; emits three child Applications
  # (lightbridge-secrets wave 0, lightbridge-db wave 1, lightbridge-app wave 2)
  # from charts/lightbridge. Components are api (main) + mcp only — opa (removed
  # per ADR-0021) and usage are dropped, along with lightbridge-usage-db. As a
  # control object (it emits Application CRs) this entry is controlPlane: true —
  # the children themselves target home-remote. Name kept `lightbridge-backend`
  # so the root app entry's identity is stable.
  # OCI mode (ADR-0055): orchestrator chart floats from OCI so its App-of-Apps
  # children config deploys continuously. Children: secrets + db leaf charts from
  # OCI, the app's upstream chart by version + its cert overlay from ai-helm-values
  # (see charts/lightbridge values).
  - name: lightbridge-backend
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    controlPlane: true
    chart: lightbridge
    releaseName: lightbridge
    destination:
      namespace: converse

  # --- lightbridge-repo-auth (ADR-0047) ---
  # GitHub-App webhook control plane + the /v1/resolve binding the gateway's
  # Authorino calls. Plain workload → home-remote (default). EXTERNAL private
  # repo: pin a commit SHA (doesn't ride the ai-helm release tag) — ⚠️ ArgoCD
  # needs read creds for the private repo. depsOverlay folds in the webhook
  # ingress Certificate (Source B). Secrets: webhook/internal-token/private-key
  # via the chart's ExternalSecret (ssegning-aws repo_auth_*); the DB `repoauth`
  # Database + role + password Secret live on lightbridge-main-db
  # (charts/lightbridge-db). ⚠️ ghcr package is private today — the image pulls
  # only if it's made public OR an imagePullSecret is added (see #393).
  - name: lightbridge-repo-auth
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    depsOverlay: environments/prod/deps/lightbridge-repo-auth
    # Workload values live in ai-helm-values (ADR-0056); template injects the
    # $values ref + valueFiles (ignoreMissingValueFiles) + the ref source.
    valuesFromRepo: true
    source:
      repoURL: https://github.com/ADORSYS-GIS/lightbridge-repo-auth
      targetRevision: f45cf0ee38cc0a16aaa57a903f9e900d8a6bc22a
      path: charts/lightbridge-repo-auth
      helm:
        releaseName: lightbridge-repo-auth
    destination:
      namespace: converse

  # --- Lightbridge Code Intelligence ---
  # The GitHub-App code-review / repo-Q&A system (repo:
  # ADORSYS-GIS/lightbridge-code-intelligence): Rust control plane + Next.js web console
  # + Neo4j. Postgres/pgvector is REUSED from the lightbridge-main-db CNPG cluster via
  # a dedicated `codeintel` role + database (charts/lightbridge-db). Plain workload →
  # home-remote (default).
  #
  # CONTINUOUS DEPLOY — argocd-image-updater + git write-back (converse-ui pattern).
  # Multi-source: the chart is a git-path source on main (Source A), but the three
  # image tags are read from ai-helm-values via a $values source (Source B).
  # image-updater picks the newest *signed* sha-<gitsha> from GHCR and commits it back
  # into that file, which ArgoCD then auto-syncs — so deploys don't need an ai-helm
  # release. The selecting ImageUpdater CR is rendered by charts/imageupdater. Image
  # tags are therefore NOT set here; they live in ai-helm-values at
  # environments/prod/values/lightbridge-code-intelligence.yaml (image-updater owns them).
  # ⚠️ Write-back moved OFF the vymalo repo (2026-06-23): vymalo `main` became
  # PR-protected (1 review required), so the bot's direct push was rejected (GH006)
  # and write-back silently FROZE (app stayed Synced/Healthy on a stale sha). The
  # ai-helm-values repo's main is unprotected (the values repo exists for exactly
  # this) → the bot direct-commits again, same as converse-ui. (PR #461's OCI
  # migration was NOT the cause — Source A's form is independent of the Source B
  # push; #463's git-path revert is kept since it matches converse-ui's proven shape.)
  - name: lightbridge-code-intelligence
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    additionalAnnotations:
      # SSA dry-run diff: ESO and the CNPG/StatefulSet controllers stamp defaulted
      # fields (on the ExternalSecrets + the Neo4j StatefulSet) that the chart never
      # declares, which otherwise show a permanent cosmetic OutOfSync + selfHeal churn.
      # ServerSideDiff ignores those server-owned fields so the app reads Synced.
      argocd.argoproj.io/compare-options: ServerSideDiff=true
      # Images aliased: cp/disp/recon/a2a/mcp (control-plane, role-selected), web, runner (the one-shot
      # agent-runner/indexer image the dispatcher launches), and review (the slimmer review-only Job
      # image — no Python/Graphify — picked for review tasks; ADR-0004 per-kind images, #207).
      # `a2a` = the A2A surface (RFC-0006) — the SAME control-plane image, kept in lockstep so the a2a
      # role never lags the control-plane on a build.
      argocd-image-updater.argoproj.io/image-list: cp=ghcr.io/adorsys-gis/lightbridge-control-plane,disp=ghcr.io/adorsys-gis/lightbridge-control-plane,recon=ghcr.io/adorsys-gis/lightbridge-control-plane,a2a=ghcr.io/adorsys-gis/lightbridge-control-plane,notifier=ghcr.io/adorsys-gis/lightbridge-control-plane,mcp=ghcr.io/adorsys-gis/lightbridge-control-plane,web=ghcr.io/adorsys-gis/lightbridge-web,runner=ghcr.io/adorsys-gis/lightbridge-agent-runner,review=ghcr.io/adorsys-gis/lightbridge-agent-review
      # ── control-plane ──
      argocd-image-updater.argoproj.io/cp.update-strategy: newest-build
      argocd-image-updater.argoproj.io/cp.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/cp.force-update: "true"
      # GHCR read cred so tag detection survives ghcr.io/adorsys-gis/* going private. The
      # #621 secret's dockerconfigjson is keyed on the ghcr.io host, so it authenticates
      # the adorsys-gis org. Applied to every alias below.
      argocd-image-updater.argoproj.io/cp.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/cp.helm.image-name: lci.controllers.control-plane.containers.main.image.repository
      argocd-image-updater.argoproj.io/cp.helm.image-tag: lci.controllers.control-plane.containers.main.image.tag
      argocd-image-updater.argoproj.io/cp.signature-type: cosign
      argocd-image-updater.argoproj.io/cp.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/cp.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── dispatcher (SAME image as control-plane, role-selected) — keeps its tag in lockstep so it
      #    never lags the control-plane on a build (it's not a pod image-updater would otherwise see). ──
      argocd-image-updater.argoproj.io/disp.update-strategy: newest-build
      argocd-image-updater.argoproj.io/disp.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/disp.force-update: "true"
      argocd-image-updater.argoproj.io/disp.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/disp.helm.image-name: lci.controllers.dispatcher.containers.main.image.repository
      argocd-image-updater.argoproj.io/disp.helm.image-tag: lci.controllers.dispatcher.containers.main.image.tag
      argocd-image-updater.argoproj.io/disp.signature-type: cosign
      argocd-image-updater.argoproj.io/disp.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/disp.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── reconciler (SAME image as control-plane, role-selected) — the single GitHub-egress drainer +
      #    feedback poll; keeps its tag in lockstep so egress never lags the control-plane on a build.
      #    (alias `recon`; was `poll` before the ADR-0058 rename.) ──
      argocd-image-updater.argoproj.io/recon.update-strategy: newest-build
      argocd-image-updater.argoproj.io/recon.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/recon.force-update: "true"
      argocd-image-updater.argoproj.io/recon.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/recon.helm.image-name: lci.controllers.reconciler.containers.main.image.repository
      argocd-image-updater.argoproj.io/recon.helm.image-tag: lci.controllers.reconciler.containers.main.image.tag
      argocd-image-updater.argoproj.io/recon.signature-type: cosign
      argocd-image-updater.argoproj.io/recon.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/recon.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── a2a (SAME image as control-plane, role-selected; RFC-0006) — keeps its tag in lockstep so
      #    the A2A surface never lags the control-plane on a build. ──
      argocd-image-updater.argoproj.io/a2a.update-strategy: newest-build
      argocd-image-updater.argoproj.io/a2a.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/a2a.force-update: "true"
      argocd-image-updater.argoproj.io/a2a.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/a2a.helm.image-name: lci.controllers.a2a.containers.main.image.repository
      argocd-image-updater.argoproj.io/a2a.helm.image-tag: lci.controllers.a2a.containers.main.image.tag
      argocd-image-updater.argoproj.io/a2a.signature-type: cosign
      argocd-image-updater.argoproj.io/a2a.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/a2a.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── notifier (SAME image as control-plane, role-selected; RFC-0006 Phase 3 / ADR-0079) — keeps its
      #    tag in lockstep so the A2A push-notification worker never lags the control-plane on a build. ──
      argocd-image-updater.argoproj.io/notifier.update-strategy: newest-build
      argocd-image-updater.argoproj.io/notifier.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/notifier.force-update: "true"
      argocd-image-updater.argoproj.io/notifier.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/notifier.helm.image-name: lci.controllers.notifier.containers.main.image.repository
      argocd-image-updater.argoproj.io/notifier.helm.image-tag: lci.controllers.notifier.containers.main.image.tag
      argocd-image-updater.argoproj.io/notifier.signature-type: cosign
      argocd-image-updater.argoproj.io/notifier.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/notifier.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── mcp (SAME image as control-plane, role-selected; story #508) — keeps its tag in lockstep so
      #    the MCP surface never lags the control-plane on a build. Without this alias the `mcp` tag
      #    seeded in ai-helm-values would never auto-update (image-updater only tracks aliases listed
      #    here), unlike every other role. ──
      argocd-image-updater.argoproj.io/mcp.update-strategy: newest-build
      argocd-image-updater.argoproj.io/mcp.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/mcp.force-update: "true"
      argocd-image-updater.argoproj.io/mcp.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/mcp.helm.image-name: lci.controllers.mcp.containers.main.image.repository
      argocd-image-updater.argoproj.io/mcp.helm.image-tag: lci.controllers.mcp.containers.main.image.tag
      argocd-image-updater.argoproj.io/mcp.signature-type: cosign
      argocd-image-updater.argoproj.io/mcp.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/mcp.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── web ──
      argocd-image-updater.argoproj.io/web.update-strategy: newest-build
      argocd-image-updater.argoproj.io/web.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/web.force-update: "true"
      argocd-image-updater.argoproj.io/web.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/web.helm.image-name: lci.controllers.web.containers.main.image.repository
      argocd-image-updater.argoproj.io/web.helm.image-tag: lci.controllers.web.containers.main.image.tag
      argocd-image-updater.argoproj.io/web.signature-type: cosign
      argocd-image-updater.argoproj.io/web.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/web.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── agent-runner (the one-shot Job image the dispatcher launches; NOT a pod in
      #    this chart, so it's a single combined `repo:tag` env value, not a split
      #    image.repository/.tag). Uses `helm.image-spec` to write the whole ref into
      #    the dispatcher's AGENT_RUNNER_IMAGE env. Same cosign identity (one build
      #    workflow signs every image). Keeps the runner in lockstep with the
      #    control-plane instead of floating on `:latest`. ──
      argocd-image-updater.argoproj.io/runner.update-strategy: newest-build
      argocd-image-updater.argoproj.io/runner.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/runner.force-update: "true"
      argocd-image-updater.argoproj.io/runner.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/runner.helm.image-spec: lci.controllers.dispatcher.containers.main.env.AGENT_RUNNER_IMAGE
      argocd-image-updater.argoproj.io/runner.signature-type: cosign
      argocd-image-updater.argoproj.io/runner.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/runner.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── review (the review-only Job image — drops Python/Graphify, ~44% smaller; #207). The
      #    dispatcher's image_for() picks it for review tasks (control_plane env AGENT_REVIEW_RUNNER_IMAGE;
      #    falls back to AGENT_RUNNER_IMAGE when unset). Same cosign identity / build workflow as runner. ──
      argocd-image-updater.argoproj.io/review.update-strategy: newest-build
      argocd-image-updater.argoproj.io/review.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/review.force-update: "true"
      argocd-image-updater.argoproj.io/review.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/review.helm.image-spec: lci.controllers.dispatcher.containers.main.env.AGENT_REVIEW_RUNNER_IMAGE
      argocd-image-updater.argoproj.io/review.signature-type: cosign
      argocd-image-updater.argoproj.io/review.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/review.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-code-intelligence/\.github/workflows/build-images\.yml@.*$
      # ── git write-back → ai-helm-values main (PRIVATE; the org-wide adorsys-gis
      # GitHub App commits, and ArgoCD reads Source B via the same repo-creds —
      # exactly like converse-ui). Unprotected branch → the bot can direct-commit. ──
      argocd-image-updater.argoproj.io/write-back-method: git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/git-repository: https://github.com/adorsys-gis/ai-helm-values.git
      # Leading slash = path absolute from the git repo ROOT (without it a `helmvalues:`
      # target resolves relative to the app's chart SOURCE path).
      argocd-image-updater.argoproj.io/write-back-target: helmvalues:/environments/prod/values/lightbridge-code-intelligence.yaml
      argocd-image-updater.argoproj.io/git-credentials: secret:argocd/github-app-creds--adorsys-gis
      # ── argocd-notifications → GitHub Deployment status. `adorsys-gis` is the
      # notifier service (GitHub App installation on the adorsys-gis org); the
      # on-deployed / on-deploy-failed triggers + ssegning.me annotation
      # contract are defined in home-os charts/argocd. ──
      notifications.argoproj.io/subscribe.on-deployed.adorsys-gis: ""
      notifications.argoproj.io/subscribe.on-deploy-failed.adorsys-gis: ""
      notifications.ssegning.me/github-repo-url: https://github.com/ADORSYS-GIS/lightbridge-code-intelligence
      notifications.ssegning.me/github-revision: main
      notifications.ssegning.me/environment-url: https://code-intelligence.ai.camer.digital
    sources:
      # Source A — the chart, as a GIT-PATH source tracking ai-helm `main`
      # (continuous, like everything else — no tag). Kept git-path to match the
      # proven converse-ui write-back shape (a git chart source + a $values
      # write-back source). OCI was never the write-back blocker — branch
      # protection on the old vymalo target was (see the header note). ADR-0055.
      - repoURL: https://github.com/ADORSYS-GIS/ai-helm
        targetRevision: main
        path: charts/lightbridge-code-intelligence
        helm:
          releaseName: lightbridge-ci
          valueFiles:
            - $values/environments/prod/values/lightbridge-code-intelligence.yaml
          ignoreMissingValueFiles: true
      # Source B — image tags from ai-helm-values main; image-updater commits here.
      - repoURL: https://github.com/adorsys-gis/ai-helm-values
        targetRevision: main
        ref: values
    destination:
      namespace: converse

  # --- Lightbridge Code Intelligence UI (apps/lci) ---
  # Next.js server-rendered UI for LCI, deployed as a SEPARATE Application/chart from
  # `lightbridge-code-intelligence` above — that chart already runs an older Next.js frontend as
  # its own `web` controller (image ghcr.io/adorsys-gis/lightbridge-web, serving
  # code-intelligence.ai.camer.digital). This app replaces it, ported onto packages/ui-web in
  # converse-frontends (epic #328). Deliberately a SEPARATE Application against a SEPARATE chart
  # (`charts/converse-lci` in converse-frontends, published as
  # oci://ghcr.io/adorsys-gis/charts/converse-lci) rather than editing the `web` controller in
  # place, for the exact reason console-ui shipped alongside converse-ui instead of replacing it
  # in place: this ships, gets proven, and only THEN has the old `web` controller retired in its
  # own follow-up PR (mirroring the converse-ui retirement checklist above) — never both changed
  # in the same reconcile.
  #
  # ⚠️ NOT YET LIVE-READY — two things outside this repo's control still need doing before this
  # Application will actually authenticate, see the PR description for the full checklist:
  #   1. DNS + ingress confirmation for the hostname below (a PROPOSAL, chosen to sit alongside
  #      the existing code-intelligence.ai.camer.digital rather than replace it yet).
  #   2. The Keycloak client this app reuses (`code-intelligence`, realm
  #      https://auth.verif.fyi/realms/camer-digital — the SAME realm/client/audience
  #      lightbridge-code-intelligence's own control-plane and existing `web` controller already
  #      use, verified against that chart's own environments/prod/values file) needs this app's
  #      redirect URI added to its allow-list. No new client, no new secret: it is already a
  #      public + PKCE client, the same shape console-ui's own `lightbridge-console` client uses.
  #
  # Image write-back mirrors console-ui exactly (Source B $values + image-updater git write-back,
  # newest-build, unsigned — converse-frontends' own CI, not signed the way
  # lightbridge-code-intelligence's upstream build is).
  - name: lci-ui
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    additionalAnnotations:
      argocd-image-updater.argoproj.io/image-list: frontend=ghcr.io/adorsys-gis/converse-frontends/lci
      argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
      argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/frontend.force-update: "true"
      # Same shared GHCR read cred as console-ui/lightbridge-code-intelligence.
      argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/frontend.helm.image-name: lci.controllers.main.containers.frontend.image.repository
      argocd-image-updater.argoproj.io/frontend.helm.image-tag: lci.controllers.main.containers.frontend.image.tag
      argocd-image-updater.argoproj.io/write-back-method: git
      argocd-image-updater.argoproj.io/git-repository: https://github.com/adorsys-gis/ai-helm-values.git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/write-back-target: helmvalues:/environments/prod/values/lci-ui.yaml
      argocd-image-updater.argoproj.io/git-credentials: secret:argocd/github-app-creds--adorsys-gis
    sources:
      # Source A — the converse-lci chart from OCI. Mirrors console-ui's Source A shape exactly.
      - repoURL: oci://ghcr.io/adorsys-gis/charts/converse-lci
        chart: "."
        targetRevision: "~0.1.0"
        helm:
          releaseName: lci-ui
          # image.{repository,tag,pullPolicy} come from Source B's $values file (image-updater
          # owns them). Runtime env (OIDC_ISSUER/CLIENT_ID/REDIRECT_URI/CONTROL_PLANE_URL) and
          # ingress live in that same file — see ai-helm-values.
          valueFiles:
            - $values/environments/prod/values/lci-ui.yaml
          ignoreMissingValueFiles: true
      # Source B — image tag from ai-helm-values; image-updater commits here.
      - repoURL: https://github.com/adorsys-gis/ai-helm-values
        targetRevision: main
        ref: values
    destination:
      # Same namespace as lightbridge-code-intelligence/console-ui — this app's own control-plane
      # backend (lightbridge-ci-control-plane) lives here, and the chart sets no namespace
      # opinion of its own.
      namespace: converse

  # --- lightbridge-governance ---
  # The AI governance platform (repo: ADORSYS-GIS/lightbridge-governance): a
  # tenant/application/integration registry plus two connectors — GitHub
  # Copilot (pull, RFC-0001, the copilot-sync CronJob) and Microsoft Foundry
  # (push over OTLP, RFC-0002). One image, two binaries. Own namespace
  # (`governance`), separate from `converse` — this is not part of the
  # Lightbridge authz stack.
  #
  # OCI mode (ADR-0055): the chart lives WITH the app code (charts live here
  # and publish to OCI on merge, matching lightbridge-authz's convention —
  # not vendored into ai-helm). The chart renders its OWN CronJob egress
  # CiliumNetworkPolicy (GitHub + the S3 raw archive, scoped to the
  # copilot-sync pods), so no depsOverlay is needed for that half. depsOverlay
  # below adds the piece the chart can't own itself: DB egress to the shared
  # lightbridge-main-db CNPG cluster in `converse` (ADR-0083 reuse, same as
  # coder/lakefs/mlflow — see charts/lightbridge-db) plus the DNS baseline
  # under this namespace's default-deny-egress.
  #
  # Postgres role/database (`governance`) provisioned in charts/lightbridge-db
  # (this repo). GHCR package is public (no imagePullSecret needed — verified
  # via `gh repo view` visibility; re-check if that ever changes).
  #
  # ⚠️ NOT YET LIVE-READY: the chart's ExternalSecret property names
  # (governance_database_url, governance_internal_resolve_token,
  # governance_internal_ingest_token, governance_github_app_id,
  # governance_github_app_private_key) are unverified against the real
  # ssegning-aws store, copilot.tenantId + externalSecret.s3RemoteKey are
  # empty until an operator sets them in the values-repo file below, and no
  # ingress-side CiliumNetworkPolicy exists yet (core-gateway's Authorino
  # calling /internal/v1/resolve and the OTel Collector calling
  # /internal/v1/ingest need their exact live Service selectors verified
  # before a restrictive ingress policy can be added safely — see this
  # chart's README). See the PR description for the full pre-merge checklist.
  - name: lightbridge-governance
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    additionalAnnotations:
      # argocd-image-updater: float both controllers (api Deployment +
      # copilot-sync CronJob, app-template v4 -- lightbridge-governance#56)
      # independently onto the newest cosign-signed sha-<gitsha> tag from
      # lightbridge-governance's own docker.yml (signing added in that
      # repo's #60, specifically to make this possible). Both aliases point
      # at the SAME image repo, so they resolve to the same tag on their
      # own -- no explicit lockstep needed, unlike lightbridge-code-
      # intelligence's role-selected same-image aliases (cp/disp/recon/...).
      # allow-tags restricts to sha-<hex> so this can never resolve back to
      # the floating `main` tag the values-repo file used before.
      argocd-image-updater.argoproj.io/image-list: api=ghcr.io/adorsys-gis/lightbridge-governance,sync=ghcr.io/adorsys-gis/lightbridge-governance
      argocd-image-updater.argoproj.io/api.update-strategy: newest-build
      argocd-image-updater.argoproj.io/api.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/api.force-update: "true"
      # GHCR read cred so tag detection survives ghcr.io/adorsys-gis/* going
      # private -- same shared secret lightbridge-code-intelligence already
      # uses (the dockerconfigjson is keyed on the ghcr.io host, not a repo).
      argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/api.helm.image-name: app-template.controllers.api.containers.main.image.repository
      argocd-image-updater.argoproj.io/api.helm.image-tag: app-template.controllers.api.containers.main.image.tag
      argocd-image-updater.argoproj.io/api.signature-type: cosign
      argocd-image-updater.argoproj.io/api.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/api.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-governance/\.github/workflows/docker\.yml@.*$
      argocd-image-updater.argoproj.io/sync.update-strategy: newest-build
      argocd-image-updater.argoproj.io/sync.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/sync.force-update: "true"
      argocd-image-updater.argoproj.io/sync.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/sync.helm.image-name: app-template.controllers.copilot-sync.containers.main.image.repository
      argocd-image-updater.argoproj.io/sync.helm.image-tag: app-template.controllers.copilot-sync.containers.main.image.tag
      argocd-image-updater.argoproj.io/sync.signature-type: cosign
      argocd-image-updater.argoproj.io/sync.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
      argocd-image-updater.argoproj.io/sync.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-governance/\.github/workflows/docker\.yml@.*$
      # Write-back: git, to ai-helm-values, same shape as converse-ui /
      # lightbridge-code-intelligence (ADR-0055). Without this the detected
      # tag has nowhere to persist -- image-updater's default write-back
      # method is `argocd` (patches the Application's own parameter
      # overrides, not this repo), which is not what the values-repo file's
      # own comment promises and silently diverges from GitOps. Caught in
      # #940's review before this ever shipped a detection-only no-op.
      argocd-image-updater.argoproj.io/write-back-method: git
      argocd-image-updater.argoproj.io/git-repository: https://github.com/adorsys-gis/ai-helm-values.git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/write-back-target: helmvalues:/environments/prod/values/lightbridge-governance.yaml
      argocd-image-updater.argoproj.io/git-credentials: secret:argocd/github-app-creds--adorsys-gis
    depsOverlay: environments/prod/deps/lightbridge-governance
    chart: lightbridge-governance
    destination:
      namespace: governance

  # ── Lightbridge observability — Grafana dashboards-as-code (ADR-0046) ──
  # Deploys the dashboards-as-code chart that lives in the APPLICATION repo
  # (ADORSYS-GIS/lightbridge-code-intelligence, PUBLIC → no repo-creds needed), NOT in
  # ai-helm: a GrafanaFolder + GrafanaDashboard CRs (imported by the grafana
  # operator) + a read-only Postgres GrafanaDatasource. Lands in `observability`
  # where the operator watches. No images → no image-updater. The metrics
  # scraping (ServiceMonitors) + the grafana_ro DB role live with the workload
  # (lightbridge-code-intelligence / lightbridge-db); this app is dashboards only.
  - name: lightbridge-observability
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    sources:
      # Source A — the dashboards chart from the app repo @ main (continuous).
      - repoURL: https://github.com/ADORSYS-GIS/lightbridge-code-intelligence
        targetRevision: main
        path: deploy/observability
        helm:
          releaseName: lightbridge-observability
          valueFiles:
            - $values/environments/prod/values/lightbridge-observability.yaml
          ignoreMissingValueFiles: true
      # Source B — env-specific values from ai-helm-values main.
      - repoURL: https://github.com/adorsys-gis/ai-helm-values
        targetRevision: main
        ref: values
    destination:
      namespace: observability

  # --- argocd-image-updater activation (control object, ADR-0055) ---
  # The CRD-based argocd-image-updater controller only acts on an Application when
  # an ImageUpdater CR selects it. Those CRs are argocd control objects (they must
  # live in the in-cluster argocd namespace where the controller watches), so this
  # entry is controlPlane: true (ADR-0017) — the CRs land in-cluster/argocd, not
  # home-remote. GitOps-native replacement for the previously hand-applied CR in
  # home-os charts/argocd-image-updater (a manual `helm upgrade`, not synced).
  # The generic `imageupdater` chart renders ONE CR per app opted into write-back
  # (its imageUpdaters[] list); add an entry there + the write-back annotations on
  # the target app's entry to onboard a new continuous-delivery app.
  # OCI mode (ADR-0055): the chart floats from oci://…/charts/imageupdater. Its
  # imageUpdaters[] list is baked into the chart values, so adding an app = edit
  # charts/imageupdater + merge (republish → float). Still controlPlane → argocd ns.
  - name: imageupdater
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    controlPlane: true
    chart: imageupdater
    releaseName: imageupdater
    destination:
      namespace: argocd

  # --- Converse UI --- RETIRED 2026-08-29.
  # The Expo self-service app that served self-service.ai.camer.digital. Replaced by
  # `console-ui` below (console.ai.camer.digital) -- the same converse-frontends repo's
  # Next.js console. Removed rather than left disabled: a dormant Application entry is the
  # "ship it but don't activate it" shape this estate avoids, and ArgoCD's
  # resources-finalizer prunes the workload cleanly on deletion.
  #
  # Retirement order, for anyone unpicking this later:
  #   1. ai-helm-values#322 -- 301 self-service.ai.camer.digital -> console.ai.camer.digital,
  #      scoped to the `/` router so /api/v2 and /budget/rpc keep serving
  #   2. ai-helm-values#323 -- repoint that router's placeholder backend converse-ui ->
  #      console-ui, because Traefik DROPS an Ingress rule whose backend Service is missing;
  #      the redirect would have gone down with the pruned Service
  #   3. (this) remove the Application + its charts/imageupdater entry
  #   4. ai-helm-values -- delete environments/prod/values/converse-ui.yaml, LAST: this
  #      Application set `ignoreMissingValueFiles: true`, so removing that file first would
  #      have silently re-rendered converse-ui from bare chart defaults instead of failing
  #
  # The converse-frontend CHART and its OCI package are untouched -- this removes one
  # deployment of it, not the chart.

  # --- Lightbridge Console (self-service-nextjs-redesign) ---
  # Next.js server-rendered console (apps/console), deployed ALONGSIDE
  # converse-ui above — not replacing it. Deliberately a SEPARATE Application
  # against a SEPARATE chart (`charts/converse-console` in converse-frontends,
  # published as `oci://ghcr.io/adorsys-gis/charts/converse-console`), for the
  # same reason that chart is its own package rather than a converse-frontend
  # bump: converse-ui's own consumer floats `targetRevision: ">=0.0.0"` against
  # converse-frontend, so anything landing in that chart's shape ships to
  # self-service on the very next reconcile. A new chart + new Application is
  # the only thing that removes that collision risk entirely (see that chart's
  # README, "Why a separate chart, not a version bump of converse-frontend").
  #
  # targetRevision `~0.1.1` (NOT converse-ui's `>=0.0.0`): converse-console is
  # a brand-new 0.x chart with no stability contract yet — under semver, a 0.x
  # MINOR bump is allowed to break compatibility, unlike converse-frontend
  # (mature enough that `>=0.0.0` has been safe in practice). A tilde range
  # takes patch releases (the chart's own version scheme is
  # commit-count-derived patches per ADR-0055) but fences off any 0.2.0 that
  # changes the app's shape, until this app has enough of a track record to
  # widen it deliberately.
  #
  # Image write-back mirrors converse-ui exactly (Source B `$values` +
  # image-updater git write-back), pointed at the `console` image (a distinct
  # GHCR package from self-service's own image — see
  # converse-frontends:.github/workflows/docker-image.yml) and the chart's
  # `console` subchart alias (Chart.yaml `dependencies[].alias: console`), NOT
  # `conversefrontend` — this chart's app-template dependency is aliased
  # differently from converse-frontend's, so the helm image-name/image-tag
  # paths below are NOT copy-paste of converse-ui's.
  #
  # depsOverlay wires in the console pod's own ExternalSecret (SESSION_SECRET +
  # KEYCLOAK_CLIENT_SECRET, see environments/prod/deps/console-ui in
  # ai-helm-values) — same mechanism as lightbridge-repo-auth/security-policies
  # above, not a new pattern.
  - name: console-ui
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    additionalAnnotations:
      argocd-image-updater.argoproj.io/image-list: frontend=ghcr.io/adorsys-gis/converse-frontends/console
      argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
      argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^sha-[0-9a-f]+$
      argocd-image-updater.argoproj.io/frontend.force-update: "true"
      # Same shared GHCR read cred as converse-ui, kept for the day this package
      # goes private too (currently public — see PR description). No-op public.
      argocd-image-updater.argoproj.io/frontend.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
      argocd-image-updater.argoproj.io/frontend.helm.image-name: console.controllers.main.containers.frontend.image.repository
      argocd-image-updater.argoproj.io/frontend.helm.image-tag: console.controllers.main.containers.frontend.image.tag
      argocd-image-updater.argoproj.io/write-back-method: git
      argocd-image-updater.argoproj.io/git-repository: https://github.com/adorsys-gis/ai-helm-values.git
      argocd-image-updater.argoproj.io/git-branch: main
      argocd-image-updater.argoproj.io/write-back-target: helmvalues:/environments/prod/values/console-ui.yaml
      argocd-image-updater.argoproj.io/git-credentials: secret:argocd/github-app-creds--adorsys-gis
    depsOverlay: environments/prod/deps/console-ui
    sources:
      # Source A — the converse-console chart from OCI. Mirrors converse-ui's
      # Source A shape exactly, different repoURL/range (see comment above).
      - repoURL: oci://ghcr.io/adorsys-gis/charts/converse-console
        chart: "."
        targetRevision: "~0.1.1"
        helm:
          releaseName: console-ui
          # image.{repository,tag,pullPolicy} come from Source B's $values file
          # (image-updater owns them). Static config (config.yaml, ingress, env
          # secret refs) lives in that same file — see ai-helm-values.
          valueFiles:
            - $values/environments/prod/values/console-ui.yaml
          ignoreMissingValueFiles: true
      # Source B — image tag from ai-helm-values; image-updater commits here.
      - repoURL: https://github.com/adorsys-gis/ai-helm-values
        targetRevision: main
        ref: values
    destination:
      # Same namespace as converse-ui/lightbridge-app — the chart sets no
      # namespace opinion of its own (README/values.yaml carry none), so this
      # follows the rest of the Converse/Lightbridge workloads.
      namespace: converse

  # --- LibreChat ---
  # NOTE: Phoenix (Arize) was removed; tracing is now served by Grafana Tempo
  # via the core-gateway `-traces` OpenTelemetryCollector -> Alloy -> Tempo path.
  - name: librechat
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Orchestrator — charts/librechart emits an ApplicationSet (a control
    # object). The ApplicationSet must land in-cluster/argocd where the
    # controller watches it; its child Applications deploy workloads to
    # home-remote. See ADR-0017.
    # OCI mode (ADR-0055): orchestrator chart floats from OCI so its ApplicationSet
    # + children config deploy continuously; children also source leaf charts from OCI.
    controlPlane: true
    chart: librechart
    releaseName: librechat
    destination:
      namespace: converse-chat

  # --- MongoDB Backup ---
  - name: mongodb-backup
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # ADR-0055 OCI-chart-float pilot. Consume charts/mongodb-backup from the OCI
    # registry on a floating semver range (Source A = argocd.chartRegistry @
    # chartVersionRange), with per-env values from ai-helm-values via $values
    # (Source B). No image write-back here (the backup image is static) — this
    # was the first `chart:` OCI-float pilot (converse-ui has since joined it,
    # floating its chart from the same adorsys-gis/charts namespace).
    # Once live, a merge that republishes charts/mongodb-backup auto-floats this
    # app to the new version on the next reconcile (no release/repoint needed).
    chart: mongodb-backup
    releaseName: mongodb-backup
    # librechat-s3-config (the S3 upload creds the CronJob's `main` container
    # needs) already exists in the `converse` namespace as librechat-app's own
    # in-chart ExternalSecret, but Secrets are namespace-scoped and this app
    # runs in `converse-chat` — so it never had a copy. Confirmed live
    # 2026-08-02: every backup run failed on `secret "librechat-s3-config"
    # not found` (CreateContainerConfigError) once the separate MONGODB_URI
    # DNS bug was fixed. This overlay materialises the app's own copy from
    # the same underlying creds.
