  # NOTE: no `metrics-server` app here — we deliberately do NOT ship one (ADR-0054).
  # k3s bundles its own metrics-server addon (sourced from the server's on-disk
  # manifests), which kept squatting the `metrics-server` Deployment/Service name
  # and reverting our GitOps copy → the Service selector (app.kubernetes.io/*) no
  # longer matched the k3s pod (k8s-app only) → empty endpointslice →
  # `v1beta1.metrics.k8s.io` MissingEndpoints → `kubectl top`/HPA dead, every sync.
  # Rather than fight the addon (which needs `--disable metrics-server` + a CP node
  # reprovision per hetzner-k8s ADR-0015), we let the healthy k3s one serve metrics
  # and own the APIService. Don't re-add this entry — see ADR-0054.

  # --- Gateway ---
  - name: core-gateway
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Workload values live in ai-helm-values (ADR-0056); template injects the
    # $values ref + valueFiles (ignoreMissingValueFiles) + the ref source.
    valuesFromRepo: true
    source:
      # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
      # Minimal in-place .source swap — the large inline valuesObject below is
      # untouched. No depsOverlay on this app, so it renders as a single source.
      repoURL: oci://ghcr.io/adorsys-gis/charts/core-gateway
      chart: "."
      # Re-floated 2026-08-06: the 2026-08-03 incident's rollback pin
      # (0.3.146, the last chart WITHOUT the ADR-0116 redact-extproc sidecar)
      # is lifted. The UTF-8 chunk-split bug in streaming ext_proc responses
      # is fixed upstream (lightbridge-governance#47, sha-b3c0a2e -- already
      # the pinned redactExtproc.image.tag in this repo's
      # environments/prod/values/core-gateway.yaml) and has been re-verified
      # live under production traffic. Back to the normal chart-float range.
      targetRevision: ">=0.0.0"
      helm:
        releaseName: core-gateway
