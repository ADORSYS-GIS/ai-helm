global:

  # ── Pod Security Standards, per namespace (charts/apps-managed apps) ─────
  # Enforce level applied to a namespace via ArgoCD `managedNamespaceMetadata`
  # for every charts/apps app targeting it (consistent → no contention). This
  # is the per-cluster-kind knob: k3s/Hetzner enforces `baseline` cluster-wide
  # (forbids hostPath/host-net), so namespaces with such workloads need
  # `privileged`; a cluster with no Pod Security admission can ignore it;
  # per-env differences override via a $values multi-source (ADR-0018).
  #
  # The observability stack (the other workload that needs elevation) is the
  # `observability` App-of-Apps orchestrator (ADR-0020), which carries its OWN
  # `podSecurityEnforce` and labels its children — it doesn't need an entry
  # here. Add an entry here only for a privileged workload that stays a flat
  # charts/apps app.
  #
  # `longhorn-system: privileged` — Longhorn's V1 data engine needs hostPath +
  # privileged host access (/var/lib/longhorn, /dev, iSCSI) on the GPU nodes
  # it's scoped to; k3s/Hetzner's baseline-enforced default forbids that
  # without this elevation (ADR-0092).
  #
  # `librechat-sandbox: privileged` — the self-hosted Code Interpreter's
  # sandbox-runner needs SYS_ADMIN/SYS_CHROOT/NET_ADMIN (NsJail namespace +
  # mount + chroot setup) because no home-remote worker node has confirmed
  # /dev/kvm for the chart's safer libkrun microVM mode (ADR-0122). Kept in
  # its OWN namespace — not added to `converse` — so the elevation doesn't
  # reach librechat-app/mongo/meilisearch, which don't need it.
  namespacePodSecurity:
    longhorn-system: privileged
    librechat-sandbox: privileged

# ────────────────────────────────────────────────────────────────────────
# ArgoCD destination — the home-remote cluster every generated Application
# targets. Single source of truth for the cluster identity (was previously
# the hardcoded `lke560142-ctx` in the template — see ADR-0006, ADR-0017).
#
# Repo invariant: workloads must NEVER deploy to the cluster ArgoCD itself
# runs in. `templates/_helpers.tpl::apps.argocd.destinationClusterRef`
# hard-fails the render if this resolves to `in-cluster` /
# `https://kubernetes.default.svc` unless `allowInCluster: true`.
#
# Per-app `destination.namespace` (under each `applications[]` entry) still
# selects the namespace; the cluster identity is shared from here.
# ────────────────────────────────────────────────────────────────────────
argocd:
  # Prefix prepended to every generated Application name (so app `traefik`
  # → Application `aii-traefik`). Single source of truth — the template
  # references this, nothing is hardcoded. Note: the orchestrator children
  # (ai-models / librechart ApplicationSets) derive their names from their
  # own `helm.releaseName`, not this prefix, so they're unaffected.
  appNamePrefix: "aii-"
  # ── Two-tier destination model (ADR-0017) ──────────────────────────────
  # ArgoCD CONTROL objects (Application / ApplicationSet CRs) must live on
  # the cluster ArgoCD runs in (local), in the argocd namespace, so the
  # controllers watch them. WORKLOADS go to home-remote (the `destination`
  # block below). An app whose deployed content is itself a control object
  # (an orchestrator that emits an ApplicationSet) sets `controlPlane: true`
  # on its entry; the template then targets the local cluster instead.
  #
  # Use the canonical in-cluster SERVER URL (always recognised as the local
  # cluster by ArgoCD) rather than the `in-cluster` NAME, which depends on
  # that cluster being registered under that name.
  inClusterServer: "https://kubernetes.default.svc"
  controlPlaneNamespace: argocd
  # This repo, used as the source for kustomize `depsOverlay` sources (the
  # app-scoped dependency CRs of umbrella Applications — ADR-0018). The deps
  # overlays live under `environments/<env>/deps/<app>` in this repo.
  #
  # ── Deployment-revision strategy (canonical note, ADR-0055) ─────────────
  # CONTINUOUS DELIVERY — there is NO release tag and no `tools/release.sh`
  # (both retired 2026-06-22). The root `ai-apps-v2` tracks `main` (pinned in
  # home-os `charts/cd`); charts publish to OCI on merge to main and every app
  # floats on a semver range (`chartRegistry` @ `chartVersionRange`). Image tags,
  # per-env values, and the `environments/` overlays live in the PRIVATE
  # `ai-helm-values` repo (argocd-image-updater write-back). A merge to main is a
  # live deploy. Rollback = `git revert` in ai-helm-values and/or pin an app's
  # chartVersionRange. converse-ui floats its chart from this same chartRegistry
  # (oci://ghcr.io/adorsys-gis/charts/converse-frontend) — published there by the
  # external converse-frontends repo, and PRIVATE (repo cred in home-os). External
  # NON-OCI sources (lightbridge-repo-auth, the upstream Lightbridge chart, etc.)
  # pin their own SHAs/versions. Runbook:
  # docs/continuous-delivery.md.
  # ── Continuous-delivery knobs (ADR-0055) ────────────────────────────────
  # Charts are published to OCI on merge to main and consumed by any app entry
  # that sets `chart: <name>`. Such an app floats on `chartVersionRange` (a
  # semver range → newest published chart wins each reconcile; immutability is
  # deliberately gone) and pulls its image-tag / per-env values from the values
  # repo via a `$values` source at `environments/<env>/values/<app>.yaml`.
  # argocd-image-updater commits the new image tag into that file (direct,
  # cosign-gated). Apps that don't set `chart:` keep the legacy path/tag source.
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"   # see ADR-0055: keep published versions clean X.Y.Z (ranges skip pre-releases unless `-0`)
  env: prod
  # The PRIVATE deployment-state repo (image tags written-back + migrated
  # environments/ overlays). ArgoCD needs a READ repo-secret for it and
  # image-updater a WRITE GitHub App — both provisioned externally (ESO).
  valuesRepoURL: https://github.com/adorsys-gis/ai-helm-values
  valuesTargetRevision: main
  # `depsOverlay` source repo: the `environments/` overlays live in the values
  # repo (this repo's copy was deleted at the ADR-0055 cutover), so depsOverlay
  # apps resolve them from there @ main (continuous).
  depsRepoURL: https://github.com/adorsys-gis/ai-helm-values
  depsTargetRevision: main
  destination:
    # Cluster context name registered in ArgoCD. Used verbatim as
    # `spec.destination.name`. This is the WORKLOAD destination.
    name: home-remote
    # Alternative to `name` — set a cluster API URL for
    # `spec.destination.server` instead. Leave empty to use `name`.
    server: ""
    # Escape hatch — only set true if you genuinely want in-cluster.
    allowInCluster: false

applications:

  # NOTE: Traefik (ingress controller + the `traefik` IngressClass) is
  # NOT deployed by this repo — it's installed externally (running in the
  # `traefik` namespace on the target cluster). Charts here still set
  # `ingressClassName: traefik` / `className: traefik` on their Ingresses;
  # those resolve to the external controller. Don't re-add a traefik
  # Application here.

  # NOTE: the OpenTelemetry Operator is NOT deployed by this repo — it's
  # installed externally (running in the `opentelemetry-system` namespace;
  # CRDs opentelemetry.io present on-cluster). This repo only defines
  # OpenTelemetryCollector CRs (charts/core-gateway: the `-traces`
  # collector → Alloy → Tempo) that the external operator reconciles.
  # Don't re-add an otel-operator Application here.

  # --- Observability (App-of-Apps orchestrator) ---
  # Factored the whole observability stack (prometheus-operator-crds, alloy,
  # kube-state-metrics, node-exporter, grafana-operator, mimir, loki, tempo,
  # grafana, observability-dashboards) + a (disabled) secrets child into one
  # orchestrator. controlPlane: true — it emits Application CRs, so it targets
  # in-cluster/argocd; the children it renders target home-remote and carry
  # the privileged PodSecurity label. See ADR-0020.
  # OCI mode (ADR-0055): orchestrator chart floats from OCI so its App-of-Apps
  # children config deploys continuously. Children source upstream charts
  # (grafana/prometheus) by version, the observability-dashboards leaf from OCI,
  # and the secrets/deps overlays from ai-helm-values@main (see charts/observability).
  - name: observability
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    controlPlane: true
    chart: observability
    releaseName: observability
    destination:
      namespace: observability

  # ─────────────────────────────────────────────────────────────────────────────
  # Same-origin proxy (ADR-0061): a generic Caddy that serves external resources
  # SAME-ORIGIN under an app's host, to dodge browser CORS. Each `routes[]` entry
  # maps a path on the host to one upstream (rewrite-pinned, not an open proxy).
  # First route: the AI-governance GitHub Atom feed at /_governance.atom on the
  # Grafana host, for the scoreboard's news panel (Grafana's news panel fetches
  # client-side, and GitHub's .atom has no CORS header → a direct fetch is blocked).
  # OCI mode (`chart:`) → the template builds the OCI chart source AND injects the
  # $values ref reading environments/<env>/values/same-origin-proxy.yaml, so the
  # host + routes (deployment-specifics, ADR-0056/0057) come from ai-helm-values,
  # not chart defaults. The chart renders its OWN CiliumNetworkPolicy (egress
  # derived from the routes' upstream hosts), so NO depsOverlay is needed. Reuse
  # for other feeds = add a route to the values-repo file.
  # ─────────────────────────────────────────────────────────────────────────────
  - name: same-origin-proxy
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    chart: same-origin-proxy
    destination:
      namespace: observability
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Notifications: Apprise API — STATELESS notify gateway for opencode-k8s-agent.
  # The agent (below) POSTs its report to this service's /notify with the channel
  # URLs in the request body (APPRISE_URLS), so this needs NO stored channel
  # config — hence no apprise-channels secret / persistence mount (that missing
  # mount was why the old pod hung 0/1). ADR-0036: the Grafana apprise path
  # (grafana-apprise-adapter + the external-alertmanager override) was removed —
  # Grafana notifies natively now; this lean apprise-api stays ONLY for the agent.
  # Source: https://github.com/ADORSYS-GIS/opencode-k8s-agent
  # ─────────────────────────────────────────────────────────────────────────────
  - name: apprise-api
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Workload values live in ai-helm-values (ADR-0056); template injects the
    # $values ref + valueFiles (ignoreMissingValueFiles) + the ref source.
    valuesFromRepo: true
    source:
      repoURL: https://github.com/ADORSYS-GIS/opencode-k8s-agent.git
      # EXTERNAL repo — doesn't ride the ai-helm release tag; bump the SHA
      # deliberately (then re-release). Keep in sync with opencode-k8s-agent below.
      targetRevision: 5c8ca29c68922678a50b664074d2ecd0bafae7e4
      path: helm/apprise-api
      helm:
        releaseName: apprise-api
    destination:
      namespace: monitoring
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  # ─────────────────────────────────────────────────────────────────────────────
  # AI Monitoring: OpenCode K8s Agent — AI-powered cluster health monitor.
  # CronJob (every 12h): OpenCode + Kubernetes MCP investigate cluster state and
  # POST a report to apprise-api's /notify (channel URLs from APPRISE_URLS).
  #
  # Auth to the model gateway = the INTERNAL plane via the CronJob's OWN projected
  # k8s SA token (ADR-0037 / ADR-0021 one-time-job path) — NO Keycloak/OAuth2, NO
  # apiKey secret. The token (audience core-gateway-internal) is TokenReview'd by
  # the internal AuthConfig → "internal" tier. Mirrors LibreChat's transport
  # (api-internal listener + internal-CA trust); differs only in the credential.
  # The agent repo (PR: static bearer) reads OPENCODE_API_KEY as the Bearer; we
  # inject the SA token into it via the container command below.
  # Secret opencode-k8s-agent-secret (via ESO) now needs ONLY: APPRISE_URLS.
  # Source: https://github.com/ADORSYS-GIS/opencode-k8s-agent
  # ─────────────────────────────────────────────────────────────────────────────
  - name: opencode-k8s-agent
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Internal-CA trust bundle (ca.crt of self-signed-ca) → /etc/internal-ca for
    # NODE_EXTRA_CA_CERTS, to verify the api-internal listener's TLS (ADR-0018).
    depsOverlay: environments/prod/deps/opencode-k8s-agent
    # Workload Helm values live in ai-helm-values (ADR-0056), read via the
    # $values ref the template injects — keeps the (large) config out of this
    # public chart repo and lets it change without an ai-helm release.
    valuesFromRepo: true
    source:
      repoURL: https://github.com/ADORSYS-GIS/opencode-k8s-agent.git
      # Pinned to a commit for a reproducible release. EXTERNAL repo — doesn't ride
      # the ai-helm release tag; bump deliberately (then re-release). This is the
      # squash-merge of the static-bearer change (ADORSYS-GIS/opencode-k8s-agent#6)
      # on the agent repo's main.
      targetRevision: e6f7b500a700abf3d334ec0d92fe9faf68173b45
      path: helm/opencode-k8s-agent
      helm:
        releaseName: opencode-k8s-agent
    destination:
      namespace: monitoring
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  # NOTE: CloudNativePG (the `cnpg` operator) and the Barman Cloud plugin
  # (`cnpg-barman-cloud`) are NOT deployed by this repo — both are
  # installed externally (running in the `cnpg-system` namespace; CRDs
  # postgresql.cnpg.io + barmancloud.cnpg.io present on-cluster). Charts
  # here still define CNPG `Cluster` CRs (e.g. charts/lightbridge-db) and rely
  # on the external operator + plugin to reconcile them. Don't re-add a
  # cnpg or plugin-barman-cloud Application here.

  # NOTE: cert-manager is NOT deployed by this repo. It's managed
  # externally (home-os repo: charts/cert via the `cert-remote`
  # Application, releaseName `cert`, in kube-system on the home-remote
  # cluster). That deployment installs the cert-manager controller +
  # CRDs AND the shared cluster-scoped ClusterIssuers this repo
  # references: `cert-home-cert-http` and `self-signed-ca`.
  #
  # GAP: home-os's cert chart does NOT yet define `cert-home-cert-envoy`
  # (the Gateway-API / gatewayHTTPRoute ACME issuer that core-gateway
  # uses for api.ai.camer.digital — see the `gateway.issuer` value
  # below). That issuer must be added to home-os, otherwise the Envoy
  # gateway's ACME cert won't be issued. Tracked out-of-band.
  # Do not re-add a cert Application here.

  # Stakater Reloader — restarts a workload when a ConfigMap/Secret it mounts
  # changes. OPT-IN only (autoReloadAll:false): a workload is reloaded solely
  # when it carries a `reloader.stakater.com/*` annotation, so this is a no-op
  # for everything unannotated. Deployed so the lightbridge-mcp pod picks up
  # cert-manager's Let's Encrypt rotation of `mcp.ai.camer.digital-tls` — the
  # Rust server reads its TLS cert only at startup, and with the verified
  # `mcp-verify` backend transport a stale cert would fail closed. Watches all
  # namespaces; lands on home-remote like the other workloads.
  - name: reloader
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    source:
      repoURL: https://stakater.github.io/stakater-charts
      # 2.2.14 → app v1.4.19 (latest at stakater-charts). Verify with
      # `helm show chart stakater/reloader` before bumping.
      targetRevision: 2.2.14
      chart: reloader
      helm:
        releaseName: reloader
        # Defaults, pinned explicitly: watch every namespace but only act on
        # annotated workloads (no cluster-wide auto-reload surprise).
        values: |
          reloader:
            watchGlobally: true
            autoReloadAll: false
    destination:
      namespace: reloader

  # --- Secret Management ---
  # NOTE: the External Secrets Operator (controller + CRDs) is NOT
  # installed by this repo — it's deployed externally (Helm-managed in
  # the `external-secrets` namespace on the target cluster). The
  # ClusterSecretStore in use is `ssegning-aws` (cluster-scoped, also
  # external — verified on-cluster). This repo's old Vault-based
  # `bootstrap-secrets` store config (charts/external-secrets) was
  # removed: it was never the store actually used. Don't re-add an ESO
  # operator or ClusterSecretStore here.
  #
  # ExternalSecret CRs are now OWNED by the charts that need them
  # (ai-models-backends, librechat-app, observability-secrets, and the
  # per-app `environments/<env>/deps/*` overlays), each referencing the
  # `ssegning-aws` store directly. The old `secrets` Application that
  # pulled them wholesale from ai-ops-secrets.git has been removed — that
  # repo is being decommissioned as each secret migrates in-chart.

  # --- Core Infrastructure ---
  # NOTE: Redis is NOT deployed by this repo. It's managed externally
  # (home-os repo: charts/home-apps/redis-ha → redis-ha-redis in the
  # redis-system namespace on the home-remote cluster). Consumers here
  # point at `redis-ha-redis.redis-system.svc.cluster.local:6379`.
  # Do not re-add a redis Application here.

  # --- GPU device plugin (Hetzner Robot GPU workers) ---
  # NVIDIA k8s-device-plugin — advertises the `nvidia.com/gpu` extended
  # resource to the kubelet on the hand-joined Hetzner Robot GPU workers
  # (hetzner-k8s-gpu-*, RTX 4000 SFF Ada, Debian 13), so GPU workloads can be
  # scheduled onto them. Lands on home-remote (the default destination) — this
  # is the Hetzner cluster, NOT the home GPU that the `model-serving-*` apps
  # target via `homeCluster` (ADR-0022).
  #
  # Replaces a manual `kubectl apply` DaemonSet (kube-system/nvidia-device-plugin)
  # that predated GitOps — SAME name, so it MUST be deleted at cutover (see the
  # PR's cutover note); the default syncPolicy's `Replace=true` is only a
  # fallback for the adoption conflict.
  #
  # Pinned to the GPU workers via nodeSelector + a matching single-term
  # affinity (the chart's default NFD/Tegra affinity is replaced — we run
  # neither NFD nor GFD here), tolerates the taint, and runs under the
  # k3s-autodetected `nvidia` RuntimeClass. The upstream chart also emits an
  # idle `nvidia-device-plugin-mps-control-daemon` DaemonSet (gated only on
  # devicePlugin.enabled); with no MPS config selected its init container just
  # waits — no crash-loop, no GPU claimed.
  - name: nvidia-device-plugin
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    source:
      repoURL: https://nvidia.github.io/k8s-device-plugin
      # (matches the manual DaemonSet being replaced). Verify before bumping:
      # `helm show chart nvidia-device-plugin --repo https://nvidia.github.io/k8s-device-plugin --version <v>`
      targetRevision: "0.*"
      chart: nvidia-device-plugin
      helm:
        releaseName: nvidia-device-plugin
        values: |
          runtimeClassName: nvidia
          # FAIL_ON_INIT_ERROR="false" — don't wedge the pod on a transient
          # driver/init hiccup (matches the manual DaemonSet).
          failOnInitError: false
          priorityClassName: system-node-critical
          nodeSelector:
            nvidia.com/gpu.present: "true"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values: ["true"]
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          # Privileged host access for the plugin socket at
          # /var/lib/kubelet/device-plugins (matches the manual DaemonSet;
          # overrides the chart's default drop-ALL context).
          securityContext:
            privileged: true
    destination:
      namespace: kube-system

  # NVIDIA DCGM exporter — GPU telemetry (utilisation, VRAM, temperature, power,
  # SM occupancy, throttling) for the two Hetzner Robot GPU workers. Until this
  # existed the fleet had NO GPU metrics at all: the model dashboards showed
  # engine-level throughput but nothing about the card underneath, and VRAM was
  # only obtainable by hand with `nvidia-smi` in the device-plugin pod.
  #
  # Same shape and namespace as nvidia-device-plugin above — a node-level system
  # component pinned to the GPU nodes — so the two GPU DaemonSets live together.
  #
  # ⚠️ `tolerations` REPLACES the chart default (which tolerates control-plane
  # nodes, not ours). Lists replace wholesale in a Helm values merge — the same
  # trap that silently dropped the ARC runners' `command` (CLAUDE.md).
  #
  # ⚠️ SYS_ADMIN + the /var/lib/kubelet/pod-resources hostPath are required, the
  # first for the DCGM_FI_PROF_* profiling metrics and the second so samples can
  # be attributed to the pod using the GPU. Both are chart defaults, kept
  # deliberately — that is also why this lands in kube-system, which permits them
  # (the cluster-wide `baseline` Pod Security Standard forbids hostPath).
  - name: dcgm-exporter
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    source:
      repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
      # Verify before bumping:
      # `helm show chart dcgm-exporter --repo https://nvidia.github.io/dcgm-exporter/helm-charts --version <v>`
      targetRevision: "4.*"
      chart: dcgm-exporter
      helm:
        releaseName: dcgm-exporter
        values: |
          runtimeClassName: nvidia
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          # Scraped by Alloy, which discovers ServiceMonitors cluster-wide.
          #
          # ⚠️ honorLabels MUST be true — same reason as kube-state-metrics
          # (CLAUDE.md). DCGM does not only report on itself: it attributes each
          # sample to the POD currently using the GPU (`pod`, `namespace`,
          # `container`), which are labels about ANOTHER object. Without
          # honorLabels the scrape's own labels win, the model pod is buried in
          # `exported_pod`/`exported_namespace`, and every series claims to be
          # the dcgm-exporter pod in kube-system — so "which model is burning
          # this GPU" becomes unanswerable and every community DCGM dashboard
          # that groups by pod shows nothing.
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 25s
            honorLabels: true
    destination:
      namespace: kube-system

  # --- Longhorn (Hetzner Robot GPU workers — model storage) ---
  # Distributed block storage backing model-cache PVCs on the hand-joined
  # Hetzner Robot GPU nodes (hetzner-k8s-gpu-1/2), which have no hcloud-csi at
  # all — Robot boxes aren't hcloud cloud VMs, so the cloud CSI node plugin is
  # deliberately excluded there (see hetzner-k8s docs/runbooks/add-gpu-node.md).
  # See ADR-0092 for the full rationale, the node-scoping mechanism, and why
  # this is a SEPARATE instance from the unrelated Longhorn already running on
  # admin@homeos (backs the legacy home-GPU model-serving-qwen3-4b RWX PVC — see
  # docs/patterns/self-hosted-model-serving.md). Lands on home-remote (the
  # default destination) — this app is NOT homeCluster.
  #
  # Every component (Manager DaemonSet, Driver Deployer, UI, and Longhorn's own
  # dynamically-created instance-manager/engine-image pods) is pinned to the
  # 2 GPU nodes via global.nodeSelector/tolerations + the matching
  # defaultSettings.taintToleration/systemManagedComponentsNodeSelector — see
  # the values file for the full explanation. This app can never schedule onto
  # cp/worker nodes, so it cannot interfere with the working hcloud-csi setup
  # serving PVCs there.
  #
  # The V1 (filesystem) data engine needs hostPath + privileged host access
  # (/var/lib/longhorn, /dev, iSCSI) — k3s/Hetzner enforces the `baseline` Pod
  # Security Standard cluster-wide, which forbids that, so `longhorn-system`
  # is elevated to `privileged` in global.namespacePodSecurity above (same
  # mechanism the observability stack uses for Alloy/node-exporter).
  - name: longhorn
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Workload Helm values live in ai-helm-values (ADR-0056) — see the file for
    # the full nodeSelector/tolerations/replica-count/reclaim-policy rationale.
    valuesFromRepo: true
    source:
      repoURL: https://charts.longhorn.io
      # Verify before bumping: `helm show chart longhorn --repo https://charts.longhorn.io --version <v>`
      targetRevision: "1.12.0"
      chart: longhorn
      helm:
        releaseName: longhorn
    destination:
      namespace: longhorn-system

  # --- Longhorn UI auth front door (oauth2-proxy, App-of-Apps) ---
  # The Longhorn UI ships no authentication of its own and grants full
  # volume/node management (including delete) — gated by a dedicated
  # oauth2-proxy instance (own Keycloak client `longhorn-proxy`), restricted
  # to the `longhorn_roles` claim (NOT any authenticated user — contrast with
  # homepage-auth). See ADR-0093. controlPlane: true — it emits Application
  # CRs (2 children: longhorn-secrets + longhorn-auth), both targeting
  # home-remote / longhorn-system (colocated with the existing, separate
  # `aii-longhorn` Application, ADR-0092, whose UI this gates).
  - name: longhorn-auth
    finalizers:
