  - name: security-policies
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    # Umbrella (ADR-0018): app-scoped dep — the `authz-tls` CA secret the
    # Authorino instance mounts (ca.crt) to trust the TLS lightbridge-opa
    # metadata endpoint. Folded in as a second (kustomize) source.
    depsOverlay: environments/prod/deps/security-policies
    # Workload Helm values live in ai-helm-values (ADR-0056), read via the
    # $values ref the template injects — keeps the (large) config out of this
    # public chart repo and lets it change without an ai-helm release.
    valuesFromRepo: true
    source:
      # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
