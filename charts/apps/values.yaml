    valuesFromRepo: true
    source:
      repoURL: oci://docker.io/envoyproxy/ai-gateway-helm
      # v1.1.0 — keep in lockstep with ai-gateway-crds-helm above (see its note
      # for the v1.1 summary, ADR-0069). Floor EG v1.8.1+ (we run v1.8.2 ✓).
