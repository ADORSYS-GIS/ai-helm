    # ── opencode-cli (ai-helm#586) ────────────────────────────────────────
    # Human OpenCode CLI client: device-code + auth-code with offline_access.
    # Consumed by charts/librechat-opencode-wellknown (remote-MCP OAuth block,
    # clientId: opencode-cli, scope "openid profile offline_access") and by
    # the opencode-oauth2 plugin's device-code flow.
    # Public client — no secret; PKCE S256 enforced on auth-code; device grant
    # enabled via client attributes below.
    # NOTE (token exchange): Keycloak Standard Token Exchange (V2) requires a
    # CONFIDENTIAL client — enabling `standard.token.exchange.enabled` here
    # makes keycloak-config-cli reject the import ("client must be
    # confidential", verified locally against KC 26.6.4 + config-cli 6.5.1).
    # Project-scoped exchange ({account_id, project_id} sealed via request_id)
    # lives on the dedicated confidential client `opencode-exchange` below —
    # STE V2 rejects public exchangers, and its audience mapper (this client)
    # satisfies the "exchanger within subject-token audience" policy.
    opencodeCli:
      enabled: true
      clientId: "opencode-cli"
      name: "OpenCode CLI"
      description: "Human OpenCode CLI client (device-code + auth-code, offline_access)"
      publicClient: true
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      pkce: "S256"
      attributes:
        oauth2.device.authorization.grant.enabled: "true"
      # Put opencode-exchange in the aud of cli-issued tokens — STE V2
      # requires the exchanging client to be within the subject token's
      # audience ("Client is not within the token audience", verified
      # locally against KC 26.6.4).
      protocolMappers:
        - name: "opencode-exchange-audience"
          protocol: "openid-connect"
          protocolMapper: "oidc-audience-mapper"
          consentRequired: false
          config:
            included.client.audience: "opencode-exchange"
            access.token.claim: "true"
      redirectUris:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
      webOrigins:
        - "http://localhost:*"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    # ── opencode-exchange (ai-helm#586) ───────────────────────────────────
    # Confidential machine client that performs Lightbridge project-scoped
    # token exchange on behalf of OpenCode: swaps a human's opencode-cli
    # token (+ `project_id` form param) for a JWT sealed with
    # {account_id, project_id} via the lightbridge-keycloak-spi provider
    # (deployed server-side; see charts comment on opencode-cli).
    # STE requires a CONFIDENTIAL client (verified against KC 26.6.4 +
    # config-cli 6.5.1). The `lightbridge-context-mapper` copies the SPI's
    # session notes into access/id/userinfo claims (pattern mirrors the
    # SPI repo's demo realm).
    # 🔐 SECRET: never committed. The realm import resolves the
    # `${OPENCODE_EXCHANGE_CLIENT_SECRET}` placeholder from the config-cli
    # CronJob's environment (IMPORT_VARIABLE_ENABLED=true); that env var is
    # bound to the `opencode-exchange-client` Secret, which is synced from
    # the secret store by the ExternalSecret template in this chart
    # (templates/externalsecret-opencode-exchange.yaml).
    # Local-dev escape hatch: disable externalSecret below and override both
    # `secret` and a literal env value — acceptable ONLY outside prod.
    opencodeExchange:
      enabled: true
      clientId: "opencode-exchange"
      name: "OpenCode Exchange"
      description: "Confidential client for Lightbridge project-scoped token exchange"
      publicClient: false
      standardFlowEnabled: false
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      secret: "${OPENCODE_EXCHANGE_CLIENT_SECRET}"
      # Syncs the real client secret into a Kubernetes Secret consumed by the
      # config-cli CronJob env (see containers.main.env in the controller
      # block). Fails closed: if the store entry is missing, the
      # ExternalSecret reports SecretSyncedError and the next import runs with
      # an unresolved placeholder rather than a guessed credential.
      externalSecret:
        enabled: true
        secretName: "opencode-exchange-client"
        refreshInterval: "1h"
        secretStore: "ssegning-aws"            # ClusterSecretStore kind
        remoteKey: "camer-digital/keycloak/opencode-exchange"
        remoteProperty: "client-secret"
      attributes:
        standard.token.exchange.enabled: "true"
      protocolMappers:
        - name: "lightbridge-context"
          protocol: "openid-connect"
          protocolMapper: "lightbridge-context-mapper"
          consentRequired: false
          config:
            access.token.claim: "true"
            id.token.claim: "true"
            userinfo.token.claim: "true"
      redirectUris: []
      webOrigins: []
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email

  # Groups with client role mappings
  groups:
    cdAdmins:
      enabled: true
      name: "CDAdmins"
      realmRoles: []
      clientRoles:
        realm-management:
          - realm-admin

    libreChatAdmin:
      enabled: true
      name: "LibreChatAdmin"
      realmRoles: []
      clientRoles:
        converse:
          - admin

    libreChatUser:
      enabled: true
      name: "LibreChatUser"
      realmRoles: []
      clientRoles:
        converse:
          - user

# Keycloak config-sync CronJob (app-template dependency)
# =====================================================
# For production with external/different-namespace Keycloak,
# override: config-sync.containers.main.env.KEYCLOAK_URL.value
config-sync:
  controllers:
    configSync:
      type: cronjob
      cronjob:
        schedule: "0 * * * *"
        concurrencyPolicy: Forbid
      containers:
        main:
          image:
            repository: docker.io/adorsys/keycloak-config-cli
            tag: "latest-26"
          env:
            KEYCLOAK_URL:
              value: "http://keycloak.keycloak.svc.cluster.local:8080"
            KEYCLOAK_USER:
              value: "admin"
            KEYCLOAK_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            IMPORT_VARIABLE_ENABLED:
              value: "true"
            OPENCODE_EXCHANGE_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: opencode-exchange-client
                  key: client-secret
            LIGHTBRIDGE_CONSOLE_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-console-client
                  key: client-secret
            IMPORT_ENABLED:
              value: "true"
            IMPORT_REALM_FILE:
              value: "/config/camer-digital-realm.yaml"
            LOG_LEVEL:
              value: "DEBUG"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  persistence:
    config:
      type: configMap
      name: keycloak-baseline-realm
      globalMounts:
        - path: /config
          readOnly: true
