# Keycloak Baseline Values
# ========================
# This chart provides reusable Keycloak baseline configuration using BJWS app-template.
# Configuration matches the camer-digital realm export.

global:
  nameOverride: keycloak-baseline

rbac:
  enabled: false
serviceAccount:
  enabled: false
networkPolicy:
  enabled: false
serviceMonitors:
  enabled: false
ingress:
  enabled: false
service:
  enabled: false
pvc:
  enabled: false

# Keycloak Realm Configuration
#=========================
keycloak-config:
  realm: "camer-digital"

  # Realm-level configuration
  realmConfig:
    enabled: true
    displayName: "CDigital"
    displayNameHtml: ""
    sslRequired: "external"
    registrationAllowed: true
    registrationEmailAsUsername: true
    rememberMe: true
    verifyEmail: true
    loginWithEmailAllowed: true
    resetPasswordAllowed: true
    passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notEmail()"
    # Session timeouts (in seconds)
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 900
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    offlineSessionIdleTimeout: 2592000
    # Theme settings
    loginTheme: "vaam-01"
    attributes:
      darkMode: "true"
      frontendUrl: "https://accounts.camer.digital"

  # SMTP Server Configuration
  smtpServer:
    host: "mail.mail.svc.cluster.local"
    port: "587"
    from: "no-reply@mail.ssegning.com"
    fromDisplayName: "SSegning Accounts"
    replyTo: "hello@camer.digital"
    replyToDisplayName: "Camer Digital Accounts"
    ssl: "false"
    starttls: "true"
    auth: ""
    debug: "false"

  # Identity Providers
  identityProviders:
    ssegning-dev:
      enabled: true
      alias: "ssegning-dev"
      displayName: "SSegning Dev"
      providerId: "keycloak-oidc"
      config:
        clientId: "camer-digital-sso"
        authorizationUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/auth"
        tokenUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/token"
        userInfoUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/userinfo"
        logoutUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/logout"
        issuer: "https://accounts.ssegning.com/realms/ssegning-dev"
        jwksUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/certs"
        validateSignature: "true"
        useJwksUrl: "true"
        pkceEnabled: "false"
        syncMode: "LEGACY"
        clientAuthMethod: "client_secret_post"

  # Client Scopes with Protocol Mappers
  clientScopes:
    librechat:
      name: "librechat"
      description: ""
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: librechat_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "false"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "librechat_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "converse"

    coder:
      name: "coder"
      description: "Coder OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: coder_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "false"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "coder_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "coder"

    # mlops platform (ADR-0085). Three scopes mirroring the coder pattern —
    # each app's client roles feed its own claim.
    argoWorkflows:
      name: "argo-workflows"
      description: "Argo Workflows OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: argo_workflows_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "true"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "argo_workflows_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "argo-workflows"

    # LakeFS: consumed by the DEDICATED lakefs-auth oauth2-proxy instance in
    # front of the lakefs-proxy SSO shim (ADR-0090). ⚠️ The `lakefs_roles`
    # claim is NOT authorization-bearing today: LakeFS OSS (`rbac: none`) is
    # single-user, so every SSO user lands on the one shared `admin` identity
    # and LakeFS itself never sees this claim. It is kept so a future
    # LakeFS-side RBAC (or a policy check in the shim) has a claim to read.
    lakefsProxy:
      name: "lakefs-proxy"
      description: "LakeFS oauth2-proxy roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: lakefs_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "false"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "lakefs_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "lakefs-proxy"

    # Longhorn (Hetzner GPU-node storage UI): consumed by the DEDICATED
    # longhorn-auth oauth2-proxy instance in front of the Longhorn UI
    # (ADR-0093). Unlike lakefs_roles (currently inert), this claim IS
    # authorization-bearing — oauth2-proxy's `--allowed-group=admin` +
    # `--oidc-groups-claim=longhorn_roles` actually rejects login for a user
    # without the `admin` client role, because the Longhorn UI grants full
    # volume/node management (including delete) and has no native auth of
    # its own.
    longhornProxy:
      name: "longhorn_groups"
      description: "Longhorn oauth2-proxy roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: longhorn_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            # MUST be multivalued — a bare string can't be matched by
            # oauth2-proxy's --allowed-group against a JSON array claim (see
            # the mlflow_roles comment above for the exact failure mode this
            # avoids: ADR-0085 found multivalued:false silently rejects every
            # login, even for a correctly-role-assigned user).
            multivalued: "true"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "longhorn_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "longhorn-proxy"

    mlflow:
      name: "mlflow"
      description: "MLflow OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: mlflow_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            # MUST be multivalued: mlflow-oidc-auth's `oidcAuth.groupsAttribute`
            # expects a JSON array to match against `groupName`/`adminGroupName`
            # — `multivalued: false` emits a bare string, which the plugin
            # can't match, so login is unconditionally rejected
            # ("User is not allowed to login") even for a user with the
            # `admin`/`viewer` client role assigned. Found live during
            # ADR-0085 verification (compare argo_workflows_roles, which was
            # multivalued: true from the start and worked).
            multivalued: "true"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "mlflow_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "mlflow"

  # OIDC Clients
  clients:
    converse:
      enabled: true
      clientId: "converse"
      name: "Converse Chats"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "*"
      webOrigins: []
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - librechat
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      # Client roles
      roles:
        - name: "admin"
          description: ""
        - name: "user"
          description: ""

    coder:
      enabled: true
      clientId: "coder"
      name: "Coder"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://coder.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - coder
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      # Client roles — included in the coder_roles claim for potential future
      # use with Coder IdP Sync (Premium feature). Without a Premium license,
      # roles must be assigned manually in Coder after user login.
      #   admin → owner, developer → member
      roles:
        - name: "admin"
          description: "Coder owner role"
        - name: "developer"
          description: "Coder member role"

    # ── mlops platform (ADR-0085) ─────────────────────────────────────────
    # Argo Workflows: NATIVE OIDC (server.sso) — no fronting oauth2-proxy.
    # The argo_workflows_roles claim (multivalued) is read as the SSO
    # "groups" claim via customGroupClaimName, used for RBAC precedence.
    argoWorkflows:
      enabled: true
      clientId: "argo-workflows"
      name: "Argo Workflows"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://argo-workflows.mlops.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - argo-workflows
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "admin"
          description: "Argo Workflows admin"
        - name: "viewer"
          description: "Argo Workflows read-only"

    # LakeFS: OSS has no usable native OIDC (Enterprise/"Fluffy" only —
    # `auth.oidc.*` is rejected at startup, ADR-0085/ADR-0090). This client is
    # consumed by the DEDICATED lakefs-auth oauth2-proxy instance, which sits
    # in front of the lakefs-proxy SSO shim (charts/lakefs-proxy). The shim
    # then logs into LakeFS as the bootstrap admin — LakeFS's own IAM stays
    # single-user, so this client authenticates people but does NOT give them
    # distinct LakeFS identities (ADR-0090 consequences).
    #
    # ⚠️ This realm config is NOT currently reconciled by anything on-cluster
    # (keycloak-config-cli isn't wired to it), so the LIVE `lakefs-proxy`
    # client must be created/adjusted MANUALLY to match — in particular the
    # redirect URI and web origin below.
    lakefsProxy:
      enabled: true
      clientId: "lakefs-proxy"
      name: "LakeFS (oauth2-proxy)"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "https://lakefs.mlops.ai.camer.digital/oauth2/callback"
      webOrigins:
        - "https://lakefs.mlops.ai.camer.digital"
      rootUrl: "https://lakefs.mlops.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - lakefs-proxy
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "user"
          description: "LakeFS gated access"

    # Longhorn (Hetzner GPU-node storage UI, ADR-0092/0093): the Longhorn UI
    # ships no authentication of its own AND grants full volume/node
    # management (including delete), so — unlike homepageProxy below — this
    # is NOT a network-gate-only client: it carries a real client role
    # (`admin`) mapped into the longhorn_roles claim, and oauth2-proxy
    # actually enforces it (--allowed-group=admin). Grant the `admin` role
    # only to operators who should be able to delete volumes.
    longhornProxy:
      enabled: true
      clientId: "longhorn-proxy"
      name: "Longhorn (oauth2-proxy)"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "https://longhorn.ai.camer.digital/oauth2/callback"
      webOrigins:
        - "https://longhorn.ai.camer.digital"
      rootUrl: "https://longhorn.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - longhorn_groups
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "admin"
          description: "Longhorn UI access (full volume/node management, including delete)"

    # MLflow: this specific upstream chart bundles the mlflow-oidc-auth
    # plugin natively — real per-user Keycloak identity + group RBAC inside
    # MLflow itself, no fronting oauth2-proxy needed (ADR-0085).
    mlflow:
      enabled: true
      clientId: "mlflow"
      name: "MLflow"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://mlflow.mlops.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - mlflow
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "admin"
          description: "MLflow MANAGE permission"
        - name: "viewer"
          description: "MLflow READ permission (default)"

    # Homepage central-hub dashboard (ADR-0089): Homepage itself ships no
    # authentication, so this client is consumed by a DEDICATED homepage-auth
    # oauth2-proxy instance in reverse-proxy mode (mirrors the ADR-0085
    # lakefs-auth shape) — a network gate only, no per-role behavior, so
    # (unlike lakefsProxy before removal) this client gets no custom
    # clientScope/role mapper.
    homepageProxy:
      enabled: true
      clientId: "homepage-proxy"
      name: "Homepage (oauth2-proxy)"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "https://hub.ai.camer.digital/oauth2/callback"
      webOrigins:
        - "https://hub.ai.camer.digital"
      rootUrl: "https://hub.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    selfServiceMcpApi:
      enabled: true
      clientId: "self-service-mcp-api"
      name: "Self Service"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: true
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      redirectUris:
        - "https://ai.camer.digital/api/mcp/lightbridge_self_service/oauth/callback"
        - "*"
      webOrigins:
        - "*"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    # converseFrontend: REMOVED 2026-08-29 along with the app it existed for.
    #
    # This was the Expo self-service app's public/PKCE client. That app (converse-ui) is retired
    # -- Application deleted, workload pruned, and self-service.ai.camer.digital now 301s to
    # console.ai.camer.digital (ai-helm#1057, ai-helm-values#322/#323/#325).
    #
    # Removed rather than left with `enabled: false`, and worth removing on its own merits even
    # so: its `redirectUris` were `https://self-service.ai.camer.digital/*` -- a WILDCARD redirect
    # on a host that now redirects elsewhere, for a client nothing uses. That is the classic
    # token-exfiltration shape, and the fact that no app used it any more made it pure downside.
    #
    # ⚠️ THIS DOES NOT DELETE THE LIVE CLIENT. Keycloak's `--import-realm` skips a realm that
    # already exists; it does not reconcile. So this document is a bootstrap artefact, and removing
    # a client here only takes effect on a fresh realm import. If `converse-frontend` still exists
    # in the running realm, it has to be deleted in the Keycloak admin console -- that is a manual
    # step this change cannot perform and does not claim to have performed.
    #
    # The `lightbridgeConsole` client below still stamps the literal string `converse-frontend`
    # into `aud` via its `converse-frontend-audience` mapper. That mapper is now vestigial in
    # production -- the console authenticates against authz-idp and expects
    # `aud: lightbridge-console` (ai-helm-values console-ui.yaml) -- but it is left alone here
    # because it is a separate question from this client's existence, and a string in `aud` that
    # nothing checks is inert.

    # ── lightbridge-console (self-service-nextjs-redesign) ─────────────────
    # Confidential client for the Next.js console (apps/console, server-rendered —
    # NOT the Expo `converseFrontend` client above, which stays untouched and keeps
    # serving apps/self-service). Confidential because the console holds its OIDC
    # session server-side (sealed JWE cookie, openid-client on Node) and can keep a
    # secret, unlike the Expo app's public/PKCE-only client.
    #
    # AUDIENCE — two mappers below, not one, because two independent things check
    # `aud` on the same token and expect different values:
    #   1. The console's OWN check (`keycloak.expectedAudiences: ['converse-frontend']`,
    #      `audienceRequired: true` — apps/console/config.yaml, dev realm precedent:
    #      the `self-service` dev client already carries this exact
    #      `converse-frontend-audience` mapper to satisfy it, added earlier in this
    #      project to fix a `/auth/error?reason=audience` failure). `included.client.
    #      audience: "converse-frontend"` reuses the LITERAL string the existing
    #      `converseFrontend` client is registered under above — no new client needed,
    #      this just stamps that clientId into `aud`.
    #   2. authz-api's bearer-token gate, which the console's proxy hits directly
    #      (forwards the session's raw access token as `Authorization: Bearer`, see
    #      apps/console/src/server/proxy.ts `forward()`). ai-helm-values
    #      `environments/prod/values/lightbridge-app.yaml`'s `oauth2.audience:
    #      ["lightbridge-api-key"]` (~line 197) is enforced by
    #      `BearerTokenService::validate_bearer_token`
    #      (lightbridge-authz `crates/lightbridge-authz-bearer/src/lib.rs:270-327`)
    #      for EVERY bearer token reaching authz-api's RPC surface — not just
    #      self-signed API keys; `rpc_authorize.rs` gates the whole cratestack RPC
    #      router through the same `BearerTokenServiceTrait`. A token missing
    #      `lightbridge-api-key` in `aud` 401s `invalid_token`. The SAME
    #      `lightbridge-app.yaml` file documents this exact two-audience shape
    #      already, for a different client (`governance-auth-cli`, ~line 291-298):
    #      "(a) subject_token.aud must contain lightbridge-api-key ... or bearer
    #      validation 401s invalid_token; (b) subject_token.aud must ALSO contain
    #      the literal [own-client-id] or the exchange 400s invalid_grant" — same
    #      two-check pattern, so both mappers are required, not optional hardening.
    #      `lightbridge-api-key` is NOT a registered Keycloak client in this realm
    #      (grep confirms), so it needs `included.custom.audience` (a literal
    #      string), not `included.client.audience`.
    #   `converseFrontend` itself has neither mapper today and is EXPO_PUBLIC_
    #   KEYCLOAK_AUDIENCE_REQUIRED: 'true' in prod (converse-ui.yaml) — whether its
    #   own calls currently pass authz-api's audience gate is a pre-existing question
    #   this PR does not resolve; out of scope (converseFrontend is explicitly not
    #   touched here). Flagging only so a reviewer doesn't assume self-service is
    #   proof this client needs no mapper.
    lightbridgeConsole:
      enabled: true
      clientId: "lightbridge-console"
      name: "Lightbridge Console"
      description: "Next.js server-rendered console (apps/console) — confidential, separate from converse-frontend"
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      # Belt-and-braces: apps/console/src/server/oidc.ts always sends PKCE S256
      # itself regardless of this setting, so enforcing it here rejects any
      # request that somehow skips the app's own PKCE step instead of silently
      # accepting it.
      pkce: "S256"
      secret: "${LIGHTBRIDGE_CONSOLE_CLIENT_SECRET}"
      # Same fail-closed pattern as opencodeExchange above: if the store entry is
      # missing, this ExternalSecret sits in SecretSyncedError and the import runs
      # with an unresolved placeholder rather than a guessed credential. Create the
      # entry in the ClusterSecretStore BEFORE rollout — this is a human
      # prerequisite this PR cannot satisfy.
      externalSecret:
        enabled: true
        secretName: "lightbridge-console-client"
        refreshInterval: "1h"
        secretStore: "ssegning-aws"            # ClusterSecretStore kind
        # The CONSOLIDATED app-secret key, not a per-client one: CLAUDE.md
        # ("Secrets + ESO") is explicit that **app** secrets resolve against
        # `ai/camer/digital/prod/env` with one property each, and only
        # **platform** secrets use a separate key. `opencodeExchange` below
        # still carries its own `camer-digital/keycloak/...` key; that predates
        # the consolidation and is left alone rather than migrated blind.
        remoteKey: "ai/camer/digital/prod/env"
        remoteProperty: "lightbridge_console_client_secret"
      protocolMappers:
        - name: "converse-frontend-audience"
          protocol: "openid-connect"
          protocolMapper: "oidc-audience-mapper"
          consentRequired: false
          config:
            included.client.audience: "converse-frontend"
            access.token.claim: "true"
        - name: "lightbridge-api-key-audience"
          protocol: "openid-connect"
          protocolMapper: "oidc-audience-mapper"
          consentRequired: false
          config:
            included.custom.audience: "lightbridge-api-key"
            access.token.claim: "true"
      redirectUris:
        # apps/console/src/app/auth/callback/route.ts — the ONLY OIDC redirect this
        # client ever uses (server-side code exchange). One origin, not a wildcard:
        # this is a confidential client for exactly one deployment.
        - "https://console.ai.camer.digital/auth/callback"
      webOrigins:
        - "https://console.ai.camer.digital"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

