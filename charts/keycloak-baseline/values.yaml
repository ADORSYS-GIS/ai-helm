# Keycloak Baseline Values
# ========================
# This chart provides reusable Keycloak baseline configuration using BJWS app-template.
# Configuration matches the camer-digital realm export.

global:
  nameOverride: keycloak-baseline

rbac:
  enabled: false
serviceAccount:
  enabled: false
networkPolicy:
  enabled: false
serviceMonitors:
  enabled: false
ingress:
  enabled: false
service:
  enabled: false
pvc:
  enabled: false

# Keycloak Realm Configuration
#=========================
keycloak-config:
  realm: "camer-digital"

  # Realm-level configuration
  realmConfig:
    enabled: true
    displayName: "CDigital"
    displayNameHtml: ""
    sslRequired: "external"
    registrationAllowed: true
    registrationEmailAsUsername: true
    rememberMe: true
    verifyEmail: true
    loginWithEmailAllowed: true
    resetPasswordAllowed: true
    passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notEmail()"
    # Session timeouts (in seconds)
    accessTokenLifespan: 300
    accessTokenLifespanForImplicitFlow: 900
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    offlineSessionIdleTimeout: 2592000
    # Theme settings
    loginTheme: "vaam-01"
    attributes:
      darkMode: "true"
      frontendUrl: "https://accounts.camer.digital"

  # SMTP Server Configuration
  smtpServer:
    host: "mail.mail.svc.cluster.local"
    port: "587"
    from: "no-reply@mail.ssegning.com"
    fromDisplayName: "SSegning Accounts"
    replyTo: "hello@camer.digital"
    replyToDisplayName: "Camer Digital Accounts"
    ssl: "false"
    starttls: "true"
    auth: ""
    debug: "false"

  # Identity Providers
  identityProviders:
    ssegning-dev:
      enabled: true
      alias: "ssegning-dev"
      displayName: "SSegning Dev"
      providerId: "keycloak-oidc"
      config:
        clientId: "camer-digital-sso"
        authorizationUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/auth"
        tokenUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/token"
        userInfoUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/userinfo"
        logoutUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/logout"
        issuer: "https://accounts.ssegning.com/realms/ssegning-dev"
        jwksUrl: "https://accounts.ssegning.com/realms/ssegning-dev/protocol/openid-connect/certs"
        validateSignature: "true"
        useJwksUrl: "true"
        pkceEnabled: "false"
        syncMode: "LEGACY"
        clientAuthMethod: "client_secret_post"

  # Client Scopes with Protocol Mappers
  clientScopes:
    librechat:
      name: "librechat"
      description: ""
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: librechat_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "false"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "librechat_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "converse"

    coder:
      name: "coder"
      description: "Coder OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: coder_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "false"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "coder_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "coder"

    # mlops platform (ADR-0085). Three scopes mirroring the coder pattern —
    # each app's client roles feed its own claim.
    argoWorkflows:
      name: "argo-workflows"
      description: "Argo Workflows OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: argo_workflows_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            multivalued: "true"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "argo_workflows_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "argo-workflows"

    # NOTE: the `lakefsProxy` clientScope was REMOVED (ADR-0085 revised) — the
    # LakeFS oauth2-proxy gate was dropped (LakeFS OSS can't consume external
    # SSO; native access-key login is used instead).

    mlflow:
      name: "mlflow"
      description: "MLflow OIDC roles scope"
      protocol: "openid-connect"
      attributes:
        include.in.token.scope: "false"
        display.on.consent.screen: "true"
      protocolMappers:
        - name: mlflow_roles
          protocol: "openid-connect"
          protocolMapper: "oidc-usermodel-client-role-mapper"
          consentRequired: false
          config:
            introspection.token.claim: "true"
            # MUST be multivalued: mlflow-oidc-auth's `oidcAuth.groupsAttribute`
            # expects a JSON array to match against `groupName`/`adminGroupName`
            # — `multivalued: false` emits a bare string, which the plugin
            # can't match, so login is unconditionally rejected
            # ("User is not allowed to login") even for a user with the
            # `admin`/`viewer` client role assigned. Found live during
            # ADR-0085 verification (compare argo_workflows_roles, which was
            # multivalued: true from the start and worked).
            multivalued: "true"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: "mlflow_roles"
            jsonType.label: "String"
            usermodel.clientRoleMapping.clientId: "mlflow"

  # OIDC Clients
  clients:
    converse:
      enabled: true
      clientId: "converse"
      name: "Converse Chats"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "*"
      webOrigins: []
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - librechat
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      # Client roles
      roles:
        - name: "admin"
          description: ""
        - name: "user"
          description: ""

    coder:
      enabled: true
      clientId: "coder"
      name: "Coder"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://coder.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - coder
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      # Client roles — included in the coder_roles claim for potential future
      # use with Coder IdP Sync (Premium feature). Without a Premium license,
      # roles must be assigned manually in Coder after user login.
      #   admin → owner, developer → member
      roles:
        - name: "admin"
          description: "Coder owner role"
        - name: "developer"
          description: "Coder member role"

    # ── mlops platform (ADR-0085) ─────────────────────────────────────────
    # Argo Workflows: NATIVE OIDC (server.sso) — no fronting oauth2-proxy.
    # The argo_workflows_roles claim (multivalued) is read as the SSO
    # "groups" claim via customGroupClaimName, used for RBAC precedence.
    argoWorkflows:
      enabled: true
      clientId: "argo-workflows"
      name: "Argo Workflows"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://argo-workflows.mlops.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - argo-workflows
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "admin"
          description: "Argo Workflows admin"
        - name: "viewer"
          description: "Argo Workflows read-only"

    # NOTE: the `lakefsProxy` client (LakeFS oauth2-proxy) was REMOVED
    # (ADR-0085 revised). LakeFS OSS can't consume external SSO (Enterprise-
    # only), so the oauth2-proxy gate was dropped in favour of LakeFS's native
    # access-key login. (The manually-created live `lakefs_proxy` client can be
    # deleted out-of-band; this realm config isn't currently reconciled.)

    # MLflow: this specific upstream chart bundles the mlflow-oidc-auth
    # plugin natively — real per-user Keycloak identity + group RBAC inside
    # MLflow itself, no fronting oauth2-proxy needed (ADR-0085).
    mlflow:
      enabled: true
      clientId: "mlflow"
      name: "MLflow"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      rootUrl: "https://mlflow.mlops.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - mlflow
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt
      roles:
        - name: "admin"
          description: "MLflow MANAGE permission"
        - name: "viewer"
          description: "MLflow READ permission (default)"

    # Homepage central-hub dashboard (ADR-0089): Homepage itself ships no
    # authentication, so this client is consumed by a DEDICATED homepage-auth
    # oauth2-proxy instance in reverse-proxy mode (mirrors the ADR-0085
    # lakefs-auth shape) — a network gate only, no per-role behavior, so
    # (unlike lakefsProxy before removal) this client gets no custom
    # clientScope/role mapper.
    homepageProxy:
      enabled: true
      clientId: "homepage-proxy"
      name: "Homepage (oauth2-proxy)"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      redirectUris:
        - "https://hub.ai.camer.digital/oauth2/callback"
      webOrigins:
        - "https://hub.ai.camer.digital"
      rootUrl: "https://hub.ai.camer.digital"
      baseUrl: "/"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    selfServiceMcpApi:
      enabled: true
      clientId: "self-service-mcp-api"
      name: "Self Service"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: true
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      redirectUris:
        - "https://ai.camer.digital/api/mcp/lightbridge_self_service/oauth/callback"
        - "*"
      webOrigins:
        - "*"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    converseFrontend:
      enabled: true
      clientId: "converse-frontend"
      name: "Converse Frontend"
      description: ""
      publicClient: true
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: false
      redirectUris:
        - "https://self-service.ai.camer.digital/*"
      webOrigins:
        - "https://self-service.ai.camer.digital"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    testingClient:
      enabled: true
      clientId: "testing-client"
      name: "Testing Client"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: true
      serviceAccountsEnabled: true
      redirectUris:
        - "*"
      webOrigins:
        - "*"
      frontchannelLogout: true
      defaultClientScopes:
        - web-origins
        - service_account
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

    adorsysGisGithubCi:
      enabled: true
      clientId: "adorsys-gis-github-ci"
      name: "Adorsys GIS Github CI"
      description: ""
      publicClient: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      redirectUris:
        - "/*"
      webOrigins:
        - "/*"
      frontchannelLogout: true
      defaultClientScopes:
        - service_account
        - web-origins
        - acr
        - profile
        - roles
        - basic
        - email
      optionalClientScopes:
        - address
        - librechat
        - phone
        - organization
        - offline_access
        - microprofile-jwt

  # Groups with client role mappings
  groups:
    cdAdmins:
      enabled: true
      name: "CDAdmins"
      realmRoles: []
      clientRoles:
        realm-management:
          - realm-admin

    libreChatAdmin:
      enabled: true
      name: "LibreChatAdmin"
      realmRoles: []
      clientRoles:
        converse:
          - admin

    libreChatUser:
      enabled: true
      name: "LibreChatUser"
      realmRoles: []
      clientRoles:
        converse:
          - user

# Keycloak config-sync CronJob (app-template dependency)
# =====================================================
# For production with external/different-namespace Keycloak,
# override: config-sync.containers.main.env.KEYCLOAK_URL.value
config-sync:
  controllers:
    configSync:
      type: cronjob
      cronjob:
        schedule: "0 * * * *"
        concurrencyPolicy: Forbid
      containers:
        main:
          image:
            repository: docker.io/adorsys/keycloak-config-cli
            tag: "latest-26"
          env:
            KEYCLOAK_URL:
              value: "http://keycloak.keycloak.svc.cluster.local:8080"
            KEYCLOAK_USER:
              value: "admin"
            KEYCLOAK_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            IMPORT_VARIABLE_ENABLED:
              value: "true"
            IMPORT_ENABLED:
              value: "true"
            IMPORT_REALM_FILE:
              value: "/config/camer-digital-realm.yaml"
            LOG_LEVEL:
              value: "DEBUG"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  persistence:
    config:
      type: configMap
      name: keycloak-baseline-realm
      globalMounts:
        - path: /config
          readOnly: true
