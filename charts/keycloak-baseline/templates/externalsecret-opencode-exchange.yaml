{{- /*
Client secret for the `opencode-exchange` confidential client (ai-helm#586).

The realm import never sees the raw value: the config-cli CronJob resolves
`${OPENCODE_EXCHANGE_CLIENT_SECRET}` from its env, which is bound to the
Kubernetes Secret created by this ExternalSecret (key: client-secret).

Fails closed on purpose — mirrors the inference-server hf-token pattern:
if `remoteKey`/`remoteProperty` is missing from the store, this resource sits
in SecretSyncedError and the import proceeds with an unresolved placeholder
instead of silently reusing a stale or guessed credential. Create the entry
in the ClusterSecretStore before rolling out.
*/ -}}
{{- $kc := index .Values "keycloak-config" -}}
{{- $es := $kc.clients.opencodeExchange.externalSecret -}}
{{- if and $kc.clients.opencodeExchange.enabled $es.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: keycloak-baseline-{{ .Chart.Version }}
    app.kubernetes.io/name: keycloak-baseline
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: realm-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "opencodeExchange.externalSecret.secretStore is required" $es.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ required "opencodeExchange.externalSecret.remoteKey is required" $es.remoteKey | quote }}
        property: {{ required "opencodeExchange.externalSecret.remoteProperty is required" $es.remoteProperty | quote }}
{{- end }}
