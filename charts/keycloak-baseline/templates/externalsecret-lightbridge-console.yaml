{{- /*
Client secret for the `lightbridge-console` confidential client
(self-service-nextjs-redesign).

The realm import never sees the raw value: the config-cli CronJob resolves
`${LIGHTBRIDGE_CONSOLE_CLIENT_SECRET}` from its env, which is bound to the
Kubernetes Secret created by this ExternalSecret (key: client-secret). The
SAME remote value is also materialised, separately, into the console
application's own pod (ai-helm-values `environments/prod/deps/console-ui`) so
the Next.js server can authenticate as this client during code exchange —
two independent ExternalSecrets pointed at one remote entry, same pattern as
any shared credential consumed by two workloads.

Fails closed on purpose — mirrors the opencode-exchange pattern above: if
`remoteKey`/`remoteProperty` is missing from the store, this resource sits in
SecretSyncedError and the import proceeds with an unresolved placeholder
instead of silently reusing a stale or guessed credential. Create the entry
in the ClusterSecretStore before rolling out — this repo cannot create it
(human prerequisite, see PR description).
*/ -}}
{{- $kc := index .Values "keycloak-config" -}}
{{- $es := $kc.clients.lightbridgeConsole.externalSecret -}}
{{- if and $kc.clients.lightbridgeConsole.enabled $es.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: keycloak-baseline-{{ .Chart.Version }}
    app.kubernetes.io/name: keycloak-baseline
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: realm-config
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "lightbridgeConsole.externalSecret.secretStore is required" $es.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ required "lightbridgeConsole.externalSecret.remoteKey is required" $es.remoteKey | quote }}
        property: {{ required "lightbridgeConsole.externalSecret.remoteProperty is required" $es.remoteProperty | quote }}
{{- end }}
