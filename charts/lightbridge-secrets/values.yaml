# lightbridge-secrets — ExternalSecrets for the Lightbridge authz stack.
# Leaf chart of the lightbridge orchestrator (ADR-0019). All ExternalSecrets
# resolve against the cluster-scoped `ssegning-aws` ClusterSecretStore.

# ClusterSecretStore the keys are pulled from (the only store on-cluster).
# Override per-env if a second cluster uses a differently-named store.
secretStore: ssegning-aws
refreshInterval: 1h

# Values-driven ExternalSecrets. Key = target Secret name. Each `data` entry
# maps a target secretKey ← a remoteRef {key, property} in the store.
externalSecrets:
  # API client secret the api component reads as API_KEY_CLIENT_SECRET
  # (env var → secretKeyRef name: lightbridge-api-client, key: secret-id).
  # = the Keycloak `lightbridge-api-key` client's Client secret, used for the
  #   token-exchange that mints scoped API-key tokens. Populate the property
  #   `lightbridge_api_client_secret_id` under key `ai/camer/digital/prod/env`.
  lightbridge-api-client:
    data:
      - secretKey: secret-id
        key: ai/camer/digital/prod/env
        property: lightbridge_api_client_secret_id
  # OPA basic-auth password (secretKeyRef name: opa-secret, key: OPA_PASSWORD).
  # Consumed by the api + mcp pods (their configs carry the OPA listener block)
  # AND by the re-enabled opa component, which authenticates the Keycloak
  # token-exchange SPI's /idp/v1/resolve-context call with it. NOTE: this is NO
  # LONGER a throwaway value — the SPI presents `authorino:<this password>` as
  # Basic auth to opa, so `lightbridge_opa_password` MUST match the password the
  # Keycloak SPI is configured with, or context resolution 401s.
  opa-secret:
    data:
      - secretKey: OPA_PASSWORD
        key: ai/camer/digital/prod/env
        property: lightbridge_opa_password
  # authz-idp RP-leg keys (lightbridge-authz ADR-0021/0024). Two independent 32-byte
  # base64url-no-pad keys with different lifecycles: state-encryption-key seals the
  # short-lived RP state cookie (cheap to rotate — costs in-flight logins only);
  # token-encryption-key seals the stored Keycloak token set at rest in
  # federated_identities.token_envelope (rotation = each user's stored tokens are
  # re-sealed on their next login; never invalidates lightbridge-issued tokens).
  #
  # CUTOVER NOTE (2026-08-25): a hand-created, unmanaged Secret of the same name
  # predates this entry (the overnight ADR-0023/0024 rollout). ESO will NOT adopt a
  # secret it doesn't own — after this chart lands, delete the manual Secret once
  # (`kubectl -n converse delete secret lightbridge-idp-rp`) so ESO recreates it from
  # the store. Running pods keep their injected env until restart; the value change
  # is safe by design for both keys (see above).
  #
  # Property names are as created in the store on 2026-08-25 (dash-form, unlike the
  # older snake_case entries). If the ExternalSecret reports SecretSyncError naming a
  # missing property, the store-side names differ — fix HERE, not in the store.
  lightbridge-idp-rp:
    data:
      - secretKey: state-encryption-key
        key: ai/camer/digital/prod/env
        property: state-encryption-key
      - secretKey: token-encryption-key
        key: ai/camer/digital/prod/env
        property: token-encryption-key
  # CNPG barman backup credentials (Hetzner Object Storage). Same creds the
  # Keycloak CNPG backup uses — platform secret under prod/meta/test-app.
  #
  # `s3_region_name` is a STATIC literal (not in the AWS store): the barman-cloud
  # ObjectStore's defaulting webhook injects an `s3Credentials.region` ref →
  # {name: lightbridge-cnpg-s3, key: s3_region_name} that the chart never
  # declares, and the plugin then reads that key at backup time. Without it every
  # ScheduledBackup fails `missing key s3_region_name, inside secret
  # lightbridge-cnpg-s3`. us-east-1 is the Ceph-RGW-accepted convention used
  # repo-wide (mimir/loki/tempo). Merged via target.template (mergePolicy: Merge).
  lightbridge-cnpg-s3:
    literals:
      s3_region_name: us-east-1
    data:
      - secretKey: s3_access_key_id
        key: prod/meta/test-app
        property: s3_backup_cnpg_client_id
      - secretKey: s3_secret_access_key
        key: prod/meta/test-app
        property: s3_backup_cnpg_secret
  # Shared redis-ha AUTH password (secretKeyRef name: redis-ha-redis-auth, key:
  # redis-password) for the api component's Redis-backed rate limiting
  # (lightbridge-authz#135 / ADR-0003 "Rate limiting (Redis-backed)"). The api pod
  # reaches the shared redis-ha (home-os, redis-system) through a haproxy TLS
  # sidecar and presents this password as Redis AUTH (see the redis block +
  # sidecar in ai-helm-values environments/prod/values/lightbridge-app.yaml).
  #
  # SAME platform secret + property the observability exporter, LibreChat and the
  # Envoy rate-limiter use (prod/meta/test-app # redis_password) — NOT the
  # consolidated app secret. Each consumer namespace needs its own copy; this
  # materialises the converse-namespace copy. Key `redis-password` matches what
  # the other consumers read.
  redis-ha-redis-auth:
    data:
      - secretKey: redis-password
        key: prod/meta/test-app
        property: redis_password
