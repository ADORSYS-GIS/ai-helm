apiVersion: v2
name: grafana-pdf-reporter
description: >-
  Remote headless-chromium for the Grafana dashboard-reporter-app
  (mahendrapaipuri-dashboardreporter-app). The reporter plugin rasterizes each
  dashboard panel to a PNG via Grafana image-renderer sidecar, then assembles
  the PDF from HTML using THIS chromium instance (remoteChromeUrl: ws://chrome:9222).
  Deploys a single chromedp/headless-shell Deployment + Service.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - grafana
  - observability
  - pdf
  - reporting
maintainers:
  - name: ai-helm
