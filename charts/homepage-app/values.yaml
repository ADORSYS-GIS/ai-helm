# Homepage (gethomepage.dev) — the central-hub dashboard. Leaf chart of the
# homepage orchestrator (ADR-0089). Sits entirely behind the homepage-auth
# oauth2-proxy reverse-proxy — no ingress, no auth of its own.
#
# Deployment/Service come from bjw-template (aliased `homepage` below).
# ConfigMap (this chart's own templates/configmap.yaml) + RBAC (this chart's
# own templates/rbac.yaml) are hand-rolled — same split as charts/ai-models-info
# (bjw-template for the generic bits, local templates for what it can't express).

# ────────────────────────────────────────────────────────────────────────
# Content — the actual dashboard config (bookmark groups, widgets, Mimir
# Prometheus queries for uptime, settings). Lives in ai-helm-values per
# ADR-0056 (this is real per-deployment content, not chart structure).
# Defaults below are intentionally empty/minimal so the chart renders
# cleanly in CI with no ai-helm-values override.
# ────────────────────────────────────────────────────────────────────────
config:
  # Hand-curated bookmark groups (the "curated" half of the hybrid content
  # mode, ADR-0089) — external links with no in-cluster Ingress to discover
  # (docs, GitHub, upstream project pages, ...).
  bookmarks: []

  # Hand-curated service groups (pinned tiles — the other half of "curated";
  # k8s auto-discovery via Ingress annotations, see docs/integrations/homepage.md,
  # adds MORE tiles on top of this list, it doesn't replace it).
  services: []

  # Widgets (status/uptime, resource usage, ...). Empty by default — the
  # Mimir-backed "info" widgets pointing at
  # http://mimir-nginx.observability.svc.cluster.local/prometheus (same URL
  # Grafana's own datasource already uses) are ai-helm-values content.
  widgets: []

  settings:
    title: "Camer Digital AI — Hub"
    headerStyle: underlined

  # kubernetes.yaml — static, not moved to ai-helm-values (no per-env
  # variance): `mode: cluster` tells Homepage's k8s connector to use the
  # in-cluster API + this chart's own ServiceAccount/RBAC (rbac.yaml), and
  # `ingress: enabled: true` turns on Ingress-annotation discovery.
  kubernetes:
    mode: cluster
    ingress:
      enabled: true

# ────────────────────────────────────────────────────────────────────────
# RBAC (templates/rbac.yaml) — ServiceAccount + read-only ClusterRole/
# ClusterRoleBinding for k8s service discovery. Upstream's own documented
# shape (gethomepage.dev/installation/k8s/): get/list on namespaces, pods,
# nodes, ingresses (extensions + networking.k8s.io), httproutes + gateways
# (gateway.networking.k8s.io — this cluster's AI Gateway routes are Gateway
# API, not just Ingress). Deliberately omits traefik.io IngressRoutes and
# metrics.k8s.io (unused in this cluster).
# ────────────────────────────────────────────────────────────────────────
serviceAccountName: homepage

# ────────────────────────────────────────────────────────────────────────
# bjw-template (aliased `homepage`) — Deployment + Service only. No
# chart-owned ingress (see Chart.yaml) and no `route:` (this isn't on the
# Envoy AI Gateway — it's a plain in-cluster ClusterIP behind oauth2-proxy).
# ────────────────────────────────────────────────────────────────────────
homepage:
  controllers:
    main:
      type: deployment
      replicas: 1
      strategy: RollingUpdate
      # Explicit literal name (not bjw's own serviceAccount: registry) — the
      # ServiceAccount itself is created by this chart's templates/rbac.yaml
      # alongside the ClusterRole/ClusterRoleBinding it's bound to, so RBAC
      # stays in one file. bjw-common's pod-spec helper honours a literal
      # `serviceAccount.name` here without requiring it to be one of its own
      # registered serviceAccounts (see bjw-common
      # templates/lib/pod/fields/_serviceAccountName.tpl).
      serviceAccount:
        name: homepage
      # Note: no checksum/config annotation here — `$.Template.BasePath`
      # inside an aliased bjw-template subchart resolves to the SUBCHART's
      # own templates dir, not this parent chart's, so a checksum-of-this-
      # file trick doesn't cross that boundary (same gotcha
      # charts/ai-models-info's values.yaml documents for its own catalog
      # ConfigMap). Content edits (services/bookmarks/widgets/settings)
      # need a `kubectl rollout restart` to pick up.
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: "v1.13.2"
            pullPolicy: IfNotPresent
          # Hostname Homepage must accept on the `Host` header — it
          # validates this itself and 403s anything not listed (including
          # its own readiness probe if misconfigured). NOTE: this is a
          # literal, not a `{{ .Values... }}` reference — bjw-template is
          # consumed as an ALIASED subchart, so its `.Values` root is this
          # `homepage:` block itself, not the parent chart's top-level
          # values; a cross-scope template reference here silently renders
          # empty. Override this exact key in ai-helm-values with the real
          # hostname (matches the depsOverlay Ingress host).
          env:
            HOMEPAGE_ALLOWED_HOSTS: "hub.ai.camer.digital"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/healthcheck
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/healthcheck
                  port: 3000
                periodSeconds: 10
                timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          enabled: true
          port: 3000
          targetPort: 3000
          protocol: HTTP

  # Mount the ConfigMap this chart renders (templates/configmap.yaml) at
  # /app/config — each data key (services.yaml, bookmarks.yaml, widgets.yaml,
  # settings.yaml, kubernetes.yaml) projects to a file of the same name,
  # exactly what Homepage expects to find there.
  persistence:
    config:
      enabled: true
      type: configMap
      name: '{{ .Release.Name }}-content'
      advancedMounts:
        main:
          main:
            - path: /app/config
              readOnly: true
