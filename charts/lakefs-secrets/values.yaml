# lakefs-secrets — ExternalSecrets for LakeFS. Leaf chart of the lakefs
# orchestrator (ADR-0085). All ExternalSecrets resolve against the
# cluster-scoped `ssegning-aws` ClusterSecretStore.

secretStore: ssegning-aws
refreshInterval: 1h

# Values-driven ExternalSecrets. Key = target Secret name. Each `data` entry
# maps a target secretKey ← a remoteRef {key, property} in the store.
# `literals` are static values merged into the materialised Secret (mergePolicy: Merge).
# `templateData` are templated strings (ESO Go templates) that can reference
# fetched data via `{{ .<secretKey> }}`.
externalSecrets:
  # NOTE: the CNPG-facing `lakefs-db-role` basic-auth Secret (consumed by the
  # managed role's passwordSecret) is NOT here — it must live in the SAME
  # namespace as the lightbridge-main-db CNPG cluster (`converse`), not
  # `mlops`. It's created directly by charts/lightbridge-db (mirrors
  # coder-db-role). This chart only carries mlops-namespace Secrets.

  # Single Secret carrying the two values the upstream LakeFS chart natively
  # pulls from an existingSecret (chart's `secretKeys` map). The DB is
  # LakeFS's OWN dedicated CNPG cluster, `lakefs-main-db` in THIS namespace
  # (mlops) — charts/lakefs-db, ADR-0123 (supersedes ADR-0085 decision #3,
  # which put LakeFS on the shared lightbridge-main-db cluster in `converse`
  # instead, after an incident where an unrelated tenant on that cluster
  # exhausted its connections and took LakeFS down with it).
  # The connection targets the RW service in the `mlops` namespace — no
  # cross-namespace hop, unlike the old lightbridge-main-db target.
  # The password is URL-encoded via ESO's `urlquery` function so URL-reserved
  # characters don't break the connection string.
  lakefs-app-secret:
    templateData:
      database_connection_string: "postgres://lakefs:{{ .dbPassword | urlquery }}@lakefs-main-db-rw.mlops.svc.cluster.local:5432/lakefs?sslmode=disable"
      auth_encrypt_secret_key: "{{ .encryptSecretKey }}"
    data:
      - secretKey: dbPassword
        key: ai/camer/digital/prod/env
        property: lakefs_db_password
      - secretKey: encryptSecretKey
        key: ai/camer/digital/prod/env
        property: lakefs_encrypt_secret_key

  # S3 blockstore credentials — the SAME platform S3 material every other
  # Hetzner Object Storage consumer uses (Keycloak/lightbridge CNPG backups,
  # LibreChat's S3 file storage): prod/meta/test-app, bucket ssegning-k8s-state.
  # LakeFS repositories default to the `lakefs/` prefix (set via extraEnvVars
  # in the app values, not here).
  lakefs-s3-creds:
    data:
      - secretKey: access_key_id
        key: prod/meta/test-app
        property: s3_backup_cnpg_client_id
      - secretKey: secret_access_key
        key: prod/meta/test-app
        property: s3_backup_cnpg_secret

  # Single Secret for the DEDICATED lakefs-auth oauth2-proxy instance (client
  # `lakefs-proxy` — NOT shared with mlflow, ADR-0085/ADR-0090): Keycloak OIDC
  # client credentials + the session cookie signing secret. Matches the
  # upstream oauth2-proxy chart's config.existingSecret schema, which reads all
  # three keys (client-id/client-secret/cookie-secret) from ONE Secret
  # (config.requiredSecretKeys default).
  #
  # ⚠️ cookie-secret MUST base64-decode to exactly 16, 24 or 32 RAW BYTES
  # (oauth2-proxy uses it as an AES cipher key). The safe generator is
  #   openssl rand -hex 16       # → 32 ASCII chars = 32 raw bytes ✅
  # A padded base64 value (44 chars, e.g. `openssl rand -base64 32` piped
  # through anything that re-encodes it) is read as 44 bytes and oauth2-proxy
  # refuses to start with
  #   "cookie_secret must be 16, 24, or 32 bytes ... but is 44 bytes"
  # — this exact failure already cost a live debug round here (see #712).
  # `head -c 32` on base64 TEXT truncates the encoding and is equally wrong.
  lakefs-proxy-secret:
    data:
      - secretKey: client-id
        key: ai/camer/digital/prod/env
        property: lakefs_proxy_client_id
      - secretKey: client-secret
        key: ai/camer/digital/prod/env
        property: lakefs_proxy_client_secret
      - secretKey: cookie-secret
        key: ai/camer/digital/prod/env
        property: lakefs_proxy_cookie_secret

  # LakeFS bootstrap-admin credentials, consumed by the lakefs-proxy SSO shim
  # (charts/lakefs-proxy, ADR-0090) as LAKEFS_ADMIN_ACCESS_KEY_ID /
  # LAKEFS_ADMIN_SECRET_ACCESS_KEY. The shim logs into LakeFS with these on
  # behalf of an oauth2-proxy-authenticated browser and relays LakeFS's own
  # `internal_auth_session` cookie back to that browser.
  #
  # ⚠️ These are the credentials of the SINGLE `admin` user LakeFS OSS
  # (`rbac: none`) supports — it cannot provision additional users, so every
  # SSO user shares this one LakeFS identity (verified live; ADR-0090
  # consequences). Treat the pair as a platform-wide credential: rotating it
  # (`lakefs superuser` / the LakeFS UI) means updating both ASM properties.
  #
  # OPERATOR PREREQ — create `lakefs_admin_access_key_id` /
  # `lakefs_admin_secret_access_key` under `ai/camer/digital/prod/env` in
  # ssegning-aws BEFORE this chart syncs, or the Secret sits in
  # SecretSyncedError and lakefs-proxy stays in ContainerCreating (by design —
  # its env refs are deliberately NOT optional).
  lakefs-proxy-admin:
    data:
      - secretKey: access-key-id
        key: ai/camer/digital/prod/env
        property: lakefs_admin_access_key_id
      - secretKey: secret-access-key
        key: ai/camer/digital/prod/env
        property: lakefs_admin_secret_access_key

  # GHCR pull secret for the PRIVATE ghcr.io/adorsys-gis/lakefs-proxy image.
  # imagePullSecrets are NAMESPACE-scoped, so the `lightbridge-repo-auth-ghcr`
  # copy that serves `converse` can't serve `mlops` — this is a second
  # materialisation of the SAME org-wide credential (github_username/
  # github_token @ ai/camer/digital/prod/env), keyed on the ghcr.io HOST so one
  # PAT covers both the adorsys-gis and vymalo orgs. Consumed via bjw's
  # defaultPodOptions.imagePullSecrets in charts/lakefs-proxy.
  #
  # Owned by THIS chart rather than a shared `mlops-ghcr` so ownership stays
  # with the single consumer; a future mlops app needing a private image can
  # reference this Secret by name or ship its own.
  #
  # mergePolicy Replace ⇒ the materialised Secret carries ONLY
  # `.dockerconfigjson`, not the raw username/token it was assembled from.
  # The `{{ … }}` below are ESO Go-template expressions evaluated by the
  # OPERATOR, not by Helm — Helm never templates values files, so they pass
  # through verbatim (same mechanism as lakefs-app-secret's templateData).
  lakefs-ghcr:
    type: kubernetes.io/dockerconfigjson
    mergePolicy: Replace
    templateData:
      .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
    data:
      - secretKey: username
        key: ai/camer/digital/prod/env
        property: github_username
      - secretKey: token
        key: ai/camer/digital/prod/env
        property: github_token
