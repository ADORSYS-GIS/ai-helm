# inference orchestrator — STRUCTURAL SKELETON ONLY.
#
# Renders ONE ApplicationSet with a child `inference-server` Application per
# enabled catalog entry, one model per GPU (ADR-0094/0095).
#
# ⚠️ THE CATALOG DOES NOT LIVE HERE ANY MORE (ADR-0129).
#
# The fleet catalog — the ArgoCD wiring, every `defaults.*` knob including the
# engine profiles' images and security contexts, and the `models:` entries
# themselves — lives in the private values repo:
#
#     ai-helm-values  environments/prod/values/inference.yaml
#
# read by the `aii-inference` Application as its `$values` source (ADR-0055/0056).
# This file holds only the empty containers those values land in. It follows
# `charts/ai-models` (ADR-0126) exactly, for the same reason: which model runs on
# which card is deployment state, not chart logic, and adding a model should not
# require publishing a chart.
#
# The three things worth knowing before editing:
#
#   • Do NOT re-add a model or a default here. A value left in this file
#     deep-merges UNDER the values-repo file and becomes invisible drift.
#
#   • Rendering on these defaults FAILS, by design — `inference.requireCatalog`
#     in templates/_helpers.tpl. That guard is load-bearing, not decorative: the
#     `$values` source uses `ignoreMissingValueFiles`, and an EMPTY catalog would
#     otherwise render a perfectly valid ApplicationSet with no children, which
#     the controller reconciles by deleting every model's StatefulSet, Service
#     and PVC-backed weights. The destination guard does NOT catch it (it
#     defaults a missing name to "home-remote" and renders happily). Failing the
#     render instead leaves `aii-inference` in ComparisonError with every GPU
#     model still serving — the only safe direction here.
#
#   • Because the defaults do not render, CI lints and renders this chart through
#     `ci/lint-values.yaml` (Chart.yaml annotation
#     `ai-helm.adorsys-gis.github.io/lint-mode: ci-values`). That fixture is
#     minimal template coverage, NOT a mirror of the fleet, and it is also this
#     chart's Trivy scan input (release-helm-charts.yml falls back to ci/* when a
#     chart's defaults do not render). Deleting it removes scan coverage.
#
# ⚠️ Serving is not federating: a model here RUNS, but users reach it only once it
# also has a backend + model entry in the gateway catalog
# (`ai-helm-values environments/prod/values/models.yaml`). Both halves now live in
# that one repo, so `check-model-catalogs.sh` there checks them against each other
# directly. See docs/adr/0129-inference-catalog-moves-to-values-repo.md.

# ── ArgoCD wiring ─────────────────────────────────────────────────────────
# Supplied by the values repo. `destination` is intentionally empty: see the
# render-failure note above.
argocd:
  namespace: ""
  project: ""
  chartRegistry: ""
  chartVersionRange: ""
  destination: {}
  syncPolicy: {}

# ── Fleet defaults ────────────────────────────────────────────────────────
# GPU placement, storage class, HF token, network policy, LMCache tuning and the
# per-engine profiles (llamacpp / vllm / localai). All supplied by the values
# repo — the engine profiles live there too, because an image tag and a security
# context are deployment state.
defaults: {}

# ── The catalog: one entry per model, one model per GPU ───────────────────
models: {}
