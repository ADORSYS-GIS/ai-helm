# ═══════════════════════════════════════════════════════════════════════════════
#  THE MODEL CATALOG — this is the file you edit to add, replace or remove a
#  self-hosted model. One entry per model. Nothing else needs to change.
#
#  Full recipes (with the verification steps): the team's `inference-ops` repo,
#  docs/how-to/add-a-model.md and docs/how-to/replace-a-model.md.
#  The GitOps mechanics: docs/patterns/self-hosted-model-serving.md · ADR-0094.
#
#  Two things to know before you touch it:
#
#   1. A merge to `main` is a LIVE DEPLOY (ADR-0055 continuous delivery). There is
#      no release tag to cut and no root to repoint. Roll back with `git revert`.
#
#   2. Serving a model and OFFERING it to users are two different steps. This file
#      makes the model run on a GPU. To let users reach it through the gateway you
#      also add a backend + model entry in `charts/ai-models/values.yaml` — and
#      that is deliberate: it means you can deploy and measure a model before any
#      user can see it. `tools/check-model-catalogs.sh` fails CI if an entry here
#      is federated inconsistently there.
# ═══════════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────
# ArgoCD wiring — where the generated child Applications live.
#
# ⚠️ Two-tier (ADR-0017): the ApplicationSet this chart renders is a CONTROL
# object and lives in-cluster/argocd (the charts/apps entry sets
# `controlPlane: true`). The child Applications are WORKLOADS and target
# home-remote, namespace `inference`, where the GPU nodes are.
# ────────────────────────────────────────────────────────────────────────
argocd:
  namespace: argocd
  project: ai
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  destination:
    name: home-remote
    allowInCluster: false
    # Models get their own namespace: not `converse` (chat/gateway territory)
    # and not the old `converse-poc` (that was the other cluster). No Pod
    # Security elevation is needed — neither engine wants hostPath or host
    # networking, so the cluster-wide `baseline` standard is satisfied.
    namespace: inference
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ═══════════════════════════════════════════════════════════════════════════════
#  FLEET DEFAULTS — the shared machinery. You should rarely need to edit this
#  section to add a model; it exists so a catalog entry can stay ~15 lines.
# ═══════════════════════════════════════════════════════════════════════════════
defaults:

  # ── GPU access ────────────────────────────────────────────────────────────
  # The two GPU nodes (hetzner-k8s-gpu-1/2) are tainted so nothing lands on them
  # by accident. `count: 1` means each model claims one whole card; there is no
  # MIG or time-slicing configured, and one model per GPU is the intent.
  #
  # Consequence worth internalising: with 2 cards, the 3rd enabled model sits
  # Pending with `Insufficient nvidia.com/gpu` until you disable another. That is
  # the queue working, not a bug — and it replaces the old routine of hunting
  # down which chart to set `enabled: false` before enabling yours.
  gpu:
    count: 1
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

  # ── GPU arbitration with MLOps (ADR-0114) ─────────────────────────────────
  # Serving is the designated preemption victim: `charts/webank-training`
  # steps run at `mlops-training` (1000) and can evict a serving pod at this
  # negative priority to take its card on demand. Deliberately NOT gated
  # behind a flag — every model on the fleet carries this by default, exactly
  # like the gpu/hardening blocks above. The PriorityClass objects themselves
  # ship from `charts/gpu-priority-classes` (a separate Application — this
  # chart only references them by name).
  priorityClassName: inference-serving

  # ── Weights storage ───────────────────────────────────────────────────────
  # Longhorn, which on this cluster exists ONLY on the GPU nodes (ADR-0092) and
  # is NOT the cluster default StorageClass — so it must be named explicitly or
  # the claim lands on hcloud-volumes and never binds. reclaimPolicy is Retain:
  # deleting a claim orphans rather than destroys an expensive weight cache.
  storageClassName: longhorn

  seedImage:
    repository: python
    tag: "3.12-slim"

  # ── HuggingFace token for the seed Job ────────────────────────────────────
  # Lifts the anonymous Hub rate limit that otherwise stalls a multi-GB download
  # partway through, and is required for gated repos.
  hfToken:
    enabled: true
    secretName: hf-token
    dataKey: token
    externalSecret:
      enabled: true
      secretStore: ssegning-aws
      refreshInterval: 1h
      key: ai/camer/digital/prod/env
      property: hf_token

  # ── Engine hardening (ADR-0097) ───────────────────────────────────────────
  # Engine-agnostic POLICY; the per-engine mapping lives in _helpers.tpl. Every
  # engine we run must end up with: no unauthenticated surface beyond the
  # inference API, no browser UI, no wildcard CORS, and a Bearer it checks
  # itself. Adding an engine means adding its flags to that mapping — the policy
  # here does not change.
  #
  # ⚠️ This is DEFENCE IN DEPTH, not the primary control. The primary control is
  # still the CiliumNetworkPolicy below: verified live 2026-07-26 that a pod in
  # the same namespace times out reaching the model, and only the gateway gets
  # through. The key matters if that policy is ever mis-edited, and it silences
  # llama-server's own start-up warning ("CORS is set to allow all origins and
  # no API key is set").
  security:
    apiKey:
      # Enforced natively by EVERY engine — llama.cpp `--api-key-file`, vLLM
      # `VLLM_API_KEY`, zimage `API_KEY`. How a given engine takes the key is
      # part of its profile (`engines.<name>.apiKey.mode`), not a knob here.
      # No proxy sidecar, ever (see the Chart.yaml note).
      enabled: true
      secretStore: ssegning-aws
      key: ai/camer/digital/prod/env
      # ⚠️ OUT-OF-BAND-SECRET-FIRST. The env binding is `optional: false`, so a
      # property missing from the store leaves the pod in ContainerCreating
      # rather than starting unauthenticated. Reusing the long-standing
      # `vllm_local_api_key` property, which is proven to resolve (the converse
      # ns has synced it for months) — do NOT point a model at a new property
      # until it exists in AWS Secrets Manager.
      property: vllm_local_api_key
    # llama-server ships a full chat Web UI + static file server, ENABLED BY
    # DEFAULT, on the same port as the API. It is an unauthenticated surface we
    # have no use for on a backend. No-op for engines that ship no UI (vLLM).
    #
    # This costs nothing in the normal path — the NetworkPolicy already makes the
    # UI unreachable from a browser, so the only way to see it at all is
    # `kubectl port-forward`. It is therefore the ONE hardening knob with real
    # debugging value, and it is overridable PER MODEL:
    #
    #   models:
    #     my-model:
    #       security:
    #         disableWebUI: false     # temporarily, for hands-on debugging
    #
    # Prefer curl against a port-forward (see the inference-ops how-tos) and
    # leave this alone; if you do flip it, flip it back.
    disableWebUI: true
    # BOTH engines default CORS to '*' (llama.cpp `--cors-origins`, vLLM
    # `--allowed-origins`). Nothing browser-based should call a model directly —
    # it goes through the gateway — so pin the canonical gateway origin.
    # ⚠️ Give a plain string here; the vLLM mapping JSON-encodes it, because that
    # flag is typed json.loads and rejects a bare URL.
    corsOrigins: "https://api.ai.camer.digital"

  # ── Who may reach a model ─────────────────────────────────────────────────
  # See charts/inference-server/templates/ciliumnetworkpolicy.yaml for why the
  # entities matter (kubelet probes) and why there is no egress block (seeding).
  networkPolicy:
    enabled: true
    allowFromNamespaces:
      - envoy-gateway-system   # the Envoy AI Gateway data plane — the only caller
      - observability          # Alloy, scraping /metrics
    allowFromEntities:
      - host
      - remote-node
      - health

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics

  # ── KV-cache precision (FLEET DEFAULT — every vLLM model) ──────────────────
  # The precision of the KEY/VALUE cache — the storage the attention reads —
  # for EVERY vLLM model, unless a catalog entry overrides it with its own
  # `serving.kvCacheDtype`. 8-bit fp8_e4m3 is the fleet policy: it halves the
  # KV footprint (≈2× context capacity in the same VRAM budget — for qwen3-vl
  # the measured ~1.14 GiB budget holds ~16 500 tokens vs ~8 288 in BF16) at a
  # quality cost that is small but MUST be measured per model, not assumed
  # (same discipline as every knob in this file).
  #   • fp8_e4m3 — 4-bit exponent / 3-bit mantissa (E4M3FN): the accuracy pick
  #     for inference, the production standard (TensorRT-LLM and most
  #     deployments).
  #   • fp8_e5m2   — 5-bit exponent / 2-bit mantissa: robust to KV outliers
  #     (e.g. vision heads); the plan B if the e4m3 quality gate fails.
  #   • auto       — 16-bit (bf16/fp16), the pre-quantization behaviour; how a
  #     single model opts out without a fleet-wide change.
  # ⚠️ vLLM-ONLY. llama.cpp has no FP8 vocabulary — its 8-bit cache type is
  # q8_0 (int8 block quant) and it takes per-model `serving.kvCacheType`; the
  # LocalAI diffusion backend has no KV cache to quantize.
  kvCacheDtype: fp8_e4m3

  # ── LMCache (vLLM only) ───────────────────────────────────────────────────
  # KV-cache offload to host RAM for prefix reuse. Values carried over from the
  # combination this repo actually ran (charts/model-serving-qwen25-3b-awq).
  # ⚠️ LMCACHE_MAX_LOCAL_CPU_SIZE is in GiB of HOST RAM and is NOT accounted for
  # by the container memory limit automatically — raise `resources.memoryLimit`
  # above it or the pod gets OOM-killed mid-cache.
  #
  # ⚠️ fp8 KV cache + LMCache is UNVERIFIED on this fleet: LMCache serializes
  # the KV tensors as stored on the GPU, and its fp8 path has never been
  # exercised here (the only LMCache model, qwen3-8b-fast, is disabled).
  # Verify the combination before enabling it — do not assume.
  lmcacheEnv:
    LMCACHE_USE_EXPERIMENTAL: "False"   # connector is activated by --kv-transfer-config alone
    LMCACHE_CHUNK_SIZE: "256"
    LMCACHE_LOCAL_CPU: "True"
    LMCACHE_MAX_LOCAL_CPU_SIZE: "4"
    LMCACHE_SAVE_DECODE_CACHE: "False"
    LMCACHE_MIN_RETRIEVE_TOKENS: "64"
    LMCACHE_LOG_LEVEL: "INFO"

  # ── Engine profiles ───────────────────────────────────────────────────────
  # Which engine to pick is an inference decision, documented in inference-ops
  # ADR-0002 (text) and ADR-0003 (image). The short version:
  #   GGUF weights, or a brand-new architecture → llamacpp
  #   safetensors (AWQ/GPTQ/FP8), want throughput/prefix-reuse → vllm
  #   a DIFFUSION model answering /v1/images/generations → zimage
  # Serving a GGUF on vLLM is a known ~8x throughput regression; do not.
  #
  # The first two are upstream images we merely configure. The third is OURS —
  # see its profile for what that costs (no CI build, no /metrics, no CORS knob).
  engines:

    llamacpp:
      # The image entrypoint IS llama-server, so `args` are bare flags.
      # ⚠️ NOT `server-cuda13`: these cards run driver 550 / CUDA 12.4, and the
      # CUDA-13 build needs a newer driver (it also regressed on some GPUs,
      # ggml-org/llama.cpp#22561). Pin a digest once a model is load-gated.
      image:
        repository: ghcr.io/ggml-org/llama.cpp
        tag: server-cuda
        pullPolicy: IfNotPresent
      # 503 while loading, 200 once the weights are in — exactly what a startup
      # probe needs.
      healthPath: /health
      # llama-server reads the Bearer from a FILE, so the Secret is mounted
      # rather than passed as an env var. `path` is the mount point; the key
      # inside it is always `api_key`.
      apiKey:
        mode: file
        path: /etc/model-api-key
      # TODO(hardening): both engines currently run as root with ALL capabilities
      # dropped and privilege escalation disabled. That is what clears Trivy
      # KSV-0118 and is what has actually shipped; a previous attempt to pin
      # runAsUser 1000 was never verified against a real GPU rollout. Tighten to
      # non-root per engine once confirmed on the fleet, and record it.
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

    vllm:
      # The LMCache-paired build of vLLM's OpenAI server.
      #
      # ⚠️⚠️ THE TAG NUMBERING IS DISCONTINUOUS AND WILL MISLEAD YOU. LMCache's
      # early tags mirrored vLLM's version, then they switched to their own
      # scheme, so the numbers went BACKWARDS in time:
      #     v0.7.0  → published 2025-02-06   (vLLM 0.7.0 — EIGHTEEN MONTHS OLD)
      #     v0.5.2  → published 2026-07-22   (LMCache 0.5.2 — current)
      # Picking the "higher" version gets you an image that predates Qwen3 and
      # fails at start-up with:
      #     ValueError: The checkpoint you are trying to load has model type
      #     `qwen3` but Transformers does not recognize this architecture
      # which reads like a broken download rather than a stale image. Always sort
      # the tags by DATE, never by version string:
      #     curl -s 'https://hub.docker.com/v2/repositories/lmcache/vllm-openai/tags?ordering=last_updated'
      #
      # ⚠️⚠️ CORRECTED 2026-07-29, live and the hard way, TWICE in one incident.
      # This guidance used to say "use the plain tag, NOT `-cu129`" — that was
      # true once and is no longer, and the replacement (`-cu129`) turned out
      # to be broken too, in a way only a real vLLM import — not a bare CUDA
      # check — catches. Both failures were verified against this image, not
      # assumed:
      #
      #   1. `v0.5.2` (plain): CUDA_VERSION=13.0.1.012 baked into the image
      #      (confirmed by pulling the image config, not the tag name).
      #      CUDA 13 is a MAJOR version bump past this fleet's driver
      #      (550.163.01, CUDA 12.4 max) — no minor-version-compatibility
      #      applies across a major boundary:
      #          RuntimeError: The NVIDIA driver on your system is too old
      #          (found version 12040). ...
      #
      #   2. `v0.5.2-cu129`: torch itself is a coherent CUDA 12.9 build and
      #      initializes fine (`torch.cuda.init()` succeeds, GPU detected) —
      #      but vLLM's own compiled extension is NOT rebuilt to match:
      #          ImportError: libcudart.so.13: cannot open shared object file
      #      i.e. this specific tag mixes a cu129 torch with a cu13-linked
      #      vLLM native extension. A bare `torch.cuda.init()` check does NOT
      #      catch this — only a real `import vllm` does.
      #
      # `nightly-2026-05-01` is what was actually verified end-to-end on
      # `hetzner-k8s-gpu-1` (three separate probe pods, not one shortcut):
      #     FULL_VLLM_IMPORT_OK 0.20.1rc1.dev128+g32964e770 2.11.0+cu129
      #     Qwen3VLForConditionalGeneration  (present in ModelRegistry)
      #     CUDA_OK  (device correctly identified as the RTX 4000 SFF Ada)
      # It is a dated NIGHTLY, not a versioned release — deliberately: the
      # closest-to-current versioned tag (`v0.5.2`) is the CUDA-13 one. Dated
      # nightly tags are immutable per LMCache's own tagging (each date is a
      # distinct tag/digest), so this pins the same way a version tag would.
      #
      # ⚠️ Re-verify with a REAL `import vllm` (not just `torch.cuda.init()`)
      # on every bump, on the actual target hardware — this incident is proof
      # that CUDA-version-in-the-env and CUDA-version-the-binaries-actually-
      # need can silently diverge inside one image. Same class of trap as
      # llama.cpp's `server-cuda13`, one layer deeper.
      #
      # ⚠️ vLLM↔LMCache compatibility is pinned by this image — test before bumping.
      image:
        repository: lmcache/vllm-openai
        tag: nightly-2026-05-01
        pullPolicy: IfNotPresent
      healthPath: /health
      # vLLM's own OpenAI server reads the Bearer from the environment.
      apiKey:
        mode: env
        envName: VLLM_API_KEY
      # vLLM's worker processes talk over shared memory; the 64 MB default
      # /dev/shm is not enough and the failure mode is an opaque hang during
      # engine start. No other engine needs this.
      devShm: true
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

    # ── localai — IMAGE GENERATION, off the shelf (ADR-0102) ─────────────────
    # LocalAI (github.com/mudler/LocalAI) is an OpenAI-compatible server that
    # serves diffusion models natively at `/v1/images/generations`. It replaced a
    # first-party Rust + Candle server we briefly maintained; see ADR-0102 for
    # why that was the wrong call and how the survey that led to it was
    # incomplete. The short version: this is a commodity, we should not have been
    # building one, and the ecosystem serves this exact model through gallery
    # entries that already exist.
    #
    # ⚠️ PIN THE CUDA-12 TAG. The `master`/`latest` tags are built against
    # **CUDA 13**, and these nodes run driver 550 / CUDA 12.4 — the same trap
    # CLAUDE.md records for llama.cpp's `server-cuda13` and vLLM's `-cu129`.
    # Versioned CUDA-12 tags exist and are what we use:
    #     quay.io/go-skynet/local-ai:v4.7.1-gpu-nvidia-cuda-12
    #
    # ⚠️⚠️ PINNING THIS IMAGE DOES NOT PIN WHAT RUNS THE MODEL. Observed live on
    # first boot, and it is the thing to know about this engine:
    #
    #   installing OCI backend without signature verification
    #     backend="cuda12-diffusers"
    #     uri="quay.io/go-skynet/local-ai-backends:latest-gpu-nvidia-cuda-12-diffusers"
    #
    # Two separate problems in one line.
    #
    #   1. The BACKEND TAG IS `latest`. LocalAI picks its inference backend at
    #      runtime from its backend gallery, and the reference it resolves is not
    #      version-pinned — so the CUDA-12 tag we pin below fixes the SERVER and
    #      leaves the thing that actually executes the model floating. A backend
    #      published tomorrow is what a pod restarting tomorrow will run. It DID
    #      select cuda12 correctly (it reads the host capability, logged as
    #      `nvidia-cuda-12`), so this is not currently broken — it is unpinned.
    #
    #   2. NO SIGNATURE VERIFICATION. LocalAI says so itself, in a WARN. This
    #      repo cosign-gates its own first-party images (ADR-0055); that gate does
    #      not extend here, and there is no knob in this chart that changes it.
    #
    # Both are consequences of choosing an engine that manages its own runtime
    # (ADR-0102) and neither was visible until it ran. Pinning them means either
    # pre-populating BACKENDS_PATH ourselves or an upstream feature; tracked as a
    # follow-up rather than papered over. Do not read the pinned server tag as
    # meaning the whole stack is pinned.
    #
    # ⚠️ LocalAI MANAGES ITS OWN DOWNLOADS. Unlike the two text engines, it pulls
    # both the model (from its model gallery) and its inference BACKEND (from its
    # backend gallery, `AUTOLOAD_BACKEND_GALLERIES` defaults true) at start-up.
    # Two consequences the other engines do not have:
    #   • there is NO seed Job — `seedJob: false` below — and no HF token;
    #   • the weights volume must be WRITABLE, and must hold `backends/` as well
    #     as `models/`, or every pod restart re-downloads both.
    # First start is therefore slow (backend + weights), which is what the long
    # startup-probe budget is for. Subsequent restarts read from the PVC.
    localai:
      image:
        repository: quay.io/go-skynet/local-ai
        tag: v4.7.1-gpu-nvidia-cuda-12
        pullPolicy: IfNotPresent
      # ⚠️ A FOUR-HOUR startup budget, and it is not paranoia. This engine does
      # ALL of its fetching after the container starts, so a cold boot is:
      #   • download the backend            4.2 GiB compressed
      #   • EXTRACT it onto Longhorn        7.3 GiB — measured at ~2 GiB per
      #                                     11 min on the RWX volume, so ~35 min
      #                                     on its own
      #   • download the model              ~33 GB for the diffusers entry
      #
      # The fleet default of 120 × 15s = 30 min does not cover the extraction
      # alone. And the failure is not a slow start — it is an INFINITE one: the
      # startup probe kills the container mid-download, the replacement starts
      # over, and it can never finish. LocalAI's own health handler warns about
      # precisely this ("a long startup preload must not read as a hung process,
      # or an orchestrator restarts the pod mid-download and the preload can
      # never finish"), which is why /healthz is always-200 and only /readyz
      # gates.
      #
      # 960 × 15s = 4h. Only the FIRST boot pays it: BACKENDS_PATH and
      # MODELS_PATH are both on the PVC, so a restart skips straight to loading.
      startupFailureThreshold: 960
      # `/readyz` — and it means what we need it to mean. Verified in LocalAI's
      # handler: it answers **503 `startup preload in progress`** until the
      # preload completes, and 200 after, while `/healthz` is always-200 for
      # liveness ("a long startup preload must not read as a hung process, or an
      # orchestrator restarts the pod mid-download"). That is the same contract
      # llama.cpp and vLLM give us, so the fleet's probe design carries over
      # unchanged — startup/readiness on this path, liveness on tcpSocket.
      #
      # ⚠️ Which makes `MODELS` load-bearing for READINESS, not just for serving:
      # readiness gates on the preload, so an empty or unrecognised model
      # reference risks a pod that reports Ready with nothing loaded.
      healthPath: /readyz
      # ⚠️ …AND `/readyz` IS NOT ENOUGH — but NOT because LOAD_TO_MEMORY is
      # broken. Measured on the fleet 2026-07-29: at Ready, `/readyz` 200s and
      # the `stablediffusion-ggml` backend process IS running, while nvidia-smi
      # reports 5 MiB used. `LOAD_TO_MEMORY` → `PreloadModelByName` →
      # `ml.Load()` does spawn the backend and open the model exactly as
      # documented; what defers is stable-diffusion.cpp's upload of tensors to
      # the GPU, which happens at first inference — BELOW LocalAI's abstraction,
      # so no LocalAI setting reaches it. The weights land on the FIRST REQUEST
      # and the first user paid for it (32.03s cold vs 29.23s warm, 1024x1024).
      # The watchdog is not the cause; it defaults to off and we leave it off.
      # Keep LOAD_TO_MEMORY set — it is correct and does its half of the job.
      #
      # `warmup` makes the startup probe perform a real generation, so the pod
      # gets a Service endpoint only after it has actually served one. Declared
      # as profile DATA (like apiKey.mode and metrics) rather than a template
      # branch — an engine that needs no warmup simply omits this key and keeps
      # the plain httpGet startup probe.
      #
      # 256x256 is deliberate: resolution does not change WHICH weights load, so
      # the cheapest size that exercises the full path is the right one — ~3.8s,
      # against ~29s for a 1024x1024. `model` is injected by the helper from
      # serving.servedModel.
      warmup:
        path: /v1/images/generations
        timeoutSeconds: 60
        body:
          prompt: warmup
          size: 256x256
          # ⚠️ QUOTED. Unquoted `n` is a YAML 1.1 boolean, so `n: 1` becomes the
          # key `false` and the request loses its image count. Caught in the
          # render as `{"false":1,…}`.
          "n": 1
          response_format: b64_json
      # `LOCALAI_API_KEY,API_KEY` — the same env var the previous engine used, so
      # the fleet's ADR-0097 key policy carries over untouched.
      apiKey:
        mode: env
        envName: API_KEY
      # ⚠️ Metrics are BACK. LocalAI serves `/metrics` unless
      # DISABLE_METRICS_ENDPOINT is set, so this engine gets a ServiceMonitor
      # like the text tiers — closing the observability gap the first-party
      # server had. Note the route sits behind LocalAI's admin middleware, so the
      # scrape must present the API key; charts/inference-server's ServiceMonitor
      # already does that whenever `apiKey.enabled` (same situation as
      # llama-server, where --api-key-file also covers /metrics).
      metrics: true
    # ⚠️ READY MEANS LOADED — but only because we force it to. Out of the box
    # `/readyz` gates on the model INSTALL (the download) while the backend loads
    # lazily on the FIRST REQUEST, so a green ArgoCD tree, a Ready pod and a
    # scraping /metrics endpoint were all compatible with a model that returned
    # 500 with 5 MiB of VRAM in use. `LOAD_TO_MEMORY` (see the env block in
    # _helpers.tpl) moves the load into the startup sequence readiness waits on.
    # Do not remove it thinking it is an optimisation — it is what makes the
    # probe honest. Verify with a real generation anyway.
    #
    # ── Backend supply chain — READ THIS BEFORE ADDING A VERIFICATION POLICY ──
    # LocalAI resolves its inference BACKEND at runtime from a gallery, separately
    # from the server image. ADR-0105 tried to pin and verify both halves. On a
    # fresh volume, live, BOTH halves of that turned out not to work as recorded;
    # ADR-0108 has the full account. What is actually true:
    #
    # 1. ⚠️ SIGNATURE VERIFICATION IS OFF, AND CANNOT CURRENTLY BE ON.
    #    ADR-0105 added a keyless-cosign `verification:` block here. It made the
    #    pod CrashLoopBackOff on the first fresh-volume boot:
    #
    #      cosignverify: no Sigstore bundle referrer for
    #      quay.io/go-skynet/local-ai-backends@sha256:84b0120a...
    #      (signed with --new-bundle-format?)
    #      → Backend not found: stablediffusion-ggml → LocalAI failed to start
    #
    #    The backend image IS signed — in the LEGACY cosign format (config
    #    `application/vnd.dev.cosign.artifact.sig.v1+json`, layer
    #    `…cosign.simplesigning.v1+json`, verified against the quay referrers
    #    API). LocalAI v4.7.1's verifier only reads the NEW Sigstore bundle
    #    format. Upstream signs one way, its own verifier reads the other, so the
    #    policy was unsatisfiable as written — the identity regex and
    #    `not_before` were never even reached.
    #
    #    Do NOT re-add `verification:` expecting the regex to be the problem. It
    #    is not. Re-add it only once upstream signs with `--new-bundle-format`,
    #    or once we serve our own mirrored+re-signed backend (see below).
    #
    # 2. ⚠️ THE BACKEND IMAGE TAG IS NOT PINNED, and cannot be from here. The
    #    gallery index at @v4.7.1 hardcodes the tag in the entry itself:
    #
    #      - name: "cuda12-stablediffusion-ggml"
    #        uri: "quay.io/go-skynet/local-ai-backends:latest-gpu-nvidia-cuda-12-stablediffusion-ggml"
    #                                                 ^^^^^^
    #    LocalAI uses that URI verbatim, so `--backend-images-release-tag` never
    #    applies to a gallery-sourced backend. ADR-0105 recorded this tag as
    #    pinned to v4.7.1; it never was. The knob is left set below because it is
    #    harmless and does govern URIs LocalAI builds itself — but it does NOT
    #    pin this backend, and the comment must not imply otherwise.
    #
    #    Consequence, stated plainly: the backend binary can move under us at any
    #    time. Today `latest-…` and `v4.7.1-…` resolve to the SAME digest
    #    (sha256:58bf31fe…), so we are running the bytes that were measured — but
    #    nothing holds that true tomorrow.
    #
    # 3. ✅ THE WEIGHTS ARE STILL PINNED. `download_files` carries a sha256 per
    #    file (see the z-image-turbo entry) and is unaffected by any of the above.
    #    The pinned-bytes guarantee holds for the MODEL; it is the BACKEND that
    #    floats.
    #
    # The durable fix is to stop consuming upstream's images directly: verify
    # their legacy signature in CI, mirror by digest into our own registry,
    # re-sign with `cosign --new-bundle-format` under our own GHA identity, and
    # point `backendGalleries` at an index we host. Tracked as ADR-0108's
    # follow-up — it is real work, not a config change.
      backendImagesReleaseTag: v4.7.1
      backendGalleries:
        - name: localai
          # `@v4.7.1`, not `@master` — the gallery INDEX is versioned, and this
          # pin does work. It fixes which entries (and which URIs) we read; it
          # does not fix the image tag inside them. See note 2 above.
          url: "github:mudler/LocalAI/backend/index.yaml@v4.7.1"
          # NO `verification:` block — deliberately. See note 1 above before
          # adding one back.
    # ⚠️ `requireBackendIntegrity` deliberately NOT set — and now load-bearing,
    # not merely deferred. It rejects ANY backend install lacking a verification
    # policy, and since note 1 above means we cannot currently HAVE one, setting
    # it would hard-fail every boot. Revisit only together with note 1.
    #
    # LocalAI downloads models and backends itself; no seed Job, no HF token.
      seedJob: false
      # …and therefore needs the volume read-write.
      writableModelStore: true
      # Upstream image, run like the other two upstream engines: root with all
      # capabilities dropped and privilege escalation off. It writes backends and
      # weights into the mount at runtime, so no read-only rootfs (KSV-0014 is
      # path-scoped in .trivyignore.yaml for the serving fleet).
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

# ═══════════════════════════════════════════════════════════════════════════════
#  THE MODELS. Add yours here.
#
#  Minimal entry:
#
#    my-model:
#      enabled: true
#      engine: llamacpp                    # or vllm, or zimage (image generation)
#      weights:
#        hfRepo: org/Some-Model-GGUF
#        revision: <full commit sha>        # NEVER a branch name — see below
#        include: "Some-Model-Q4_K_M.gguf"  # llamacpp only: which file to fetch
#        sizeGi: 20                         # PVC size, comfortably above the file
#      serving:
#        contextSize: 32768
#
#  `revision` must be a commit SHA, not `main`. Weights are mutable on the Hub:
#  a pinned SHA means the bytes you measured are the bytes you serve, and it is
#  also what makes the seed stamp meaningful (change the SHA → weights re-seed).
#  Get it with:
#      curl -s https://huggingface.co/api/models/<org>/<repo> | jq -r .sha
#
#  Optional per-model knobs:
#
#    lmcache: { enabled: true }        # vllm only — KV offload to host RAM
#    kvCacheDtype: auto                # vllm only — override of the fleet default
#                                      # (defaults.kvCacheDtype = fp8_e4m3).
#                                      # `auto` = 16-bit, for the model that
#                                      # fails its fp8 quality gate.
#    kvCacheType: q8_0                 # llamacpp only — 8-bit KV cache; llama.cpp
#                                      # has no fp8 vocabulary, q8_0 (int8 block
#                                      # quant) is its sweet spot. No fleet
#                                      # default: explicit per model.
#    apiKey:                           # engine-enforced Bearer, normally OFF
#      enabled: true
#      property: my_model_api_key      # property in ssegning-aws
#
#  On `kvCacheDtype`: the fleet default (defaults.kvCacheDtype) is fp8_e4m3
#  for EVERY vLLM model — you normally do not touch this. A per-model override
#  exists for two cases: the model that fails its fp8 quality gate (set `auto`
#  to go back to 16-bit), or, after measurement, the model where `fp8_e5m2`
#  beats e4m3fn (vision-head outliers). One knob, one model, measured.
#
#  On `apiKey`: you almost certainly do not want it. A model is cluster-local
#  (ADR-0095) and the CiliumNetworkPolicy already limits ingress to the gateway,
#  so a shared secret in the pod adds a rotation surface without closing a hole.
#  It exists for a model that must be reachable from somewhere other than the
#  gateway. When it IS on, BOTH engines enforce it natively and NEITHER grows a
#  proxy sidecar — llama-server via `--api-key-file`, vLLM via `VLLM_API_KEY`.
#  (The Caddy sidecar in the legacy charts was never a vLLM limitation: it was
#  required only by `kserve/huggingfaceserver`, KServe's wrapper, which ignores
#  VLLM_API_KEY entirely — ADR-0022. That wrapper is not an engine option here.)
# ═══════════════════════════════════════════════════════════════════════════════
models:

   # ─────────────────────────────────────────────────────────────────────────
   # Qwen3-4B (Q6_K GGUF, llama.cpp) — DISABLED.
   # Was the fleet's coding model; swapped by qwen25-3b-awq (one GPU, one
   # model) on 2026-08-10. Kept as a rollback surface — re-enable to roll back.
   #
   # Full deployment plan + sizing:
   #   inference-ops docs/benchmarks/2026-08-06-qwen3-4b-q6k-rtx4000-ada-deployment.md
   #
   # ⚠️ NOT FEDERATED until the load gate measures it (ADR-0101 — a model must
   # be measured before any user can route to it). Predictions are in the plan
   # above; the gate's own report is separate and immuable.
   #
   # contextSize 32768 / parallel 1: every request gets the FULL native
   # window (the per-request window is the load-bearing number). parallel: 2 @
   # ctx 65536 (two full-window slots) is a load-gate comparison, not the
   # initial setting — it implies rope scaling.
   qwen3-4b:
     enabled: false                  # DISABLED — swapped by qwen25-3b-awq (one GPU). Re-enable to roll back.
     engine: llamacpp
     weights:
       hfRepo: Qwen/Qwen3-4B-GGUF
       # Pinned via `curl -s https://huggingface.co/api/models/Qwen/Qwen3-4B-GGUF | jq -r .sha`
       revision: bc640142c66e1fdd12af0bd68f40445458f3869b
       include: "Qwen3-4B-Q6_K.gguf"
       sizeGi: 10
     serving:
       contextSize: 32768
       parallel: 1
       # Fleet convention for Qwen3 text models (same as openmythos-27b,
       # qwen3-8b-fast): thinking OFF at the server. Clients opt in per
       # request; the catalog does NOT advertise reasoning.
       reasoning: "off"
     resources:
       cpuRequest: "2"
       cpuLimit: "8"
       memoryRequest: 4Gi
       memoryLimit: 16Gi

   # ─────────────────────────────────────────────────────────────────────────
   # Qwen2.5-3B-Instruct-AWQ (AWQ INT4, vLLM) — DISABLED.
   # Was the fleet's coding model; swapped by qwen3-5-2b (one GPU, one model)
   # on 2026-08-10. Kept as a rollback surface — re-enable to roll back.
   #
   # Qwen2.5 is a non-thinking causal LM with 32K native context; AWQ INT4
   # fits the full window comfortably on the 20 GiB Ada card (~2.5 GiB
   # weights). Tool calling via the hermes parser (same as the legacy
   # charts/model-serving-qwen25-3b-awq deployment, which ran this exact
   # model + LMCache on the home GPU).
   #
   # ⚠️ LMCache ON → kvCacheDtype MUST be `auto`: fp8 KV cache + LMCache is
   # UNVERIFIED on this fleet and fails the render (ADR-0118). This is the
   # exact combination the legacy chart ran (LMCache in-process, 16-bit KV).
   qwen25-3b-awq:
     enabled: false                 # DISABLED — swapped by qwen3-5-2b (one GPU). Re-enable to roll back.
     engine: vllm
     weights:
       hfRepo: Qwen/Qwen2.5-3B-Instruct-AWQ
       # Pinned via `curl -s https://huggingface.co/api/models/Qwen/Qwen2.5-3B-Instruct-AWQ | jq -r .sha`
       revision: 3559b226e8ce77211e2c1bd7ddfb7686fec4d6dd
       sizeGi: 10
     serving:
       contextSize: 32768
       parallel: 4
       quantization: awq
       dtype: float16
       toolCallParser: hermes
       kvCacheDtype: auto            # required with LMCache (fp8+LMCache unverified)
     lmcache:
       enabled: true
     resources:
       cpuRequest: "2"
       cpuLimit: "8"
       memoryRequest: 8Gi
       memoryLimit: 16Gi             # above LMCACHE_MAX_LOCAL_CPU_SIZE (4 GiB) + vLLM overhead

   # ─────────────────────────────────────────────────────────────────────────
   # Qwen3.5-2B (BF16, vLLM) — the fleet's coding model.
   #
   # Replaces qwen25-3b-awq (one GPU, one model). Multimodal causal LM (vision
   # + text), 2B params, hybrid Gated DeltaNet + Gated Attention + MoE FFN
   # architecture, 262,144 native context, Apache-2.0. Non-thinking by default;
   # thinking opt-in per request via `enable_thinking`.
   #
   # ⚠️ REQUIRES vLLM FROM THE `main`/NIGHTLY BRANCH (model card). The profile
   # image `lmcache/vllm-openai:nightly-2026-05-01` MUST be verified with a
   # real `import vllm` + ModelRegistry check for the Qwen3_5 architecture on
   # the actual card BEFORE this entry is enabled in prod (Step 0 of
   # plans/qwen3-5-2b-replacing-qwen25-3b-awq.md). If it does not support
   # Qwen3.5, bump the image and re-verify — never assume.
   #
   # ⚠️ kvCacheDtype `auto` (16-bit): fp8_e4m3 is UNVERIFIED on the hybrid
   # architecture (DeltaNet layers have no classic KV cache). Measure at the
   # load gate, then try fp8_e4m3 (÷2 KV).
   #
   # ⚠️ LMCache OFF: LMCache serializes KV tensors as stored on the GPU; its
   # behaviour with the hybrid architecture is UNVERIFIED. Enable only after
   # measurement (and then kvCacheDtype MUST stay `auto` — ADR-0118).
   qwen3-5-2b:
     enabled: true
     engine: vllm
     weights:
       hfRepo: Qwen/Qwen3.5-2B
       # Pinned via `curl -s https://huggingface.co/api/models/Qwen/Qwen3.5-2B | jq -r .sha`
       revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
       sizeGi: 10
     serving:
       contextSize: 32768
       parallel: 4
       dtype: bfloat16
       toolCallParser: qwen3_coder
       kvCacheDtype: auto            # fp8 unverified on the hybrid architecture
       reasoning: "off"              # non-thinking default; clients opt in per request
     resources:
       cpuRequest: "2"
       cpuLimit: "8"
       memoryRequest: 8Gi
       memoryLimit: 16Gi

   # ─────────────────────────────────────────────────────────────────────────
   # Z-Image-Turbo — IMAGE GENERATION, served by LocalAI (ADR-0102/0103/0105).
   #
   # Tongyi-MAI/Z-Image-Turbo: 6B distilled DiT, 8 sampling steps, 1024×1024,
   # Apache-2.0. Answers OpenAI `POST /v1/images/generations`, so it federates
   # like any other model — with `kind: image` + `flatPerRequest` pricing, because
   # tokens are always 0 for image generation.
   #
   # ⚠️ RESTORED 2026-07-29 (ADR-0106, issue #803). This entry is not new work:
   # it is the configuration that was measured live at 32.4 s / 1024×1024 and
   # 7985 MiB VRAM on 2026-07-28, then silently deleted when PR #790 merged a
   # stale branch (`704-ticket-deployment-of-z-image-turbo`) that predated the
   # LocalAI decision. That merge resurrected a first-party Rust/Candle server
   # whose image `ghcr.io/adorsys-gis/z-image-turbo-server:v0.1.0` does not exist
   # — the source had been deleted by ADR-0102 the day after it shipped — so the
   # pod sat in ImagePullBackOff and could never have served a request. The
   # legacy chart is gone; this is the deployment.
   #
   # LocalAI downloads BOTH the model and its inference backend at start-up, so
   # unlike every other entry here there is no `weights.hfRepo`, no HF revision
   # to pin and no seed Job — the engine profile sets `seedJob: false` and the
   # volume is mounted writable. The pinned-bytes guarantee comes back a
   # different way: `download_files` carries a sha256 per file (ADR-0105).
   z-image-turbo:
     enabled: true
     engine: localai
     serving:
       # The inference backend to install at boot. REQUIRED because we define the
       # model ourselves and therefore name no gallery model — naming one used to
       # pull its backend as a side effect. The chart fails the render without it
       # rather than letting LocalAI find out at boot, where a missing backend
       # surfaces as a cooldown cascade that names every backend EXCEPT the
       # absent one (an error that cost real time to read correctly).
       backends:
         - cuda12-stablediffusion-ggml
       # ⚠️ A DIFFERENT FILENAME FROM THE GALLERY'S, deliberately. Overwriting
       # `Z-Image-Turbo.yaml` does not work: LocalAI logs `installing model` on
       # EVERY start and rewrites it, so an initContainer's version survived
       # exactly until the engine booted. Measured proof — latency and VRAM were
       # bit-identical to the untuned run (95.6 s, 815 MiB). The `._gallery_*`
       # marker does not prevent the rewrite. So we write our own file under our
       # own name, and nothing of ours is left for the gallery to clobber.
       modelConfigFile: z-image-turbo.yaml
       # The name LocalAI serves and preloads. Must equal `name:` in modelConfig
       # below, and `modelNameOverride` in charts/ai-models. It cannot be derived
       # — modelConfig is an opaque string to Helm.
       servedModel: z-image-turbo
       modelConfig: |
         backend: stablediffusion-ggml
         name: z-image-turbo
         cfg_scale: 1
         # ⚠️ 8, not the gallery's 25. Z-Image-**Turbo** is distilled for 8 steps;
         # 25 is ~3x the sampling work for no quality gain, and step count is the
         # dominant term in image latency. Measured at 25: 94.2 s per 1024x1024;
         # at 8: 32.4 s, and the output is visibly better, not merely faster.
         step: 8
         options:
             - diffusion_model
             - llm_path:Qwen3-4B.Q4_K_M.gguf
             - vae_path:ae.safetensors
             # ⚠️ `offload_params_to_cpu:true` is DELIBERATELY ABSENT. The gallery
             # sets it for small cards; on ours it left 815 MiB of 20475 MiB in
             # use while parameters streamed over PCIe every step. ~6.7 GB of
             # quantized weights fit the card many times over — put them on it.
             # Removing it is what moved VRAM 815 MiB → 7985 MiB and latency
             # 94.2 s → 32.4 s. Both reproduced on 2026-07-29: 7985 MiB resident,
             # held across 190 s of idle. A 1024x1024 generation transiently
             # peaks at 14643 MiB (activations, released afterwards) — budget the
             # peak when sizing a co-tenant for this card.
         parameters:
             model: z_image_turbo-Q4_0.gguf
         # sha256-pinned, so the bytes measured at the load gate are the bytes
         # served. Digests are the LocalAI gallery's own, copied deliberately and
         # verified against its index.yaml rather than trusted from a summary —
         # only the TUNING above is ours.
         #
         # ⚠️ The Z-Image `filename` says Q4_0 while its `uri` fetches Q4_K. That
         # mismatch is the gallery's, not a typo here: the file is stored under
         # the name `parameters.model` refers to, and the sha256 is the one that
         # is actually checked. Sizes confirmed via the HF tree API — Q4_K
         # 3.86 GB, Qwen3-4B Q4_K_M 2.50 GB, ae 0.34 GB (~6.7 GB total).
         download_files:
             - filename: z_image_turbo-Q4_0.gguf
               sha256: 14b375ab4f226bc5378f68f37e899ef3c2242b8541e61e2bc1aff40976086fbd
               uri: https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q4_K.gguf
             - filename: Qwen3-4B.Q4_K_M.gguf
               sha256: a37931937683a723ae737a0c6fc67dab7782fd8a1b9dea2ca445b7a1dbd5ca3a
               uri: huggingface://MaziyarPanahi/Qwen3-4B-GGUF/Qwen3-4B.Q4_K_M.gguf
             - filename: ae.safetensors
               sha256: afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38
               uri: https://huggingface.co/ChuckMcSneed/FLUX.1-dev/resolve/main/ae.safetensors
     weights:
       # No hfRepo/revision: LocalAI fetches from its own gallery. `sizeGi` still
       # applies — the volume holds the weights AND the downloaded backend.
       #
       # ⚠️ 40Gi, NOT the 100Gi this entry carried before. That number was never
       # the right size: it was forced by a PVC that had already been expanded to
       # 100Gi in the staging-disk fix, and `spec.resources.requests.storage` may
       # never be less than `status.capacity` — Longhorn grows a claim in place
       # but never shrinks one. That constraint is gone: the old
       # `z-image-turbo-weights` claim was pruned with the app, VERIFIED live on
       # 2026-07-29 (`kubectl -n inference get pvc` lists only the qwen3-vl
       # claim), so this provisions a fresh volume and can be sized honestly.
       #
       # 40Gi against ~6.7 GB of weights plus the extracted backend is deliberate
       # headroom, not a measurement: this direction only goes one way, and there
       # is ~1.6 TiB free per GPU node. 40Gi is the number the retired entry
       # itself recommended as the starting point for a new image model.
       sizeGi: 40
     resources:
       # Text encoding for this model runs on CPU in most backends, so it wants
       # real CPU — unlike the text tiers, where the CPU idles while the GPU works.
       cpuRequest: "4"
       cpuLimit: "12"
       memoryRequest: 12Gi
       # HOST RAM, not VRAM.
       memoryLimit: 32Gi

   # ─────────────────────────────────────────────────────────────────────────
   # OpenMythos-27B (Q4_K GGUF, llama.cpp) — DISABLED.
   # Was the first model on the Hetzner GPU fleet, load-gated at 15.05 tok/s
   # decode / 625 tok/s prefill / 16748 MiB and served to users. Disabled because
   # the fleet has two cards and they now hold z-image-turbo (and the coding
   # model that briefly took the other card was retired 2026-08-06 — the card is
   # free). The pinned SHA still resolves, so re-enabling re-seeds
   # byte-identical weights. Report: inference-ops
   # docs/benchmarks/2026-07-26-openmythos-27b-q4k-rtx4000-ada.md
   # ─────────────────────────────────────────────────────────────────────────
   openmythos-27b:
     enabled: false
     engine: llamacpp
     weights:
       hfRepo: jabbatheduck/OpenMythos-GGUF
       revision: 4a1a1f97fbfc621d6f33cebc9f3ecc5c12e8c7d7
       include: "OpenMythos-27B-Q4_K.gguf"
       sizeGi: 30
     serving:
       contextSize: 32768
       parallel: 2
       reasoning: "off"
     resources:
       cpuRequest: "2"
       cpuLimit: "8"
       memoryRequest: 8Gi
       memoryLimit: 24Gi

   # ─────────────────────────────────────────────────────────────────────────
   # Qwen3-8B-AWQ (vLLM + LMCache) — DISABLED.
   # Was the SPEED tier on the second GPU. Disabled because the fleet has two
   # cards and they now hold z-image-turbo (the coding model that briefly took
   # the other card was retired 2026-08-06 — the card is free). Never
   # load-gated, so it was never federated. Re-enable to roll back.
   # ─────────────────────────────────────────────────────────────────────────
   qwen3-8b-fast:
     enabled: false
     engine: vllm
     weights:
       hfRepo: Qwen/Qwen3-8B-AWQ
       revision: 4da05a8edb55c6046cce958586c33b61da07bb79
       sizeGi: 20
     serving:
       contextSize: 32768
       parallel: 4
       quantization: awq
       dtype: float16
       toolCallParser: hermes
       reasoning: "off"
     lmcache:
       enabled: true
     resources:
       cpuRequest: "2"
       cpuLimit: "8"
       memoryRequest: 8Gi
       memoryLimit: 16Gi
