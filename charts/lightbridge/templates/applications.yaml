{{- /*
lightbridge App-of-Apps orchestrator — renders three child Application CRs:
  • lightbridge-secrets — local ExternalSecrets leaf chart (single source).
  • lightbridge-db      — local CNPG leaf chart (single source).
  • lightbridge-app     — upstream Lightbridge chart (deployed as an ArgoCD
                          source, like the old flat app) + the ingress
                          Certificates via the per-env kustomize overlay
                          (second source).
All target home-remote (ADR-0017 guard via
lightbridge.argocd.destinationClusterRef). Rendered as direct Application CRs
rather than an ApplicationSet because the children are fixed + heterogeneous —
see ADR-0019 (coder is the canonical example).
*/ -}}
{{- $a := .Values.argocd -}}
{{- if .Values.secrets.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.secrets.appName }}
  namespace: {{ $a.namespace | default "argocd" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.secrets.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  source:
    # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
    repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.secrets.chartName | quote }}
    chart: "."
    targetRevision: {{ $a.chartVersionRange | quote }}
    helm:
      releaseName: {{ .Values.secrets.releaseName | quote }}
  destination:
    {{- include "lightbridge.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.db.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.db.appName }}
  namespace: {{ $a.namespace | default "argocd" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.db.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  source:
    # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
    repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.db.chartName | quote }}
    chart: "."
    targetRevision: {{ $a.chartVersionRange | quote }}
    helm:
      releaseName: {{ .Values.db.releaseName | quote }}
  destination:
    {{- include "lightbridge.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  {{- /*
    The CNPG operator (field manager `manager`) stamps dozens of default fields
    onto the Cluster (affinity, bootstrap, probes, primaryUpdateStrategy, …) that
    the chart doesn't declare → permanent cosmetic OutOfSync (and selfHeal churn).
    Ignore fields owned by the operator's field manager so the Cluster reads
    Synced. */}}
  {{- with .Values.db.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.app.appName }}
  namespace: {{ $a.namespace | default "argocd" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.app.syncWave | quote }}
    # Continuous delivery (ADR-0055): argocd-image-updater picks the newest
    # COSIGN-signed `sha-<gitsha>` build of each first-party image and git
    # write-backs the image into environments/prod/values/lightbridge-app.yaml on
    # ai-helm-values `main` (api → global.authz.image.{repository,version}, mcp →
    # global.authz_mcp.image.{repository,version}). BOTH image-name (repository)
    # and image-tag (version) are required — the operator errors ("could not find
    # an image-name") if only the tag param is given. cosign identity = the
    # lightbridge-authz CI workflow that signs the images. Until a signed build
    # exists the updater finds no verifiable tag and leaves the version untouched.
    argocd-image-updater.argoproj.io/image-list: api=ghcr.io/adorsys-gis/lightbridge-authz,mcp=ghcr.io/adorsys-gis/lightbridge-authz-mcp
    argocd-image-updater.argoproj.io/api.update-strategy: newest-build
    argocd-image-updater.argoproj.io/api.allow-tags: regexp:^sha-[0-9a-f]+$
    argocd-image-updater.argoproj.io/api.force-update: "true"
    # GHCR read cred (App-based, argocd ns) so tag detection keeps working once
    # ghcr.io/adorsys-gis/lightbridge-authz goes private. Secret provisioned in
    # home-os (serverless/k/lightbridge-authz). No-op while the image is public.
    argocd-image-updater.argoproj.io/api.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
    argocd-image-updater.argoproj.io/api.helm.image-name: global.authz.image.repository
    argocd-image-updater.argoproj.io/api.helm.image-tag: global.authz.image.version
    argocd-image-updater.argoproj.io/api.signature-type: cosign
    argocd-image-updater.argoproj.io/api.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
    argocd-image-updater.argoproj.io/api.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-authz/\.github/workflows/ci\.yml@.*$
    argocd-image-updater.argoproj.io/mcp.update-strategy: newest-build
    argocd-image-updater.argoproj.io/mcp.allow-tags: regexp:^sha-[0-9a-f]+$
    argocd-image-updater.argoproj.io/mcp.force-update: "true"
    argocd-image-updater.argoproj.io/mcp.pull-secret: pullsecret:argocd/adorsys-gis-ghcr-pull
    argocd-image-updater.argoproj.io/mcp.helm.image-name: global.authz_mcp.image.repository
    argocd-image-updater.argoproj.io/mcp.helm.image-tag: global.authz_mcp.image.version
    argocd-image-updater.argoproj.io/mcp.signature-type: cosign
    argocd-image-updater.argoproj.io/mcp.cosign.certificate-oidc-issuer: https://token.actions.githubusercontent.com
    argocd-image-updater.argoproj.io/mcp.cosign.certificate-identity-regexp: ^https://github\.com/ADORSYS-GIS/lightbridge-authz/\.github/workflows/ci\.yml@.*$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: https://github.com/adorsys-gis/ai-helm-values.git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/environments/prod/values/lightbridge-app.yaml
    argocd-image-updater.argoproj.io/git-credentials: secret:argocd/github-app-creds--adorsys-gis
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  sources:
    # Source A — the upstream Lightbridge workload (OCI Helm chart as an ArgoCD
    # source; full chart path in repoURL + chart "." per ADR-0055, same as the
    # secrets/db leaves but pinned via app.chart.targetRevision rather than
    # floated). releaseName stays `lightbridge` so workload resource names don't
    # churn vs the old flat app. Values live in ai-helm-values (ADR-0056), read
    # via the $values ref (Source C) — not inline.
    - repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.app.chart.chartName | quote }}
      chart: "."
      targetRevision: {{ .Values.app.chart.targetRevision | quote }}
      helm:
        releaseName: {{ .Values.app.releaseName | quote }}
        valueFiles:
          - $values/environments/{{ $a.env | default "prod" }}/values/lightbridge-app.yaml
        ignoreMissingValueFiles: true
    # Source B — app-scoped deps (ingress Certificates) via the per-env
    # kustomize overlay in this repo; issuer patched per environment.
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      path: {{ .Values.app.depsOverlay | quote }}
    # Source C — $values ref: the workload values file (ai-helm-values, ADR-0056).
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      ref: values
  destination:
    {{- include "lightbridge.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
