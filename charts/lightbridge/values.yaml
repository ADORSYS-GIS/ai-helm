# lightbridge App-of-Apps orchestrator — renders three child Application CRs
# (lightbridge-secrets + lightbridge-db + lightbridge-app). See ADR-0019 (coder
# is the canonical example). The chart owns no workload resources; it owns the
# three child Applications.
#
# Replaces the old flat `lightbridge-backend` app. Components: api (main) + mcp
# are always on; opa stays dropped (ADR-0021), but usage was re-enabled at the
# values layer (ai-helm-values PR #247 — usage.enabled: true in
# environments/prod/values/lightbridge-app.yaml), reversing the usage half of
# ADR-0026. This chart doesn't gate usage itself — the upstream
# lightbridge-authz-stack chart's own component toggles do. Namespace stays
# `converse`.

# ────────────────────────────────────────────────────────────────────────
# Shared ArgoCD wiring for all child Applications.
# ────────────────────────────────────────────────────────────────────────
argocd:
  # ArgoCD project the children belong to.
  project: ai
  # OCI chart-float (ADR-0055). Two sources of truth now:
  #  • chartRegistry/chartVersionRange — the secrets + db leaf charts float from
  #    OCI (full chart path in repoURL + chart "."; template builds
  #    `<chartRegistry>/<chartName>`).
  #  • repoURL/targetRevision — the app child's cert/deps overlay (Source B), now
  #    the values repo @ main (where environments/ lives).
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  repoURL: https://github.com/adorsys-gis/ai-helm-values
  targetRevision: main
  destination:
    # The home-remote cluster all children target. Repo invariant (ADR-0017):
    # workloads NEVER deploy to the cluster ArgoCD runs in. The destination
    # helper hard-fails the render if this resolves to in-cluster unless
    # `allowInCluster: true`.
    name: home-remote
    allowInCluster: false
    namespace: converse
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ────────────────────────────────────────────────────────────────────────
# lightbridge-secrets child — the ExternalSecrets leaf chart (this repo).
# Lowest sync-wave: the api client secret + CNPG S3 backup creds must exist
# before the DB (barman) and the app (API_KEY_CLIENT_SECRET) start.
# ────────────────────────────────────────────────────────────────────────
secrets:
  enabled: true
  appName: lightbridge-secrets
  chartName: lightbridge-secrets   # OCI chart name (was chartPath: charts/<name>)
  releaseName: lightbridge-secrets
  syncWave: "0"

# ────────────────────────────────────────────────────────────────────────
# lightbridge-db child — the CloudNativePG database leaf chart (this repo).
# Lower sync-wave than the app so Postgres is up before Lightbridge starts.
# ────────────────────────────────────────────────────────────────────────
db:
  enabled: true
  appName: lightbridge-db
  chartName: lightbridge-db   # OCI chart name (was chartPath: charts/<name>)
  releaseName: lightbridge-db
  syncWave: "1"
  # Ignore the CNPG operator's defaulted fields on the Cluster so it doesn't sit
  # permanently OutOfSync (the operator, field manager `manager`, adds affinity/
  # bootstrap/probes/primaryUpdateStrategy/… that the chart never declares).
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager

# ────────────────────────────────────────────────────────────────────────
# lightbridge-app child — the upstream Lightbridge workload (Helm chart,
# deployed as an ArgoCD source — NOT a Helm dependency, so ArgoCD pulls it the
# same way the old flat app did) + the ingress TLS Certificates via the
# kustomize overlay. releaseName stays `lightbridge` so workload resource names
# don't churn.
# ────────────────────────────────────────────────────────────────────────
app:
  enabled: true
  appName: lightbridge-app
  releaseName: lightbridge
  syncWave: "2"
  # Upstream Lightbridge umbrella chart, now pulled via OCI (ADR-0055) instead of
  # the retired gh-pages Helm repo. Published by lightbridge-authz CI to
  # <argocd.chartRegistry>/<chartName> = oci://ghcr.io/adorsys-gis/charts/lightbridge-authz-stack
  # (renamed from `lightbridge` to avoid colliding with THIS orchestrator's own
  # charts/lightbridge package). Pinned — NOT floated like the secrets/db leaves —
  # so a lightbridge-authz chart release doesn't auto-deploy; the workload IMAGE
  # still floats via argocd-image-updater (annotations below).
  chart:
    chartName: lightbridge-authz-stack
    # 10.0.0 — ADORSYS-GIS/lightbridge-authz#661 replaced the five per-component `config.yaml`
    # strings in ai-helm-values' `lightbridge-app.yaml` with ONE
    # `global.lightbridge.sharedConfig` object. Only a chart carrying that PR's
    # `lightbridge.config.render` helper knows how to read it; on an older chart those keys are
    # unknown values, the render SUCCEEDS, and every component silently falls back to the chart's
    # own local-dev config (keycloak:9100). So this bump MUST land, and sync, BEFORE the
    # ai-helm-values migration is merged.
    #
    # Verified byte-safe on its own, before that migration: `helm template` of the published
    # 5.0.0 and 10.0.0 charts against the CURRENT `lightbridge-app.yaml`, with ArgoCD's own
    # invocation (`-n converse --kube-version 1.35.3 --include-crds`), produces deep-equal
    # `config.yaml` for all six components, and differs only in the `helm.sh/chart` /
    # `app.kubernetes.io/version` labels plus one new `lightbridge-usage-migrate-*` Job name
    # (unrelated 5.0.0→9.x drift in `charts/lightbridge-authz-usage`, #593/#603 — the migrate
    # subcommand is idempotent).
    #
    # 5.0.0 was four majors stale: chart publishing had been broken since 2026-08-25 (v6..v9
    # were tagged by release-please with GITHUB_TOKEN, which does not fire the `push: tags`
    # workflow), so nothing had been published. 10.0.0 was published by a manual
    # `workflow_dispatch` of helm-oci.yml on the v10.0.0 tag; the underlying PAT expiry is
    # tracked separately.
    targetRevision: "10.0.0"
  # App-scoped deps (ingress Certificates) — kustomize overlay in this repo,
  # added as a second source (issuer patched per env). ADR-0018 pattern.
  depsOverlay: environments/prod/deps/lightbridge-backend
  # The Lightbridge chart's values (verbatim from the old flat app's
  # valuesObject — api + mcp components only; opa + usage + all DB
  # rawRessources removed; the DB resources moved to the lightbridge-db leaf).
