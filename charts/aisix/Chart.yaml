apiVersion: v2
name: aisix
description: >-
  api7/aisix — a Rust AI gateway deployed BEHIND Envoy AI Gateway as an upstream
  protocol adapter. Its one job in this platform is the `/v1/responses` →
  `/v1/chat/completions` bridge: OpenAI Responses-API clients (codex CLI) reach a
  chat-only upstream (DeepInfra) that has no Responses endpoint. EAIG keeps auth
  (Authorino), the distributed budget limiter, routing and metering; AISIX only
  translates the wire between EAIG and the provider. Runs in declarative
  `resources_file` mode (no etcd, admin listener off); the provider keys, models
  and caller keys come from ai-helm-values. Spike — see the chart README and
  ADORSYS-GIS/ai-helm-values#380.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - ai-gateway
  - responses-api
  - aisix
maintainers:
  - name: ai-helm

dependencies:
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common
