apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisix.fullname" . }}
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
{{- /*
  Render-time guards. Each of these is a mistake that renders as perfectly valid
  YAML and only shows up as a wedged drain, a pod that will not boot, or a
  duplicate env var Kubernetes silently resolves last-one-wins.
*/}}
{{- if le (int .Values.terminationGracePeriodSeconds) (int .Values.shutdown.minDrainSecs) }}
{{- fail (printf "aisix: terminationGracePeriodSeconds (%v) must exceed shutdown.minDrainSecs (%v) — otherwise SIGKILL lands while AISIX is still deliberately accepting new connections. See values.yaml § Termination and draining." .Values.terminationGracePeriodSeconds .Values.shutdown.minDrainSecs) }}
{{- end }}
{{- $callerEnv := .Values.callerKey.envName }}
{{- range .Values.envFromSecrets }}
{{- if not (and .env .name .key) }}{{ fail (printf "aisix: envFromSecrets entry %v needs all three of env/name/key" .) }}{{ end }}
{{- if eq .env $callerEnv }}{{ fail (printf "aisix: envFromSecrets must not define %s — the chart wires it from .Values.callerKey, which also owns the Secret" $callerEnv) }}{{ end }}
{{- if hasPrefix "AISIX_" .env }}{{ fail (printf "aisix: %s is a RESERVED name — AISIX layers every AISIX_* variable onto config.yaml as a deserialisation override, so this would change (or refuse) the gateway's boot config, not feed resources.yaml" .env) }}{{ end }}
{{- end }}
{{- range .Values.env }}
{{- if eq .name $callerEnv }}{{ fail (printf "aisix: env must not define %s — the chart wires it from .Values.callerKey" $callerEnv) }}{{ end }}
{{- if hasPrefix "AISIX_" .name }}{{ fail (printf "aisix: %s is a RESERVED name (AISIX_* overrides config.yaml)" .name) }}{{ end }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /*
    maxUnavailable: 0 + maxSurge: 1 — surge-then-retire. A replacement pod must
    clear the startup gate (:9090/status/ready) and readiness (:3000/readyz)
    before its predecessor is signalled, so the served capacity during a roll is
    replicaCount..replicaCount+1 and never dips. This is the half of "zero
    failed requests during a deploy" that the chart controls; the drain window
    below is the other half.
  */}}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "aisix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # AISIX re-reads resources.yaml only on SIGHUP and never re-reads
        # config.yaml, so a ConfigMap edit alone changes nothing in a running
        # pod. Roll it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        checksum/resources: {{ include (print $.Template.BasePath "/configmap-resources.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aisix.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # AISIX talks to no Kubernetes API.
      automountServiceAccountToken: false
      {{- /*
        ⚠️ LOAD-BEARING, found by a live CrashLoopBackOff on the first sync:
            Error: config load failed: failed to load configuration: deserialize:
            unknown field `port`, expected one of `etcd`, `resources_file`, `proxy`, …

        AISIX's `Config::load_from_path` layers EVERY `AISIX_*` environment
        variable on top of the YAML as a deserialisation override (that is the
        documented mechanism, and it is why the image's own entrypoint has to
        `unset AISIX_CONFIG_PATH` before exec'ing the binary). Kubernetes' legacy
        docker-link service variables inject exactly that shape for every Service
        in the namespace — and this chart's Service is named `aisix`, so the pod
        gets `AISIX_PORT=tcp://10.x.x.x:3000`, `AISIX_SERVICE_HOST`,
        `AISIX_PORT_3000_TCP`, … The loader reads `AISIX_PORT` as a top-level
        field `port`, which does not exist, and the process refuses to boot.

        Turning the links off is the fix: nothing here consumes them (every
        upstream is addressed by DNS), and no amount of chart config can make the
        collision safe while the Service keeps the name the EAIG Backend
        (`aisix.converse.svc.cluster.local`) depends on.
      */}}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aisix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: proxy
              containerPort: {{ .Values.ports.proxy }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          env:
            {{- /*
              The caller key is wired from `callerKey`, not from the overridable
              `envFromSecrets` list: this chart MINTS that Secret (see the
              ExternalSecret), so it also owns the env var. A values file that
              replaces `envFromSecrets` wholesale — which is what ai-helm-values
              does once every backend has an entry — therefore cannot drop the
              one credential without which no caller can authenticate at all.
            */}}
            - name: {{ .Values.callerKey.envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.callerKey.secretName }}
                  key: {{ .Values.callerKey.secretKey }}
            {{- range .Values.envFromSecrets }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- /*
            /livez and /readyz are served on the PROXY listener (see the comment
            in crates/aisix-server/src/main.rs around the accept loop). They
            answer different questions and are wired to different probes on
            purpose:
              livez  — "should this instance be RESTARTED?" Stays 200 through a
                       drain, so it must NOT be what withdraws traffic.
              readyz — "may traffic be routed here?" Flips to 503 the moment
                       SIGTERM lands, which is what empties the EndpointSlice
                       before the listener closes.
            The metrics listener's /status/ready is the third signal — it is
            503 until a resource snapshot has been applied — and is the right
            startup gate, because a pod that has not yet loaded resources.yaml
            would otherwise pass readyz and 404 every model.
          */}}
          startupProbe:
            httpGet:
              path: /status/ready
              port: metrics
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: proxy
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: proxy
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.podResources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/aisix/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: resources
              mountPath: /etc/aisix/resources
              readOnly: true
            # readOnlyRootFilesystem: the image's own /etc/aisix and
            # /var/lib/aisix are writable dirs it may touch; give it emptyDirs
            # rather than a writable root.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "aisix.fullname" . }}-config
        - name: resources
          configMap:
            name: {{ include "aisix.fullname" . }}-resources
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Spread the replicas across hosts. PREFERRED, not required: a required
        rule makes replica 2 unschedulable as soon as the cluster has fewer
        schedulable workers than replicas, and it also deadlocks the surge step
        of a `maxUnavailable: 0` roll on a small cluster — the new pod has
        nowhere to go while both old pods still hold their nodes. Preferred
        spreads whenever it can and degrades to co-location rather than to a
        stuck rollout. `.Values.affinity` REPLACES this outright when set.
      */}}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "aisix.selectorLabels" . | nindent 20 }}
        {{- end }}
