{{- /*
The caller key EAIG presents to AISIX.

Unlike every other credential in this platform this one has NO upstream source:
it exists only between two in-cluster components, so there is nothing to store
in AWS Secrets Manager and nothing to rotate out-of-band. ESO's `Password`
generator mints it in-cluster; the ExternalSecret materialises it into Secret
`{{ .Values.callerKey.secretName }}` under data key `{{ .Values.callerKey.secretKey }}`.

That ONE Secret has two consumers:
  1. this chart's Deployment  → env `CALLER_API_KEY`, which resources.yaml's
     `api_keys[].key_env` hashes into `key_hash` at load time;
  2. ai-helm-values' `aisix-01` BackendSecurityPolicy (type APIKey), whose
     `secretRef.name` is the same Secret — the backends chart already reads the
     `apiKey` data key.
Neither side ever sees a plaintext key in git.

`refreshInterval: "0"` — the ExternalSecret CRD documents this verbatim as
"May be set to 0s to fetch and create it once" (ESO v2.10.0). It is required
here, not an optimisation: a generator-backed ExternalSecret on a live interval
re-runs the generator and rewrites the Secret every interval, which would rotate
the credential out from under the running EAIG policy. Rotation is deliberate:
delete the Secret and ESO regenerates on the next reconcile of this
ExternalSecret (see the chart README).

`secretKeys` on the generator is what puts the value under `apiKey` rather than
the generator's default `password` key, so `dataFrom` can be used as-is with no
`rewrite` block.
*/ -}}
{{- $ck := .Values.callerKey -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "aisix.fullname" . }}-caller-key
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
spec:
  length: {{ $ck.password.length }}
  digits: {{ $ck.password.digits }}
  symbols: {{ $ck.password.symbols }}
  noUpper: {{ $ck.password.noUpper }}
  allowRepeat: {{ $ck.password.allowRepeat }}
  secretKeys:
    - {{ $ck.secretKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $ck.secretName }}
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $ck.refreshInterval | quote }}
  target:
    name: {{ $ck.secretName }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "aisix.fullname" . }}-caller-key
