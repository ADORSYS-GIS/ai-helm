# Representative render — mirrors what ai-helm-values sends from
# environments/prod/values/aisix.yaml for the Responses-bridge spike
# (ADORSYS-GIS/ai-helm-values#380). Kept in the chart so CI renders the
# populated branch, not just the empty defaults.
#
# The rendered resources.yaml from THIS file is the one validated against the
# real binary: `aisix validate --resources` inside ghcr.io/api7/aisix:1.0.0.
resources:
  providerKeys:
    - display_name: deepinfra-01
      provider: openai
      adapter: openai
      api_base: https://api.deepinfra.com/v1/openai
      api_key: ${DEEPINFRA_API_KEY}
      # Present but WITHOUT `responses` → AISIX bridges /v1/responses to
      # /v1/chat/completions instead of forwarding it (and getting a 404 from
      # DeepInfra, which has no Responses endpoint). Deleting this map is the
      # single change that would silently break the whole spike.
      apis: {}

  models:
    - display_name: deepseek-v4-flash-aisix
      provider: openai
      # File-only sugar: a provider-key NAME, resolved to provider_key_id.
      provider_key: deepinfra-01
      model_name: deepseek-ai/DeepSeek-V4-Flash-0731

  apiKeys:
    - display_name: eaig
      # File-only sugar: the NAME of an env var holding the plaintext bearer;
      # AISIX hashes it to key_hash (SHA-256) at load time and drops it.
      key_env: CALLER_API_KEY
      allowed_models:
        - deepseek-v4-flash-aisix
