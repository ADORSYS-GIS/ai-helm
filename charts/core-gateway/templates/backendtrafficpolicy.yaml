{{- $btp := .Values.backendTrafficPolicy | default dict -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "core-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "core-gateway.fullname" . }}
  {{- with $btp.loadBalancer }}
  loadBalancer:
    type: {{ .type }}
  {{- end }}
  {{- with $btp.circuitBreaker }}
  circuitBreaker:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $btp.outlierDetection }}
  # Outlier detection = Envoy Gateway's passive health check.
  healthCheck:
    passive:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with $btp.tcpKeepalive }}
  tcpKeepalive:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $btp.compression }}
  compression:
    {{- range . }}
    - type: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $btp.requestTimeout }}
  # Whole-request ceiling for routes governed by THIS gateway-wide policy
  # (non-model routes — model routes carry their own per-model BTP that replaces
  # this one). ADR-0034.
  timeout:
    http:
      requestTimeout: {{ . | quote }}
  {{- end }}
  {{- /* ── Shared cross-model monthly budget (#532) ──────────────────────────
     ONE gateway-scoped, `shared: true` counter per (x-account-id, x-billing-plan)
     that spans EVERY model route — the fix for budgets being enforced per-model
     (a heavy user held ~29 separate per-model counters, so the real cap was
     $30 × models). Lives on THIS gateway-wide policy because `shared: true` keys
     the bucket by policy name, so it only collapses to one bucket when the rule
     is on a single policy (not the 28 per-model BTPs). The per-model BTPs merge
     with this one via `mergeType: StrategicMerge` (charts/ai-model) to keep their
     per-model burst + timeout while inheriting this shared budget.

     ⚠️ REQUIRES Envoy Gateway ≥ v1.8.2. On v1.8.1 (bug envoyproxy/gateway#9244) a
     rule that is BOTH `shared: true` AND cost-bearing drops the per-request cost
     → the counter ticks +1/req instead of +micro-USD → budget effectively
     UNLIMITED (worse than per-model). `monthlyBudget.enabled` defaults false;
     flip it (and ai-model `sharedBudget.enabled`) TOGETHER only after the upgrade.

     ADR-0111: the key also includes x-billing-period, a calendar "YYYY-MM"
     marker this chart's Lua EnvoyExtensionPolicy (envoyextensionpolicy-billing-
     period.yaml) stamps on every request. That marker — NOT the `unit` below —
     is what makes the budget roll over on the 1st of each calendar month.

     ⚠️ ADR-0112: `unit` is deliberately `Year`, and MUST NOT be "corrected"
     back to `Month`. Lyft/Envoy append their own window epoch
     (`floor(now/unit_seconds)*unit_seconds`) to every Redis key, so the counter
     rotates whenever EITHER the period marker OR that epoch changes. `Month`
     (2,592,000s = 30 days, NOT a calendar month) rotates on a drifting 30-day
     grid — e.g. 2026-08-05, mid-month — handing every account a spurious extra
     budget on top of the intended 1st-of-month reset, ~12× a year. `Year`
     (31,536,000s) is the longest unit the CRD enum allows, so the epoch holds
     still for a full year and the period marker is left as the sole rotation
     trigger. The unit is now only a TTL: `requests` below stays the MONTHLY
     budget and is NOT multiplied by 12. One residual epoch rollover remains
     (~2026-12-18, then annually) — a known, documented limitation.

     ADR-0119: a second, additive WEEKLY sub-budget rule (per plan, opt-in via
     `weeklyBudgetUsd`) renders after the monthly rules below, in the same
     shared/cross-model shape, keyed on x-billing-week (ISO-8601 Monday-start,
     same Lua block) instead of x-billing-period. It composes (AND) with the
     monthly rule to stop a user front-loading the whole month's budget in a
     few days — it never raises the monthly ceiling, only tightens pacing
     within a week. See that rule's own comment below for the render-order
     reasoning (append-only, ADR-0084).
  */ -}}
  {{- with $btp.monthlyBudget }}
  {{- if .enabled }}
  rateLimit:
    type: Global
    global:
      rules:
        {{- /* ⚠️ `plans` is an ORDERED LIST, not a map — the index below becomes the
               `rule/N` in the Lyft ratelimit Redis key, and the plan name is masked
               (Exact match ⇒ constant), so the index is the only carrier of plan
               identity. A map was sorted by Helm, so inserting a plan renumbered the
               existing ones and orphaned their counters (2026-07-16 incident, ADR-0084).
               APPEND ONLY — never reorder, insert, or remove an entry. */ -}}
        {{- range $i, $plan := .plans }}
        {{- if not $plan.id }}{{ fail (printf "core-gateway monthlyBudget.plans[%d]: `id` is required (plans is an ordered list of {id, monthlyBudgetUsd}, not a map — see values.yaml)" $i) }}{{ end }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  # ADR-0111: calendar billing-month marker (stamped by the Lua
                  # EnvoyExtensionPolicy in this chart) folded into the key so
                  # the counter rotates on the 1st. This — not `unit` — is the
                  # real monthly boundary; see the ADR-0112 note in the header.
                  name: x-billing-period
                  type: Distinct
          limit:
            requests: {{ mulf $plan.monthlyBudgetUsd 1000000.0 | int64 }} # rule/{{ $i }} · {{ $plan.id }} shared MONTHLY budget ${{ $plan.monthlyBudgetUsd }} across ALL models (unit is a TTL only — do NOT scale by 12)
            # ADR-0112: `Year` is deliberate — see the header note. Reverting to
            # `Month` reintroduces spurious mid-month budget resets.
            unit: Year
          # The lever (#9244): keyed by policy, shared across every route/model.
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_custom_total_cost
        {{- end }}
        {{- /* ── Weekly sub-budget (ADR-0119) — additive, NOT a replacement ──
           Same shared cross-model shape as the monthly rule above, but keyed
           on x-billing-week (an ISO-8601 Monday-start "GGGG-Www" marker,
           stamped by the SAME Lua block that stamps x-billing-period) instead
           of x-billing-period, with its own tighter weeklyBudgetUsd limit.
           Composed (AND) with the monthly rule: a request is denied if EITHER
           bucket is exhausted, so this only ever tightens the effective cap
           within a week — the monthly ceiling above is completely unchanged.

           Rendered as a SECOND, independent pass over the SAME .plans list,
           strictly AFTER the monthly loop above, so it only ever APPENDS new
           rule-index slots and never shifts a monthly rule's index (the
           ADR-0084 append-only contract). Per plan, opt-in via
           weeklyBudgetUsd — omit it and no weekly rule renders for that plan.
        */ -}}
        {{- range $i, $plan := .plans }}
        {{- with $plan.weeklyBudgetUsd }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  # ADR-0119: ISO-8601 Monday-start week marker, stamped by the
                  # same Lua EnvoyExtensionPolicy as x-billing-period.
                  name: x-billing-week
                  type: Distinct
          limit:
            requests: {{ mulf . 1000000.0 | int64 }} # weekly-rule/{{ $i }} · {{ $plan.id }} shared WEEKLY budget ${{ . }} across ALL models (unit is a TTL only — do NOT scale)
            # ADR-0112's reasoning applies identically here: Year holds the
            # window epoch still for far longer than a week, so x-billing-week
            # is the sole rotation trigger. Do not "correct" this to Week —
            # the CRD enum doesn't even offer it, and Month/Day reintroduce
            # the same drifting-epoch defect ADR-0112 fixed for the monthly rule.
            unit: Year
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_custom_total_cost
        {{- end }}
        {{- end }}
  {{- end }}
  {{- end }}
  connection:
    bufferLimit: {{ $btp.bufferLimit | default "100Mi" | quote }}
  retry:
    numRetries: {{ (default dict $btp.retry).numRetries | default 1 }}
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 10s
      # 300s default (ADR-0034): a single try must outlast a long generation —
      # the hardcoded 30s cut them. Configurable via retry.perRetryTimeout.
      timeout: {{ (default dict $btp.retry).perRetryTimeout | default "300s" }}
    retryOn:
      httpStatusCodes:
        - 500
        - 502
        - 503
        - 504
      triggers:
        - connect-failure
        - retriable-status-codes
