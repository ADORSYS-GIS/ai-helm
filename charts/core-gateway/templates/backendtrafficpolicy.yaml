{{- $btp := .Values.backendTrafficPolicy | default dict -}}
{{- $mb := $btp.monthlyBudget | default dict -}}
{{- $rl := $btp.rateLimit | default dict -}}
{{- /* Requests/minute per (API-key id × model) and per (account id × model) — see
       the § "Request-rate rules" block further down for the whole rationale. `0`
       (the chart default) renders no rule. */ -}}
{{- $rpm := int64 ($rl.perKeyModelRpm | default 0) -}}
{{- if lt $rpm 0 }}{{ fail (printf "core-gateway rateLimit.perKeyModelRpm: must be >= 0, got %d" $rpm) }}{{ end }}
{{- /* `rateLimit.global.rules` is a REQUIRED, minItems-1 list in the
       BackendTrafficPolicy CRD, so emitting the block with an empty list gets the
       WHOLE policy rejected by the API server — which would take this gateway's
       timeout / retry / loadBalancer / circuitBreaker down with it, a far bigger
       blast radius than the rate limits themselves. Both rule families are
       independently optional (the cost buckets have rendered nothing since
       ai-helm-values#427), so decide up front whether ANY rule renders and omit
       the block entirely when none does. Same guard as charts/ai-model. */ -}}
{{- $hasRules := or (and $mb.enabled (gt (len ($mb.plans | default list)) 0)) (gt $rpm 0) -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "core-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "core-gateway.fullname" . }}
  {{- with $btp.loadBalancer }}
  loadBalancer:
    type: {{ .type }}
  {{- end }}
  {{- with $btp.circuitBreaker }}
  circuitBreaker:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $btp.outlierDetection }}
  # Outlier detection = Envoy Gateway's passive health check.
  healthCheck:
    passive:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with $btp.tcpKeepalive }}
  tcpKeepalive:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $btp.compression }}
  compression:
    {{- range . }}
    - type: {{ . }}
    {{- end }}
  {{- end }}
  {{- with $btp.requestTimeout }}
  # Whole-request ceiling for routes governed by THIS gateway-wide policy
  # (non-model routes — model routes carry their own per-model BTP that replaces
  # this one). ADR-0034.
  timeout:
    http:
      requestTimeout: {{ . | quote }}
  {{- end }}
  {{- /* ── THIS POLICY'S `rateLimit` BLOCK HAS TWO INDEPENDENT RULE FAMILIES ──
     1. the shared cross-model COST buckets (`monthlyBudget`, immediately below).
        ⚠️ They render for NOBODY on the live fleet: ai-helm-values#427 deleted
        `backendTrafficPolicy.monthlyBudget` from `environments/prod/values/
        core-gateway.yaml` on 2026-09-05, because a plan bucket that knew nothing
        about the ledger made the effective cap `min(plan bucket, ledger)` and a
        refill could not clear a spent bucket. The logic is kept, unchanged.
     2. the REQUEST-RATE rules (`rateLimit.perKeyModelRpm`), rendered strictly
        after them — see the § "Request-rate rules" comment further down. Those
        ARE live, and they are what stops spam now that (1) is gone.
     Both are optional; `$hasRules` at the top of this file drops the whole
     `rateLimit:` block when neither renders (the CRD's list is minItems-1).

     ── Shared cross-model monthly budget (#532) ──────────────────────────
     ONE gateway-scoped, `shared: true` counter per (x-account-id, x-billing-plan)
     that spans EVERY model route — the fix for budgets being enforced per-model
     (a heavy user held ~29 separate per-model counters, so the real cap was
     $30 × models). Lives on THIS gateway-wide policy because `shared: true` keys
     the bucket by policy name, so it only collapses to one bucket when the rule
     is on a single policy (not the 28 per-model BTPs). The per-model BTPs merge
     with this one via `mergeType: StrategicMerge` (charts/ai-model) to keep their
     per-model burst + timeout while inheriting this shared budget.

     ⚠️ REQUIRES Envoy Gateway ≥ v1.8.2. On v1.8.1 (bug envoyproxy/gateway#9244) a
     rule that is BOTH `shared: true` AND cost-bearing drops the per-request cost
     → the counter ticks +1/req instead of +micro-USD → budget effectively
     UNLIMITED (worse than per-model). `monthlyBudget.enabled` defaults false;
     flip it (and ai-model `sharedBudget.enabled`) TOGETHER only after the upgrade.

     ADR-0111: the key also includes x-billing-period, a calendar "YYYY-MM"
     marker this chart's Lua EnvoyExtensionPolicy (envoyextensionpolicy-billing-
     period.yaml) stamps on every request. That marker — NOT the `unit` below —
     is what makes the budget roll over on the 1st of each calendar month.

     ⚠️ ADR-0112: `unit` is deliberately `Year`, and MUST NOT be "corrected"
     back to `Month`. Lyft/Envoy append their own window epoch
     (`floor(now/unit_seconds)*unit_seconds`) to every Redis key, so the counter
     rotates whenever EITHER the period marker OR that epoch changes. `Month`
     (2,592,000s = 30 days, NOT a calendar month) rotates on a drifting 30-day
     grid — e.g. 2026-08-05, mid-month — handing every account a spurious extra
     budget on top of the intended 1st-of-month reset, ~12× a year. `Year`
     (31,536,000s) is the longest unit the CRD enum allows, so the epoch holds
     still for a full year and the period marker is left as the sole rotation
     trigger. The unit is now only a TTL: `requests` below stays the MONTHLY
     budget and is NOT multiplied by 12. One residual epoch rollover remains
     (~2026-12-18, then annually) — a known, documented limitation.

     ADR-0119: a second, additive WEEKLY sub-budget rule (per plan, opt-in via
     `weeklyBudgetUsd`) renders after the monthly rules below, in the same
     shared/cross-model shape, keyed on x-billing-week (ISO-8601 Monday-start,
     same Lua block) instead of x-billing-period. It composes (AND) with the
     monthly rule to stop a user front-loading the whole month's budget in a
     few days — it never raises the monthly ceiling, only tightens pacing
     within a week. See that rule's own comment below for the render-order
     reasoning (append-only, ADR-0084).
  */ -}}
  {{- if $hasRules }}
  rateLimit:
    type: Global
    global:
      rules:
        {{- with $mb }}
        {{- if and .enabled (gt (len (.plans | default list)) 0) }}
        {{- /* ⚠️ `plans` is an ORDERED LIST, not a map — the index below becomes the
               `rule/N` in the Lyft ratelimit Redis key, and the plan name is masked
               (Exact match ⇒ constant), so the index is the only carrier of plan
               identity. A map was sorted by Helm, so inserting a plan renumbered the
               existing ones and orphaned their counters (2026-07-16 incident, ADR-0084).
               APPEND ONLY — never reorder, insert, or remove an entry. */ -}}
        {{- range $i, $plan := .plans }}
        {{- if not $plan.id }}{{ fail (printf "core-gateway monthlyBudget.plans[%d]: `id` is required (plans is an ordered list of {id, monthlyBudgetUsd}, not a map — see values.yaml)" $i) }}{{ end }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  # ADR-0111: calendar billing-month marker (stamped by the Lua
                  # EnvoyExtensionPolicy in this chart) folded into the key so
                  # the counter rotates on the 1st. This — not `unit` — is the
                  # real monthly boundary; see the ADR-0112 note in the header.
                  name: x-billing-period
                  type: Distinct
          limit:
            requests: {{ mulf $plan.monthlyBudgetUsd 1000000.0 | int64 }} # rule/{{ $i }} · {{ $plan.id }} shared MONTHLY budget ${{ $plan.monthlyBudgetUsd }} across ALL models (unit is a TTL only — do NOT scale by 12)
            # ADR-0112: `Year` is deliberate — see the header note. Reverting to
            # `Month` reintroduces spurious mid-month budget resets.
            unit: Year
          # The lever (#9244): keyed by policy, shared across every route/model.
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_custom_total_cost
        {{- end }}
        {{- /* ── Weekly sub-budget (ADR-0119) — additive, NOT a replacement ──
           Same shared cross-model shape as the monthly rule above, but keyed
           on x-billing-week (an ISO-8601 Monday-start "GGGG-Www" marker,
           stamped by the SAME Lua block that stamps x-billing-period) instead
           of x-billing-period, with its own tighter weeklyBudgetUsd limit.
           Composed (AND) with the monthly rule: a request is denied if EITHER
           bucket is exhausted, so this only ever tightens the effective cap
           within a week — the monthly ceiling above is completely unchanged.

           Rendered as a SECOND, independent pass over the SAME .plans list,
           strictly AFTER the monthly loop above, so it only ever APPENDS new
           rule-index slots and never shifts a monthly rule's index (the
           ADR-0084 append-only contract). Per plan, opt-in via
           weeklyBudgetUsd — omit it and no weekly rule renders for that plan.
        */ -}}
        {{- range $i, $plan := .plans }}
        {{- with $plan.weeklyBudgetUsd }}
        - clientSelectors:
            - headers:
                - invert: false
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-billing-plan
                  type: Exact
                  value: {{ $plan.id | quote }}
                - invert: false
                  # ADR-0119: ISO-8601 Monday-start week marker, stamped by the
                  # same Lua EnvoyExtensionPolicy as x-billing-period.
                  name: x-billing-week
                  type: Distinct
          limit:
            requests: {{ mulf . 1000000.0 | int64 }} # weekly-rule/{{ $i }} · {{ $plan.id }} shared WEEKLY budget ${{ . }} across ALL models (unit is a TTL only — do NOT scale)
            # ADR-0112's reasoning applies identically here: Year holds the
            # window epoch still for far longer than a week, so x-billing-week
            # is the sole rotation trigger. Do not "correct" this to Week —
            # the CRD enum doesn't even offer it, and Month/Day reintroduce
            # the same drifting-epoch defect ADR-0112 fixed for the monthly rule.
            unit: Year
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_custom_total_cost
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- /* ── § Request-rate rules — requests/min per (identity × model) ──────
           Owner ruling 2026-09-06: *"a rate limit per api-key id and per model
           would be enough, so that spamming is avoided — no cost hit, no tier."*

           WHY THIS EXISTS. ai-helm-values#427 (2026-09-05) deleted the monthly
           and weekly cost buckets, which were the last rules on this policy —
           every per-model `burst:` family had already been commented out
           fleet-wide on 2026-08-01, and `tiers`/`projectEnvelope` are still
           empty. From that commit this gateway had NO rate limit of any kind:
           spend is bounded by the Dynamic Budget Limiter's ledger, *after the
           fact*, at 402 — request rate was bounded by nothing. These two rules
           put a request-count ceiling back, and nothing else.

           WHAT IT IS DELIBERATELY NOT.
           • No `cost:` block. The default request cost is 1, so the counter
             counts REQUESTS, not micro-USD. `min(plan bucket, ledger)` — the
             bug #427 existed to remove — cannot come back through this door: a
             refusal here is about request RATE and a refill neither clears it
             nor is blocked by it.
           • No plan / tier descriptor. `x-billing-plan` is not in either key, so
             this is one flat ceiling for everybody. Introducing a per-plan rule
             would re-arm the ADR-0084 ordered-list hazard for no product reason.
           • No period marker, and `unit: Minute` is the plain, correct unit.
             ADR-0111/0112's `x-billing-period` + `unit: Year` trick exists ONLY
             because a CALENDAR-month budget cannot be expressed by Lyft's window
             epoch (`Month` = 2 592 000 s = 30 drifting days). A per-minute window
             is exactly what `Minute` means, so the epoch rotating every 60 s is
             the feature, not the defect. Do NOT copy the Year/marker pattern here.

           ONE GATEWAY-SCOPED RULE PAIR, NOT PER-MODEL BTP RULES. The model is
           already a first-class descriptor: Envoy AI Gateway stamps
           `x-ai-eg-model` on every model request (it is what the per-model BTPs'
           own burst families match on), so `type: Distinct` on that header gives
           "per model" without touching the 28 per-model policies. Putting it
           there instead would mean 28 copies of the same number, 28 chances to
           drift, and — because `charts/ai-model` renders its plan rules from an
           ordered `plans` list — a new rule family competing for indices with
           ADR-0084's append-only contract. Here there is exactly one place to
           read the number and one place to change it. The rules reach model
           routes because `sharedBudget.enabled` makes each per-model BTP
           `mergeType: StrategicMerge` against this policy rather than override
           it — the same path the deleted cost buckets used to produce their 429s.

           `shared: true`, so the Lyft/Redis counter is keyed by POLICY name and
           collapses to ONE bucket across every route. Without it Envoy Gateway
           namespaces the counter per route, which would silently add a second,
           invisible dimension to a key whose model dimension is already
           explicit. The EG ≥ v1.8.2 requirement noted for the cost buckets
           (envoyproxy/gateway#9244: `shared` + `cost` drops the per-request
           cost) cannot bite a rule that carries no `cost` at all.

           TWO RULES, SO NO PLANE IS UNLIMITED. `x-api-key-id` is stamped by the
           public AuthConfig from the `api_key_id` claim, and is a constant `""`
           on the internal AuthConfig (LibreChat / LCI / k8s SAs) and empty for
           GitHub-Actions repobinding tokens, which carry no API key. An Envoy
           header descriptor does not generate for an absent-or-empty header, so
           a rule keyed only on `x-api-key-id` would leave those planes
           completely unlimited. `x-account-id` IS stamped on every plane, so
           the second rule — same limit, same unit — is the floor under all of
           them. On the public plane both rules match and compose (AND) at the
           same number, which is a no-op in practice: one API key belongs to one
           account, so the account bucket cannot be exhausted before the key one
           unless the account holds several keys — exactly when it should be.

           RENDER ORDER: strictly AFTER the cost rules above, deliberately. If
           `monthlyBudget` is ever re-enabled it takes indices 0..N as it always
           did and these two shift — and a shifted per-MINUTE counter costs at
           most 60 seconds of allowance, whereas a shifted per-MONTH cost counter
           is the ADR-0084 incident. Ordering the risk this way round is the
           whole point.
        */ -}}
        {{- if gt $rpm 0 }}
        - clientSelectors:
            - headers:
                - invert: false
                  # The API key's own id (`api_key_id` claim → x-api-key-id in
                  # the AuthConfig's success headers). Absent/"" ⇒ no descriptor
                  # ⇒ this rule does not fire; the x-account-id rule below is
                  # what covers those planes.
                  name: x-api-key-id
                  type: Distinct
                - invert: false
                  # Stamped by Envoy AI Gateway on every model request. Distinct,
                  # so each model gets its own bucket for the same key.
                  name: x-ai-eg-model
                  type: Distinct
          limit:
            requests: {{ $rpm }} # rpm-rule/0 · {{ $rpm }} req/min per (API-key id × model). NO cost block ⇒ +1 per request.
            unit: Minute
          shared: true
        - clientSelectors:
            - headers:
                - invert: false
                  # Stamped on EVERY plane (public, internal, repobinding), so
                  # this rule is the floor nothing falls through.
                  name: x-account-id
                  type: Distinct
                - invert: false
                  name: x-ai-eg-model
                  type: Distinct
          limit:
            requests: {{ $rpm }} # rpm-rule/1 · {{ $rpm }} req/min per (account id × model). NO cost block ⇒ +1 per request.
            unit: Minute
          shared: true
        {{- end }}
  {{- end }}
  connection:
    bufferLimit: {{ $btp.bufferLimit | default "100Mi" | quote }}
  retry:
    numRetries: {{ (default dict $btp.retry).numRetries | default 1 }}
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 10s
      # 300s default (ADR-0034): a single try must outlast a long generation —
      # the hardcoded 30s cut them. Configurable via retry.perRetryTimeout.
      timeout: {{ (default dict $btp.retry).perRetryTimeout | default "300s" }}
    retryOn:
      httpStatusCodes:
        - 500
        - 502
        - 503
        - 504
      triggers:
        - connect-failure
        - retriable-status-codes
