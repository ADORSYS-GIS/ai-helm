{{- /*
⚠️ EG allows exactly ONE EnvoyExtensionPolicy per targetRef. A second policy
targeting the same Gateway (this is what ai-helm#900 originally shipped, as
its own envoyextensionpolicy-redact.yaml) is REJECTED outright —
`status.ancestors[].conditions`: `Accepted: False, reason: Conflicted,
message: "Unable to target Gateway core-gateway, another EnvoyExtensionPolicy
has already attached to it"` — not merged, not queued, just never wired into
the filter chain. Caught live 2026-08-03: a bare `ghp_` token sent to the
public gateway came back fully analysed, unblocked, because the ext_proc
filter this policy's `extProc` block below adds was never attached at all.
Every extension for this Gateway (Lua, ext_proc, any future one) MUST live
in this ONE resource. Do not split a new extension into its own
EnvoyExtensionPolicy file again — verify this constraint against the
CRD/controller behaviour before assuming otherwise.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ include "core-gateway.fullname" . }}-billing-period
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "core-gateway.fullname" . }}
  lua:
    - type: Inline
      # ADR-0111: Envoy Gateway's rate-limit `unit: Month` is a fixed 30-day
      # (2,592,000s) epoch window, not a calendar month, and never resets on
      # the 1st. Stamping a calendar billing-period marker folds it into every
      # monthly-budget rate-limit key (see backendtrafficpolicy.yaml in this
      # chart and in charts/ai-model), so a fresh key is used starting every
      # 1st of the month and the old one just ages out on its own TTL.
      # Runs strictly before the rate-limit filter (Envoy Gateway's own fixed
      # HTTP filter order: Lua < RateLimit), confirmed in ADR-0111.
      #
      # ADR-0119: the SAME function also stamps an ISO-8601, Monday-start week
      # marker for the additive weekly sub-budget (backendtrafficpolicy.yaml
      # in this chart). Must live in this one function — EG rejects a second
      # EnvoyExtensionPolicy on the same Gateway (see the file header note).
      # `%G` (ISO week-numbering year) is used instead of `%Y` (Gregorian
      # year) so a week spanning a year boundary doesn't key against the
      # wrong year — e.g. 2027-01-01 is ISO week 53 of 2026.
      inline: |
        function envoy_on_request(request_handle)
          request_handle:headers():replace("x-billing-period", os.date("!%Y-%m"))
          request_handle:headers():replace("x-billing-week", os.date("!%G-W%V"))
        end
    # ADR-0133: per-project model-allowlist enforcement — the DOWNSTREAM half of the
    # split ai-helm-values#288 made, tracked as ai-helm-values#292. Authorino resolves
    # `model_policy` and publishes `x-model-policy` / `x-allowed-models` on every
    # request but applies neither; this filter is the consumer that tests list
    # membership against the model the AI Gateway's ext_proc extracted into
    # `x-ai-eg-model`. Until it shipped, `allowlist` mode was published-but-unenforced.
    #
    # A SECOND LIST ENTRY — not a second EnvoyExtensionPolicy (the file header explains
    # why that is rejected), and deliberately not merged into the function above. EG
    # renders each `lua` entry as its own envoy.filters.http.lua filter, ordered
    # `12 + index` (internal/xds/translator/httpfilters.go, newOrderedHTTPFilter,
    # v1.8.2). So this is filter order 13 and billing-period is 12; both land after
    # ext_authz (order 5 — Authorino, which is what stamps the two policy headers) and
    # after the AI Gateway's own ext_proc, which is injected ahead of that table
    # entirely. The header constraint is one POLICY per targetRef, not one script, so
    # two unrelated concerns stay in two files.
    #
    # The script is `.Files.Get`-ed from charts/core-gateway/files/model-policy.lua
    # rather than inlined, so the exact bytes that deploy are the exact bytes that can
    # be replayed against a real Envoy (the PR's verification harness does exactly
    # that). Read that file for the full decision table, the fail-closed rules and the
    # anti-spoofing mechanism.
    - type: Inline
      inline: |-
        {{- .Files.Get "files/model-policy.lua" | nindent 8 }}
    {{- /*
    lightbridge-authz ADR-0034 (lightbridge-authz#658): the Dynamic Budget Limiter's enforcement
    half. Authorino publishes the account's live ledger balance as ext_authz dynamic metadata (an
    AuthConfig `metadata` step against authz-budget's mTLS-only `GET /budget/v1/remaining`); this
    filter reads it and answers 402 `budget_exhausted` when nothing is left. Read
    charts/core-gateway/files/budget-limiter.lua for the full decision table, the fail-closed
    rules, and why dynamic metadata rather than a header.

    A THIRD list entry, for the same reason model-policy is the second: EG rejects a second
    EnvoyExtensionPolicy on this Gateway (see the file header note). Each `lua` entry renders as
    its own filter at order `12 + index`, so this is filter 14 — after ext_authz (5, Authorino,
    which is what publishes the metadata) and after the two existing scripts.

    GATED, and the gate defaults OFF. A Helm comment, not a YAML one, deliberately: with
    `budgetLimiter.enabled: false` (the chart default, and prod today) this whole block must
    render NOTHING — a rendered comment is still a rendered diff, and the claim this change makes
    is that prod's manifests are unchanged until someone sets the value.

    Turning it on WITHOUT also adding the AuthConfig `metadata` + `dynamicMetadata` blocks in
    ai-helm-values would make every model request 503 — the two halves are enabled together, and
    `docs/runbooks/budget-limiter-rollout.md` (in ai-helm-values) sequences them.
    */}}
    {{- if .Values.budgetLimiter.enabled }}
    # lightbridge-authz ADR-0034: the Dynamic Budget Limiter's enforcement half. Reads the
    # account's live ledger balance out of Authorino's ext_authz dynamic metadata and answers 402
    # `budget_exhausted` when nothing is left. Script: charts/core-gateway/files/budget-limiter.lua.
    - type: Inline
      # The config table is prepended rather than templated INTO the script so the shipped .lua
      # stays byte-identical to what the test harness (tests/budget-limiter/) replays against a
      # real Envoy. Same idea as EG's own `filterContext`, which is only available for `ValueRef`
      # entries. The script defaults every field to its SAFEST value when the table is absent
      # (shadow ON), so a templating mistake cannot start refusing paid traffic.
      inline: |-
        BUDGET_LIMITER_CONFIG = {
          shadow = {{ .Values.budgetLimiter.shadowMode | ternary "true" "false" }},
          refill_url = {{ .Values.budgetLimiter.refillUrl | quote }},
        }
        {{- .Files.Get "files/budget-limiter.lua" | nindent 8 }}
    {{- end }}
  # ADR-0116: PII/credential redaction ext_proc filter. Merged into THIS
  # resource for the reason in the header comment above — it cannot be its
  # own EnvoyExtensionPolicy targeting the same Gateway. Gated on
  # redactExtproc.enabled (default true in values.yaml) — see envoy-proxy.yaml's own note
  # on the same gate — so this whole block, and not just the sidecar that
  # backs it, is a values-repo toggle.
  {{- if .Values.redactExtproc.enabled }}
  extProc:
    - backendRefs:
        - name: {{ include "core-gateway.fullname" . }}-redact-extproc
          kind: Backend
          group: gateway.envoyproxy.io
      # Explicit on purpose: the CRD's own documented default is to send
      # NEITHER headers nor body to the processor, which yields a filter
      # that is attached, healthy, and inspecting nothing (ADR-0116 flags
      # this as the same silent-no-op class as the `"n": 1` YAML-boolean
      # trap). Both modes are values, not literals, precisely because of
      # 2026-08-03: response body was flipped Streamed -> Buffered as an
      # emergency stopgap for a UTF-8 chunk-split bug (fixed properly
      # upstream in lightbridge-governance#47), and that flip had to wait
      # for an ai-helm chart release instead of shipping as an
      # ai-helm-values change. Defaults restore ADR-0116's original intent
      # — request Buffered (the redact engine's payload walker needs the
      # whole JSON body), response Streamed (see governance_redact::holdback
      # for why buffering a whole completion is the wrong latency trade).
      processingMode:
        request:
          body: {{ .Values.redactExtproc.processingMode.request.body | default "Buffered" }}
        response:
          body: {{ .Values.redactExtproc.processingMode.response.body | default "Streamed" }}
      messageTimeout: {{ .Values.redactExtproc.messageTimeout | default "200ms" }}
      # NOT a value, deliberately: matches decision 10 of the governance
      # roadmap and every profile's own `fail_closed` stance — an outage of
      # the redactor must fail the request, never silently forward
      # unscanned content. This is a safety invariant of the feature, not
      # workload config, the same way `project: ai` is hardcoded in
      # applications.yaml rather than made a per-app value.
      failOpen: false
  {{- end }}
