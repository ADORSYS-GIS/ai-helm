{{- /*
⚠️ EG allows exactly ONE EnvoyExtensionPolicy per targetRef. A second policy
targeting the same Gateway (this is what ai-helm#900 originally shipped, as
its own envoyextensionpolicy-redact.yaml) is REJECTED outright —
`status.ancestors[].conditions`: `Accepted: False, reason: Conflicted,
message: "Unable to target Gateway core-gateway, another EnvoyExtensionPolicy
has already attached to it"` — not merged, not queued, just never wired into
the filter chain. Caught live 2026-08-03: a bare `ghp_` token sent to the
public gateway came back fully analysed, unblocked, because the ext_proc
filter this policy's `extProc` block below adds was never attached at all.
Every extension for this Gateway (Lua, ext_proc, any future one) MUST live
in this ONE resource. Do not split a new extension into its own
EnvoyExtensionPolicy file again — verify this constraint against the
CRD/controller behaviour before assuming otherwise.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ include "core-gateway.fullname" . }}-billing-period
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "core-gateway.fullname" . }}
  lua:
    - type: Inline
      # ADR-0111: Envoy Gateway's rate-limit `unit: Month` is a fixed 30-day
      # (2,592,000s) epoch window, not a calendar month, and never resets on
      # the 1st. Stamping a calendar billing-period marker folds it into every
      # monthly-budget rate-limit key (see backendtrafficpolicy.yaml in this
      # chart and in charts/ai-model), so a fresh key is used starting every
      # 1st of the month and the old one just ages out on its own TTL.
      # Runs strictly before the rate-limit filter (Envoy Gateway's own fixed
      # HTTP filter order: Lua < RateLimit), confirmed in ADR-0111.
      inline: |
        function envoy_on_request(request_handle)
          request_handle:headers():replace("x-billing-period", os.date("!%Y-%m"))
        end
  # ADR-0116: PII/credential redaction ext_proc filter. Merged into THIS
  # resource for the reason in the header comment above — it cannot be its
  # own EnvoyExtensionPolicy targeting the same Gateway.
  extProc:
    - backendRefs:
        - name: {{ include "core-gateway.fullname" . }}-redact-extproc
          kind: Backend
          group: gateway.envoyproxy.io
      # Explicit on purpose: the CRD's own documented default is to send
      # NEITHER headers nor body to the processor, which yields a filter
      # that is attached, healthy, and inspecting nothing (ADR-0116 flags
      # this as the same silent-no-op class as the `"n": 1` YAML-boolean
      # trap). Request is Buffered — the whole JSON body arrives as one
      # message, matching what crates/governance-redact's payload walker
      # expects. Response is Streamed — see governance_redact::holdback for
      # why buffering the whole completion is the wrong latency trade.
      processingMode:
        request:
          body: Buffered
        response:
          body: Streamed
      messageTimeout: {{ .Values.redactExtproc.messageTimeout | default "200ms" }}
      # Matches decision 10 of the governance roadmap and every profile's
      # own `fail_closed` stance: an outage of the redactor must fail the
      # request, never silently forward unscanned content.
      failOpen: false
