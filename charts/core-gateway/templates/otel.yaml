{{- $tracesDebug := ((.Values.otelCollector | default dict).debug | default dict).traces | default dict -}}
{{- $tracesDebugEnabled := $tracesDebug.enabled | default false -}}
{{- $tracesDebugVerbosity := $tracesDebug.verbosity | default "basic" -}}
{{- $usageDebug := ((.Values.otelCollector | default dict).debug | default dict).usage | default dict -}}
{{- $usageDebugEnabled := $usageDebug.enabled | default false -}}
{{- $usageDebugVerbosity := $usageDebug.verbosity | default "basic" -}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "core-gateway.fullname" . }}-traces
  namespace: {{ .Release.Namespace }}
spec:
  # REQUIRED: the otel-operator v1beta1 webhook rejects a collector with an
  # empty mode ("the OpenTelemetry Collector mode is set to , which does not
  # support modification"). Set it explicitly. Configurable; default deployment.
  # NOTE: `mode` is immutable on an existing collector — if one was already
  # created with empty/other mode, delete it once so ArgoCD recreates it.
  mode: {{ (.Values.otelCollector | default dict).mode | default "deployment" }}
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # memory_limiter MUST be first — it sheds load before the collector OOMs
      # (an OOM loses data entirely). Tuned batch cuts export frequency. Both
      # were dropped in the rewrite (and a per-request `debug` stdout flood
      # re-added); restored per ADR-0034.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        # send_batch_size: 1, NOT a throughput tuning knob. Live prod
        # metrics (2026-08-14/15) on this collector showed
        # otelcol_exporter_send_failed_spans running ~74% of all spans
        # (e.g. 10911 failed vs 3869 sent), with the exporter logging
        # repeating "rpc error: code = ResourceExhausted desc = grpc:
        # received message after decompression larger than max 4194304"
        # against Alloy's OTLP receiver — which has no
        # max_recv_msg_size override configured (ai-helm-values repo,
        # environments/prod/values/alloy.yaml), so the otelcol default
        # of 4 MiB stands.
        #
        # The prior send_batch_size: 512 was already NOT the driver of
        # the oversized exports: otelcol_processor_batch_batch_send_size
        # showed real exported batches averaging ~2.8 spans
        # (batch_send_size_sum/count ≈ 14873/5307, with 99.8% of
        # batches under 10 items) — at this traffic volume the 5s
        # `timeout` below fired long before 512 items ever accumulated.
        # Yet even those already-tiny batches were failing whole
        # (exporter logs show 2-11 dropped_items per failed export),
        # which means one oversized span in a batch — almost certainly
        # a full multimodal request/response body (base64 image
        # content; see values.yaml's extProc memory-limit comment on
        # this exact class of payload) captured as a span attribute by
        # the AI Gateway's ExtProc — was taking every other,
        # normal-sized span sharing its 5s window down with it.
        #
        # send_batch_size: 1 forces one span per export, so an
        # oversized span's failure can no longer drag its batch-mates
        # down too. (NOTE: the first version of this fix set
        # send_batch_max_size: 1 while leaving send_batch_size: 512 —
        # caught in review, that combination fails the batch
        # processor's own Config.Validate(), which requires
        # send_batch_max_size >= send_batch_size whenever
        # send_batch_max_size is nonzero, so the collector would have
        # failed to start entirely. Lowering send_batch_size itself,
        # with send_batch_max_size left unset/0, gets the same
        # one-span-per-export behavior without tripping that
        # constraint.) This is expected to recover most, not all, of
        # the current ~74% loss: a single span that is itself >4 MiB
        # will still fail on its own — that residual gap can only be
        # closed by raising Alloy's OTLP receiver grpc
        # max_recv_msg_size above 4 MiB, which lives outside this
        # chart/repo (ai-helm-values' environments/prod/values/alloy.yaml,
        # the `otelcol.receiver.otlp "default" { grpc { ... } }` block)
        # — flagged for a follow-up there, not silently worked around
        # here.
        send_batch_size: 1
        timeout: 5s

    exporters:
      # Forward traces to Grafana Alloy, which fans out to Tempo.
      otlp/alloy:
        endpoint: "alloy.observability.svc.cluster.local:4317"
        tls:
          insecure: true
      {{- if $tracesDebugEnabled }}
      # Diagnostic-only: dumps received spans to the collector pod's own
      # stdout (visible via `kubectl logs`) ALONGSIDE the otlp/alloy export
      # above — never in place of it. `logging` was the old exporter name;
      # it was renamed to `debug` and later removed entirely upstream, and
      # this fleet's deployed image (opentelemetry-collector-k8s:0.157.0,
      # verified live against the CR) only ships `debug`. Toggle off via
      # otelCollector.debug.traces.enabled.
      #
      # verbosity: every span here carries a `user.id` tag (see the
      # EnvoyProxy `telemetry.tracing.tags` block in templates/envoy-proxy.yaml,
      # sourced from x-oidc-user-id) — a correlatable user identifier, not
      # the full email/name profile the `-usage` collector's access-log JSON
      # carries, but real user data all the same. The debug exporter's
      # `normal` verbosity already prints per-span attributes inline (it is
      # NOT a bare counts view), so `user.id` would land in pod logs/Loki at
      # `normal`, before ever reaching `detailed`. Default `basic` for that
      # reason — it proves spans are flowing without printing any attribute
      # value. Bump to `detailed` only to verify gen_ai.*/token/cost
      # attribute names+values once, then set back to `basic`.
      debug:
        verbosity: {{ $tracesDebugVerbosity }}
      {{- end }}

    service:
      telemetry:
        logs:
          level: debug
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp/alloy
            {{- if $tracesDebugEnabled }}
            - debug
            {{- end }}
---
# Restores the `-usage` collector removed in 948814de ("remove usage-collector
# + otel-operator (external)"). That commit repointed the Envoy access-log
# OTLP sink straight at Alloy, which is correct for the per-user Loki path
# (ADR-0005) but dropped the second leg that used to feed
# lightbridge-authz-usage's billing ingest. Restoring the collector as a fan-
# out point lets both consumers keep receiving the exact same access-log
# stream: Envoy's accessLog sink (templates/envoy-proxy.yaml) now points here
# instead of at Alloy directly, and this collector re-exports unchanged to
# both `otlp/alloy` (byte-identical to the pre-restore direct path) and the
# new `otlphttp/lightbridge_usage` leg.
#
# Not merged into the `-traces` collector above: that one is a traces-only
# pipeline reconciled independently, and keeping them separate matches the
# pre-948814de shape (two collectors, one per signal grouping) rather than
# coupling trace and access-log volume/scaling together.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "core-gateway.fullname" . }}-usage
  namespace: {{ .Release.Namespace }}
spec:
  # See the `mode` comment on the `-traces` collector above — same webhook
  # requirement applies here.
  mode: {{ (.Values.otelCollector | default dict).mode | default "deployment" }}
  # `<fullname>-usage-ca` (certificate-usage-ca.yaml) chains to the same
  # ClusterIssuer (self-signed-ca) that signs lightbridge-authz-usage's own
  # `authz-tls` cert in the `converse` namespace — see that template for why
  # this mounts our own same-namespace Certificate rather than the literal
  # `authz-tls` Secret name (which lives in a different namespace and isn't
  # replicated here). Mounting its ca.crt lets the otlphttp/lightbridge_usage
  # exporter below verify the usage service's HTTPS listener for real — no
  # `insecure`/skip-verify.
  volumes:
    - name: usage-ca
      secret:
        secretName: {{ include "core-gateway.fullname" . }}-usage-ca
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: usage-ca
      mountPath: /etc/otel/tls
      readOnly: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Same rationale as the `-traces` collector: memory_limiter first so a
      # spike sheds load instead of OOMing the pod and losing everything in
      # flight; batch cuts export frequency.
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      # lightbridge-authz-usage's OTLP/HTTP ingest only exposes a logs path
      # (/v1/otel/logs — see crates/lightbridge-authz-usage/src/routers/mod.rs
      # in the lightbridge-authz repo); there is no gRPC receiver on that
      # service, which is exactly why this has to be `otlphttp` (path-aware)
      # rather than a plain `otlp` gRPC exporter.
      otlphttp/lightbridge_usage:
        logs_endpoint: "https://lightbridge-usage.converse.svc.cluster.local:3000/v1/otel/logs"
        tls:
          ca_file: /etc/otel/tls/ca.crt

      # Fan the same access-log stream out to Grafana Alloy, which forwards
      # to Loki (ADR-0005 per-user observability). Identical endpoint/TLS
      # shape to the sink Envoy used to hit directly pre-restore, so this
      # leg's behavior is unchanged — only the hop is new.
      otlp/alloy:
        endpoint: "alloy.observability.svc.cluster.local:4317"
        tls:
          insecure: true
      {{- if $usageDebugEnabled }}
      # Diagnostic-only: dumps received log records (Envoy's access-log
      # stream) to the collector pod's own stdout, ADDED alongside the two
      # real exporters above, never replacing them. Same exporter-naming
      # rationale as the `-traces` collector above (`debug`, not the removed
      # `logging` name — verified against this fleet's deployed
      # opentelemetry-collector-k8s:0.157.0 image).
      #
      # verbosity: the access-log JSON this collector receives carries real
      # PII — lc_user_email, oidc_email, oidc_name, lc_user_name, user_id,
      # oidc_jti, x-forwarded-for (see templates/envoy-proxy.yaml's
      # accessLog json block) — alongside account_id/project_id/api_key_id
      # and the gen_ai.*/token/cost attributes this diagnosis actually wants
      # to check. At `detailed` verbosity every one of those fields'
      # VALUES gets printed into this collector pod's logs, which ship to
      # Loki — i.e. PII duplicated into a logging backend with Loki's
      # retention, not a transient debug session. Default `basic`: it only
      # prints per-batch record counts, which is enough to confirm data is
      # flowing at all (the original symptom here — the usage collector's
      # otelcol_receiver_accepted_* metrics were absent entirely). Bump to
      # `detailed` only to verify the attribute mapping once data is
      # confirmed flowing, then set back to `basic` immediately after.
      debug:
        verbosity: {{ $usageDebugVerbosity }}
      {{- end }}

    service:
      telemetry:
        logs:
          level: debug
      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/lightbridge_usage
            - otlp/alloy
            {{- if $usageDebugEnabled }}
            - debug
            {{- end }}
