apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ include "core-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- $ep := .Values.envoyProxy | default dict }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyPDB:
        maxUnavailable: {{ (default dict $ep.pdb).maxUnavailable | default 1 }}
      {{- with $ep.hpa }}
      # Autoscale the data plane on CPU. envoyHpa supersedes a static
      # envoyDeployment.replicas, so 2000+ clients aren't funnelled through
      # a fixed pod count. (The HPA in the `eg` app scales the Envoy Gateway
      # *controller* — not this, the data plane that serves requests.)
      envoyHpa:
        minReplicas: {{ .minReplicas }}
        maxReplicas: {{ .maxReplicas }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ .cpuUtilization | default 60 }}
      {{- end }}
      envoyDeployment:
        container:
          resources:
            {{- toYaml ($ep.resources | default dict) | nindent 12 }}
        # redact-extproc (ADR-0116): a second native sidecar beside the one
        # AIEG's own admission webhook injects. Direct assignment here
        # (`InitContainers: deploymentConfig.InitContainers` in EG's own
        # resource_provider.go) and AIEG's injection (an APPEND in its
        # gateway_mutator.go, at Pod CREATE admission) happen at different
        # layers — one writes the Deployment spec, the other patches the Pod
        # — so this cannot displace AIEG's container. Verified against EG
        # v1.8.2 / AIEG v1.0.0 source before relying on it; re-check on any
        # major bump to either.
        #
        # Gated on redactExtproc.enabled (default true in values.yaml) so the whole feature
        # is a values-repo toggle (ai-helm-values), not an ai-helm chart
        # release — see backend-redact.yaml / externalsecret-redact.yaml /
        # envoyextensionpolicy-billing-period.yaml / podmonitors-
        # observability.yaml, which gate the rest of this feature's
        # resources the same way.
        {{- if .Values.redactExtproc.enabled }}
        initContainers:
          - name: redact-extproc
            image: "{{ .Values.redactExtproc.image.repository }}:{{ .Values.redactExtproc.image.tag }}"
            # The Kubernetes native-sidecar marker (1.28+, this cluster is
            # 1.35): starts before the main containers, keeps running
            # alongside them, and is what makes an initContainer entry behave
            # as a sidecar rather than a run-once init step.
            restartPolicy: Always
            ports:
              - name: redact-grpc
                containerPort: {{ .Values.redactExtproc.listenPort | default 9500 }}
              - name: redact-metrics
                containerPort: {{ .Values.redactExtproc.metricsPort | default 9501 }}
            env:
              - name: LISTEN_ADDR
                value: "127.0.0.1:{{ .Values.redactExtproc.listenPort | default 9500 }}"
              - name: METRICS_LISTEN_ADDR
                value: "0.0.0.0:{{ .Values.redactExtproc.metricsPort | default 9501 }}"
              - name: REDACT_PROFILE
                value: {{ .Values.redactExtproc.profile | default "coding-assistant" | quote }}
              # Quoted deliberately: a bare number here renders as a YAML
              # int/float that Kubernetes' string-typed EnvVar.value rejects.
              - name: RESPONSE_HOLD_BACK_BYTES
                value: {{ .Values.redactExtproc.responseHoldBackBytes | default 1024 | quote }}
              - name: REDACT_HASH_SALT
                valueFrom:
                  secretKeyRef:
                    name: {{ include "core-gateway.fullname" . }}-redact-extproc-env
                    key: {{ .Values.redactExtproc.externalSecret.saltProperty | default "redact_extproc_hash_salt" }}
                    # ⚠️ NEVER optional — see charts/redact-gateway's own
                    # comment on this exact env var. An optional ref lets a
                    # sidecar that beats ESO capture an empty salt and hash
                    # with it forever.
                    optional: false
            resources:
              {{- toYaml (.Values.redactExtproc.resources | default dict) | nindent 14 }}
        {{- end }}
        {{- if (default dict $ep.topologySpread).enabled }}
        pod:
          topologySpreadConstraints:
            - maxSkew: {{ $ep.topologySpread.maxSkew | default 1 }}
              topologyKey: kubernetes.io/hostname
              # Soft: spread across nodes when possible, never block scheduling.
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: {{ include "core-gateway.fullname" . }}
        {{- end }}
      # Data-plane LoadBalancer Service. `type` defaults to LoadBalancer;
      # `annotations` are cluster-specific (e.g. Hetzner Cloud LB: private IP
      # + health checks) and fully configurable via values — empty by default
      # so non-Hetzner clusters get a plain LB. See envoyProxy.service.
      envoyService:
        type: {{ (default dict $ep.service).type | default "LoadBalancer" | quote }}
        # externalTrafficPolicy: Envoy Gateway defaults this to `Local` (to
        # preserve client source IP). On Hetzner with `use-private-ip`, the
        # hcloud-ccm fails to resolve private LB targets under `Local`
        # (resolve_cloud_private_targets_error) — the working traefik LB on
        # this cluster uses `Cluster`. Default to Cluster here for that reason;
        # source IP is recovered via X-Forwarded-For / PROXY protocol if needed.
        externalTrafficPolicy: {{ (default dict $ep.service).externalTrafficPolicy | default "Cluster" | quote }}
        {{- with (default dict $ep.service).annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  shutdown:
    drainTimeout: {{ (default dict $ep.shutdown).drainTimeout | default "60s" }}
    minDrainDuration: {{ (default dict $ep.shutdown).minDrainDuration | default "15s" }}
  logging:
    level:
      default: warn
      
  telemetry:
    # Expose Envoy proxy metrics on :19001/stats/prometheus (the default).
    # Stated explicitly so the scrape contract with the PodMonitor in
    # templates/podmonitors-observability.yaml is documented in one place.
    metrics:
      prometheus: {}
    tracing:
      # Gateway-wide, ALL requests through this listener are traced (MCP
      # routes and health checks included). We tried to scope this to just
      # the AI Gateway model routes via the per-model BackendTrafficPolicy's
      # telemetry.tracing.samplingFraction, but that field is backend/cluster
      # -scoped telemetry (custom tags + a secondary sampling gate that only
      # applies "if no prior sampling decision has been made" — see Envoy
      # Gateway's own Tracing type docs), NOT a per-route override of
      # whether the downstream request is sampled at all. Verified live: the
      # xDS RouteConfiguration never carried a route-level `tracing:` block
      # despite the BackendTrafficPolicy being accepted. Envoy Gateway
      # v1.8.2 has no CRD field for genuine per-route sampling (raw Envoy
      # supports it — config.route.v3.Tracing — Envoy Gateway just doesn't
      # expose it); the only real per-route mechanism would be an
      # EnvoyPatchPolicy JSON-patching the RouteConfiguration directly,
      # which we decided against for now. Revisit if a future EG version
      # adds real per-route sampling, or if span volume becomes a problem.
      samplingRate: {{ (default dict $ep.tracing).samplingRate | default 1 }}
      provider:
        type: OpenTelemetry
        # Same Alloy OTLP endpoint the access log sink below already uses —
        # no new backend/collector needed.
        host: alloy.observability.svc.cluster.local
        port: 4317
      tags:
        user.id: "%REQ(x-oidc-user-id)%"
    accessLog:
      settings:
        - sinks:
            - type: OpenTelemetry
              openTelemetry:
                # Restored fan-out (see templates/otel.yaml, `-usage`
                # collector): the collector re-exports this exact stream to
                # BOTH Alloy (→ Loki, ADR-0005 per-user observability —
                # unchanged) and lightbridge-authz-usage's OTLP/HTTP ingest
                # (→ usage_events, billing). This EnvoyProxy access-log sink
                # only speaks OTLP/gRPC (host:port, no URL path, no per-sink
                # TLS/CA) — verified against the OpenTelemetryEnvoyProxyAccessLog
                # type in envoyproxy/gateway release/v1.8 — so it cannot reach
                # lightbridge-authz-usage's HTTP+path ingest
                # (/v1/otel/logs, no gRPC receiver) directly. The collector
                # hop is what makes both destinations reachable from one
                # sink.
                host: {{ include "core-gateway.fullname" . }}-usage.{{ .Release.Namespace }}.svc.cluster.local
                port: 4317
                resources:
                  k8s.cluster.name: "converse-llm-1"
                  # Name the OTLP log stream. Without this the OTel SDK
                  # default leaks through and the stream lands in Loki as
                  # service_name="unknown_service" (ADR-0046). Alloy also
                  # pins the service_name label deterministically — this
                  # resource documents intent at the source.
                  service.name: "envoy-ai-gateway"
          matches:
            - "request.headers['x-ai-eg-model'] != ''"
          format:
            type: JSON
            json:
              gen_ai.request.model: "%REQ(X-AI-EG-MODEL)%"
              gen_ai.request.model_override: "%DYNAMIC_METADATA(io.envoy.ai_gateway:model_name_override)%"
              gen_ai.provider.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:backend_name)%"
              gen_ai.usage.total_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_total_token)%"
              gen_ai.usage.input_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              gen_ai.usage.output_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              gen_ai.usage.custom_total_cost: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_custom_total_cost)%"
              # Some Common fields
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              x-envoy-origin-path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              x-envoy-upstream-service-time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              x-forwarded-for: "%REQ(X-FORWARDED-FOR)%"
              user-agent: "%REQ(USER-AGENT)%"
              x-request-id: "%REQ(X-REQUEST-ID)%"
              # Tempo trace correlation: the AI Gateway extproc's tracer
              # injects `traceparent` into the request headers when it
              # starts a ChatCompletion span (same mechanism used for
              # x-ai-eg-model). Logging the header here — rather than
              # %TRACE_ID%, which needs Envoy's own tracing provider
              # configured (it isn't) — lets Grafana pull the trace ID
              # straight out of this access log line and jump to the
              # matching Tempo span (see the Loki derivedFields config).
              traceparent: "%REQ(TRACEPARENT)%"
              ":authority": "%REQ(:AUTHORITY)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
              # LightBridge
              api_key_id: "%REQ(X-API-KEY-ID)%"
              project_id: "%REQ(X-PROJECT-ID)%"
              account_id: "%REQ(X-ACCOUNT-ID)%"
              billing_plan: "%REQ(X-BILLING-PLAN)%"
              # LibreChat Downstream Headers
              lc_user_id: "%REQ(X-USER-ID)%"
              lc_user_email: "%REQ(X-USER-EMAIL)%"
              lc_user_role: "%REQ(X-USER-ROLE)%"
              lc_user_name: "%REQ(X-USER-NAME)%"
              # Authorino-injected OIDC claim headers (ADR-0011).
              # user_id + azp are promoted to Loki labels by Alloy
              # (ADR-0005). The rest ride in the body and are queried via
              # LogQL `| json`. See docs/patterns/per-user-observability.md.
              # IDENTITY
              user_id:              "%REQ(X-OIDC-USER-ID)%"
              user_name:            "%REQ(X-OIDC-USER-NAME)%"
              azp:                  "%REQ(X-OIDC-AZP)%"
              oidc_iss:             "%REQ(X-OIDC-ISS)%"
              # AUTHORIZATION
              oidc_roles_realm:     "%REQ(X-OIDC-ROLES-REALM)%"
              oidc_resource_access: "%REQ(X-OIDC-RESOURCE-ACCESS)%"
              oidc_scope:           "%REQ(X-OIDC-SCOPE)%"
              # TRACING
              oidc_jti:             "%REQ(X-OIDC-JTI)%"
              # PROFILE (PII — see ADR-0011)
              oidc_email:           "%REQ(X-OIDC-EMAIL)%"
              oidc_name:            "%REQ(X-OIDC-NAME)%"
