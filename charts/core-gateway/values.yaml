gateway:
  apiHostname: dummy.example.com
  # api-https TLS issuer (used when acmeHttp01.enabled is false). External
  # ClusterIssuer/Issuer by name+kind (e.g. a DNS-01 ClusterIssuer).
  issuer: self-signed-ca
  issuerKind: ClusterIssuer
  # In-chart ns-scoped ACME Issuer solving HTTP-01 *through this Gateway*
  # (cert-manager gatewayHTTPRoute solver). Self-contained, no DNS token.
  # Requires cert-manager's --enable-gateway-api flag on the controller.
  acmeHttp01:
    enabled: false
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
  # Redirect plain HTTP → HTTPS (on the :80 listener). ACME HTTP-01 challenges
  # still serve on :80 (exact challenge path out-ranks this `/` redirect).
  httpsRedirect:
    enabled: true
    listenerName: http
    statusCode: 308

  # Vanity / alias hostnames redirected to a canonical host (ADR-0053). Each
  # entry gets its OWN HTTPS listener + ACME cert (same issuer as the api host)
  # + an HTTPRoute carrying a RequestRedirect filter, so e.g. callers of
  # api.ai.kivoyo.com land on api.ai.camer.digital (path + query preserved).
  # ACME-safe: cert-manager's exact /.well-known/acme-challenge/<token> path
  # out-ranks the redirect's `/` prefix on the :80 listener (same as
  # httpsRedirect above). Empty by default → zero behaviour change.
  #
  #   redirectHosts:
  #     - name: kivoyo-api        # short slug → listener/cert/route names
  #       from: api.ai.kivoyo.com # vanity host (its DNS must point at this LB)
  #       to: api.ai.camer.digital# canonical host
  #       statusCode: 307         # 307 temporary (keeps method); 302 also valid
  redirectHosts: []

  # Internal plane (ADR-0021): a second HTTPS listener (`api-internal`) bound to a
  # k8s service-DNS hostname, for IN-CLUSTER callers (LibreChat, cron-jobs, k8s
  # SAs). A ClusterIP Service in the proxy namespace gives the stable DNS and
  # routes to the same Envoy proxy pods; TLS terminates with an internal-CA cert
  # (clients trust the Home Root CA + present a Keycloak SA JWT). The public
  # LoadBalancer / `api-https` listener is untouched (external plane).
  internal:
    enabled: true
    # The Envoy proxy pods + their Service live here (EG data plane), so the
    # ClusterIP Service must be in this namespace to select them.
    proxyNamespace: envoy-gateway-system
    serviceName: core-gateway-internal
    # = <serviceName>.<proxyNamespace>.svc.cluster.local — the listener hostname,
    # the cert SAN, and the host the internal AuthConfig (charts/apps) binds to.
    hostname: core-gateway-internal.envoy-gateway-system.svc.cluster.local
    # Envoy Gateway's proxy HTTPS container port (Service 443 → this targetPort).
    httpsTargetPort: 10443
    # Internal-CA issuer for the listener server cert (clients trust its ca.crt).
    issuer: self-signed-ca
    issuerKind: ClusterIssuer

# ────────────────────────────────────────────────────────────────────────
# Envoy data plane (the proxy pods that actually serve client traffic).
# Tuned for high HTTP/2 concurrency; the HPA ceiling is RIGHT-SIZED to the
# current 4×8-CPU worker pool (see docs/playbooks/gateway-capacity.md), not to a
# theoretical client count. Envoy proxying is cheap, so a few pods serve a lot
# of streaming connections; the real ceiling for volume is the cluster + the
# model backends, not this proxy.
# ────────────────────────────────────────────────────────────────────────
envoyProxy:
  # Horizontal autoscaling for the proxy pods. When set, this supersedes a
  # static replica count. NOTE: the HPA in the `eg` app (charts/apps) scales
  # the Envoy Gateway *controller* — this scales the data plane that serves
  # requests, which is the one that matters for client capacity.
  hpa:
    minReplicas: 3
    # maxReplicas RIGHT-SIZED 20 → 5 (2026-06-08). The 4×8=32-CPU worker pool
    # (shared with Mimir, the model apps, LibreChat, MCPs, the GPU model) cannot
    # feed 20 pods × 1 CPU request (let alone the 4 CPU limit) without starving
    # the rest of the platform — the old ceiling was a cheque the cluster
    # couldn't cash. 5 pods (req 5 CPU / burst ≤20) fits the headroom and is
    # ample: Envoy proxies thousands of HTTP/2 streams per pod at low CPU. Raise
    # this in lockstep with adding worker capacity. See docs/playbooks/gateway-capacity.md.
    maxReplicas: 5
    cpuUtilization: 60
  # Real production resources (the chart shipped placeholder values tagged
  # "cleared for local tests").
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi
  pdb:
    maxUnavailable: 1
  # Tracing sampling rate (percent, 0-100) for ALL requests through this
  # listener (gateway-wide — see the EnvoyProxy template comment on why this
  # isn't scoped per-route). Every sampled request pays span-creation +
  # OTLP-export overhead, so this trades trace completeness for per-request
  # latency. Dropped from 100 (trace everything) to 1 (2026-07-14) once the
  # gateway was live-traffic-serving — 100% tracing was a permanent tax on
  # every request for a debugging capability we don't need at that volume.
  tracing:
    samplingRate: 1
  # Spread proxy pods across nodes so a single node drain doesn't take a
  # large slice of capacity. Soft (ScheduleAnyway) so it never blocks
  # scheduling.
  topologySpread:
    enabled: true
    maxSkew: 1
  # Graceful shutdown. Longer drain than the 30s default so long-lived
  # HTTP/2 streams (SSE / token streams) aren't cut mid-flight on rollouts.
  shutdown:
    drainTimeout: 60s
    minDrainDuration: 15s

  # ── Data-plane LoadBalancer Service (cluster-specific knob) ──────────────
  # Rendered into the EnvoyProxy's provider.kubernetes.envoyService. `type`
  # stays LoadBalancer everywhere; `annotations` are the per-cluster bit —
  # here Hetzner Cloud's hcloud-cloud-controller-manager annotations so the
  # Service provisions a Hetzner LB on the PRIVATE network with health checks.
  #
  # Configurable / portable: on a non-Hetzner cluster, override
  # `envoyProxy.service.annotations` (set to {} for a plain LB, or your
  # provider's annotations) via the core-gateway app's valuesObject in
  # charts/apps, or a per-env $values file (ADR-0018 Source C). Safe default:
  # if annotations is empty the key is omitted entirely (no behaviour change).
  service:
    type: LoadBalancer
    # Required on Hetzner with use-private-ip: the hcloud-ccm can't resolve
    # private LB targets under `Local` (resolve_cloud_private_targets_error);
    # the working traefik LB on this cluster uses `Cluster`. Trade-off: client
    # source IP is no longer preserved at the node hop (use X-Forwarded-For /
    # Hetzner PROXY protocol if you need it). Override per cluster if desired.
    externalTrafficPolicy: Cluster
    annotations:
      # Hetzner LB name (must be unique within the Hetzner project).
      load-balancer.hetzner.cloud/name: "core-gateway"
      # Region the LB is created in (match the cluster's location).
      load-balancer.hetzner.cloud/location: "nbg1"
      # Route LB→node traffic over the private network (the ask), AND add LB
      # targets by their private IP rather than by hcloud server reference.
      # MUST be "true": one control-plane node (cp-1) has a stale providerID
      # (hcloud://127562844 — server recreated), so server-reference targeting
      # fails the whole LB sync with `cloud target was not found (invalid_input)`.
      # IP targeting sidesteps the dead server ID. The working `traefik` LB on
      # this cluster uses exactly this (use-private-ip: true + Cluster policy);
      # a prior "false" here (linter regression) is what kept the LB unassigned.
      load-balancer.hetzner.cloud/use-private-ip: "true"
      load-balancer.hetzner.cloud/health-check-interval: "10s"
      load-balancer.hetzner.cloud/health-check-timeout: "5s"
      load-balancer.hetzner.cloud/health-check-retries: "3"

# ────────────────────────────────────────────────────────────────────────
# ClientTrafficPolicy — downstream (client → gateway) connection tuning.
# Sized for ≥2000 concurrent users (laptops, long-lived opencode sessions)
# + GitHub CI runners, all multiplexing over HTTP/2.
#
# Rendered by templates/client-traffic-policy.yaml. Every block is
# optional — drop one and that section is omitted (Envoy defaults apply).
# ────────────────────────────────────────────────────────────────────────
clientTrafficPolicy:
  # Per-connection read/write buffer. Large to absorb big request/response
  # bodies + streaming without back-pressuring the socket.
  bufferLimit: 500Mi

  # HTTP/2 multiplexing — the headline knob. Each client holds a small
  # number of HTTP/2 connections and multiplexes many concurrent streams
  # (requests) over each, so 2000+ clients stay cheap on socket count while
  # still getting high per-client request concurrency.
  http2:
    # Max concurrent streams (in-flight requests) per HTTP/2 connection.
    # Envoy default is 100; raised for heavy multiplexing (parallel tool
    # calls from agents, CI fan-out).
    maxConcurrentStreams: 1000
    # Flow-control windows — raised from Envoy defaults (64Ki stream /
    # 1Mi connection) for higher streaming throughput (LLM token streams,
    # SSE) without window stalls. Connection window = 16× stream window so
    # many busy streams can fill the pipe concurrently.
    initialStreamWindowSize: 1Mi
    initialConnectionWindowSize: 16Mi

  connection:
    # Concurrent downstream connection ceiling for the listener. Generous —
    # far above 2000 laptops (≈1–2 HTTP/2 conns each) + CI runners — but
    # bounded so a connection flood can't exhaust the proxy. Raise if the
    # fleet outgrows it.
    connectionLimit: 100000
    # Grace period before forcibly closing a connection once the limit is
    # hit (lets in-flight requests drain).
    closeDelay: 1s

  # Keep idle client connections alive (laptops behind NAT / corporate
  # load balancers, long-lived opencode sessions) so they aren't silently
  # dropped and forced to reconnect.
  tcpKeepalive:
    probes: 3
    idleTime: 5m
    interval: 30s

  # Long idle timeouts: streaming responses (SSE / token streams) and idle
  # agent sessions hold connections open well beyond a typical web idle.
  timeout:
    tcpIdleTimeout: 1h
    # Time allowed to receive the full set of request headers.
    httpRequestReceivedTimeout: 60s
    httpIdleTimeout: 1h

# ────────────────────────────────────────────────────────────────────────
# BackendTrafficPolicy — upstream (gateway → model backends) resilience.
# Protects backends + keeps client latency stable under load: one slow or
# failing provider shouldn't stall everyone. Rendered by
# templates/backendtrafficpolicy.yaml (targets the Gateway → applies to all
# routes). Per-model budget rate limits stay in charts/ai-model.
# ────────────────────────────────────────────────────────────────────────
backendTrafficPolicy:
  bufferLimit: 100Mi

  # ── Shared cross-model monthly + weekly budget (#532, ADR-0119) ───────────
  # One SHARED micro-USD budget per (user, plan) across ALL model routes, instead
  # of the per-model counters that let a heavy user spend cap × N-models. Rendered
  # as `shared: true` cost rule(s) on the gateway-wide BTP (see the template) —
  # plus an additive weekly sub-budget (ADR-0119) that composes with it to stop
  # front-loading. Requires Envoy Gateway ≥ v1.8.2 (bug #9244 breaks shared+cost
  # on 1.8.1) — live since 2026-07-08, paired with ai-models `sharedBudget.enabled`.
  #
  # ⚠️ ai-helm / ai-helm-values split (ADR-0055/0056): this is WORKLOAD CONFIG,
  # not a structural chart default. The actual `enabled` + ordered `plans` list
  # (monthlyBudgetUsd / weeklyBudgetUsd per plan) lives in `ai-helm-values`
  # `environments/prod/values/core-gateway.yaml` (`backendTrafficPolicy.monthlyBudget`),
  # which this app's `valuesFromRepo` `$values` ref overrides this whole block
  # with. What's below is ONLY the safe structural default (rate limiting off,
  # no plans) so `helm template`/`helm lint` render a valid chart standalone —
  # no real business figures live in this repo. Edit plan budgets in
  # ai-helm-values, never here.
  #
  # ⚠️⚠️ Whoever edits `plans` in ai-helm-values — ORDER IS LOAD-BEARING,
  # APPEND ONLY (ADR-0084). Each entry's INDEX becomes the `rule/N` inside the
  # Lyft ratelimit Redis counter key, and the plan name itself is masked (an
  # `Exact` match renders as a constant) — the index is the ONLY carrier of
  # plan identity in the key. Reordering, inserting, or removing an entry
  # ORPHANS every account's accumulated spend mid-window and silently hands
  # out a fresh, unthrottled counter (the 2026-07-16 incident this ADR fixed).
  # New plans are always appended at the tail.
  #
  # `weeklyBudgetUsd` (ADR-0119) is an optional additive per-plan field on the
  # SAME entries, rendered as a second, independent rule pass in the
  # template — strictly after the monthlyBudgetUsd rules, so it only ever
  # APPENDS new rule-index slots and never re-keys a monthly counter.
  # Composes (AND) with monthlyBudgetUsd: it only ever tightens the effective
  # cap within an ISO week (Monday-start), never raises the monthly ceiling.
  # Omitting it for a plan renders no weekly rule for that plan.
  monthlyBudget:
    enabled: false
    plans: []

  # Whole-request ceiling for routes this gateway-wide policy governs (the
  # non-model routes — model routes are governed by their own per-model BTP in
  # charts/ai-model, which replaces this one). ADR-0034.
  requestTimeout: 600s

  # Upstream retry budget. perRetryTimeout must outlast a long generation
  # (the shipped 30s cut them — ADR-0034). numRetries kept at 1 (retrying LLM
  # calls amplifies load on already-stressed backends).
  retry:
    numRetries: 1
    perRetryTimeout: 300s

  # Spread load across a backend's endpoints by in-flight request count —
  # better tail latency than round-robin when request durations vary wildly
  # (streaming LLM responses do).
  loadBalancer:
    type: LeastRequest

  # Circuit breaking — generous ceilings (budget rate limits do the real
  # throttling; these just stop unbounded queue/connection explosion to a
  # single backend cluster so a stuck provider fails fast instead of
  # piling up).
  circuitBreaker:
    maxConnections: 50000
    maxPendingRequests: 50000
    maxParallelRequests: 50000
    maxParallelRetries: 1000

  # Passive health check (outlier detection) — eject a backend endpoint
  # that starts throwing 5xx / gateway errors, so clients stop hitting it.
  outlierDetection:
    consecutive5XxErrors: 5
    consecutiveGatewayErrors: 5
    interval: 10s
    baseEjectionTime: 30s
    maxEjectionPercent: 50

  # Reuse upstream connections to the model backends (cut TLS/handshake
  # churn) and keep them warm.
  tcpKeepalive:
    probes: 3
    idleTime: 5m
    interval: 30s

  # Compress responses to clients (model lists, large JSON, non-streamed
  # bodies) — meaningful bandwidth savings across thousands of laptops.
  compression:
    - Gzip

# ────────────────────────────────────────────────────────────────────────
# OpenTelemetryCollector (-traces, -usage): receive OTLP. -traces forwards to
# Alloy → Tempo; -usage receives Envoy's access-log stream and fans it out to
# both Alloy → Loki (per-user observability, ADR-0005, unchanged) and
# lightbridge-authz-usage's OTLP/HTTP ingest (billing). `mode` MUST be set on
# both (otel-operator v1beta1 webhook rejects an empty mode); it is immutable
# on an existing collector. deployment | daemonset | statefulset | sidecar.
#
# usageCa: issuer for the `<fullname>-usage-ca` Certificate
# (certificate-usage-ca.yaml) the -usage collector mounts to verify
# lightbridge-authz-usage's TLS listener — see that template for why this is
# a same-namespace Certificate off the same issuer rather than a literal
# cross-namespace `authz-tls` Secret reference.
#
# debug: the `debug` exporter (templates/otel.yaml) — stdout diagnostic
# output on top of, never instead of, each collector's real exporters.
# Added to confirm data is actually flowing (both collectors'
# otelcol_receiver_accepted_* metrics had been absent — the `-usage` one
# because Envoy's access-log sink pointed at a hostname missing its
# `-collector` suffix) and that the expected attributes
# (account_id/project_id/api_key_id/user_id/gen_ai.request.model/token
# counts/cost) are present with the right names once it does.
#
# `enabled: false` removes the `debug` EXPORTER and its pipeline entry
# entirely — no telemetry payloads/attribute values get printed. It does
# NOT touch `service.telemetry.logs.level: debug`, which templates/otel.yaml
# sets unconditionally on both collectors: that's the collector binary's own
# internal operational logging (component startup, config validation,
# export errors), not a telemetry-payload dump, so it carries no
# attribute/PII values and is left on regardless of this toggle.
#
# `verbosity: basic | normal | detailed`. `basic` only counts records per
# batch — proves data is flowing without printing a single attribute
# value. `detailed` prints every attribute's NAME AND VALUE.
#
#   - usage: the access-log JSON this collector receives carries real PII
#     (lc_user_email, oidc_email, oidc_name, lc_user_name, user_id,
#     oidc_jti, x-forwarded-for — see templates/envoy-proxy.yaml's
#     accessLog json block). At `detailed` every one of those VALUES gets
#     written into this collector pod's own logs, which ship to Loki — PII
#     duplicated into a logging backend with Loki's retention, not a
#     transient debug session. Defaults to `basic` for that reason.
#   - traces: every span carries a `user.id` tag (EnvoyProxy
#     `telemetry.tracing.tags`, sourced from x-oidc-user-id) — a
#     correlatable user identifier. The debug exporter's `normal`
#     verbosity already prints per-span attributes inline (it is not a
#     bare counts view like `basic`), so `user.id` would land in
#     pod logs/Loki at `normal`, before ever reaching `detailed`. Defaults
#     to `basic` here too, for the same reason.
#
# To check the attribute MAPPING specifically (names/values, not just
# flow), temporarily set the relevant collector's verbosity to `detailed`
# in ai-helm-values (environments/<env>/values/core-gateway.yaml):
#   otelCollector.debug.usage.verbosity: detailed   (PII — revert after)
#   otelCollector.debug.traces.verbosity: detailed  (user.id — revert after)
# then set it back to `basic` once verified. Don't leave `detailed`
# deployed.
# ────────────────────────────────────────────────────────────────────────
otelCollector:
  mode: deployment
  usageCa:
    issuer: self-signed-ca
    issuerKind: ClusterIssuer
  debug:
    traces:
      enabled: true
      verbosity: basic
    usage:
      enabled: true
      verbosity: basic

# ────────────────────────────────────────────────────────────────────────
# ExtProc sidecar (the Envoy AI Gateway's per-request processor: token
# counting, cost CEL, model routing, dynamic-metadata population). It runs
# inline on EVERY request and response body and holds state for the whole
# stream, so an undersized CPU limit throttles the data path under concurrent /
# streaming load (ADR-0034 — the shipped 512m limit was the inline bottleneck
# the pre-cutover perf work had already raised to 2000m). Rendered into the
# GatewayConfig's spec.extProc.kubernetes.resources. Limit is a burst ceiling,
# not a reservation; the modest request keeps scheduling cheap on the shared
# worker pool. Right-size in lockstep with worker capacity.
# ────────────────────────────────────────────────────────────────────────
extProc:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      # Memory raised 512Mi → 1Gi (2026-06-12): the processor buffers + parses
      # request/response bodies, which grew with the 1M context ceiling
      # (charts/ai-models-info) and multimodal image inputs (base64). Big bodies
      # under concurrency were the OOM risk; this gives headroom.
      memory: "1Gi"

# ────────────────────────────────────────────────────────────────────────
# redact-extproc (ADR-0116): PII/credential redaction as a NATIVE SIDECAR in
# this same Envoy pod, beside the `extProc` block above — sidecar is the
# topology, ext_proc is the protocol, and AIEG already uses both; this adds a
# second processor rather than a new one. Filter order is measured, not
# assumed: EG v1.8.2 fixes ExtProc at `100 + index` in its own chain, and
# AIEG's processor is inserted ahead of that table entirely, so ours always
# runs AFTER Authorino (order 5) and AFTER AIEG — acceptable only because
# every AIServiceBackend on this fleet is `schema.name: OpenAI` (verified
# live), so AIEG never rewrites the body into a shape our walker won't
# recognise. If that stops being true, `redact_uninspected_bodies_total`
# (exported on `metricsPort`) is the alarm — see the ADR.
#
# Image built + published from lightbridge-governance's docker.yml
# (lightbridge-governance#44, merged into its main at 54718b2; this tag is
# the immutable per-commit build from main's current tip, 415d877 — a
# docs-only README commit on top of #44, confirmed to touch neither
# app/redact-extproc nor crates/governance-redact source, so it's the same
# binary). `restartPolicy: Always` makes this an init container the kubelet
# must start before the pod is Ready, so pin the immutable sha-<commit> tag
# here rather than the floating `main` tag — an unrelated later push to
# that repo's main must not silently change what THIS chart deploys.
# ────────────────────────────────────────────────────────────────────────
redactExtproc:
  # Kill switch for the whole feature (sidecar, Backend, ExternalSecret,
  # ext_proc filter, PodMonitor) — a values-repo toggle, not an ai-helm chart
  # release. Added 2026-08-03 after an incident where disabling required
  # pinning the app's targetRevision below the whole feature in ai-helm
  # instead — see charts/apps/values.yaml's core-gateway entry history.
  enabled: true
  # request/response body processing mode — see
  # templates/envoyextensionpolicy-billing-period.yaml for why these are
  # values rather than literals (a 2026-08-03 incident needed a chart
  # release to flip response back from an emergency Buffered stopgap).
  # Defaults restore ADR-0116's original intent; don't set response to
  # Buffered without also checking the messageTimeout budget below is
  # enough to scan a WHOLE completion, not a chunk.
  processingMode:
    request:
      body: Buffered
    response:
      body: Streamed
  # ADR-0055/0056: the deployed tag is workload config, not chart structure —
  # it lives in ai-helm-values (environments/prod/values/core-gateway.yaml),
  # not here. This placeholder previously held a real live tag by mistake
  # (ai-helm#900/#901), which meant the fix in lightbridge-governance#47
  # published to GHCR but was never referenced anywhere ArgoCD reads.
  image:
    repository: ghcr.io/adorsys-gis/redact-extproc
    tag: "TBD-no-image-published-yet"
  # Loopback only — reached solely by Envoy in this same pod (shared network
  # namespace), never over the pod network. See templates/backend-redact.yaml:
  # the EnvoyExtensionPolicy's Backend targets `127.0.0.1` specifically so
  # every gateway replica always talks to ITS OWN sidecar, never another
  # replica's — a Service-selector backendRef could not guarantee that with
  # `envoyProxy.hpa` running 3-5 replicas.
  listenPort: 9500
  # 0.0.0.0: unlike the gRPC port above, Alloy scrapes this cross-pod (see
  # podmonitors-observability.yaml), so it must be reachable via the pod IP.
  metricsPort: 9501
  profile: coding-assistant
  # Bytes of a streamed response held back before release — see
  # governance_redact::holdback for the sizing rationale. Quoted in the
  # container env (a bare number renders as a YAML float/int that Kubernetes'
  # string-typed EnvVar.value rejects — the same class of bug as ADR-0109's
  # `"n": 1` trap and the MAX_BODY_BYTES scientific-notation one).
  #
  # ⚠️ 2026-08-06 incident: this MUST track governance_redact::holdback::DEFAULT_WINDOW
  # in the deployed image, not just be "a reasonable-looking number". The
  # 2026-08-03 fix (lightbridge-governance#47, sha-b3c0a2e) shipped with
  # DEFAULT_WINDOW still at 1024; a follow-up review pass (main@29ae332,
  # "window size ... 1024 -> 4096 bytes, exceeds longest Block entity")
  # raised the CODE's own default to 4096 -- but this chart value is an
  # explicit env override, so it kept forcing 1024 regardless of which image
  # was deployed. Re-enabling redactExtproc with only the image bumped, and
  # NOT this value, would have silently reintroduced the exact bug the image
  # bump was meant to fix. Verify against governance_redact::holdback::DEFAULT_WINDOW
  # at whatever commit `redactExtproc.image.tag` (ai-helm-values) points to
  # before changing either one without the other.
  responseHoldBackBytes: 4096
  # Per-message ext_proc budget. The CRD default (200ms) is the whole
  # redaction budget per chunk; regex/validator recognizers fit comfortably
  # inside it, an NER pass would not (ADR-0115 — NER is a separate service).
  messageTimeout: 200ms
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  externalSecret:
    secretStore: ssegning-aws
    remoteKey: ai/camer/digital/prod/env
    # ⚠️ Populate this property in ssegning-aws BEFORE this syncs, or the
    # ExternalSecret sits in SecretSyncedError and the sidecar never starts
    # (`optional: false` on the env — see charts/redact-gateway's own
    # comment on why an optional ref is unacceptable for a hash salt).
    saltProperty: redact_extproc_hash_salt

# NOTE: the `mcpBackendTls` EnvoyPatchPolicy (ADR-0039) was REMOVED by ADR-0040.
# External MCPs no longer terminate TLS at Envoy — they're fronted by per-MCP
# Caddy normalizing proxies (charts/mcps, `mode: proxiedExternal`) that do the
# upstream TLS in-cluster, so AIEG's `dummy.transport_socket` / empty-SNI bug no
# longer applies and the brittle cluster-name patch is gone.
