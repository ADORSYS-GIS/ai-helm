# ImageUpdater CRs to render (ADR-0055). Each entry activates the CRD-based
# argocd-image-updater controller for the listed Application(s); the actual
# per-image update config (image-list / update-strategy / cosign / git
# write-back to the ai-helm-values repo) lives on the target Application's own
# annotations in charts/apps/values.yaml, so `useAnnotations: true` is all the
# CR needs.
#
# To opt a new continuous-delivery app in: add the write-back annotations to its
# charts/apps entry (see lightbridge-code-intelligence for the canonical shape),
# set `chart:` on it (OCI mode), then add an entry here:
#
#   - name: <app>
#     applicationRefs:
#       - namePattern: aii-<app>      # `aii-` = charts/apps argocd.appNamePrefix
#         useAnnotations: true
imageUpdaters:
  - name: lightbridge-code-intelligence
    applicationRefs:
      # The `aii-` prefix is charts/apps `argocd.appNamePrefix`. A bare pattern
      # is an exact match.
      - namePattern: aii-lightbridge-code-intelligence
        useAnnotations: true
  # Lightbridge console image write-back to ai-helm-values (newest-build,
  # unsigned — same converse-frontends CI that used to build converse-ui, which
  # this app REPLACED (retired 2026-08-29; self-service.ai.camer.digital now 301s
  # to console.ai.camer.digital).
  # Annotations live on the aii-console-ui Application (charts/apps/values.yaml).
  # Entry required, annotations alone do nothing: see the lightbridge-governance
  # entry below for the 6-hour incident this exact omission caused.
  - name: console-ui
    applicationRefs:
      - namePattern: aii-console-ui
        useAnnotations: true
  # ADR-0055 continuous-delivery — lightbridge backend api/mcp image write-back
  # to ai-helm-values (newest-build, COSIGN-signed; lightbridge-authz signs in
  # its CI). The write-back annotations live on the `lightbridge-app` child
  # Application emitted by the lightbridge orchestrator chart (charts/lightbridge),
  # NOT a charts/apps entry — so the pattern is the bare child name, no `aii-`
  # prefix (exact match).
  - name: lightbridge-app
    applicationRefs:
      - namePattern: lightbridge-app
        useAnnotations: true
  # lightbridge-governance API + copilot-sync image write-back to
  # ai-helm-values (ai-helm#939, COSIGN-signed). The write-back annotations
  # live on the aii-lightbridge-governance Application (charts/apps/values.yaml)
  # -- adding those annotations alone does nothing without this CR: the
  # CRD-based controller only scans Applications an ImageUpdater actually
  # references. Confirmed missing 2026-08-07: #939 shipped the annotations
  # but not this entry, so the controller's reconcile loop never once
  # considered lightbridge-governance despite the Application carrying valid
  # image-updater config for 6+ hours.
  - name: lightbridge-governance
    applicationRefs:
      - namePattern: aii-lightbridge-governance
        useAnnotations: true
