# charts/model-serving-qwen2-vl-2b - self-hosted Qwen2-VL-2B-Instruct on the home GPU.
# See ADR-0022 (federation) + ADR-0028 (pricing) + ADR-0029 (serving mode) +
# ADR-0030 (one StatefulSet via bjw-template) + docs/patterns/self-hosted-model-serving.md.
#
# Qwen2-VL-2B-Instruct: a vision-language model (Apache-2.0). 2B params at BF16
# ~ 4 GB weights - fits a 32K context on the 12 GB A2000 with ~6 GB left for KV.
# Supports image+text chat completions (OpenAI-compatible image_url content parts).
# Standard Qwen2 architecture -> vLLM supports it natively.
#
# Shape: a hybrid bjw-template chart (like charts/model-serving-qwen25-3b-awq).
#   - The bjw-template subchart (values under `modelServing:`) renders the WHOLE
#     workload: the model StatefulSet (model + Caddy proxy sidecar), the seed
#     Job (a bjw `job` controller, ArgoCD Sync hook), the Service, and the
#     Ingress.
#   - The chart's own templates/ render only the resources bjw doesn't do
#     natively: the weights PVC, the ExternalSecrets, and the Caddyfile ConfigMap.
#
# Sync-wave ordering (this Application's resources, on the HOME cluster):
#   -2  ExternalSecret (vllm-local-api-key + hf-token)  - before any pod
#   -1  PVC (qwen2-vl-2b-models, RWX)                   - weights volume
#    0  seed Job (download-once into the PVC)             - ArgoCD Sync hook
#    1  StatefulSet (model + proxy) + Service + Ingress   - mounts the PVC

global:
  labels:
    app: model-serving-qwen2-vl-2b
    team: adorsys-gis

model:
  name: qwen2-vl-2b
  hfRepo: Qwen/Qwen2-VL-2B-Instruct
  storagePath: Qwen2-VL-2B-Instruct

pvc:
  enabled: true
  name: qwen2-vl-2b-models
  storageClassName: longhorn
  accessMode: ReadWriteMany
  size: 15Gi                       # ~4GB BF16 weights + headroom

seedJob:
  enabled: true
  hfToken:
    enabled: true
    secretName: hf-token
    dataKey: token
    externalSecret:
      enabled: true
      secretStore: ssegning-aws
      refreshInterval: 1h
      key: ai/camer/digital/prod/env
      property: hf_token

apiKey:
  enabled: true
  secretName: vllm-local-api-key
  dataKey: api_key
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: vllm_local_api_key

edgeAuth:
  enabled: true
  proxyResponseTimeout: 600s

modelServing:
  global:
    fullnameOverride: qwen2-vl-2b

  defaultPodOptions:
    runtimeClassName: nvidia
    nodeSelector:
      gpu-node: "true"

  controllers:
    main:
      type: statefulset
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        # Pod-level hardening so the workload clears Trivy KSV-0118
        # ("default security context"). The GPU model container needs root to
        # initialise the GPU runtime; every container additionally drops
        # ALL caps + disables privilege escalation.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          # No seccompProfile here — the Caddy sidecar shares this pod and its
          # /usr/bin/caddy is a file-capability binary that cannot exec under the
          # no_new_privs a seccomp profile forces; runAsUser:0 keeps KSV-0118 cleared.
      containers:
        model:
          image:
            repository: vllm/vllm-openai
            tag: v0.25.1
            pullPolicy: IfNotPresent
          args:
            - /mnt/models
            - --served-model-name=qwen2-vl-2b
            - --port=8080
            - --dtype=float16
            - --max-model-len=32768
            - --max-num-seqs=4
            - --gpu-memory-utilization=0.90
            - --enforce-eager
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
          env:
            VLLM_API_KEY:
              secretKeyRef:
                name: vllm-local-api-key
                key: api_key
          ports:
            - name: http
              containerPort: 8080
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                periodSeconds: 15
                failureThreshold: 120
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8080
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi

        proxy:
          image:
            repository: caddy
            tag: 2-alpine
            pullPolicy: IfNotPresent
          # NO securityContext on this sidecar. caddy:2-alpine's /usr/bin/caddy
          # ships an EFFECTIVE file-capability (cap_net_bind_service=ep); the kernel
          # refuses to exec such a binary if that cap is dropped from the bounding
          # set (capabilities.drop) OR if no_new_privs is set (allowPrivilegeEscalation:
          # false / any seccompProfile), and Talos baseline PSS forbids the Unconfined
          # seccomp that would dodge the latter — so this image cannot take a hardened
          # SC at all. KSV-0118 for it is path-scoped-ignored (.trivyignore.yaml); the
          # pod + model container ARE hardened. PROPER FIX: drop this sidecar — vLLM
          # gates VLLM_API_KEY on :8080 itself, making Caddy redundant (tracked).
          env:
            MODEL_API_KEY:
              secretKeyRef:
                name: vllm-local-api-key
                key: api_key
          ports:
            - name: edge
              containerPort: 8090
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8090 }
                periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }

    seed:
      type: job
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
      pod:
        restartPolicy: OnFailure
        # Hardened for Trivy KSV-0118 (job- and container-level). The seed pip-installs
        # huggingface_hub into system site-packages, so it runs as root; capabilities are
        # dropped and privilege-escalation disabled. readOnlyRootFilesystem is intentionally
        # omitted (pip writes to the rootfs) — KSV-0014 is path-scoped-ignored in .trivyignore.yaml.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      job:
        backoffLimit: 6
        activeDeadlineSeconds: 3600
      containers:
        seed:
          # Container hardening for KSV-0118 (see the pod securityContext note above).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          image:
            repository: python
            tag: "3.12-slim"
            pullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              MODEL_DIR="/models/Qwen2-VL-2B-Instruct"
              mkdir -p "$MODEL_DIR"
              echo "Seeding Qwen/Qwen2-VL-2B-Instruct -> $MODEL_DIR (skips files already present)"
              pip install --no-cache-dir -q --root-user-action=ignore "huggingface_hub[hf_xet]>=1.0"
              hf download Qwen/Qwen2-VL-2B-Instruct --local-dir "$MODEL_DIR"
              echo "Seed complete."
          env:
            HF_TOKEN:
              secretKeyRef:
                name: hf-token
                key: token
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "2", memory: 4Gi }

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        edge:
          port: 8090
          targetPort: 8090

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cert-cloudflare
      hosts:
        - host: qwen2-vl-2b--poc.ssegning.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: edge
      tls:
        - secretName: qwen2-vl-2b-edge-tls
          hosts:
            - qwen2-vl-2b--poc.ssegning.com

  persistence:
    model-store:
      enabled: true
      existingClaim: qwen2-vl-2b-models
      advancedMounts:
        main:
          model:
            - path: /mnt/models
              subPath: Qwen2-VL-2B-Instruct
              readOnly: true
        seed:
          seed:
            - path: /models
    caddyfile:
      enabled: true
      type: configMap
      name: qwen2-vl-2b-caddy
      advancedMounts:
        main:
          proxy:
            - path: /etc/caddy