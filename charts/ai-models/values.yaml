  # ─────────────────────────────────────────────────────────────────────────
  # GPU fleet (cluster-local, ADR-0095) — backends for enabled models only.
  # Backends for disabled models are removed to keep the catalog consistent
  # with charts/inference/values.yaml (check-model-catalogs.sh).
  # ─────────────────────────────────────────────────────────────────────────

  # Qwen3-VL-4B-Thinking — the fleet's first VISION-LANGUAGE backend (ADR-0094
  # orchestrator, no KServe/Caddy sidecar — vLLM's own OpenAI server handles
  # `image_url` content parts natively). `prefix: /v1` is vLLM's own OpenAI
  # server, same as the other vLLM fleet backends. Same `vllm_local_api_key`
  # ssegning-aws property every other local vLLM backend uses.
  #
  # ⚠️ LOAD-GATED 2026-07-29: sent a real image (a generated PNG, blue square /
  # red circle) through /v1/chat/completions and read the actual response —
  # "The image features a blue square with a red circle inside it." — correct,
  # not just HTTP 200. Peak VRAM 10405 / 20475 MiB (~51%, under the 60%
  # budget). Reasoning landed in the separate `reasoning_content`/`reasoning`
  # field, not leaking `<think>` tags into `content`.
  # Z-Image-Turbo — IMAGE GENERATION, served by LocalAI (ADR-0102). Same
  # cluster-local shape as the text backends above; the difference is what it
  # serves, not how it is reached.
  #
  # ⚠️ RESTORED 2026-07-29 (ADR-0106, issue #803). The entry #814 removed pointed
  # at `z-image-turbo--poc.ssegning.com` — the OLD home-cluster edge host, dead
  # since the model moved onto the fleet, resolving through Cloudflare with no
  # origin behind it. #814 was right to remove it; this is not that backend. It
  # is the cluster-local Service the `z-image-turbo` inference entry creates,
  # which is what the LocalAI deployment served from before PR #790 deleted it.
  #
  # ⚠️ `prefix: /v1` — LocalAI registers `/v1/images/generations` and `/v1/models`.
