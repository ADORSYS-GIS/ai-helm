    # self-regulating with no param) so `reasoning` stays in supported params,
    # but it is deliberately excluded from the opencode well-known reasoning
    # caps (charts/librechat-opencode-wellknown) — a cap there would send
    # reasoning_effort and break it. (`output_config.effort` was ACCEPTED —
    # HTTP 200 — in live testing, so it's the likely path if we ever want a
    # real cap; not yet proven to actually reduce thinking volume.) DeepInfra's
    # 2026-08 invoice is authoritative here: this partner model fell back to
