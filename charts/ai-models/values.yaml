  # comment block above `models:` in this file). ai-helm-values must update any
  # reference to this backend key in the same commit window.
  z-image-turbo-internal:
    schema: OpenAI
    prefix: "/v1"
    fqdn:
      hostname: z-image-turbo.inference.svc.cluster.local
      port: 8080
    securityType: APIKey
    resourceName: z-image-turbo-internal-svc
    secretRef:
      name: z-image-turbo-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # ── Qwen3.5-2B backend (cluster-local, ADR-0095) ────────────────────────
  # The fleet coding model served by the `qwen3-5-2b` inference entry
  # (charts/inference/values.yaml). Same cluster-local shape as every other
  # fleet backend: ClusterIP Service, CiliumNetworkPolicy, no Ingress.
  # `prefix: /v1` is vLLM's own OpenAI route.
  qwen3-5-2b-local:
    schema: OpenAI
    prefix: "/v1"
    fqdn:
      hostname: qwen3-5-2b.inference.svc.cluster.local
      port: 8080
    securityType: APIKey
    resourceName: qwen3-5-2b-local-svc
    secretRef:
      name: qwen3-5-2b-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

# Models — each entry becomes one child Application using the `ai-model`
# leaf chart. Setting `enabled: false` on a model skips its Application
# (the AppSet controller will delete a previously-generated child).
#
# Pricing strategies driving the `llm_custom_total_cost` CEL:
#   weighted        — input / cached-input / output prices differ
#   tieredWeighted  — same as weighted, but use `longContext` prices when
#                     prompt size exceeds `thresholdTokens`
#   flat            — one blended price for total tokens

models:

# ═══════════════════════════════════════════════════════════════════════════════
#  MODEL ID SUFFIXES — the convention clients read (2026-07-28)
#
#  `/v1/models` is generated by Envoy AI Gateway from the AIGatewayRoutes and
#  CANNOT be filtered from these charts, so every model we route is advertised to
#  everyone. The id is therefore the only thing that tells a caller what a model
#  is for — `owned_by` exists but nobody reads it. Three shapes:
#
#    <name>            a SaaS model. Anyone may use it.
#    <name>-internal    `disableExternal: true`. Routed on the internal listener
#                       only; an external client that picks one gets a
#                       correct-but-baffling "404 No matching route found".
#    <name>-local       served on OUR GPU fleet, in `inference` on this cluster.
#
#  ⚠️ `-local` MEANS THE HETZNER FLEET, AND NOTHING ELSE. It used to also cover
#  models on the home cluster's RTX A2000, reached over a public
#  `*--poc.ssegning.com` edge. That generation is gone — every one of those
#  charts is disabled (ADR-0100) — so their entries are COMMENTED OUT below
#  rather than left `enabled: false`, because a disabled entry still reads like
#  something that could come back, and these cannot: the servers no longer exist.
#
#  Today `-local` is exactly: z-image-turbo-local (image generation) — one per
#  fleet card. The text tiers (openmythos-27b-local, qwen3-8b-fast-local) are
#  all disabled. If you add another, it is on the fleet or it does not carry -local.
# ═══════════════════════════════════════════════════════════════════════════════

# ⚠️ INTERNAL-ONLY MODELS CARRY AN `-internal` SUFFIX (2026-07-28).
#
# `/v1/models` is generated by Envoy AI Gateway from the AIGatewayRoutes and
# CANNOT be filtered from these charts, so every `disableExternal: true` model is
# still ADVERTISED to external clients — who then get a correct-but-baffling
# "404 No matching route found" if they pick one. `owned_by` already says
# "internal only", but the id is what a client actually reads and passes around.
#
# The suffix makes the id self-describing at the point of use. It is the model
# KEY that carries it, because that key IS the route name and the advertised id.
#
# ⚠️ CONSEQUENCE, and it is not local to this file: the id is the routing key that
# in-cluster consumers send as `x-ai-eg-model`. Renaming one is a CROSS-REPO
# change — `ai-helm-values` `environments/prod/values/{librechat-app,
# lightbridge-code-intelligence}.yaml` name these ids in agent configs, allowed-
# model lists and token tables. Rename here and there together, or callers 404.
# Historical Mimir/Loki series keyed on the old id do not follow the rename.


  # ─────────────────────────────────────────────────────────────────────────
  # Qwen3-8B-AWQ — the SPEED tier (vLLM + LMCache) on the second GPU.
  #
  # Since OpenMythos-27B was retired on 2026-07-27 this is the fleet's ONLY
  # self-hosted text model — the other card now runs image generation. Pick it
  # for anything interactive or agentic; route considered long-form analysis to
  # a SaaS model rather than to a second local tier, until one comes back.
  #
  # Measured (inference-ops docs/benchmarks/2026-07-26-qwen3-8b-awq-vllm-rtx4000-ada.md):
  #   45 tok/s decode (3x the 27B) · TTFT ~45ms · tool calling OK · 401 without key
  #
  # Pricing per ADR-0096: same €0.252/h node cost as the 27B, but 3x the token
  # rate, so the per-token cost is ~1/3. Derivation:
  #   €0.252/h ÷ (45 tok/s × 3600) = €1.56/1M output at saturation
  #   × 3.45 duty-cycle uplift ⇒ €5.38/1M ⇒ ~$5.85, rounded to $5.85/$0.88/$0.18
  #   at ADR-0028's 1 : 0.15 : 0.03 out/in/cached split.
  # Still above most SaaS entries — rented hardware at low duty cycle is simply
  # expensive — but a third of the 27B, which is the honest signal: prefer this
  # tier unless the task needs the bigger model.
  qwen3-8b-fast-local:
    enabled: false
    kind: text
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3-8B (self-hosted, fast)"
      # vLLM does NOT split --max-model-len across slots the way llama.cpp splits
      # --ctx-size, so the configured 32768 IS the per-request window.
      contextLength: 32768
      maxOutputTokens: 8192
    pricing:
      # ⚠️ Basis corrected by ADR-0104. Every self-hosted price derived from
      # ADR-0096's €184/mo for a GEX44; the machine is ~$234/mo (€217), so the
      # €/hour term goes 0.2521 → 0.2968 and EVERY fleet price was ~18% low —
      # this one included, not just the image model that prompted the check.
      #
      # Re-derived from this model's MEASURED 45 tok/s, not scaled by 1.18:
      # scaling a stale measurement into a corrected basis only looks like a fix.
      strategy: weighted
      standard:
        inputPer1M: 1.04
        cachedInputPer1M: 0.21
        outputPer1M: 6.89
    backends:
      qwen3-8b-fast-local:
        ref: qwen3-8b-fast-local
        priority: 0
        modelNameOverride: "qwen3-8b-fast"   # = --served-model-name

  # ─────────────────────────────────────────────────────────────────────────
  # Z-Image-Turbo — IMAGE GENERATION, on the GPU fleet (ADR-0100).
  #
  # Moved here 2026-07-27 from the old home RTX A2000, where it was reached over
  # a public `*--poc.ssegning.com` edge with a static Bearer. It is now an
  # ordinary cluster-local backend like every other fleet model: ClusterIP,
  # CiliumNetworkPolicy, no Ingress, no certificate, no DNS record.
  #
  # Serving spec: charts/inference/values.yaml `z-image-turbo`.
  #
  # `kind: image` is load-bearing in charts/ai-model: it drops the InputToken /
  # OutputToken / TotalToken cost metadata and the tokens-per-minute burst rule,
  # both of which are meaningless here — an image response carries zero tokens,
  # so a tokens/min limit would never bind and the metadata slots would be spent
  # on constant zeroes.
  #
  # ⚠️ Thinking mode is disabled at the SERVER (`--chat-template-kwargs`), because
  # on by default it turned an 0.2s answer into an 18.2s one and could return an
  # EMPTY answer when max_tokens was small. A client that wants the reasoning
  # trace opts in per request with chat_template_kwargs.enable_thinking=true —
  # which is why `supportedParameters` does NOT advertise reasoning here.
  #
  # ⚠️ Pricing is deliberately high and is NOT a copy of the A2000 models'
  # numbers: ADR-0096 derives it from €184/mo ÷ 730h ÷ the MEASURED 15.05 tok/s.
  # A slow model on a rented card genuinely costs about an order of magnitude
  # more per token than the SaaS entries in this catalog. That is the make-vs-buy
  # signal ADR-0028 exists to surface — do not "fix" it by matching SaaS prices.
  openmythos-27b-local:
    enabled: false
    kind: text
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s           # ~15 tok/s: a long answer legitimately runs minutes
      connectionIdleTimeout: 1h
    info:
      displayName: "OpenMythos-27B (self-hosted)"
      contextLength: 16384           # = n_ctx_slot, NOT --ctx-size
      maxOutputTokens: 8192
    pricing:
      strategy: weighted             # cost-recovery per ADR-0028, basis ADR-0096
      standard:
        inputPer1M: 2.55
        cachedInputPer1M: 0.50
        outputPer1M: 17.00
    backends:
      openmythos-27b-local:
        ref: openmythos-27b-local
        priority: 0
        modelNameOverride: "openmythos-27b"   # = llama-server --alias

  # ─────────────────────────────────────────────────────────────────────────
  # Z-Image-Turbo — IMAGE GENERATION, on the GPU fleet (ADR-0100/0102).
  #
  # ⚠️ RE-FEDERATED 2026-07-29 (ADR-0106, issue #803), which is exactly what #814
  # asked for: "re-add a model + backend entry here once that lands, rather than
  # re-enabling this one." #814 removed an entry pointing at the dead home-cluster
  # edge host; this one points at the cluster-local LocalAI Service.
  #
  # Serving spec: charts/inference/values.yaml `z-image-turbo`.
  #
  # `kind: image` is load-bearing in charts/ai-model: it drops the InputToken /
  # OutputToken / TotalToken cost metadata and the tokens-per-minute burst rule,
  # both of which are meaningless here — an image response carries zero tokens,
  # so a tokens/min limit would never bind and the metadata slots would be spent
  # on constant zeroes.
  #
  # ✅ LOAD-GATED 2026-07-28 (ADR-0101) on hetzner-k8s-gpu-*, on the TUNED
  # configuration this restores — verified end to end by generating an image and
  # looking at it, not by checking for HTTP 200:
  #
  #   1024x1024   32.4 s median (34.30 / 32.18 / 32.38)   HTTP 200, PNG, matches prompt
  #   VRAM        7985 MiB of 20475 resident
  #
  # ✅ RE-CONFIRMED 2026-07-29 on the fresh volume (ADR-0106's outstanding gate):
  # 1024x1024 in 32.03 s, HTTP 200, a valid 1024x1024 PNG matching the prompt and
  # looked at; 512x512 in 4.76 s, twice, identical. Resident VRAM measured at
  # 7985 MiB and held there across 190 s of idle — the 2026-07-28 figures
  # reproduce exactly, on both latency and memory.
  #
  # Two refinements, neither of which changes the numbers above:
  #   - 7985 MiB is the RESIDENT footprint. A 1024x1024 generation transiently
  #     peaks at 14643 MiB (1 Hz sampling) — the extra ~6.6 GiB is activations,
  #     released afterwards. Budget the peak, not the resident, when sizing a
  #     co-tenant for this card: real headroom mid-generation is ~5.8 GiB.
  #   - ⚠️ VRAM was 5 MiB until the FIRST SUCCESSFUL REQUEST, then jumped to 7985
  #     and stayed. So the weights reach the card on first use rather than at
  #     start-up, which is what `LOAD_TO_MEMORY` is supposed to prevent — readiness
  #     may be reporting Ready before anything is loaded. It self-heals after one
  #     request and did NOT cost latency here, but it is worth confirming
  #     separately; do not assume the preload is doing its job because the model
  #     works.
  #
  # ⚠️ Everything above was FALSE of the configuration that preceded it, which had
  # a green ArgoCD tree, a Ready pod and a scraping /metrics endpoint while
  # returning 500. Read the numbers, not the dashboard (ADR-0101).
  #
  # ⚠️ The gate was passed on this hardware and this config, but the volume it ran
  # on has since been pruned, so the FIRST boot after this merge is a fresh-volume
  # install: LocalAI will fetch the `download_files` weights and cosign-verify the
  # backend for real (ADR-0105 flagged both as untested). Re-confirm one 1024×1024
  # generation after the first sync before treating this as done.
  #
  # ⚠️ RENAMED 2026-07-31 (issue #830): `z-image-turbo-local` → `z-image-turbo-internal`
  # (disableExternal: true — internal-plane only, LibreChat consumer only). Following
  # the `-internal` suffix convention for models not exposed on api.ai.camer.digital.
  # ⚠️ Cross-repo: ai-helm-values must rename any reference to `z-image-turbo-local`
  # → `z-image-turbo-internal` (x-ai-eg-model header, allowed-model lists, token tables)
  # in the same deployment window, or internal callers 404.
  z-image-turbo-internal:
    enabled: true
    kind: image
    # Blocked on the external host (api.ai.camer.digital) — only reachable on
    # the internal plane (LibreChat and other in-cluster callers). The image-gen
    # agent is a LibreChat-only consumer; external exposure is unnecessary attack
    # surface (issue #830).
    disableExternal: true
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      # 8 distilled steps at 1024×1024 is ~32 s — but the model holds a Mutex and
      # serves ONE request at a time, so a queued caller waits for those ahead of
      # it. 300s rides a short queue; it does NOT need to ride a cold start,
      # because LocalAI pre-loads its weights before reporting Ready (/readyz
      # gates on the preload), so no request ever meets a loading model.
      requestTimeout: 300s
      connectionIdleTimeout: 1h
    info:
      # NOT "FP8" — the published weights are FP32; we serve a Q4 GGUF quant. The
      # old display name advertised a quantization this model has never had.
      displayName: "Z-Image-Turbo (self-hosted, image generation)"
    pricing:
      # ✅ MEASURED ON THE TUNED CONFIGURATION, 2026-07-28:
      #
      #   €217/mo ÷ 730 h           = €0.2973/hour     (basis: ADR-0104)
      #   3600 ÷ 32.4 s             = 111.1 images/hour
      #   €0.2973 ÷ 111.1           = €0.00268/image raw
      #   × 3.45 duty-cycle uplift  = €0.00923  ≈ $0.0100
      #
      # ⚠️ The 3.45x duty-cycle uplift is INHERITED from the old A2000 and has
      # never been measured on this fleet (ADR-0104). It is the only unverified
      # term left in this figure. Re-derive from measured throughput if the
      # tuning changes — never scale the old number.
      strategy: flatPerRequest
      standard:
        effectivePerRequest: 0.0100
    backends:
      z-image-turbo-internal:
        ref: z-image-turbo-internal
        priority: 0
        # ⚠️ The id the ENGINE serves, read off /v1/models — not the catalog key.
        # Lowercase `z-image-turbo` because we define the model ourselves under
        # our own filename (ADR-0105); it was `Z-Image-Turbo` while we served the
        # gallery entry directly, because LocalAI serves a model under the name of
        # whatever DEFINES it. Must equal `serving.servedModel` in
        # charts/inference. Re-read /v1/models after any change to how the
        # model is defined — it is not derivable from the catalog key.
        modelNameOverride: "z-image-turbo"

  # ── Qwen2.5-3B-AWQ — DISABLED (was the fleet's coding model) ───────────
  #
  # Swapped by qwen3-5-2b (one GPU, one model) on 2026-08-10. Kept as a
  # rollback surface — re-enable to roll back. Its backend was removed
  # (backends for disabled models are removed — check-model-catalogs.sh).
  #
  # ⚠️ PRICING WAS AN ESTIMATE at a CONSERVATIVE 100 tok/s (formula ADR-0104:
  #   €0.2968/h ÷ 3600 ÷ tok/s × 3.45 × 1.09 = $/1M output, split 1 : 0.15 : 0.03).
  #   Re-derive from the MEASURED gate throughput before treating as final —
  #   never merge on a guessed number (the 30B rule, see the #938 revert).
  #
  # Qwen2.5 is non-thinking → `supportedParameters` is *spStandard (no
  # `reasoning` advertised). Tool calling via the hermes parser.
  qwen25-3b-awq-local:
    enabled: false                  # DISABLED — swapped by qwen3-5-2b (one GPU). Re-enable to roll back.
    kind: text
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen2.5-3B-AWQ (self-hosted)"
      contextLength: 32768           # = vLLM --max-model-len
      maxOutputTokens: 8192
      supportedParameters: *spStandard
    pricing:
      strategy: weighted             # cost-recovery per ADR-0028, basis ADR-0104
      standard:
        inputPer1M: 0.47             # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
        cachedInputPer1M: 0.09       # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
        outputPer1M: 3.10            # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
    backends:
      qwen25-3b-awq-local:
        ref: qwen25-3b-awq-local
        priority: 0
        modelNameOverride: "qwen25-3b-awq"   # = vLLM --served-model-name

  # ── Qwen3.5-2B — the fleet's coding model (ADR-0101 load-gated) ────────
  #
  # Serving spec: charts/inference/values.yaml `qwen3-5-2b`.
  #
  # ⚠️ PRICING IS AN ESTIMATE at a CONSERVATIVE 100 tok/s (formula ADR-0104:
  #   €0.2968/h ÷ 3600 ÷ tok/s × 3.45 × 1.09 = $/1M output, split 1 : 0.15 : 0.03).
  #   Re-derive from the MEASURED gate throughput before treating as final —
  #   never merge on a guessed number (the 30B rule, see the #938 revert).
  #
  # Qwen3.5 is non-thinking by default → `supportedParameters` is *spStandard
  # (no `reasoning` advertised; clients opt in per request). Tool calling via
  # the qwen3_coder parser (Qwen's recommended parser for Qwen3.5).
  qwen3-5-2b-local:
    enabled: true
    kind: text                      # multimodal, but catalogued `kind: text` (qwen3-vl-4b)
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3.5-2B (self-hosted)"
      contextLength: 262144          # 256k = full native context (model_max_length), = vLLM --max-model-len
      maxOutputTokens: 8192
      supportedParameters: *spStandard
    pricing:
      strategy: weighted             # cost-recovery per ADR-0028, basis ADR-0104
      standard:
        inputPer1M: 0.47             # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
        cachedInputPer1M: 0.09       # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
        outputPer1M: 3.10            # ESTIMATE @ 100 tok/s — re-derive from measured tok/s
    backends:
      qwen3-5-2b-local:
        ref: qwen3-5-2b-local
        priority: 0
        modelNameOverride: "qwen3-5-2b"   # = vLLM --served-model-name

#   # Self-hosted Qwen3-4B on the home RTX A2000 (ADR-0022). Routed exactly like a
#   # SaaS model; pricing flat $0 (owned hardware) so no monthly-budget rule, but
#   # the per-plan burst req/min + tokens/min limits still apply. The backend
#   # serves under the name set by the runtime's --model_name (qwen3-4b), so
#   # modelNameOverride rewrites the route id → that. ⚠️ Confirm `qwen3-4b` matches
#   # the served-model-name on the first test call; adjust if huggingfaceserver
#   # advertises the HF path instead.
#   #
#   # ── Model card (Qwen/Qwen3-4B · Apache-2.0) ────────────────────────────────
#   #   Causal LM, 4.0B params (3.6B non-embedding), 36 layers, GQA 32 Q / 8 KV.
#   #   Native context 32,768 (→131,072 with YaRN); we CLAMP to 16,384 to fit KV
#   #   in the 12GB A2000. Hybrid thinking / non-thinking mode (→ *spReasoning),
#   #   tool calling, 100+ languages. Recommended sampling (think mode): temp 0.6 /
#   #   top_p 0.95 / top_k 20 / min_p 0 — "do NOT use greedy decoding". Non-think:
#   #   temp 0.7 / top_p 0.8 / top_k 20. Full card + cost model in
#   #   docs/patterns/self-hosted-model-serving.md §12-§13.
#   #   ⚠️ Window = 16384 tokens HARD (prompt+completion); a >16k prompt 400s. This
#   #   is the small/owned tier — ROUTE big-context or long-output (Qwen recommends
#   #   up to 32k–38k output for hard coding/math; thinking mode also eats output
#   #   tokens) work to the SaaS models. 16k/8k kept on purpose (12GB VRAM); upgrade
#   #   path = AWQ-INT4 → ~32k. YaRN/130k not viable on one A2000. See doc §12.1.
#   #
#   # ── Cost (ADR-0028: cost-recovery pricing for owned-hardware models) ────────
#   #   NOT $0. Real operating cost ≈ €0.05/hour while serving (≈ €0.018/h amortized
#   #   A2000-$449-launch + 3/28-vCPU CPU-share + 6GB RAM-share over 3yr + ≈€0.032/h
#   #   power @ €0.34/kWh in Erlangen — full derivation in the self-hosted-model
#   #   doc §13). Capex accrues even when idle, and PoC utilization is low/bursty,
#   #   so we price for **cost recovery at realistic utilization**, not the
#   #   best-case saturated marginal cost. Weighted so LMCache prefix-cache hits
#   #   bill at the near-free cached rate. Every number is a documented knob
#   #   (ADR-0028 §Pricing); re-tune as utilization data arrives.
#   qwen3-4b-local:
#     enabled: false                  # DISABLED — swapped by qwen25-3b-awq-local (one GPU). Re-enable to roll back.
#     kind: text
#     # Single self-hosted backend by design (one GPU, one model). The default
#     # 2-backend HA guard doesn't apply; a cloud fallback at priority 1 is the
#     # documented optional upgrade (ADR-0022), not a requirement.
#     minBackends: 1
#     # The model is always-on (ADR-0029: plain Deployment, replicas:1), so warm
#     # requests are fast. The slow case is a DEPLOY: `Recreate` restarts the single
#     # pod, which reloads multi-GB weights (~30-60s, no model pod meanwhile), so a
#     # request landing then can take tens of seconds. Without an explicit timeout
#     # the route uses Envoy's ~15s default → 504 "upstream request timeout". 600s
#     # rides a restart AND a long generation (8k tokens @ ~30-50 tok/s). Keep in
#     # sync with charts/model-serving-qwen3-4b edgeAuth.proxy.responseTimeout (Caddy hop)
#     # — both must exceed it. Path: Envoy(Hetzner) → Caddy → model.
#     timeout:
#       requestTimeout: 600s
#       connectionIdleTimeout: 1h
#     info:
#       displayName: "Qwen3-4B (self-hosted)"
#       contextLength: 16384          # = --max-model-len (native 32k, clamped for 12GB VRAM)
#       maxOutputTokens: 8192
