# ai-models orchestrator. The chart renders one ApplicationSet that
# generates child Applications for backends + each enabled model.
#
# Pre-split (chart v1.x), this same values.yaml drove a single Application
# rendering all the K8s resources directly. Post-split (v2.x), the data is
# unchanged in shape; the orchestrator template fans it out into N child
# Applications, one per model + one for backends. See ADR-0012.

# ────────────────────────────────────────────────────────────────────────
# ArgoCD wiring — where the generated child Applications live and which
# upstream branch they sync from.
# ────────────────────────────────────────────────────────────────────────
argocd:
  # Namespace the ApplicationSet (and the children it generates) live in.
  # `argocd` is the standard install; override if the operator lives elsewhere.
  namespace: argocd
  # ArgoCD project the children belong to.
  project: ai
  # OCI chart-float (ADR-0055): children source the leaf charts (ai-models-backends,
  # ai-models-info, ai-model) from the OCI registry on a floating semver range —
  # full chart path in repoURL + chart "." (the applicationset builds
  # `<chartRegistry>/<chartName>`). Replaces the old tag-pinned ai-helm path source.
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  destination:
    # The home-remote cluster every child Application targets. This repo's
    # invariant (ADR-0017) is that workloads NEVER deploy to the cluster
    # ArgoCD itself runs in. The destination helper hard-fails the render
    # if this resolves to `in-cluster` / `https://kubernetes.default.svc`
    # unless `allowInCluster: true` is set below.
    name: home-remote
    # Escape hatch — only set true if you genuinely want in-cluster.
    allowInCluster: false
    namespace: converse
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ────────────────────────────────────────────────────────────────────────
# Monthly estimated-spend guardrails. Each plan value is in real USD but
# the chart converts to micro-USD because `llm_custom_total_cost` is
# emitted by Envoy AI Gateway as an integer in micro-USD.
# ────────────────────────────────────────────────────────────────────────
# Rate-limit tiers (ADR-0021). Each plan drives up to three rule families per
# model in the BackendTrafficPolicy:
#   - burst.requestsPerMin  → per-USER req/min cap   (keyed on x-account-id)
#   - burst.tokensPerMin    → per-USER token/min cap (keyed on x-account-id,
#                             cost from the llm_total_token AIEG metadata)
#   - monthlyBudgetUsd      → per-ORG monthly micro-USD budget (keyed on
#                             x-org-id). OMITTED for a plan ⇒ uncapped budget.
# x-billing-plan (set by the AuthConfig from the Keycloak `billing_plan` claim,
# or "internal" on the internal plane) selects which plan's rules apply.
# Shared cross-model monthly-budget cutover (#532). Single lever propagated to
# every per-model ai-model child. When true: each model's BTP drops its per-model
# budget rule and merges with the gateway-wide BTP's ONE `shared: true` counter
# per (user, plan). ⚠️ Keep false until Envoy Gateway ≥ v1.8.2 (bug #9244), and
# flip core-gateway `backendTrafficPolicy.monthlyBudget.enabled` in the SAME
# rollout so there is never a window with neither budget active.
# CUTOVER 2026-07-08: enabled — EG is live on v1.8.2 (#9244 fixed), paired with
# core-gateway monthlyBudget.enabled: true.
sharedBudget:
  enabled: true

rateLimitBudgeting:
  plans:
    free:
      # Per-person monthly budget. DORMANT since the #532 shared-budget cutover
      # (sharedBudget.enabled gates the per-model rule off) — the LIVE knob is
      # core-gateway backendTrafficPolicy.monthlyBudget.plans. Kept in sync
      # (15, 2026-07-08) so a rollback to per-model budgets keeps the same cap.
      monthlyBudgetUsd: 15
      burst:
        requestsPerMin: 200
        # Raised 200k → 1M (2026-06-12) to match the 1M context ceiling
        # (charts/ai-models-info) — a single max-context request no longer
        # blows the per-minute token bucket. The monthly budget ($50) stays the
        # real cost cap; this is just the per-minute RATE.
        tokensPerMin: 1000000
    pro:
      monthlyBudgetUsd: 200
      burst:
        requestsPerMin: 400
        tokensPerMin: 2000000     # 400k → 2M: a couple of max-context requests/min
    # Customer "enterprise" tier — the top self-serve plan lightbridge keys can be
    # minted on (lightbridge-authz billing.plans id `enterprise`, x-billing-plan set
    # from the key's introspected plan). Explicit HIGH caps (≈2× pro), NOT uncapped —
    # a bounded ceiling still protects the shared budget/backends. Adjust to taste.
    # monthlyBudgetUsd DORMANT (see free); the LIVE monthly cap is
    # core-gateway backendTrafficPolicy.monthlyBudget.plans.enterprise — keep in sync.
    enterprise:
      monthlyBudgetUsd: 1000
      burst:
        requestsPerMin: 800
        tokensPerMin: 4000000
    # Remote service accounts (GitHub runners, …) on the EXTERNAL plane.
    # Uncapped budget (no monthlyBudgetUsd) — burst-only.
    service:
      burst:
        requestsPerMin: 600
        tokensPerMin: 2000000
    # In-cluster services (LibreChat, cron-jobs, k8s SAs) on the INTERNAL plane.
    # Uncapped budget — burst-only.
    internal:
      burst:
        requestsPerMin: 600
        tokensPerMin: 2000000

gatewayRef:
  name: core-gateway
  namespace: converse-gateway
  # Pin model routes to the Gateway's HTTPS listener so they're HTTPS-only; the
  # :80 listener is reserved for the http→https redirect + the ACME solver.
  sectionName: api-https
  # Internal plane (ADR-0021): also attach each model route to the api-internal
  # listener so in-cluster callers reach the same backends. Keep in sync with
  # core-gateway gateway.internal.enabled (the listener must exist).
  internalSectionName: api-internal

# ────────────────────────────────────────────────────────────────────────
# Models-info endpoint (charts/ai-models-info). Adds a sync-wave 1
# child Application that serves an OpenRouter-shape catalog at
# api.ai.camer.digital/v1/models/info so opencode's
# @vymalo/opencode-models-info plugin can enrich its in-process model
# registry. See ADR-0015.
# ────────────────────────────────────────────────────────────────────────
modelsInfo:
  enabled: true
  # Kinds we omit from the catalog (chat-only catalog by default).
  excludeKinds:
    - embedding
    - reranker
  # Route/host/path live in `charts/ai-models-info`'s own defaults
  # (core-gateway api-https listener, api.ai.camer.digital, exact path
  # /v1/models/info). Override there via ai-gitops if a different env
  # needs different values.

backendDefaults:
  fireworks: &fireworksBackend
    schema: OpenAI
    prefix: "/inference/v1"
    fqdn:
      hostname: api.fireworks.ai
      port: 443
    securityType: APIKey
    tlsHostname: api.fireworks.ai
  deepinfra: &deepinfraBackend
    schema: OpenAI
    prefix: "/v1/openai"
    fqdn:
      hostname: api.deepinfra.com
      port: 443
    securityType: APIKey
    tlsHostname: api.deepinfra.com
  googleAiStudio: &googleAiStudioBackend
    schema: OpenAI
    prefix: v1beta/openai
    fqdn:
      hostname: generativelanguage.googleapis.com
      port: 443
    securityType: APIKey
    tlsHostname: generativelanguage.googleapis.com
  # Self-hosted model on the home GPU (ADR-0022). vLLM via KServe's
  # huggingfaceserver, exposed by Knative→Traefik→cert-manager at a public,
  # publicly-trusted FQDN — so it's reached exactly like a SaaS backend:
  # OpenAI schema, :443, System CA. The huggingfaceserver OpenAI routes sit
  # under /openai/v1. ⚠️ Confirm the hostname against the live InferenceService
  # `.status.url` after first deploy — KServe/Knative routing can shift it.
  vllmLocal: &vllmLocalBackend
    schema: OpenAI
    prefix: "/openai/v1"
    fqdn:
      # The model is cluster-local on the home cluster; this is the Traefik
      # edge-auth IngressRoute domain (charts/model-serving-qwen3-4b edgeAuth.host), which
      # validates the Bearer below before proxying to the cluster-local ksvc.
      # ⚠️ Must match charts/model-serving-qwen3-4b edgeAuth.host exactly.
      hostname: qwen3-4b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: qwen3-4b--poc.ssegning.com

  # Self-hosted Qwen2.5-3B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver, same pattern as vllmLocal but a distinct edge FQDN.
  # AWQ 4-bit quantized; prefix is /openai/v1 (KServe OpenAI-compatible route).
  vllmLocalAwq: &vllmLocalAwqBackend
    schema: OpenAI
    prefix: "/openai/v1"
    fqdn:
      hostname: qwen25-3b-awq--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: qwen25-3b-awq--poc.ssegning.com

  # Self-hosted DeepSeek-R1-Distill-Qwen-1.5B on the home GPU — vLLM via KServe's
  # huggingfaceserver, same pattern as vllmLocalAwq but a distinct edge FQDN.
  # BF16 reasoning model (Qwen2.5-Math base); prefix is /openai/v1 (KServe).
  vllmDeepseek: &vllmDeepseekBackend
    schema: OpenAI
    prefix: "/openai/v1"
    fqdn:
      hostname: deepseek-r1-1-5b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: deepseek-r1-1-5b--poc.ssegning.com

  # Self-hosted Qwen3-8B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver, same pattern as the other local vLLM backends but a
  # distinct edge FQDN. AWQ 4-bit quantized (8.2B params, ~5 GB); prefix is
  # /openai/v1 (KServe OpenAI-compatible route).
  vllmLocal8b: &vllmLocal8bBackend
    schema: OpenAI
    prefix: "/openai/v1"
    fqdn:
      hostname: qwen3-8b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: qwen3-8b--poc.ssegning.com

  # Self-hosted Ministral-3B-Instruct-2410 (AWQ) on the home GPU — vLLM via
  # KServe's huggingfaceserver, same pattern as the other local vLLM backends
  # but a distinct edge FQDN. AWQ 4-bit quantized (3B params, ~2 GB); prefix is
  # /openai/v1 (KServe OpenAI-compatible route). Mistral tool-call parser.
  vllmLocalMinistral: &vllmLocalMinistralBackend
    schema: OpenAI
    prefix: "/openai/v1"
    fqdn:
      hostname: ministral-3b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: ministral-3b--poc.ssegning.com

  # Self-hosted Qwen2-VL-2B-Instruct on the home GPU.
  vllmLocalQwen2Vl: &vllmLocalQwen2VlBackend
    schema: OpenAI
    prefix: "/v1"
    fqdn:
      hostname: qwen2-vl-2b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: qwen2-vl-2b--poc.ssegning.com

modelDefaults:
  backendRefs:
    fwPrimary: &fwBackendPrimary
      ref: fw-01
      priority: 0
    fwSecondary: &fwBackendSecondary
      ref: fw-02
      priority: 1
    deepinfraPrimary: &deepinfraBackendPrimary
      ref: deepinfra-01
      priority: 0
    deepinfraSecondary: &deepinfraBackendSecondary
      ref: deepinfra-02
      priority: 1
    googleAiStudioPrimary: &googleAiStudioBackendPrimary
      ref: google-ai-studio-01
      priority: 0
    googleAiStudioSecondary: &googleAiStudioBackendSecondary
      ref: google-ai-studio-02
      priority: 1
    vllmLocalPrimary: &vllmLocalBackendPrimary
      ref: vllm-local-01
      priority: 0

# ────────────────────────────────────────────────────────────────────────
# supported_parameters anchors — flow through to the models-info catalog
# (each model's `info.supportedParameters` → OpenRouter-shape
# `supported_parameters[]`). The OpenAI-compatible Fireworks/DeepInfra
# endpoints accept the standard sampling+tool set; agentic/thinking models
# additionally expose `reasoning`. Reranker/embedding models are excluded
# from the catalog (excludeKinds) so they carry no list.
#
# Verified 2026-06-02 against the backend model pages (DeepInfra / Fireworks).
#
# ⚠️ `reasoning` here declares CAPABILITY only ("this model exposes a thinking
# channel") — it does NOT set runtime behaviour. The runtime *cap* on how much
# a model thinks lives client-side in the opencode well-known
# (`charts/librechat-opencode-wellknown/values.yaml` →
# `config.provider.camer-digital.models.<id>.options.reasoningEffort`, default
# `low`, with a `thinking` variant at `high`). Issue #534 / PR #631 — we cap
# rather than disable, because a hard off regresses the agentic coding models
# this catalog is mostly made of. There is deliberately NO default-effort field
# on the catalog entries: the OpenRouter shape this feeds
# (`ai-models-info` → `supported_parameters[]`) has no field for a default
# reasoning budget, and inventing one would only confuse the consumer plugin.
# If you add a thinking-capable model here, add its cap to the well-known too
# (and check first whether its backend honours `reasoning_effort` at all —
# always-on models like Kimi K2.7-Code reject it).
supportedParams:
  # Agentic chat models with a thinking/reasoning mode (GLM-5.2, Kimi,
  # MiniMax, DeepSeek-V4, Qwen3.7-Plus).
  reasoning: &spReasoning
    - tools
    - tool_choice
    - temperature
    - top_p
    - top_k
    - max_tokens
    - stop
    - frequency_penalty
    - presence_penalty
    - seed
    - response_format
    - structured_outputs
    - reasoning
  # Chat models without an exposed reasoning channel (Gemma-4: tools +
  # vision but no thinking mode).
  standard: &spStandard
    - tools
    - tool_choice
    - temperature
    - top_p
    - top_k
    - max_tokens
    - stop
    - frequency_penalty
    - presence_penalty
    - seed
    - response_format

# Per-backend API-key ExternalSecrets — flows through to the
# `ai-models-backends` child (templates/externalsecret.yaml), which renders
# one chart-owned ExternalSecret per unique `secretRef.name` (deduped) from
# the store below. Replaces the out-of-band `aii-secret` provisioning.
#
# Each backend's `externalSecret.{key,property}` resolves against the
# consolidated ssegning-aws secret `ai/camer/digital/prod/env`, one property
# per provider key. The old out-of-band provisioner (`aii-secret` / the
# `secrets` Application) has been retired now these are chart-owned.
externalSecrets:
  enabled: true
  secretStore: ssegning-aws
  refreshInterval: 1h
  apiKeyDataKey: apiKey

# Backends — flow into the `ai-models-backends` child as its `backends:`
# values, and into each `ai-model` child as `backendsInventory:` for
# resourceName lookup.
backends:
  fw-01:
    <<: *fireworksBackend
    secretRef:
      name: fireworks-api-key-01
    resourceName: fw-backend-01-svc
    externalSecret:
      key: ai/camer/digital/prod/env
      property: fireworks_api_key_01
  fw-02:
    <<: *fireworksBackend
    resourceName: fw-backend-02-svc
    secretRef:
      name: fireworks-api-key-02
    externalSecret:
      key: ai/camer/digital/prod/env
      property: fireworks_api_key_02
  deepinfra-01:
    <<: *deepinfraBackend
    resourceName: deepinfra-backend-01-svc
    secretRef:
      name: deepinfra-api-key-01
    externalSecret:
      key: ai/camer/digital/prod/env
      property: deepinfra_api_key_01
  deepinfra-02:
    <<: *deepinfraBackend
    resourceName: deepinfra-backend-02-svc
    # Independent key from deepinfra-01 (own Secret name → own ExternalSecret;
    # the chart dedupes by secret name, so a distinct name is required for the
    # second key to render). Mirrors the fw/google primary/secondary pattern.
    secretRef:
      name: deepinfra-api-key-02
    externalSecret:
      key: ai/camer/digital/prod/env
      property: deepinfra_api_key_02
  google-ai-studio-01:
    <<: *googleAiStudioBackend
    resourceName: google-ai-studio-backend-01-svc
    secretRef:
      name: google-ai-studio-api-key-01
    externalSecret:
      key: ai/camer/digital/prod/env
      property: google_ai_studio_api_key_01
  google-ai-studio-02:
    <<: *googleAiStudioBackend
    resourceName: google-ai-studio-backend-02-svc
    secretRef:
      name: google-ai-studio-api-key-02
    externalSecret:
      key: ai/camer/digital/prod/env
      property: google_ai_studio_api_key_02

  # Self-hosted Qwen3-4B on the home GPU (ADR-0022). Same API key value as the
  # model pod's VLLM_API_KEY (both pull ssegning-aws → vllm_local_api_key); this
  # Secret lives on Hetzner/ns converse for the BackendSecurityPolicy, the other
  # on the home cluster/ns converse-poc for the pod — different clusters, no
  # collision. The ai-models-backends ExternalSecret writes it under the default
  # `apiKey` data key (what the BSP expects).
  vllm-local-01:
    <<: *vllmLocalBackend
    resourceName: vllm-local-01-svc
    secretRef:
      name: vllm-local-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted Qwen3.5-4B (Q4_K_M GGUF) via llama.cpp llama-server. Like
  # vllm-local-01 but `prefix: /v1` (llama-server, NOT KServe's /openai/v1) and a
  # distinct edge host. STAGED — only referenced by the (disabled) qwen3-5-4b-local
  # model, so these CRs render but route nothing until cutover. ⚠️ host MUST match
  # charts/model-serving-qwen3-5 ingress host. Engine: ADR-0032; paper:
  # docs/models/qwen3.5-4b-q4.md. Reuses the vllm_local_api_key SM property for now.
  llama-local-01:
    schema: OpenAI
    prefix: "/v1"
    fqdn:
      hostname: qwen3-5-4b--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: qwen3-5-4b--poc.ssegning.com
    resourceName: llama-local-01-svc
    secretRef:
      name: llama-local-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted Qwen2.5-3B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver (AWQ 4-bit quantized). Same API key as the other local
  # vLLM models. Distinct edge host MUST match charts/model-serving-qwen25-3b-awq
  # ingress host. DISABLED until cutover (one GPU → one model).
  vllm-local-awq-01:
    <<: *vllmLocalAwqBackend
    resourceName: vllm-local-awq-01-svc
    secretRef:
      name: vllm-local-awq-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted DeepSeek-R1-Distill-Qwen-1.5B on the home GPU — vLLM via KServe's
  # huggingfaceserver (BF16 reasoning model). Same API key as the other local
  # vLLM models. Distinct edge host MUST match charts/model-serving-deepseek-r1-1-5b
  # ingress host. DISABLED by default (one GPU → one model).
  vllm-deepseek-01:
    <<: *vllmDeepseekBackend
    resourceName: vllm-deepseek-01-svc
    secretRef:
      name: vllm-local-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted Qwen3-8B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver (AWQ 4-bit quantized, 8.2B params). Same API key as the
  # other local vLLM models. Distinct edge host MUST match
  # charts/model-serving-qwen3-8b ingress host. DISABLED by default (one GPU →
  # one model).
  vllm-local-8b-01:
    <<: *vllmLocal8bBackend
    resourceName: vllm-local-8b-01-svc
    secretRef:
      name: vllm-local-8b-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted Ministral-3B-Instruct-2410 (AWQ) on the home GPU — vLLM via
  # KServe's huggingfaceserver (AWQ 4-bit quantized, 3B params, ~2 GB). Same
  # API key as the other local vLLM models. Distinct edge host MUST match
  # charts/model-serving-ministral-3b ingress host. DISABLED by default (one
  # GPU → one model). ⚠️ Tool calling requires the official gated repo or a
  # chat-template override — the community AWQ repo strips tool-call tokens.
  vllm-local-ministral-01:
    <<: *vllmLocalMinistralBackend
    resourceName: vllm-local-ministral-01-svc
    secretRef:
      name: vllm-local-ministral-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # Self-hosted Tongyi-MAI Z-Image-Turbo FP8 on the home GPU — custom
  # Rust/Candle server (no Python, no PyTorch, 6B params FP8). Different
  # schema/prefix from the vLLM backends: the server natively speaks OpenAI
  # /v1/images/generations at root (/). No server-side auth — the Envoy AI
  # Gateway enforces the Bearer token. Distinct edge host MUST match
  # charts/model-serving-zimage-turbo ingress host. DISABLED by default
  # (one GPU → one model).
  zimage-local-01:
    schema: OpenAI
    prefix: "/"
    fqdn:
      hostname: z-image-turbo--poc.ssegning.com
      port: 443
    securityType: APIKey
    tlsHostname: z-image-turbo--poc.ssegning.com
    resourceName: zimage-local-01-svc
    secretRef:
      name: zimage-local-api-key
  vllm-local-qwen2-vl-01:
    <<: *vllmLocalQwen2VlBackend
    resourceName: vllm-local-qwen2-vl-01-svc
    secretRef:
      name: vllm-local-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  # ── GPU fleet (cluster-local, ADR-0095) ──────────────────────────────────
  # Everything above this line is either a SaaS provider or a legacy self-hosted
  # model reached over the public internet at *--poc.ssegning.com. Backends below
  # are models on the Hetzner GPU nodes, in THIS cluster — so they are reached at
  # a ClusterIP Service over plain HTTP on the pod network.
  #
  # ⚠️ `tlsHostname` is deliberately ABSENT and must stay absent — traffic never
  # leaves the cluster network, so there is no TLS and no BackendTLSPolicy.
  # Adding one would break the backend: the model speaks plain HTTP.
  #
  # `securityType: APIKey` IS set, and must stay in lockstep with the fleet
  # security policy (ADR-0097): the model enforces the same Bearer natively
  # (llama.cpp `--api-key-file`), so a backend that omits the key gets 401 on
  # every request, and one that sends a key to a model with hardening disabled
  # is merely harmless. Both sides read the SAME ssegning-aws property.
  # The NetworkPolicy remains the primary control; this is defence in depth.
  #
  # ⚠️ `fqdn.hostname` MUST be `<name>.inference.svc.cluster.local`, where <name>
  # is the charts/model-serving catalog entry (also the Service name).
  # tools/check-model-catalogs.sh fails CI if it does not resolve to a live model.
  # Fast tier — vLLM. Same cluster-local shape as openmythos below; `prefix: /v1`
  # is vLLM's own OpenAI server (NOT KServe's /openai/v1).
  qwen3-8b-fast-local:
    schema: OpenAI
    prefix: "/v1"
    fqdn:
      hostname: qwen3-8b-fast.inference.svc.cluster.local
      port: 8080
    securityType: APIKey
    resourceName: qwen3-8b-fast-local-svc
    secretRef:
      name: qwen3-8b-fast-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

  openmythos-27b-local:
    schema: OpenAI
    prefix: "/v1"                  # llama-server, NOT KServe's /openai/v1
    fqdn:
      hostname: openmythos-27b.inference.svc.cluster.local
      port: 8080
    securityType: APIKey
    resourceName: openmythos-27b-local-svc
    secretRef:
      name: openmythos-27b-api-key
    externalSecret:
      key: ai/camer/digital/prod/env
      property: vllm_local_api_key

# Models — each entry becomes one child Application using the `ai-model`
# leaf chart. Setting `enabled: false` on a model skips its Application
# (the AppSet controller will delete a previously-generated child).
#
# Pricing strategies driving the `llm_custom_total_cost` CEL:
#   weighted        — input / cached-input / output prices differ
#   tieredWeighted  — same as weighted, but use `longContext` prices when
#                     prompt size exceeds `thresholdTokens`
#   flat            — one blended price for total tokens

models:

  # ─────────────────────────────────────────────────────────────────────────
  # Qwen3-8B-AWQ — the SPEED tier (vLLM + LMCache) on the second GPU.
  #
  # The counterpart to openmythos-27b: pick this for anything interactive or
  # agentic, that one for considered analysis. Two cards means both are available
  # at once, which is new (ADR-0094).
  #
  # Measured (inference-ops docs/benchmarks/2026-07-26-qwen3-8b-awq-vllm-rtx4000-ada.md):
  #   45 tok/s decode (3x the 27B) · TTFT ~45ms · tool calling OK · 401 without key
  #
  # Pricing per ADR-0096: same €0.252/h node cost as the 27B, but 3x the token
  # rate, so the per-token cost is ~1/3. Derivation:
  #   €0.252/h ÷ (45 tok/s × 3600) = €1.56/1M output at saturation
  #   × 3.45 duty-cycle uplift ⇒ €5.38/1M ⇒ ~$5.85, rounded to $5.85/$0.88/$0.18
  #   at ADR-0028's 1 : 0.15 : 0.03 out/in/cached split.
  # Still above most SaaS entries — rented hardware at low duty cycle is simply
  # expensive — but a third of the 27B, which is the honest signal: prefer this
  # tier unless the task needs the bigger model.
  qwen3-8b-fast-local:
    enabled: true
    kind: text
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3-8B (self-hosted, fast)"
      # vLLM does NOT split --max-model-len across slots the way llama.cpp splits
      # --ctx-size, so the configured 32768 IS the per-request window.
      contextLength: 32768
      maxOutputTokens: 8192
    pricing:
      strategy: weighted
      standard:
        inputPer1M: 0.88
        cachedInputPer1M: 0.18
        outputPer1M: 5.85
    backends:
      qwen3-8b-fast-local:
        ref: qwen3-8b-fast-local
        priority: 0
        modelNameOverride: "qwen3-8b-fast"   # = --served-model-name

  # ─────────────────────────────────────────────────────────────────────────
  # OpenMythos-27B — the first model on the Hetzner GPU fleet (ADR-0094/0095).
  # Security-analysis QUALITY tier, explicitly not a speed tier.
  #
  # Serving spec: charts/model-serving/values.yaml `openmythos-27b`.
  # Load gate + every number below: inference-ops
  # docs/benchmarks/2026-07-26-openmythos-27b-q4k-rtx4000-ada.md
  #
  # Measured on the card (llama.cpp build 10133, RTX 4000 SFF Ada):
  #   decode 15.05 tok/s · prefill 625 tok/s · 17780/20475 MiB · tool calling OK
  #
  # ⚠️ contextLength is 16384 because that is `n_ctx_slot` — llama.cpp splits
  # `--ctx-size 32768` across the 2 slots. Advertising 32768 would promise a
  # window the model refuses.
  #
  # ⚠️ Thinking mode is disabled at the SERVER (`--chat-template-kwargs`), because
  # on by default it turned an 0.2s answer into an 18.2s one and could return an
  # EMPTY answer when max_tokens was small. A client that wants the reasoning
  # trace opts in per request with chat_template_kwargs.enable_thinking=true —
  # which is why `supportedParameters` does NOT advertise reasoning here.
  #
  # ⚠️ Pricing is deliberately high and is NOT a copy of the A2000 models'
  # numbers: ADR-0096 derives it from €184/mo ÷ 730h ÷ the MEASURED 15.05 tok/s.
  # A slow model on a rented card genuinely costs about an order of magnitude
  # more per token than the SaaS entries in this catalog. That is the make-vs-buy
  # signal ADR-0028 exists to surface — do not "fix" it by matching SaaS prices.
  openmythos-27b-local:
    enabled: true
    kind: text
    minBackends: 1                   # one GPU, one backend, by design
    timeout:
      requestTimeout: 600s           # ~15 tok/s: a long answer legitimately runs minutes
      connectionIdleTimeout: 1h
    info:
      displayName: "OpenMythos-27B (self-hosted)"
      contextLength: 16384           # = n_ctx_slot, NOT --ctx-size
      maxOutputTokens: 8192
    pricing:
      strategy: weighted             # cost-recovery per ADR-0028, basis ADR-0096
      standard:
        inputPer1M: 2.55
        cachedInputPer1M: 0.50
        outputPer1M: 17.00
    backends:
      openmythos-27b-local:
        ref: openmythos-27b-local
        priority: 0
        modelNameOverride: "openmythos-27b"   # = llama-server --alias

  # Self-hosted Qwen3-4B on the home RTX A2000 (ADR-0022). Routed exactly like a
  # SaaS model; pricing flat $0 (owned hardware) so no monthly-budget rule, but
  # the per-plan burst req/min + tokens/min limits still apply. The backend
  # serves under the name set by the runtime's --model_name (qwen3-4b), so
  # modelNameOverride rewrites the route id → that. ⚠️ Confirm `qwen3-4b` matches
  # the served-model-name on the first test call; adjust if huggingfaceserver
  # advertises the HF path instead.
  #
  # ── Model card (Qwen/Qwen3-4B · Apache-2.0) ────────────────────────────────
  #   Causal LM, 4.0B params (3.6B non-embedding), 36 layers, GQA 32 Q / 8 KV.
  #   Native context 32,768 (→131,072 with YaRN); we CLAMP to 16,384 to fit KV
  #   in the 12GB A2000. Hybrid thinking / non-thinking mode (→ *spReasoning),
  #   tool calling, 100+ languages. Recommended sampling (think mode): temp 0.6 /
  #   top_p 0.95 / top_k 20 / min_p 0 — "do NOT use greedy decoding". Non-think:
  #   temp 0.7 / top_p 0.8 / top_k 20. Full card + cost model in
  #   docs/patterns/self-hosted-model-serving.md §12-§13.
  #   ⚠️ Window = 16384 tokens HARD (prompt+completion); a >16k prompt 400s. This
  #   is the small/owned tier — ROUTE big-context or long-output (Qwen recommends
  #   up to 32k–38k output for hard coding/math; thinking mode also eats output
  #   tokens) work to the SaaS models. 16k/8k kept on purpose (12GB VRAM); upgrade
  #   path = AWQ-INT4 → ~32k. YaRN/130k not viable on one A2000. See doc §12.1.
  #
  # ── Cost (ADR-0028: cost-recovery pricing for owned-hardware models) ────────
  #   NOT $0. Real operating cost ≈ €0.05/hour while serving (≈ €0.018/h amortized
  #   A2000-$449-launch + 3/28-vCPU CPU-share + 6GB RAM-share over 3yr + ≈€0.032/h
  #   power @ €0.34/kWh in Erlangen — full derivation in the self-hosted-model
  #   doc §13). Capex accrues even when idle, and PoC utilization is low/bursty,
  #   so we price for **cost recovery at realistic utilization**, not the
  #   best-case saturated marginal cost. Weighted so LMCache prefix-cache hits
  #   bill at the near-free cached rate. Every number is a documented knob
  #   (ADR-0028 §Pricing); re-tune as utilization data arrives.
  qwen3-4b-local:
    enabled: false                  # DISABLED — swapped by qwen25-3b-awq-local (one GPU). Re-enable to roll back.
    kind: text
    # Single self-hosted backend by design (one GPU, one model). The default
    # 2-backend HA guard doesn't apply; a cloud fallback at priority 1 is the
    # documented optional upgrade (ADR-0022), not a requirement.
    minBackends: 1
    # The model is always-on (ADR-0029: plain Deployment, replicas:1), so warm
    # requests are fast. The slow case is a DEPLOY: `Recreate` restarts the single
    # pod, which reloads multi-GB weights (~30-60s, no model pod meanwhile), so a
    # request landing then can take tens of seconds. Without an explicit timeout
    # the route uses Envoy's ~15s default → 504 "upstream request timeout". 600s
    # rides a restart AND a long generation (8k tokens @ ~30-50 tok/s). Keep in
    # sync with charts/model-serving-qwen3-4b edgeAuth.proxy.responseTimeout (Caddy hop)
    # — both must exceed it. Path: Envoy(Hetzner) → Caddy → model.
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3-4B (self-hosted)"
      contextLength: 16384          # = --max-model-len (native 32k, clamped for 12GB VRAM)
      maxOutputTokens: 8192
      supportedParameters: *spReasoning   # Qwen3 has a thinking mode
    pricing:
      strategy: weighted
      standard:
        inputPer1M: 0.15            # prefill share of GPU-time (cost-recovery, ADR-0028)
        cachedInputPer1M: 0.03      # LMCache prefix-reuse hit ≈ near-free
        outputPer1M: 1.00           # decode is the throughput bottleneck → the cost driver
    backends:
      vllm-local-01:
        <<: *vllmLocalBackendPrimary
        modelNameOverride: "qwen3-4b"

  # Self-hosted Qwen3.5-4B (Q4_K_M GGUF) via llama.cpp — the upgrade candidate for
  # the home GPU (one GPU → one model, so it SWAPS qwen3-4b-local at cutover).
  # STAGED: enabled:false until a recent server-cuda build is proven to load the
  # GGUF on the A2000 (docs/models/qwen3.5-4b-q4.md §5). CUTOVER = set this
  # enabled:true + qwen3-4b-local enabled:false + the model-serving apps likewise,
  # then cut a release + repoint root. Engine/decisions: ADR-0032.
  #
  # Model card (Qwen/Qwen3.5-4B · Apache-2.0): Gated DeltaNet + sparse-MoE hybrid,
  # natively multimodal (served TEXT-ONLY here — no image input), 262k native ctx.
  # 3-of-4 blocks are linear-attention → KV barely grows → 64k ctx is cheap on the
  # 12GB A2000 (vs the 16k wall on qwen3-4b). Served by llama-server (prefix /v1),
  # served-model-name = --alias `qwen3-5-4b`.
  qwen3-5-4b-local:
    enabled: false                   # DISABLED — swapped by deepseek-r1-1-5b-local (one GPU). Re-enable to roll back.
    kind: text
    minBackends: 1                   # single self-hosted backend by design (one GPU)
    timeout:
      requestTimeout: 600s           # rides a deploy restart + a long generation
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3.5-4B (self-hosted)"
      contextLength: 131072          # 128k = llama-server --ctx-size (GDN linear-attn → KV cheap; ~8.5GB of 12GB)
      maxOutputTokens: 16384
      supportedParameters: *spReasoning   # Qwen3.5 has a thinking mode
    pricing:
      strategy: weighted             # same cost-recovery basis as qwen3-4b-local (ADR-0028)
      standard:
        inputPer1M: 0.15             # re-check per-token at cutover (lighter Q4_K_M)
        cachedInputPer1M: 0.03
        outputPer1M: 1.00
    backends:
      llama-local-01:
        ref: llama-local-01
        priority: 0
        modelNameOverride: "qwen3-5-4b"   # = llama-server --alias

  # Self-hosted Qwen2.5-3B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver (AWQ 4-bit quantized). Qwen2.5 is a non-thinking causal LM
  # with 32K native context; AWQ INT4 fits the full window in 12GB A2000 VRAM.
  # DISABLED by default (staged) — one GPU, one model. Enable + disable another
  # self-hosted model at cutover.
  #
  # Model card (Qwen/Qwen2.5-3B-Instruct-AWQ · Apache-2.0):
  #   3.0B params, 36 layers, GQA 16 Q / 2 KV, 32,768 native context,
  #   AWQ 4-bit quantization. Supports tool/function calling via hermes
  #   parser. Non-thinking (no reasoning mode).
  #   https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-AWQ
  #
  # Cost (ADR-0028: cost-recovery for owned-hardware): same rate as the other
  # self-hosted models — the hardware cost is identical.
  qwen25-3b-awq-local:
    enabled: false                   # DISABLED — swapped by z-image-turbo-local (one GPU). Re-enable to roll back.
    kind: text
    minBackends: 1
    timeout:
      requestTimeout: 600s
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen2.5-3B-AWQ (self-hosted)"
      contextLength: 32768           # full native context fits with AWQ INT4
      maxOutputTokens: 8192
      supportedParameters: *spStandard   # Qwen2.5 is non-thinking → standard params
    pricing:
      strategy: weighted
      standard:
        inputPer1M: 0.15
        cachedInputPer1M: 0.03
        outputPer1M: 1.00
    backends:
      vllm-local-awq-01:
        ref: vllm-local-awq-01
        priority: 0
        modelNameOverride: "qwen25-3b-awq"

  # Self-hosted DeepSeek-R1-Distill-Qwen-1.5B on the home GPU — vLLM via KServe's
  # huggingfaceserver (BF16 reasoning model). A reasoning model distilled from
  # DeepSeek-R1 onto a Qwen2.5-Math-1.5B base (MIT). ~1.5B params, BF16 ≈ 2 GB
  # weights → 32K native context fits easily in 12GB A2000 VRAM. Long chain-of-
  # thought generation → high maxOutputTokens. DISABLED by default (one GPU, one
  # model). Enable + disable another self-hosted model at cutover.
  #
  # ── Model card (deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B · MIT) ───────────
  #   Qwen2.5-Math-1.5B base, fine-tuned with 800k R1 reasoning samples. Long
  #   CoT (thinking) generation — strong on math/code/reasoning, NOT tool-use.
  #   Usage: temp 0.5-0.7 (0.6 rec), NO system prompt, enforce "\n" start.
  #   https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  #
  # ── Cost (ADR-0028: cost-recovery for owned-hardware) ──────────────────────
  #   Same hardware → same €/h TCO basis as the other self-hosted models. The
  #   1.5B is lighter on the GPU so per-token cost is lower; prices below are a
  #   conservative starting point — re-tune as utilization data arrives.
  deepseek-r1-1-5b-local:
    enabled: false                  # DISABLED — swapped by ministral-3b-local (one GPU). Re-enable to roll back.
    kind: text
    minBackends: 1
    timeout:
      requestTimeout: 600s          # rides a deploy restart + a long CoT generation
      connectionIdleTimeout: 1h
    info:
      displayName: "DeepSeek-R1-Distill-Qwen-1.5B (self-hosted)"
      contextLength: 32768           # Qwen2.5-1.5B native context (BF16 fits in 12GB)
      maxOutputTokens: 32768        # reasoning model → long chain-of-thought
      supportedParameters: *spReasoning   # R1 distill: reasoning mode; server accepts tools (hermes parser) but won't call them well
    pricing:
      strategy: weighted
      standard:
        inputPer1M: 0.10             # 1.5B is lighter → cheaper per token than the 3B/4B
        cachedInputPer1M: 0.02
        outputPer1M: 0.50
    backends:
      vllm-deepseek-01:
        ref: vllm-deepseek-01
        priority: 0
        modelNameOverride: "deepseek-r1-1-5b"

  # Self-hosted Qwen3-8B-AWQ on the home GPU — vLLM via KServe's
  # huggingfaceserver (AWQ 4-bit quantized, 8.2B params, ~5 GB). The safe dense
  # upgrade from qwen3-4b-local: 2× the active params, full 32K native context
  # fits in 12GB A2000 VRAM with AWQ INT4 (~5 GB weights + KV cache). Qwen3
  # hybrid thinking/non-thinking mode + Hermes tool calling → agentic-capable.
  # DISABLED by default (staged) — one GPU, one model. Enable + disable
  # deepseek-r1-1-5b-local at cutover.
  #
  # ── Model card (Qwen/Qwen3-8B-AWQ · Apache-2.0) ─────────────────────────────
  #   8.2B params, 36 layers, GQA 32 Q / 8 KV (→ 1 KB KV/tok, same as qwen3-4b),
  #   32,768 native context (→131,072 with YaRN). Hybrid thinking / non-thinking
  #   mode (→ *spReasoning), Hermes tool calling. Recommended sampling (think):
  #   temp 0.6 / top_p 0.95 / top_k 20 / min_p 0 — do NOT use greedy decoding.
  #   https://huggingface.co/Qwen/Qwen3-8B-AWQ
  #
  # ── Cost (ADR-0028: cost-recovery for owned-hardware) ──────────────────────
  #   Same hardware → same €/h TCO basis as qwen3-4b-local. The 8B is heavier
  #   on the GPU per token than the 4B, but AWQ INT4 keeps it in VRAM; prices
  #   match qwen3-4b-local as a starting point — re-tune as utilization arrives.
  qwen3-8b-local:
    enabled: false                   # STAGED — disable deepseek-r1-1-5b-local + enable this at cutover.
    kind: text
    minBackends: 1                   # single self-hosted backend by design (one GPU)
    timeout:
      requestTimeout: 600s           # rides a deploy restart + a long generation
      connectionIdleTimeout: 1h
    info:
      displayName: "Qwen3-8B-AWQ (self-hosted)"
      contextLength: 32768           # = --max-model-len (full native context fits with AWQ INT4)
      maxOutputTokens: 8192
      supportedParameters: *spReasoning   # Qwen3 has a thinking mode
    pricing:
      strategy: weighted             # same cost-recovery basis as qwen3-4b-local (ADR-0028)
      standard:
        inputPer1M: 0.15
        cachedInputPer1M: 0.03
        outputPer1M: 1.00
    backends:
      vllm-local-8b-01:
        ref: vllm-local-8b-01
        priority: 0
        modelNameOverride: "qwen3-8b"

  # Self-hosted Ministral-3B-Instruct-2410 (AWQ) on the home GPU — vLLM via
  # KServe's huggingfaceserver (AWQ 4-bit quantized, 3B params, ~2 GB). The
  # lightest self-hosted model that fits comfortably on the 12GB A2000 with
  # generous KV-cache headroom (128K native context, 14 layers, 8 KV heads →
  # 56 KiB/tok). Standard instruct model (no thinking mode) → *spStandard.
  # Mistral tool-call parser. DISABLED by default (staged) — one GPU, one
  # model. Enable + disable deepseek-r1-1-5b-local at cutover.
  #
  # ── Model card (Ministral-3B-Instruct-2410 · Mistral Research License) ──────
  #   3B params, 14 layers, GQA 32 Q / 8 KV (head_dim 128 → 56 KiB KV/tok),
  #   131,072 native context (clamped to 64K by --max-model-len for KV budget).
  #   No thinking/reasoning mode (→ *spStandard). Mistral tool-call format
  #   (→ --tool-call-parser=mistral). https://huggingface.co/mistralai/Ministral-3B-Instruct-2410
  #
  # ── Cost (ADR-0028: cost-recovery for owned-hardware) ──────────────────────
  #   Same hardware → same €/h TCO basis. The 3B is lighter on the GPU per
  #   token than the 4B; prices sit between the 1.5B and 4B tiers — re-tune
  #   as utilization data arrives.
  #
  # ⚠️ Tool-calling caveat: the community AWQ repo (RichardErkhov) strips the
  #   [TOOL_CALLS] token from the tokenizer, so vLLM's mistral parser fails.
  #   For agentic use (opencode), switch the chart's hfRepo to the official
  #   gated mistralai/Ministral-3B-Instruct-2410 (needs HF license acceptance)
  #   or inject a --chat-template override before cutover.
  ministral-3b-local:
    enabled: false                   # DISABLED — swapped by qwen25-3b-awq-local (one GPU). Re-enable to roll back.
    kind: text
    minBackends: 1                   # single self-hosted backend by design (one GPU)
    timeout:
      requestTimeout: 600s           # rides a deploy restart + a long generation
      connectionIdleTimeout: 1h
    info:
      displayName: "Ministral-3B-AWQ (self-hosted)"
      contextLength: 65536           # = --max-model-len (128K native, 64K×2seq fits 12GB KV budget)
      maxOutputTokens: 8192
      supportedParameters: *spStandard   # standard instruct model — no thinking mode
    pricing:
      strategy: weighted             # cost-recovery basis (ADR-0028), between the 1.5B and 4B tiers
      standard:
        inputPer1M: 0.12
        cachedInputPer1M: 0.02
        outputPer1M: 0.60
    backends:
      vllm-local-ministral-01:
        ref: vllm-local-ministral-01
        priority: 0
        modelNameOverride: "ministral-3b"

