# ai-models orchestrator — STRUCTURAL SKELETON ONLY.
#
# The chart renders one ApplicationSet that generates child Applications for
# the shared backends, the catalog endpoint, and each enabled model (ADR-0012).
#
# ⚠️ THE CATALOG DOES NOT LIVE HERE ANY MORE (ADR-0126).
#
# Every value this chart consumes — the ArgoCD wiring, the gateway ref, the
# rate-limit plans, the provider backends and the whole `models:` catalog with
# its prices — lives in the private values repo:
#
#     ai-helm-values  environments/prod/values/models.yaml
#
# read by the `aii-models` Application as its `$values` source (ADR-0055/0056).
# This file holds only the empty containers those values land in, so that the
# template's dot-chains resolve. It is deliberately NOT a working default:
#
#   • Do NOT re-add a model, a backend, or a price here. A value left in this
#     file deep-merges UNDER the values-repo file and becomes invisible drift —
#     exactly the duplicate-source-of-truth failure ADR-0056 exists to prevent.
#     Lists (`rateLimitBudgeting.plans`) are worse: they REPLACE rather than
#     merge, so a stale list here would be silently discarded, or silently win
#     if the values file ever omits the key.
#
#   • Rendering this chart on its defaults FAILS, by design — and specifically
#     because of the `ai-models.requireCatalog` guard in templates/_helpers.tpl.
#     ⚠️ It is NOT the destination guard that saves you here, however much it
#     looks like it should: `argocd.destination` is empty, but
#     `destinationClusterRef` DEFAULTS a missing name to "home-remote" and
#     renders happily. Verified by deleting the catalog and rendering: exit 0,
#     a valid ApplicationSet with a backends child and NO model children — which
#     the controller reconciles by pruning every AIGatewayRoute and
#     BackendTrafficPolicy on the gateway. So do not treat `requireCatalog` as
#     belt-and-braces and remove it; it is the only thing standing there. With
#     it, a missing or unparseable values file leaves `aii-models` in
#     ComparisonError and every running model child untouched.
#
#   • Because the defaults do not render, CI lints and renders this chart through
#     `ci/lint-values.yaml` instead (Chart.yaml annotation
#     `ai-helm.adorsys-gis.github.io/lint-mode: ci-values`). That fixture is a
#     minimal representative catalog for template coverage — it is NOT a mirror
#     of production and must never grow into one.
#
#     ⚠️ That fixture is also this chart's **Trivy scan input**. The release
#     workflow renders every chart standalone and skips whatever fails to
#     render, so without the fixture this chart drops out of the security scan
#     silently — a green run that scanned nothing. `release-helm-charts.yml`
#     falls back to `ci/*-values.yaml` for exactly that reason. Deleting the
#     fixture removes scan coverage, not just a lint convenience.
#
# See docs/adr/0126-model-catalog-moves-to-values-repo.md.

# ── ArgoCD wiring ─────────────────────────────────────────────────────────
# Supplied by the values repo. `destination` is intentionally empty here: see
# the render-failure note above.
argocd:
  namespace: ""
  project: ""
  chartRegistry: ""
  chartVersionRange: ""
  destination: {}
  syncPolicy: {}

# ── Gateway the generated AIGatewayRoutes attach to ───────────────────────
gatewayRef: {}

# ── Shared monthly-budget cutover flag + the rate-limit plan list ─────────
# ⚠️ `plans` is an APPEND-ONLY, index-keyed contract (ADR-0084/0085): the rule
# index is part of the live Lyft ratelimit counter key. It is a list, so it
# REPLACES rather than merges — the values-repo file is its only source.
sharedBudget: {}
rateLimitBudgeting: {}

# ── /v1/models/info catalog endpoint ──────────────────────────────────────
modelsInfo: {}

# ── Per-backend API-key ExternalSecrets ───────────────────────────────────
externalSecrets: {}

# ── Provider backends (where the gateway sends traffic) ───────────────────
backends: {}

# ── The model catalog (what users can route to, and what it costs) ────────
# ⚠️ Prices in the values-repo file are machine-maintained — a scheduled job
# there syncs them from the providers' own price APIs (ADR-0127). Nothing in
# this repo should carry a price.
models: {}
