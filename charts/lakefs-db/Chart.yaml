apiVersion: v2
name: lakefs-db
description: |
  Dedicated CloudNativePG Cluster (lakefs-main-db) for LakeFS's metadata KV
  store, plus its own barman-cloud ObjectStore, ScheduledBackup and
  PodMonitor. Leaf chart of the lakefs App-of-Apps orchestrator (ADR-0019).
  Gives LakeFS its own failure domain, isolated from the shared
  lightbridge-main-db cluster other unrelated tenants share — see ADR-0123
  (supersedes ADR-0085 decision #3 for LakeFS specifically).
type: application
version: 0.1.0
appVersion: "1.0.0"
