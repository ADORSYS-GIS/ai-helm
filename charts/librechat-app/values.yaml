# ExternalSecret that materialises `librechat-s3-config` (LibreChat S3 file
# storage). Same Hetzner Object Storage as Keycloak/observability — shared
# bucket `ssegning-k8s-state` (LibreChat namespaces its own keys: images/,
# files/…), creds from the SAME ssegning-aws material. region + bucket are plain
# config (templated into the secret); only the access/secret keys are fetched.
s3ExternalSecret:
  enabled: true
  secretStore: ssegning-aws
  refreshInterval: 1h
  region: us-east-1
  bucket: ssegning-k8s-state
  remoteRef:
    key: prod/meta/test-app
    accessKeyIdProperty: s3_backup_cnpg_client_id
    secretAccessKeyProperty: s3_backup_cnpg_secret

# ExternalSecret materialising `redis-ha-redis-auth` (key `redis-password`) in
# this namespace — LibreChat reads it as REDIS_PASSWORD. The shared redis-ha
# (home-os, redis-system) is password-protected AND TLS-only; the password is the
# platform secret `prod/meta/test-app` / `redis_password` (NOT the consolidated
# app secret). Each redis consumer namespace needs its own copy (see CLAUDE.md).
# NOTE: redis-ha is TLS-only — LibreChat must also connect over TLS and trust the
# internal self-signed-ca (a cert-manager Certificate mounting ca.crt); this
# ExternalSecret provides only the password.
redisExternalSecret:
  enabled: true
  secretStore: ssegning-aws
  refreshInterval: 1h
  secretName: redis-ha-redis-auth
  remoteRef:
    key: prod/meta/test-app
    passwordProperty: redis_password

# Internal-CA trust bundle. Several in-cluster endpoints LibreChat talks to use
# TLS signed by the internal "Home Root CA" (the `self-signed-ca` ClusterIssuer):
# redis-ha (rediss://) AND the api-internal gateway listener (ADR-0021). We issue
# a throwaway leaf from that issuer and mount only its `ca.crt` at mountPath —
# REDIS_CA + NODE_EXTRA_CA_CERTS both point at it. Mirrors the Envoy rate-limit
# redis-CA pattern (environments/.../deps/eg). (No client cert needed.)
internalCaTrust:
  enabled: true
  caIssuer: self-signed-ca
  caIssuerKind: ClusterIssuer
  secretName: librechat-internal-ca
  mountPath: /etc/internal-ca

# User-owned secrets LibreChat (+ search) need, materialised as chart-owned
# ExternalSecrets. Each property resolves against the consolidated ssegning-aws
# secret `ai/camer/digital/prod/env` (one property per key); ensure every
# property below exists there or the ExternalSecret sits in SecretSyncedError
# and the workload won't start. Set a secret's block to {} (or remove keys) if
# you provision it elsewhere; set librechatSecrets.enabled=false to skip all.
librechatSecrets:
  enabled: true
  secretStore: ssegning-aws
  refreshInterval: 1h
  # secretName -> { secretKey -> {key, property} }  (ssegning-aws remoteRef)
  secrets:
    librechat-main-config:
      converse_openai_api_key: { key: ai/camer/digital/prod/env, property: converse_openai_api_key }
    librechat-config:
      creds_key: { key: ai/camer/digital/prod/env, property: librechat_config_creds_key }
      creds_iv: { key: ai/camer/digital/prod/env, property: librechat_config_creds_iv }
      jwt_secret: { key: ai/camer/digital/prod/env, property: librechat_config_jwt_secret }
      jwt_refresh_secret: { key: ai/camer/digital/prod/env, property: librechat_config_jwt_refresh_secret }
    librechat-openid-config:
      client_id: { key: ai/camer/digital/prod/env, property: librechat_openid_config_client_id }
      client_secret: { key: ai/camer/digital/prod/env, property: librechat_openid_config_client_secret }
      session_secret: { key: ai/camer/digital/prod/env, property: librechat_openid_config_session_secret }
    librechat-meili-config:
      MEILI_MASTER_KEY: { key: ai/camer/digital/prod/env, property: librechat_meili_config_meili_master_key }
    librechat-mcp-cd-credentials:
      client_id: { key: ai/camer/digital/prod/env, property: librechat_mcp_cd_credentials_client_id }
      client_secret: { key: ai/camer/digital/prod/env, property: librechat_mcp_cd_credentials_client_secret }
    librechat-mcp-github:
      client_id: { key: ai/camer/digital/prod/env, property: librechat_mcp_github_client_id }
      client_secret: { key: ai/camer/digital/prod/env, property: librechat_mcp_github_client_secret }
    librechat-mcp-coder-credentials:
      client_id: { key: ai/camer/digital/prod/env, property: librechat_mcp_coder_credentials_client_id }
      client_secret: { key: ai/camer/digital/prod/env, property: librechat_mcp_coder_credentials_client_secret }
    librechat-websearch-config:
      serper_api_key: { key: ai/camer/digital/prod/env, property: librechat_websearch_config_serper_api_key }
      firecrawl_api_key: { key: ai/camer/digital/prod/env, property: librechat_websearch_config_firecrawl_api_key }
      jina_api_key: { key: ai/camer/digital/prod/env, property: librechat_websearch_config_jina_api_key }
    # GitHub PAT for skill sync (config.skillSync). Fine-grained token with
    # Contents: Read-only on ADORSYS-GIS/ai-helm (classic: public_repo, or repo
    # once ai-helm is private, #640). Injected as GITHUB_SKILLS_TOKEN below.
    librechat-skills-sync:
      github_token: { key: ai/camer/digital/prod/env, property: librechat_skills_sync_github_token }
    # LibreChat Code Interpreter API key (the managed sandbox service — code runs
    # on LibreChat/Clickhouse infra, not our cluster). Activates the already-on
    # `execute_code` agent capability. Injected as LIBRECHAT_CODE_API_KEY below.
    # Get the key from your librechat.ai account (Code Interpreter is GA/free
    # now — no pricing; a key is still required to call the managed API).
    librechat-code-config:
      code_api_key: { key: ai/camer/digital/prod/env, property: librechat_code_api_key }

# ────────────────────────────────────────────────────────────────────────
# Agent-seed Job (ADR-0088). Idempotently provisions the LibreChat agent fleet
# (DB Agents, incl. subagent delegation) as the SSO system user. Structural
# defaults only — the live fleet + enable live in ai-helm-values:
#   agentSeed:
#     enabled: true
#     platformUserEmail: platform@ai.camer.digital   # must have logged in once
#     agents: [ {name, description, provider, model, instructions, category,
#                tools?, mcpServers?, subagentNames?}, … ]
# `image`/`librechatUrl` default to the LibreChat image + the in-cluster
# librechat-app Service (:3080). Runs as an ArgoCD PostSync hook; the seed script
# is idempotent (GET-by-name → PATCH/POST) and two-phase (leaves → orchestrators).
# ────────────────────────────────────────────────────────────────────────
agentSeed:
  enabled: false
  platformUserEmail: ""
  # Override only if the Service name/namespace differ from the defaults above.
  librechatUrl: ""
  image: ""
  agents:
    - name: "converse"
      description: "Primary platform assistant for general conversation, coding, and web app prototyping"
      provider: "converse"
      model: "kimi-k2.7-code"
      category: "general"
      subagentNames:
        - "coder"
      instructions: |
        You are Converse, the primary platform AI assistant for the AI Governance platform. You assist users with general queries, architectural guidance, and code generation.
        When a user requests to build, prototype, host, or preview a web application, delegate the workspace creation, application scaffolding, and port-sharing tasks to your `@coder` subagent.
    - name: "coder"
      description: "Autonomous Coder subagent for workspace provisioning, Next.js + tRPC + Keycloak app scaffolding, and live port previews"
      provider: "converse"
      model: "adorsys-coder-pro"
      category: "subagent"
      tools:
        - "execute_code"
        - "github_repos"
      mcpServers:
        - "coder"
      instructions: |
        You are the LibreChat Coder Agent, an expert autonomous developer and environment orchestrator for the AI Governance platform. Your primary purpose is to turn user requests for web applications into live, running, and accessible software previews.

        ### Core Capabilities & Tools
        1. Coder Workspace Management (`coder_mcp`): Spin up, inspect, and manage developer workspaces on the platform's Coder cluster.
        2. In-Workspace AI Agent Control: Pass structured prompts to the in-workspace OpenCode agent (via AgentAPI) to write, test, and containerize code (e.g., Next.js + tRPC + Keycloak auth in a `docker-compose` setup).
        3. Programmatic Port Publishing: Execute Coder REST API requests to expose workspace dev server ports publicly without requiring Keycloak SSO redirects (`303`), strictly adhering to ADR-0121.

        ### Step-by-Step Autonomous Workflow
        Step 1: Workspace Provisioning
        - Check available Coder templates or workspaces using `coder_list_templates` or `coder_list_workspaces`.
        - Spin up or re-use a workspace via `coder_create_workspace` using the default node template.
        - Capture the `workspace_id`, `agent_name` (default: `"main"`), `workspace_name`, and `username`.

        Step 2: In-Workspace App Scaffolding
        - Pass instructions to the in-workspace OpenCode assistant to generate Next.js (App Router), tRPC router/client, Keycloak OIDC authentication (`https://auth.verif.fyi/realms/camer-digital`), and a `docker-compose.yml` or dev script running on port `3000`.
        - Confirm that the dev server/container boots cleanly and listens on port `3000`.

        Step 3: Public Port Exposure (ADR-0121 Contract)
        - To allow the user to view the app directly from their browser, publish port `3000` via the Coder REST API:
          POST /api/v2/workspaces/{workspace_id}/port-share with JSON payload:
          {"agent_name": "main", "port": 3000, "share_level": "public", "protocol": "http", "workspace_id": "<workspace_id>"}
        - Construct the flat wildcard subdomain access URL: `https://3000--main--<workspace_name>--<username>.coder-ws.camer.digital`.

        Step 4: Verification & Delivery
        - Verify that the URL returns HTTP 200 OK.
        - Provide the user with a clickable Markdown link to the live preview URL, a concise summary of the scaffolded stack, and teardown instructions:
          DELETE /api/v2/workspaces/{workspace_id}/port-share with JSON payload:
          {"agent_name": "main", "port": 3000}

        ### Operational Constraints & Guardrails
        - Security Isolation: Never expose workspace ports without user intent. Use `share_level: "public"` for open browser previews or `share_level: "authenticated"` if Keycloak SSO is requested.
        - Hostname Limit: Ensure total hostname labels (`<port>--<agent>--<workspace>--<user>`) do not exceed the RFC 1035 limit of 63 characters.
        - API Payloads: Always include mandatory schema fields (`workspace_id`, `agent_name`, `port`) in Coder REST API calls.

global:
  librechat:
    version: "v0.8.7"
  rag_librechat:
    version: "v0.7.2"
  mongo:
    replicaCount: 1
    replicaSetName: rs0
  configmap:
    name: "librechat-config"

librechat:
  ingress:
    librechat:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: cert-home-cert-http
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "LibreChat"
        gethomepage.dev/group: "Chat"
        gethomepage.dev/icon: "librechat.png"
      className: traefik
      hosts:
        - host: ai.camer.digital
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: librechat
                port: http
      tls:
        - secretName: ai.camer.digital-tls
          hosts:
            - ai.camer.digital

  rawResources:
    # Vanity-domain redirect (ADR-0053): we own kivoyo.com and ai.kivoyo.com DNS
    # already points at this cluster's Traefik LB. Redirect it (temporary → 302,
    # path+query preserved) to the canonical ai.camer.digital. The redirect is a
    # Traefik redirectRegex Middleware attached to a dedicated Ingress; the
    # Ingress backend is never reached (the middleware 302s first) but the spec
    # requires one. TLS for ai.kivoyo.com is issued by the same ClusterIssuer as
    # the main ingress (cert-home-cert-http). ACME-safe: cert-manager's HTTP-01
    # solver Ingress for the exact /.well-known/acme-challenge/<token> path
    # out-ranks this Host-only redirect by Traefik router priority.
    # (The API host api.ai.kivoyo.com is redirected separately at the Envoy AI
    # Gateway — charts/core-gateway gateway.redirectHosts.)
    kivoyoRedirectMiddleware:
      enabled: true
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      # forceRename pins the exact metadata.name (bjw-s otherwise prefixes the
      # chart fullname + appends the identifier once >1 rawResource exists). The
      # Ingress's router.middlewares annotation references this name verbatim.
      forceRename: kivoyo-redirect
      spec:
        spec:
          redirectRegex:
            regex: "^https?://ai\\.kivoyo\\.com/(.*)"
            replacement: "https://ai.camer.digital/${1}"
            permanent: false

    kivoyoRedirectIngress:
      enabled: true
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      forceRename: librechat-kivoyo-redirect
      annotations:
        cert-manager.io/cluster-issuer: cert-home-cert-http
        traefik.ingress.kubernetes.io/router.middlewares: '{{ .Release.Namespace }}-kivoyo-redirect@kubernetescrd'
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "LibreChat (kivoyo redirect)"
        gethomepage.dev/group: "Chat"
        gethomepage.dev/icon: "librechat.png"
      spec:
        spec:
          ingressClassName: traefik
          tls:
            - hosts:
                - ai.kivoyo.com
              secretName: ai.kivoyo.com-tls
          rules:
            - host: ai.kivoyo.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: '{{ .Release.Name }}'
                        port:
                          number: 3080

    hpa:
      enabled: true
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      # Pin the name (adding the redirect rawResources above pushes the count >1,
      # which would otherwise append the `hpa` identifier and rename this HPA).
      forceRename: '{{ .Release.Name }}'
      spec:
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: '{{ .Release.Name }}'
          minReplicas: 1
          maxReplicas: 4
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 80

  service:
    librechat:
      enabled: true
      annotations: { }
      type: ClusterIP
      controller: librechat
      ports:
        http:
          enabled: true
          port: 3080
          targetPort: 3080

    rag-api:
      enabled: false
      annotations: { }
      type: ClusterIP
      controller: rag-api
      ports:
        http:
          enabled: true
          port: 8000
          targetPort: 8000

  # Pod + container hardening so the LibreChat Deployment clears Trivy KSV-0118
  # (non-default securityContext / "allows root"). The official
  # ghcr.io/danny-avila/librechat image runs as USER node (uid/gid 1000, from
  # node:24-alpine), so runAsNonRoot at 1000 is a no-op on the image's own user.
  # fsGroup 1000 keeps the mounted config/CA (readOnly secrets/CMs) group-owned.
  # NOTE: readOnlyRootFilesystem is intentionally NOT set — LibreChat writes
  # winston logs + upload staging to its rootfs at runtime; a read-only rootfs
  # would crashloop the live app (KSV-0014 is path-scoped-ignored in
  # .trivyignore.yaml with that justification).
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  controllers:
    librechat:
      type: deployment
      strategy: RollingUpdate
      replicas: 2
      podDisruptionBudget:
        minAvailable: 1
      pod:
        labels:
          app: librechat-app
      containers:
        librechat:
          # Container hardening for KSV-0118. readOnlyRootFilesystem omitted on
          # purpose (see defaultPodOptions note above + .trivyignore KSV-0014).
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image:
            repository: ghcr.io/danny-avila/librechat
            tag: "{{ .Values.global.librechat.version }}"
            pullPolicy: Always
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: "Europe/Berlin"

            # Trust the internal CA (Home Root CA, self-signed-ca) for in-cluster
            # TLS — both the api-internal gateway listener (the Converse / image-gen
            # baseURLs below) and redis-ha. ca.crt is mounted at /etc/internal-ca
            # from the librechat-internal-ca cert (templates/certificate-internal-ca.yaml).
            NODE_EXTRA_CA_CERTS: "/etc/internal-ca/ca.crt"

            ALLOW_EMAIL_LOGIN: "false"
            ALLOW_REGISTRATION: "false"
            ALLOW_SOCIAL_LOGIN: "true"
            ALLOW_SOCIAL_REGISTRATION: "true"
            REFRESH_TOKEN_EXPIRY: 5184000000 # "(1000 * 60 * 60 * 24) * 60 => 60 days"

            OPENID_ISSUER: "https://auth.verif.fyi/realms/camer-digital"
            OPENID_CALLBACK_URL: "/oauth/openid/callback"
            OPENID_SCOPE: "openid profile email librechat offline_access"
            #OPENID_REQUIRED_ROLE: "user" # Now we're in open beta; everyone can connect and test
            OPENID_REQUIRED_ROLE_TOKEN_KIND: "access"
            OPENID_REQUIRED_ROLE_PARAMETER_PATH: "librechat_roles"
            OPENID_AUTO_REDIRECT: "true"
            OPENID_REUSE_TOKENS: "true"
            OPENID_AUDIENCE: "converse"

            #OPENAI_API_KEY: "user_provided"
            #OPENAI_MODELS: "gpt-3.5-turbo-0125,gpt-3.5-turbo-0301,gpt-3.5-turbo,gpt-4,gpt-4-0613,gpt-4-vision-preview,gpt-3.5-turbo-0613,gpt-3.5-turbo-16k-0613,gpt-4-0125-preview,gpt-4-turbo-preview,gpt-4-1106-preview,gpt-3.5-turbo-1106,gpt-3.5-turbo-instruct,gpt-3.5-turbo-instruct-0914,gpt-3.5-turbo-16k"

            #GOOGLE_KEY: "user_provided"
            #GOOGLE_MODELS: "gemini-3-pro-preview,gemini-3-pro-image-preview,gemini-3-flash-preview,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.5-pro"

            #DEBUG_LOGGING: true
            #DEBUG_CONSOLE: true

            LOGIN_MAX: "50"
            LOGIN_WINDOW: "1"

            CD_MCP_CLIENT_ID:
              secretKeyRef:
                name: librechat-mcp-cd-credentials
                key: client_id
            CD_MCP_SECRET_ID:
              secretKeyRef:
                name: librechat-mcp-cd-credentials
                key: client_secret

            GITHUB_MCP_CLIENT_ID:
              secretKeyRef:
                name: librechat-mcp-github
                key: client_id
            GITHUB_MCP_SECRET_ID:
              secretKeyRef:
                name: librechat-mcp-github
                key: client_secret

            CODERS_MCP_CLIENT_ID:
              secretKeyRef:
                name: librechat-mcp-coder-credentials
                key: client_id
            CODERS_MCP_SECRET:
              secretKeyRef:
                name: librechat-mcp-coder-credentials
                key: client_secret

            # GitHub PAT for config.skillSync (ESO secret librechat-skills-sync).
            GITHUB_SKILLS_TOKEN:
              secretKeyRef:
                name: librechat-skills-sync
                key: github_token

            # Code Interpreter (managed sandbox API) — activates execute_code.
            LIBRECHAT_CODE_API_KEY:
              secretKeyRef:
                name: librechat-code-config
                key: code_api_key

            OPENID_CLIENT_ID:
              secretKeyRef:
                name: librechat-openid-config
                key: client_id
            OPENID_CLIENT_SECRET:
              secretKeyRef:
                name: librechat-openid-config
                key: client_secret
            OPENID_SESSION_SECRET:
              secretKeyRef:
                name: librechat-openid-config
                key: session_secret

            DEBUG_OPENID_REQUESTS: "true"

            # Optional: redirects the user to the end session endpoint after logging out
            OPENID_USE_END_SESSION_ENDPOINT: "true"

            #RAG_API_URL: "http://{{ .Release.Name }}-rag-api:8000"

            DOMAIN_CLIENT: &url "https://ai.camer.digital"
            DOMAIN_SERVER: *url
            NO_INDEX: "true"
            # TRUST_PROXY: "-1"

            USE_REDIS: "true"
            REDIS_KEY_PREFIX: "librechat-prod-v2"
            # redis-ha is TLS-ONLY (port 0 / tls-port 6379), server cert from the
            # internal self-signed-ca. Connect with the `rediss://` scheme and
            # trust that CA via REDIS_CA (ca.crt mounted from the internalCaTrust
            # cert at /etc/internal-ca). Plaintext `redis://` gets reset.
            #
            # Point at the redis-ha HAProxy master-router (home-os redis-ha) — the
            # DURABLE fix for the READONLY trap. The round-robin `redis-ha-redis`
            # Service load-balances master+replica, so a write connection lands on the
            # read-only replica ~50% of the time → "READONLY You can't write against a
            # read only replica". HAProxy health-checks both pods over TLS and routes
            # ALL traffic to whichever is `role:master`, auto-following Sentinel
            # failover — so LibreChat (which can't speak Sentinel) always writes to the
            # master. Replaces the earlier fragile master-POD pin. TLS verifies via the
            # same self-signed-ca (cert SAN `redis-ha-haproxy.redis-system...`).
            REDIS_URI: "rediss://redis-ha-haproxy.redis-system.svc.cluster.local:6379"
            REDIS_CA: "/etc/internal-ca/ca.crt"
            # redis-ha requires auth. LibreChat applies REDIS_PASSWORD on top
            # of REDIS_URI. Secret `redis-ha-redis-auth` (key `redis-password`)
            # exists in this namespace (converse) via the redisExternalSecret
            # above (mirrors the redis-system one).
            REDIS_PASSWORD:
              secretKeyRef:
                name: redis-ha-redis-auth
                key: redis-password
            FORCED_IN_MEMORY_CACHE_NAMESPACES: "APP_CONFIG,CONFIG_STORE,STARTUP_CONFIG"

            SEARCH: true
            # Meilisearch runs in a separate Application (charts/librechat-search) but
            # exposes a fixed in-namespace Service. The release-name for that chart is
            # `librechat-search`, so the Service follows the chart's standard pattern.
            MEILI_HOST: "http://librechat-search:7700"
            MEILI_MASTER_KEY:
              secretKeyRef:
                name: librechat-meili-config
                key: MEILI_MASTER_KEY

            MONGO_URI: '{{ include "mongo_uri" $ }}'

            CREDS_KEY:
              secretKeyRef:
                name: librechat-config
                key: creds_key
            CREDS_IV:
              secretKeyRef:
                name: librechat-config
                key: creds_iv
            JWT_SECRET:
              secretKeyRef:
                name: librechat-config
                key: jwt_secret
            JWT_REFRESH_SECRET:
              secretKeyRef:
                name: librechat-config
                key: jwt_refresh_secret

            CONVERSE_OPENAI_API_KEY:
              secretKeyRef:
                name: librechat-main-config
                key: converse_openai_api_key

            # Web Search Configuration - Reference environment variables from secrets
            # Search Provider: Serper (you can also use SearXNG)
            SERPER_API_KEY:
              secretKeyRef:
                name: librechat-websearch-config
                key: serper_api_key

            # Scraper: Firecrawl
            FIRECRAWL_API_KEY:
              secretKeyRef:
                name: librechat-websearch-config
                key: firecrawl_api_key

            # Reranker: Jina (you can also use Cohere)
            JINA_API_KEY:
              secretKeyRef:
                name: librechat-websearch-config
                key: jina_api_key

            # Image Generation Configuration - Reference environment variables from secrets
            #  Image Generation
            IMAGE_GEN_OAI_API_KEY:
              secretKeyRef:
                name: librechat-main-config
                key: converse_openai_api_key

            # OpenAI-compatible Converse LLM API base URL
            # Internal plane (ADR-0021): in-cluster, via the api-internal listener.
            IMAGE_GEN_OAI_BASEURL: https://core-gateway-internal.envoy-gateway-system.svc.cluster.local/v1
            IMAGE_GEN_OAI_MODEL: gemini-2.5-flash-image


            AWS_REGION:
              secretKeyRef:
                name: librechat-s3-config
                key: s3_region_name
            AWS_ACCESS_KEY_ID:
              secretKeyRef:
                name: librechat-s3-config
                key: s3_access_key_id
            AWS_SECRET_ACCESS_KEY:
              secretKeyRef:
                name: librechat-s3-config
                key: s3_secret_access_key
            AWS_BUCKET_NAME:
              secretKeyRef:
                name: librechat-s3-config
                key: s3_bucket_name
            # Hetzner Object Storage (nbg1) — the shared `ssegning-k8s-state`
            # bucket (see s3ExternalSecret below). Path-style for Ceph-RGW.
            AWS_ENDPOINT_URL: "https://nbg1.your-objectstorage.com"
            AWS_FORCE_PATH_STYLE: "true"

          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          probes:
            liveness:
              enabled: true
              path: /health
              type: HTTP
              spec:
                httpGet:
                  port: http
            readiness:
              enabled: true
              path: /health
              type: HTTP
              spec:
                httpGet:
                  port: http
            startup:
              enabled: true
              path: /health
              type: HTTP
              spec:
                httpGet:
                  port: http
                failureThreshold: 30
                periodSeconds: 5

    rag-api:
      enabled: false
      type: statefulset
      strategy: RollingUpdate
      replicas: 1
      pod:
        labels:
          app: librechat-app
      containers:
        rag-api:
          image:
            repository: ghcr.io/danny-avila/librechat-rag-api-dev-lite
            tag: "{{ .Values.global.rag_librechat.version }}"
            pullPolicy: Always
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: "Europe/Berlin"

            RAG_OPENAI_BASEURL: "http://envoy-converse-gateway-core-gateway-c480b207.envoy-gateway-system.svc.cluster.local/v1"
            RAG_OPENAI_API_KEY:
              secretKeyRef:
                name: librechat-main-config
                key: converse_openai_api_key

            EMBEDDINGS_MODEL: "text-embedding-3-small"
            EMBEDDING_BATCH_SIZE: 750

          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          probes:
            liveness:
              enabled: true
              path: /
              type: HTTP
              spec:
                httpGet:
                  port: http
            readiness:
              enabled: true
              path: /
              type: HTTP
              spec:
                httpGet:
                  port: http
            startup:
              enabled: true
              path: /
              type: HTTP
              spec:
                httpGet:
                  port: http
                failureThreshold: 30
                periodSeconds: 5

  # config-rollout — force the librechat pods to redeploy on a config change.
  # The librechat.yaml `config:` object is a STANDALONE ConfigMap
  # (templates/configmap.yaml, rendered from top-level .Values.config which now
  # comes from ai-helm-values). bjw-s can't content-hash a ConfigMap it doesn't
  # manage, and the config's subPath mount does NOT auto-update — so editing the
  # config alone would silently keep the old config until the pod restarts for
  # another reason. This tiny UNMOUNTED marker ConfigMap, listed in
  # includeChecksumInControllers, makes bjw-s stamp a `checksum/configMaps`
  # annotation on the librechat pods. ⚠️ Bump `data.generation` (overridden from
  # ai-helm-values, co-located with the config) in the SAME commit as any
  # `config:` change and the pods roll to pick it up. Pattern: ADR-0087 +
  # lightbridge-code-intelligence.
  configMaps:
    config-rollout:
      enabled: true
      # Pin the name to <release>-config-rollout (else bjw-s collapses a lone
      # managed configMap to the bare release name). The checksum hashes only
      # `data`, so the suffix doesn't affect it.
      suffix: config-rollout
      includeChecksumInControllers:
        - librechat
      data:
        generation: "1"

  persistence:
    config:
      enabled: true
      type: configMap
      name: '{{ .Values.global.configmap.name }}'
      advancedMounts:
        librechat:
          librechat:
            - path: /app/librechat.yaml
              subPath: librechat
              readOnly: true
    # Internal-CA ca.crt (Home Root CA) for in-cluster TLS — redis-ha (REDIS_CA)
    # AND the api-internal gateway listener (NODE_EXTRA_CA_CERTS), both pointing
    # at /etc/internal-ca/ca.crt. Secret created by
    # templates/certificate-internal-ca.yaml (parent chart). Name hardcoded here
    # because this block renders in the bjw-s subchart context, where the
    # parent-level `.Values.internalCaTrust` is unset.
    internal-ca:
      enabled: true
      type: secret
      name: librechat-internal-ca
      advancedMounts:
        librechat:
          librechat:
            - path: /etc/internal-ca
              readOnly: true

  networkpolicies:
    librechat:
      enabled: true
      controller: librechat
      policyTypes:
        - Ingress
        - Egress
      rules:
        ingress:
          - {}
        egress:
          - {}

# ────────────────────────────────────────────────────────────────────────
# librechat.yaml config (the `config:` object) — MOVED to ai-helm-values
# (ADR-0087, extends ADR-0056). It now lives at
# environments/prod/values/librechat-app.yaml in the PRIVATE ai-helm-values
# repo and is injected by the librechart ApplicationSet's per-child
# `valuesFromRepo` ($values ref → helm.valueFiles). Intentionally NO inline
# `config:` here — a stale copy would layer under the values-repo file. The
# configmap.yaml `{{ with .Values.config }}` guard renders an empty ConfigMap
# if the values-repo file is ever missing (fails closed, no partial config).
# ⚠️ Values-repo-FIRST: the file must exist on ai-helm-values `main` before
# this chart deploys, or LibreChat falls back to no models/endpoints.
# ────────────────────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────────────────
# MongoDB subchart values (helmforge/mongodb@1.7.6, aliased as `db`).
# Bundled with librechat in this Application because they share lifecycle.
# ────────────────────────────────────────────────────────────────────────
db:
  enabled: true
  auth:
    enabled: false
  persistence:
    size: 30Gi
    storageClass: ~
  architecture: standalone
  replicaSet:
    name: rs0
    members: 1
  # Pod + container hardening so the mongod StatefulSet clears Trivy
  # KSV-0118 (non-default securityContext) + KSV-0014 (readOnlyRootFilesystem).
  # The official `mongo` image runs as UID 999 (its own `mongodb` user);
  # the chart already sets fsGroup 999 so the data PVC stays writable. With a
  # read-only root fs mongod still needs a writable /tmp — it puts its unix
  # socket at /tmp/mongodb-27017.sock — so a `tmp` emptyDir is mounted there via
  # the subchart's extraVolumes/extraVolumeMounts.
  # ⚠️ This reconciles onto the LIVE LibreChat database (a mongod pod restart) —
  # roll out deliberately and watch the StatefulSet come Ready.
  podSecurityContext:
    fsGroup: 999
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
