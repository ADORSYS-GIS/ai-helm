{{- include "llm-d.validate" . -}}
{{- /*
The weights volume. Pre-seeded once by the seed Job (the bjw `seed` controller),
then mounted read-only by the model container. RWO on local-path (single-node
k3d). Wave -1: before the seed Job.
*/ -}}
{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - {{ .Values.pvc.accessMode | default "ReadWriteOnce" }}
  {{- with .Values.pvc.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pvc.size | default "5Gi" }}
{{- end }}
