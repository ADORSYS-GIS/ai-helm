{{- /*
homepage App-of-Apps orchestrator — renders three child Application CRs:
  • homepage-secrets — local ExternalSecrets leaf chart (single source, OCI float).
  • homepage-auth    — upstream oauth2-proxy chart (classic Helm repo), reverse-
                        proxy mode, own Keycloak client (second source: $values).
  • homepage-app     — this repo's own Homepage leaf chart (OCI float, like
                        every other in-repo chart, ADR-0055) + the ingress
                        Certificate/CiliumNetworkPolicy via the per-env
                        kustomize overlay (second source) + $values (third).
All target home-remote (ADR-0017 guard via homepage.argocd.destinationClusterRef).
Rendered as direct Application CRs rather than an ApplicationSet because the
children are fixed + heterogeneous — see ADR-0019 (lightbridge is the
canonical example). See ADR-0089 for the Homepage-specific auth decision.
*/ -}}
{{- $a := .Values.argocd -}}
{{- if .Values.secrets.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.secrets.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.secrets.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  source:
    # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
    repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.secrets.chartName | quote }}
    chart: "."
    targetRevision: {{ $a.chartVersionRange | quote }}
    helm:
      releaseName: {{ .Values.secrets.releaseName | quote }}
  destination:
    {{- include "homepage.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.auth.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.auth.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.auth.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  sources:
    # Source A — upstream oauth2-proxy chart (classic Helm repo, pinned — not
    # floated). A DEDICATED instance for Homepage (own Keycloak client, own
    # cookie secret) — not shared with any other app's oauth2-proxy (ADR-0089,
    # mirrors the ADR-0085 lakefs-auth shape).
    - repoURL: {{ .Values.auth.chart.repoURL | quote }}
      chart: {{ .Values.auth.chart.name | quote }}
      targetRevision: {{ .Values.auth.chart.targetRevision | quote }}
      helm:
        releaseName: {{ .Values.auth.releaseName | quote }}
        valueFiles:
          - $values/environments/{{ $a.env | default "prod" }}/values/homepage-auth.yaml
        ignoreMissingValueFiles: true
    # Source B — $values ref: the workload values file (ai-helm-values, ADR-0056).
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      ref: values
  destination:
    {{- include "homepage.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.app.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.app.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  sources:
    # Source A — this repo's own Homepage leaf chart, OCI-floated like every
    # other in-repo chart (ADR-0055; full chart path in repoURL + chart ".").
    # releaseName stays `homepage` so workload resource names (Service,
    # ServiceAccount) match what homepage-auth's `upstream`/CiliumNetworkPolicy
    # expect. Values live in ai-helm-values (ADR-0056), read via the $values
    # ref (Source C) — not inline.
    - repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.app.chartName | quote }}
      chart: "."
      targetRevision: {{ $a.chartVersionRange | quote }}
      helm:
        releaseName: {{ .Values.app.releaseName | quote }}
        valueFiles:
          - $values/environments/{{ $a.env | default "prod" }}/values/homepage-app.yaml
        ignoreMissingValueFiles: true
    # Source B — app-scoped deps (ingress Certificate + CiliumNetworkPolicy)
    # via the per-env kustomize overlay in ai-helm-values; issuer patched per
    # environment.
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      path: {{ .Values.app.depsOverlay | quote }}
    # Source C — $values ref: the workload values file (ai-helm-values, ADR-0056).
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      ref: values
  destination:
    {{- include "homepage.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
