# GPU arbitration between self-hosted model serving (charts/inference) and
# any higher-priority GPU workload — ADR-0114. PriorityClass is
# cluster-scoped, so this chart renders no namespaced resources; the
# destination namespace on the Argo Application is a formality ArgoCD
# requires, not a placement decision.
#
# `inference-serving` is deliberately NEGATIVE: it must never be able to
# preempt anything itself, including an unprioritized pod sitting at the
# implicit default of 0 — it is the designated victim, nothing more.
# `mlops-training` is a large positive so an on-demand training/dataset-build
# step always outranks it. (No workload requests it today: the MLOps stack that
# did was removed 2026-10-18; the class stays so a GPU batch job can be added
# without touching the serving fleet.)
classes:
  inference-serving:
    value: -10
    preemptionPolicy: PreemptLowerPriority
    description: >-
      Self-hosted GPU model serving (charts/inference). Never the
      preemptor — only ever preempted, by mlops-training.
  mlops-training:
    value: 1000
    preemptionPolicy: PreemptLowerPriority
    description: >-
      On-demand GPU dataset-build and training workloads. Preempts
      inference-serving on demand.
