# CI fixture — the llama.cpp engine path.
#
# charts/model-server is a render-only leaf: its templates fail-guard on values
# the orchestrator injects, so linting it with default (empty) values aborts by
# design. Chart.yaml carries `lint-mode: ci-values`, so CI lints AND renders each
# fixture in this directory instead.
#
# This is NOT a hand-written approximation of what the orchestrator produces —
# keep it representative, but the authoritative check that the two agree is
# `helm template x charts/model-serving`, which renders the real expansion.

model:
  name: fixture-llamacpp
  engine: llamacpp
  storagePath: Fixture-Model-GGUF

pvc:
  enabled: true
  name: fixture-llamacpp-weights
  storageClassName: longhorn
  accessMode: ReadWriteMany
  size: 20Gi

hfToken:
  enabled: true
  secretName: hf-token
  dataKey: token
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: hf_token

# Exercise the optional API-key path in at least one fixture so the template is
# covered, even though the fleet default is off (ADR-0095).
apiKey:
  enabled: true
  secretName: fixture-llamacpp-api-key
  dataKey: api_key
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: fixture_api_key

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - envoy-gateway-system
    - observability
  allowFromEntities:
    - host
    - remote-node
    - health

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

modelServing:
  global:
    fullnameOverride: fixture-llamacpp
  defaultPodOptions:
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    labels:
      ai-helm.adorsys-gis.github.io/model: fixture-llamacpp
  controllers:
    main:
      # Deployment + Recreate, not StatefulSet (ADR-0098): OrderedReady lets a
      # crash-looping pod block its own replacement. Recreate also guarantees the
      # single-GPU invariant by fully terminating the old pod first.
      type: deployment
      strategy: Recreate
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        model:
          image:
            repository: ghcr.io/ggml-org/llama.cpp
            tag: server-cuda
            pullPolicy: IfNotPresent
          args:
            - --model
            - /models/Fixture-Model-GGUF/model.gguf
            - --alias
            - fixture-llamacpp
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -ngl
            - "99"
            - --ctx-size
            - "16384"
            - --parallel
            - "2"
            - --metrics
            - --jinja
            # Thinking default. `--reasoning on|off|auto` is the supported flag;
            # --chat-template-kwargs '{"enable_thinking":...}' still works but is
            # logged as deprecated at start-up.
            - --reasoning
            - "off"
            # Hardening (ADR-0097). ⚠️ --api-key-file covers /metrics as well as
            # /v1/*, so the ServiceMonitor below must present the same key;
            # /health is exempt, which is why probes still pass.
            - --api-key-file
            - /etc/model-api-key/api_key
            - --no-webui
            - --cors-origins
            - https://api.ai.camer.digital
          ports:
            - name: http
              containerPort: 8080
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8080 }
                periodSeconds: 15
                failureThreshold: 120
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8080 }
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8080 }
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: 1
    seed:
      type: job
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
      pod:
        restartPolicy: OnFailure
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      job:
        backoffLimit: 6
        activeDeadlineSeconds: 7200
      containers:
        seed:
          image:
            repository: python
            tag: "3.12-slim"
            pullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "fixture — the real script is generated by charts/model-serving"
          env:
            HF_TOKEN:
              secretKeyRef:
                name: hf-token
                key: token
                optional: false
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "2", memory: 6Gi }
  service:
    main:
      controller: main
      type: ClusterIP
      labels:
        ai-helm.adorsys-gis.github.io/model: fixture-llamacpp
      ports:
        http:
          port: 8080
          targetPort: 8080
  persistence:
    model-store:
      enabled: true
      existingClaim: fixture-llamacpp-weights
      advancedMounts:
        main:
          model:
            - path: /models
              readOnly: true
        seed:
          seed:
            - path: /models
    api-key:
      enabled: true
      type: secret
      name: fixture-llamacpp-api-key
      advancedMounts:
        main:
          model:
            - path: /etc/llama
              readOnly: true
