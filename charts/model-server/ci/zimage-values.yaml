# CI fixture — the zimage (image-generation) engine path (ADR-0100).
#
# charts/model-server is a render-only leaf: its templates fail-guard on values
# the orchestrator injects, so linting it with default (empty) values aborts by
# design. Chart.yaml carries `lint-mode: ci-values`, so CI lints AND renders each
# fixture in this directory instead.
#
# This is NOT a hand-written approximation of what the orchestrator produces —
# keep it representative, but the authoritative check that the two agree is
# `helm template x charts/model-serving`, which renders the real expansion.
#
# What this fixture exists to cover that the other two do not:
#   • `serviceMonitor.enabled: false` — the ONLY engine with no /metrics, so this
#     is the only fixture that proves the ServiceMonitor is genuinely skipped
#     rather than rendered empty.
#   • the API key delivered as an ENV var with a non-vLLM name, and therefore
#     NO `api-key` secret volume (llama.cpp mounts a file; this does not).
#   • no /dev/shm volume (vLLM-only).
#   • a non-root, read-only-rootfs container — our own image, so it can be
#     hardened further than the upstream engines.

model:
  name: fixture-zimage
  engine: zimage
  storagePath: Z-Image-Turbo

pvc:
  enabled: true
  name: fixture-zimage-weights
  storageClassName: longhorn
  # ~33 GB of FP32 safetensors on disk — an image model is not sized like a
  # quantized text model, and under-sizing this fails hours into the seed.
  accessMode: ReadWriteMany
  size: 45Gi

hfToken:
  enabled: true
  secretName: hf-token
  dataKey: token
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: hf_token

apiKey:
  enabled: true
  secretName: fixture-zimage-api-key
  dataKey: api_key
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: fixture_api_key

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - envoy-gateway-system
    - observability
  allowFromEntities:
    - host
    - remote-node
    - health

# ⚠️ The point of this fixture. The server exposes /health, /v1/models and
# /v1/images/generations — there is no /metrics to scrape.
serviceMonitor:
  enabled: false

modelServing:
  global:
    fullnameOverride: fixture-zimage
  defaultPodOptions:
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    labels:
      ai-helm.adorsys-gis.github.io/model: fixture-zimage
  controllers:
    main:
      type: deployment
      strategy: Recreate
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1002
          seccompProfile:
            type: RuntimeDefault
      containers:
        model:
          image:
            repository: ghcr.io/adorsys-gis/z-image-turbo-server
            tag: v0.2.0
            pullPolicy: IfNotPresent
          # Image geometry and sampling, not context and slots. The server
          # validates these at start-up and exits non-zero if they disagree.
          args:
            - --model-dir
            - /models/Z-Image-Turbo
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --max-size
            - "1024"
            - --default-width
            - "1024"
            - --default-height
            - "1024"
            - --num-steps
            - "8"
            - --guidance-scale
            - "5"
          env:
            # Env, not a mounted file — the engine profile's `apiKey.mode`.
            API_KEY:
              secretKeyRef:
                name: fixture-zimage-api-key
                key: api_key
                optional: false
          ports:
            - name: http
              containerPort: 8080
          # /health is 503 `model_loading` until the weights are on the GPU and
          # 200 after. That only works because the server pre-loads at start-up:
          # loading on first request would deadlock against readiness.
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8080 }
                periodSeconds: 15
                failureThreshold: 120
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8080 }
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8080 }
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1002
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "12"
              # Host RAM: the BF16 text encoder lives here, on the CPU, which is
              # what keeps ~4 GB off the card.
              memory: 32Gi
              nvidia.com/gpu: 1
    seed:
      type: job
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
      pod:
        restartPolicy: OnFailure
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      job:
        backoffLimit: 6
        activeDeadlineSeconds: 10800
      containers:
        seed:
          image:
            repository: python
            tag: "3.12-slim"
            pullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "fixture — the real script is generated by charts/model-serving"
          env:
            HF_TOKEN:
              secretKeyRef:
                name: hf-token
                key: token
                optional: false
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "2", memory: 6Gi }
  service:
    main:
      controller: main
      type: ClusterIP
      labels:
        ai-helm.adorsys-gis.github.io/model: fixture-zimage
      ports:
        http:
          port: 8080
          targetPort: 8080
  persistence:
    model-store:
      enabled: true
      existingClaim: fixture-zimage-weights
      advancedMounts:
        main:
          model:
            - path: /models
              readOnly: true
        seed:
          seed:
            - path: /models
