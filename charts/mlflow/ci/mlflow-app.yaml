# CI / reference values for the upstream MLflow chart
# (https://community-charts.github.io/helm-charts, image burakince/mlflow).
#
# This file serves TWO purposes:
# 1. Human reference copy — kept structurally in sync with the PRIVATE
#    ai-helm-values repo file at environments/prod/values/mlflow-app.yaml
#    (NOT auto-linted: the top-level repo CI loop only picks up
#    charts/<chart>/ci/*-values.yaml, and this file is named *-app.yaml).
# 2. Documentation of the exact chart schema decisions (existingDatabaseSecret,
#    S3 artifact store via existingSecret, native mlflow-oidc-auth plugin).
#
# Backend store DB: the dedicated mlops-main-db CNPG cluster (mlops ns,
# charts/mlops-db), via the `mlflow` managed role/Database — ADR-0123,
# supersedes the earlier lightbridge-main-db (converse ns) placement.
# Cutover gated on the owner confirming, via the authenticated MLflow UI,
# that lightbridge-main-db's `mlflow`/`mlflow_oidc` databases held nothing
# worth migrating (only the default experiment, no run history).
# Artifact store: Hetzner Object Storage (S3-compatible), prefix
# `mlflow-artifacts/` inside the shared ssegning-k8s-state bucket, reusing
# the platform's existing S3 credentials.
#
# Auth: this specific chart bundles the mlflow-oidc-auth plugin in its image
# — `auth.oidcAuth` gives real per-user Keycloak identity + group-based
# RBAC inside MLflow itself (no fronting oauth2-proxy needed, unlike LakeFS
# — see ADR-0085). Keycloak client `mlflow`, client roles `viewer`/`admin`
# mapped into the `mlflow_roles` claim (same clientRoleMapping pattern as
# `coder`/`argo-workflows`).

backendStore:
  databaseMigration: true
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: "mlops-main-db-rw.mlops.svc.cluster.local"
    port: 5432
    database: "mlflow"
    driver: "psycopg2"
  existingDatabaseSecret:
    name: mlflow-db-secret
    usernameKey: username
    passwordKey: password

artifactRoot:
  defaultArtifactRoot: "s3://ssegning-k8s-state/mlflow-artifacts"
  s3:
    enabled: true
    bucket: "ssegning-k8s-state"
    path: "mlflow-artifacts"
    existingSecret:
      name: mlflow-s3-creds
      # Keys match the Secret's defaults (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).

# Hetzner Object Storage (Ceph-RGW) endpoint + path-style addressing — this
# chart's `extraEnvVars` is a plain MAP (key: value), not a list.
#
# Connection-pool cap (ADR-0123 follow-up, now confirmed — not guessed):
# MLFLOW_SQLALCHEMYSTORE_POOL_SIZE / _MAX_OVERFLOW, read by MLflow's own
# store/db/utils.py straight into sqlalchemy.create_engine(). pool_size=3 +
# max_overflow=2 = 5/worker x 2 gunicorn workers = 10 total, well inside the
# 30-connection worst case charts/mlops-db's max_connections="80" budgeted.
extraEnvVars:
  MLFLOW_S3_ENDPOINT_URL: "https://nbg1.your-objectstorage.com"
  AWS_DEFAULT_REGION: "us-east-1"
  MLFLOW_SQLALCHEMYSTORE_POOL_SIZE: "3"
  MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW: "2"

# Basic-auth (the chart default) stays OFF — oidcAuth is the auth mechanism.
auth:
  enabled: false

# NOTE: `oidcAuth` is a TOP-LEVEL key in this chart's schema (sibling of
# `auth`, NOT nested under it) — a schema-validation error catches this if
# it's misplaced (`additional properties 'oidcAuth' not allowed` at /auth).
oidcAuth:
  enabled: true
  discoveryUrl: "https://auth.verif.fyi/realms/camer-digital/.well-known/openid-configuration"
  clientId: "mlflow"
  existingSecret:
    name: mlflow-oidc
    clientSecretKey: client-secret
  # ⚠️ SECURITY — LOAD-BEARING. Renders env `OIDC_AUDIENCE`, which is the ONLY
  # thing that makes the plugin check the `aud` claim on a Bearer token.
  #
  # mlflow-oidc-auth v7.3.1 `config.py::_get_claims_options()` only adds
  # `{"aud": {"essential": True, "value": <OIDC_AUDIENCE>}}` to the JWT
  # validation options when OIDC_AUDIENCE is set; unset ⇒ the audience claim
  # is not validated at all. The plugin still verifies the signature against
  # the Keycloak JWKS — but the JWKS is REALM-wide, so with no audience check
  # ANY valid token from the `camer-digital` realm was accepted. Verified live
  # (2026-07): a client-credentials token minted for the unrelated
  # `testing-client` (aud: ['coder','account'], no `mlflow_roles` claim) got
  # HTTP 200 from `POST /api/2.0/mlflow/experiments/search` on the public
  # ingress. The `groupName`/`adminGroupName` gate below does NOT close this —
  # it runs on the browser OIDC callback path only, never on Bearer.
  #
  # Setting it means a token intended for MLflow must carry `mlflow` in `aud`
  # (Keycloak: an audience mapper on the `mlflow` client / a dedicated client
  # scope — see docs/playbooks/keycloak-audience-operations.md). It gates the
  # BEARER path only; the browser session path is unaffected.
  audience: "mlflow"
  # OAuth2/OIDC `scope` is SPACE-separated per spec — Keycloak rejected the
  # comma-separated form outright. Found live during ADR-0085 verification.
  scope: "openid email profile"
  providerDisplayName: "Sign in with Keycloak"
  # Client-role claim (oidc-usermodel-client-role-mapper on the `mlflow`
  # Keycloak client, same pattern as coder's coder_roles / argo-workflows'
  # groups claim) — NOT a realm-group claim.
  groupsAttribute: "mlflow_roles"
  groupName:
    - viewer
  adminGroupName:
    - admin
  defaultPermission: "READ"
  sessionCookieSecure: true
  # The mlflow-oidc-auth plugin keeps its OWN users/groups/permissions DB,
  # SEPARATE from the tracking backendStore, and auto-migrates it (Alembic →
  # head) on first login. It MUST have a DEDICATED database — NOT the tracking
  # store's `mlflow` DB. Both use a default `alembic_version` table, so if the
  # plugin shares `mlflow` it reads the TRACKING store's revision, can't
  # resolve it against its own migration chain, aborts before any DDL, and
  # never creates its tables → every login fails "Failed to update
  # user/groups" (traced through the plugin's `migrate_if_needed`, ADR-0085
  # verification). Two earlier wrong states, same class of bug: default
  # `sqlite:///auth.db` (read-only fs → "unable to open database file"), then
  # the shared `mlflow` DB (alembic revision collision above).
  # Point it at a DEDICATED `mlflow_oidc` DB on the same mlops-main-db
  # server (owned by the same `mlflow` role — charts/mlops-db Database CR,
  # ADR-0123); the plugin then finds an empty alembic_version and migrates
  # from base. No new egress / no new Secret — same host:port + role as the
  # tracking store.
  database:
    postgres:
      enabled: true
      host: "mlops-main-db-rw.mlops.svc.cluster.local"
      port: 5432
      database: "mlflow_oidc"
      driver: "psycopg2"
      existingSecret:
        name: mlflow-db-secret
        usernameKey: username
        passwordKey: password

replicaCount: 1

# 2Gi limit still OOMKilled (round 1 of live verification, ADR-0085) — the
# gunicorn default of 4 workers each duplicate the FastAPI+SQLAlchemy+OIDC
# process memory. Cut to 2 workers and give more headroom.
extraArgs:
  workers: "2"

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1500m
    memory: 4Gi

ingress:
  enabled: true
  className: traefik
  # gethomepage.dev/* — Homepage k8s auto-discovery (ai-helm ADR-0089,
  # starter set). See ai-helm docs/integrations/homepage.md.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "MLflow"
    gethomepage.dev/group: "MLOps"
    gethomepage.dev/icon: "mlflow.png"
  hosts:
    - host: mlflow.mlops.ai.camer.digital
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: mlflow-tls
      hosts:
        - mlflow.mlops.ai.camer.digital
