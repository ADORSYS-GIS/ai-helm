# mlflow App-of-Apps orchestrator — renders two child Application CRs
# (mlflow-secrets + mlflow-app). Follows the lightbridge canonical pattern
# (ADR-0019) / the coder 2-child shape (ADR-0083). No auth-proxy child: the
# upstream chart bundles the mlflow-oidc-auth plugin natively (ADR-0085) —
# native Keycloak OIDC + group RBAC inside MLflow itself. The chart owns no
# workload resources; it owns the two child Applications.
#
# MLflow is CUT OVER to mlops-main-db, the mlops namespace's own dedicated
# CNPG cluster (charts/mlops-db, a child of charts/lakefs — see that chart),
# per ADR-0123 — superseding ADR-0085 decision #3's original shared
# lightbridge-main-db placement for MLflow, same as it already did for
# LakeFS. The `mlflow`/`mlflow_oidc` role/Database on mlops-main-db were
# provisioned ahead of time by ai-helm#957; the actual connection repoint
# (ai-helm-values `environments/prod/values/mlflow-app.yaml`) landed once
# the owner confirmed, via the authenticated MLflow UI, that
# lightbridge-main-db's `mlflow`/`mlflow_oidc` databases held nothing worth
# migrating (only the default experiment, no run history) — clearing the
# gate ADR-0123 explicitly left open. The now-dead role/Database on
# lightbridge-main-db (charts/lightbridge-db) are dropped in this same PR,
# once that connection repoint is merged and verified — hard cutover, no
# dormant parallel path.

# ────────────────────────────────────────────────────────────────────────
# Shared ArgoCD wiring for all child Applications.
# ────────────────────────────────────────────────────────────────────────
argocd:
  project: ai
  # OCI chart-float (ADR-0055). Two sources of truth:
  #  • chartRegistry/chartVersionRange — the secrets leaf chart floats from
  #    OCI (full chart path in repoURL + chart "."; template builds
  #    `<chartRegistry>/<chartName>`).
  #  • repoURL/targetRevision — the app child's cert/deps overlay (Source B) +
  #    $values ref (Source C), from ai-helm-values @ main (where environments/ lives).
  chartRegistry: oci://ghcr.io/adorsys-gis/charts
  chartVersionRange: ">=0.0.0"
  repoURL: https://github.com/adorsys-gis/ai-helm-values
  targetRevision: main
  destination:
    name: home-remote
    allowInCluster: false
    namespace: mlops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

# ────────────────────────────────────────────────────────────────────────
# mlflow-secrets child — the ExternalSecrets leaf chart (this repo).
# Lowest sync-wave: DB password + S3 creds + OIDC client secret must exist
# before the app starts.
# ────────────────────────────────────────────────────────────────────────
secrets:
  enabled: true
  appName: mlflow-secrets
  chartName: mlflow-secrets   # OCI chart name
  releaseName: mlflow-secrets
  syncWave: "0"

# ────────────────────────────────────────────────────────────────────────
# mlflow-db child — stays DISABLED even now that MLflow is cut over
# (ADR-0123). This does NOT mean MLflow lacks a dedicated cluster: it uses
# mlops-main-db, provisioned by charts/mlops-db (a child of the lakefs
# orchestrator, not this one) — the `mlflow`/`mlflow_oidc` role/Database
# CRs already live there. This child stays disabled purely to avoid
# deploying the SAME Cluster resource twice from two different
# Applications; ownership of mlops-main-db isn't LakeFS- or MLflow-
# specific, same as lightbridge-main-db being a child of
# charts/lightbridge doesn't make Lightbridge own coder's/governance's data.
# ────────────────────────────────────────────────────────────────────────
db:
  enabled: false

# ────────────────────────────────────────────────────────────────────────
# mlflow-app child — the upstream MLflow workload (Helm chart, deployed as
# an ArgoCD source — NOT a Helm dependency, so ArgoCD pulls it directly) +
# the ingress TLS Certificate via the kustomize overlay. releaseName stays
# `mlflow` so workload resource names match the namespace.
# ────────────────────────────────────────────────────────────────────────
app:
  enabled: true
  appName: mlflow-app
  releaseName: mlflow
  syncWave: "1"
  # Upstream MLflow chart (community-charts) — classic Helm repo (NOT OCI),
  # pinned to a stable version (not floated like the secrets leaf).
  chart:
    repoURL: https://community-charts.github.io/helm-charts
    name: mlflow
    targetRevision: "1.11.2"
  # App-scoped deps (ingress Certificate) — kustomize overlay in
  # ai-helm-values, added as a second source (issuer patched per env).
  # ADR-0018 pattern.
  depsOverlay: environments/prod/deps/mlflow
