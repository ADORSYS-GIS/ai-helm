{{- /*
ExternalSecrets for the Argo Workflows platform. Values-driven (the `externalSecrets`
map below) so they're easy to read: each entry names the target Secret, the
remoteRef key in the ssegning-aws store, and one-or-more data mappings (target
secretKey ← remoteRef property). All use creationPolicy Owner so the operator
owns the materialised Secret. ADR-0018 in-chart secret ownership; ssegning-aws
is the only ClusterSecretStore on-cluster.

Supports:
  • data       — standard remoteRef mappings (secretKey ← {key, property})
  • literals   — static key-value pairs merged into the materialised Secret
  • templateData — ESO Go-template strings that can reference fetched data
                   via {{ .<secretKey> }} (e.g., assembling a DB connection URL)
  • type       — Kubernetes Secret type (e.g., kubernetes.io/basic-auth)
*/ -}}
{{- $store   := .Values.secretStore | default "ssegning-aws" }}
{{- $refresh := .Values.refreshInterval | default "1h" }}
{{- range $name, $cfg := .Values.externalSecrets }}
{{- if ne $cfg.enabled false }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
    {{- if or $cfg.literals $cfg.templateData $cfg.type }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      {{- with $cfg.type }}
      type: {{ . | quote }}
      {{- end }}
      data:
        {{- range $k, $v := $cfg.literals }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- range $k, $v := $cfg.templateData }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range $cfg.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .key | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
{{- end }}