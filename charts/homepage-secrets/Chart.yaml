apiVersion: v2
name: homepage-secrets
description: |
  ExternalSecrets for the Homepage central-hub platform — the oauth2-proxy
  Keycloak client credentials + cookie-signing secret. Leaf chart of the
  homepage App-of-Apps orchestrator (ADR-0089), lowest sync-wave so the
  Secret exists before homepage-auth starts. References the `ssegning-aws`
  ClusterSecretStore (ADR-0018 in-chart ownership).
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - homepage
  - secrets
  - external-secrets
maintainers:
  - name: ai-helm

dependencies:
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common
