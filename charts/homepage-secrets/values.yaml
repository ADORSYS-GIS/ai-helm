# homepage-secrets — ExternalSecrets for the Homepage central-hub platform.
# Leaf chart of the homepage orchestrator (ADR-0089). Resolves against the
# cluster-scoped `ssegning-aws` ClusterSecretStore.

secretStore: ssegning-aws
refreshInterval: 1h

# Values-driven ExternalSecrets — see charts/coder-secrets/templates/externalsecret.yaml
# for the full schema (data / literals / templateData / type).
externalSecrets:
  # oauth2-proxy (homepage-auth) reverse-proxy instance — own Keycloak client
  # `homepage-proxy`, own cookie-signing secret (NOT shared with any other
  # app's oauth2-proxy, mirrors the removed lakefs-proxy-secret). Matches the
  # upstream oauth2-proxy chart's `config.existingSecret` schema, which reads
  # all three keys from ONE Secret (config.requiredSecretKeys default).
  #
  # cookie-secret MUST base64-decode to exactly 16, 24, or 32 raw bytes
  # (oauth2-proxy uses it as an AES cipher key) — generate with
  # `openssl rand -base64 32` (no extra piping — see charts/lakefs-secrets'
  # git history for the exact failure mode of a wrongly-sized value).
  #
  # Populate `homepage_proxy_client_id` / `homepage_proxy_client_secret` /
  # `homepage_proxy_cookie_secret` under key `ai/camer/digital/prod/env`
  # (out-of-band, ssegning-aws) before this Secret can sync.
  homepage-proxy-secret:
    data:
      - secretKey: client-id
        key: ai/camer/digital/prod/env
        property: homepage_proxy_client_id
      - secretKey: client-secret
        key: ai/camer/digital/prod/env
        property: homepage_proxy_client_secret
      - secretKey: cookie-secret
        key: ai/camer/digital/prod/env
        property: homepage_proxy_cookie_secret
