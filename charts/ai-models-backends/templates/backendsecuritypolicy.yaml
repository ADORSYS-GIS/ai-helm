{{- range $backendName, $backendConfig := .Values.backends }}
{{- /*
Audit fix from the pre-split chart: gate on `enabled: false` to avoid
emitting a security policy that references a non-existent AIServiceBackend
when a backend is disabled.

Second gate (ADR-0095): emit nothing at all for a backend that carries NO
credential. Cluster-local model backends are the case — a self-hosted model on
the GPU fleet is reachable only from the gateway (CiliumNetworkPolicy) and
speaks plain HTTP over the pod network, so there is no key to present. Without
this gate such a backend rendered a BackendSecurityPolicy whose spec had
targetRefs and nothing else: a credential-less policy that declares no type,
which is not a meaningful object to hand the controller.

A backend therefore opts IN to a security policy by setting `type:
GCPCredentials` or `securityType: APIKey`; anything else gets no policy.
*/ -}}
{{- $hasCredential := or (eq ($backendConfig.type | default "") "GCPCredentials") (eq ($backendConfig.securityType | default "") "APIKey") -}}
{{- if and (not (eq $backendConfig.enabled false)) $hasCredential }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: {{ $backendName }}-security
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: {{ $backendConfig.resourceName }}
  {{- if eq ($backendConfig.type | default "") "GCPCredentials" }}
  type: GCPCredentials
  gcpCredentials:
    projectName: {{ $backendConfig.gcpCredentials.projectName }}
    region: {{ $backendConfig.gcpCredentials.region }}
    credentialsFile:
      secretRef:
        name: {{ $backendConfig.gcpCredentials.credentialsFile.secretRef.name }}
        {{- if $backendConfig.gcpCredentials.credentialsFile.secretRef.key }}
        key: {{ $backendConfig.gcpCredentials.credentialsFile.secretRef.key }}
        {{- end }}
  {{- else }}
  type: APIKey
  apiKey:
    secretRef:
      name: {{ $backendConfig.secretRef.name }}
  {{- end }}
{{- end }}
{{- end }}
