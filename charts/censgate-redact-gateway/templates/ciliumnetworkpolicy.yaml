{{- /*
The `apps` namespace carries no default-deny-egress baseline (verified live:
only `default-deny-ingress` + `allow-dns` + `allow-ingress-to-apps` +
`allow-apps-egress-data` exist there today), so this policy is defense in
depth, not a prerequisite for the pod to come up. Egress is scoped to exactly
what redact-gateway needs to talk to: DNS, core-gateway-internal (the
provider), and Alloy (OTLP). Ingress is scoped to the canary phase -- no
production client is cut over to this proxy in this change, so same-namespace
is deliberately as far as it opens; tighten to a specific caller label once a
real client is wired to it (see the chart description / ADR-0116).
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.name }}-allow
  labels:
    app: {{ .Values.name }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Values.name }}
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: {{ .Values.port | quote }}
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        # Matches the pods actually behind the core-gateway-internal Service --
        # verified live (`kubectl -n envoy-gateway-system get svc
        # core-gateway-internal -o jsonpath='{.spec.selector}'`), not guessed.
        # These are the shared Envoy proxy pods for the `core-gateway` Gateway
        # (owned by the `converse-gateway` namespace), not a name specific to
        # the internal listener -- the internal/external split is a listener
        # inside this same Envoy Deployment, not a separate pod.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.providerNamespace }}
            k8s:gateway.envoyproxy.io/owning-gateway-name: core-gateway
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.providerPort | quote }}
              protocol: TCP
    - toEndpoints:
        # Verified live against the alloy Service selector.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.otlpNamespace }}
            k8s:app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.otlpPort | quote }}
              protocol: TCP
