apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # No Kubernetes API access needed.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redact-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: CENSGATE_HOST
              value: "0.0.0.0"
            - name: CENSGATE_PORT
              value: {{ .Values.port | quote }}
            - name: CENSGATE_PROVIDER_NAME
              value: openai
            - name: CENSGATE_PROVIDER_BASE_URL
              value: {{ .Values.provider.baseUrl | quote }}
            - name: CENSGATE_PROVIDER_FORWARD_CLIENT_AUTHORIZATION
              value: {{ .Values.provider.forwardClientAuthorization | quote }}
            - name: CENSGATE_AUTH_MODE
              # Only mode compatible with forwarding the caller's own
              # Authorization header to the provider (see values.yaml).
              value: "none"
            - name: CENSGATE_DEFAULT_PROFILE
              value: {{ .Values.defaultProfile | quote }}
            - name: CENSGATE_STREAM_MODE
              value: {{ .Values.streamMode | quote }}
            - name: CENSGATE_METRICS_ENDPOINT
              value: "true"
            - name: CENSGATE_ENABLE_TRACING
              value: "true"
            - name: CENSGATE_TRACE_OPERATIONS
              value: {{ .Values.telemetry.traceOperations | quote }}
            - name: CENSGATE_AUDIT_EXPORT
              value: {{ .Values.telemetry.auditExport | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: SSL_CERT_FILE
              value: "{{ .Values.internalCaTrust.mountPath }}/ca.crt"
          volumeMounts:
            - name: internal-ca
              mountPath: {{ .Values.internalCaTrust.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCaTrust.secretName }}
