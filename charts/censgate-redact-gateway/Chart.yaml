name: censgate-redact-gateway
description: >-
  Off-the-shelf censgate/redact `redact-gateway` (ghcr.io/censgate/redact-gateway,
  Rust, Apache-2.0) deployed as an OpenAI-compatible front proxy, so PII redaction
