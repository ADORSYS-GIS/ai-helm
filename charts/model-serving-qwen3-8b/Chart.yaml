apiVersion: v2
name: model-serving-qwen3-8b
description: |
  Self-hosted LLM on the home GPU: Qwen3-8B-AWQ served via vLLM
  (kserve/huggingfaceserver) with a Caddy auth-proxy sidecar. AWQ 4-bit
  quantized (8.2B params, ~5 GB) — fits a 32K context on the 12GB A2000 with
  room for KV cache. Weights are pre-seeded into a PVC (no per-start
  HuggingFace download).

  Deployed via homeCluster (ADR-0017 exception) and federated into the Hetzner
  Envoy AI Gateway as an OpenAI backend. See ADR-0022 (federation) + ADR-0029
  (serving mode) + ADR-0030 (one STS via bjw-template).
type: application
version: 0.1.2
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - llm
  - vllm
  - qwen
  - awq
  - inference
  - gpu
maintainers:
  - name: ai-helm

dependencies:
  - name: bjw-template
    version: "4.6.2"
    repository: "file://../bjw-template"
    alias: modelServing
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common
