# charts/model-serving-qwen3-8b — self-hosted Qwen3-8B-AWQ on the home GPU.
# See ADR-0022 (federation) + ADR-0028 (pricing) + ADR-0029 (serving mode) +
# ADR-0030 (one StatefulSet via bjw-template) + docs/patterns/self-hosted-model-serving.md.
#
# Shape: a hybrid bjw-template chart (like charts/librechat-app).
#   - The bjw-template subchart (values under `modelServing:`) renders the WHOLE
#     workload: the model StatefulSet (model + Caddy proxy sidecar), the seed
#     Job (a bjw `job` controller, ArgoCD Sync hook), the Service, and the
#     Ingress.
#   - The chart's own templates/ render only the resources bjw doesn't do
#     natively: the weights PVC, the ExternalSecrets, and the Caddyfile ConfigMap.
#
# Sync-wave ordering (this Application's resources, on the HOME cluster):
#   -2  ExternalSecret (vllm-local-api-key + hf-token)  — before any pod
#   -1  PVC (qwen3-8b-models, RWX)                     — weights volume
#    0  seed Job (download-once into the PVC)             — ArgoCD Sync hook
#    1  StatefulSet (model + proxy) + Service + Ingress   — mounts the PVC

global:
  labels:
    app: model-serving-qwen3-8b
    team: adorsys-gis

model:
  name: qwen3-8b
  hfRepo: Qwen/Qwen3-8B-AWQ
  storagePath: Qwen3-8B-AWQ

pvc:
  enabled: true
  name: qwen3-8b-models
  storageClassName: longhorn
  accessMode: ReadWriteMany
  size: 15Gi

seedJob:
  enabled: true
  hfToken:
    enabled: true
    secretName: hf-token
    dataKey: token
    externalSecret:
      enabled: true
      secretStore: ssegning-aws
      refreshInterval: 1h
      key: ai/camer/digital/prod/env
      property: hf_token

apiKey:
  enabled: true
  secretName: vllm-local-api-key
  dataKey: api_key
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: vllm_local_api_key

edgeAuth:
  enabled: true
  proxyResponseTimeout: 600s

modelServing:
  global:
    fullnameOverride: qwen3-8b

  defaultPodOptions:
    runtimeClassName: nvidia
    nodeSelector:
      gpu-node: "true"

  controllers:
    main:
      type: statefulset
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        # Pod-level hardening so the workload clears Trivy KSV-0118
        # ("default security context"). The GPU model container needs root to
        # initialise the GPU runtime; every container additionally drops
        # ALL caps + disables privilege escalation.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          # No seccompProfile here — the Caddy sidecar shares this pod and its
          # /usr/bin/caddy is a file-capability binary that cannot exec under the
          # no_new_privs a seccomp profile forces; runAsUser:0 keeps KSV-0118 cleared.
      containers:
        model:
          image:
            repository: kserve/huggingfaceserver
            tag: v0.18.0-gpu
            pullPolicy: IfNotPresent
          args:
            - --model_name=qwen3-8b
            - --model_dir=/mnt/models
            - --backend=vllm
            - --dtype=float16
            - --quantization=awq
            - --max-model-len=32768
            - --max-num-seqs=4
            - --gpu-memory-utilization=0.90
            - --swap-space=1
            - --enforce-eager
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - '--kv-transfer-config={"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
          env:
            LMCACHE_USE_EXPERIMENTAL: "True"
            LMCACHE_LOCAL_CPU: "True"
            LMCACHE_MAX_LOCAL_CPU_SIZE: "1"
            VLLM_API_KEY:
              secretKeyRef:
                name: vllm-local-api-key
                key: api_key
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /v2/health/ready, port: 8080 }
                periodSeconds: 15
                failureThreshold: 120
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /v2/health/ready, port: 8080 }
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8080 }
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi

        proxy:
          image:
            repository: caddy
            tag: 2-alpine
            pullPolicy: IfNotPresent
          # NO securityContext: caddy:2-alpine's /usr/bin/caddy is a file-capability
          # binary (cap_net_bind_service=ep) that cannot exec if that cap is dropped
          # (capabilities.drop) or under no_new_privs (allowPrivilegeEscalation:false /
          # any seccompProfile) — Talos baseline PSS also forbids Unconfined. So this
          # image takes no hardened SC; KSV-0118 is path-scoped-ignored. This chart
          # uses kserve/huggingfaceserver (IGNORES VLLM_API_KEY) so the Caddy edge-auth
          # proxy is REQUIRED here (unlike the vllm-openai charts, where it was removed).
          env:
            MODEL_API_KEY:
              secretKeyRef:
                name: vllm-local-api-key
                key: api_key
          ports:
            - name: edge
              containerPort: 8090
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8090 }
                periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }

    seed:
      type: job
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
      pod:
        restartPolicy: OnFailure
        # Hardened for Trivy KSV-0118 (job- and container-level). The seed pip-installs
        # huggingface_hub into system site-packages, so it runs as root; capabilities are
        # dropped and privilege-escalation disabled. readOnlyRootFilesystem is intentionally
        # omitted (pip writes to the rootfs) — KSV-0014 is path-scoped-ignored in .trivyignore.yaml.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      job:
        backoffLimit: 6
        activeDeadlineSeconds: 3600
      containers:
        seed:
          # Container hardening for KSV-0118 (see the pod securityContext note above).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          image:
            repository: python
            tag: "3.12-slim"
            pullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              MODEL_DIR="/models/Qwen3-8B-AWQ"
              mkdir -p "$MODEL_DIR"
              echo "Seeding Qwen/Qwen3-8B-AWQ -> $MODEL_DIR (skips files already present)"
              pip install --no-cache-dir -q --root-user-action=ignore "huggingface_hub[hf_xet]>=1.0"
              hf download Qwen/Qwen3-8B-AWQ --local-dir "$MODEL_DIR"
              echo "Seed complete."
          env:
            HF_TOKEN:
              secretKeyRef:
                name: hf-token
                key: token
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "2", memory: 4Gi }

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        edge:
          port: 8090
          targetPort: 8090

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cert-cloudflare
      hosts:
        - host: qwen3-8b--poc.ssegning.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: edge
      tls:
        - secretName: qwen3-8b-edge-tls
          hosts:
            - qwen3-8b--poc.ssegning.com

  persistence:
    model-store:
      enabled: true
      existingClaim: qwen3-8b-models
      advancedMounts:
        main:
          model:
            - path: /mnt/models
              subPath: Qwen3-8B-AWQ
              readOnly: true
        seed:
          seed:
            - path: /models
    caddyfile:
      enabled: true
      type: configMap
      name: qwen3-8b-caddy
      advancedMounts:
        main:
          proxy:
            - path: /etc/caddy