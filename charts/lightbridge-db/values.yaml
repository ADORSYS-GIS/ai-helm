# lightbridge-db — CNPG Clusters (lightbridge-main-db, lightbridge-usage-db) +
# their barman ObjectStores + ScheduledBackups + PodMonitors. Leaf chart of
# the lightbridge orchestrator (ADR-0019). Moved verbatim from the old flat
# app's rawRessources EXCEPT the ObjectStores, which are modernised to
# Hetzner Object Storage (the old MinIO s3.ssegning.me / ai-ops-backups is
# decommissioned). lightbridge-usage-db was dropped by ADR-0026 and is
# restored below (see the block's own comment for why it is a separate
# Cluster+ClusterImageCatalog rather than a Database CR on lightbridge-main-db).
#
# Namespace is `converse` (the orchestrator targets that namespace; these CRs
# pin it explicitly to match the old flat-app behaviour).

resources:
  # ────────────────────────────────────────────────────────────────────
  # The primary CNPG cluster. Spec verbatim from the old flat app's
  # rawRessources (instances 2, postgresql:18.4-system-trixie, 5Gi storage,
  # archive_timeout 30min, the barman WAL-archiver plugin, the resources
  # block). Backs up via the barman ObjectStore below.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: lightbridge-main-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      instances: 2
      imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
      storage:
        size: "5Gi"
      plugins:
        # `enabled: true` is set explicitly: the CNPG operator defaults it on,
        # and ArgoCD compares `plugins` as an atomic LIST — so without it here
        # the live list item (which has enabled:true) never matches the chart's
        # → permanent OutOfSync. (managedFieldsManagers can't ignore a field
        # inside a list item, hence matching it directly.)
        - name: barman-cloud.cloudnative-pg.io
          enabled: true
          isWALArchiver: true
          parameters:
            barmanObjectName: lightbridge-main-db
            serverName: lightbridge-main-db
      postgresql:
        parameters:
          archive_timeout: "30min"
          # Incident (2026-08-08/09): max_connections was left UNSET, so CNPG
          # applied its own default of 100 — too little for a cluster shared
          # by 7 tenant roles (repoauth/codeintel/grafana_ro/coder/lakefs/
          # mlflow/governance) each holding their own client-side pool, plus
          # the reserved superuser/replication/monitoring-exporter slots.
          # LakeFS alone defaults to a 25-connection pool (see charts/lakefs
          # lakefs-app.yaml, now capped to 5) — a quarter of the old ceiling
          # from one tenant. Doubled explicitly to 200 rather than left
          # implicit, paired with the memory bump below so it isn't a bare
          # number with no headroom behind it. Sized for max_connections ×
          # work_mem (Postgres default work_mem=4MiB, unset here): worst case
          # (every connection concurrently sorting) is 200 × 4MiB ≈ 800MiB,
          # plus per-backend base overhead (roughly 200 × ~2MiB ≈ 400MiB) and
          # CNPG's own shared_buffers default (128MiB) — call it ~1.3GiB
          # worst-case, which the 2Gi limit below covers with headroom without
          # requiring the node to reserve that much (500Mi→1Gi request only).
          max_connections: "200"
      resources:
        limits:
          cpu: 300m
          memory: 2Gi
        requests:
          cpu: 200m
          memory: 1Gi
      # Declarative role for lightbridge-repo-auth (ADR-0047): a dedicated login
      # role, isolated from the bootstrap `app` role. Password from the
      # basic-auth Secret below (ESO-provisioned); CNPG creates/maintains the
      # role and the `repoauth` Database (below) is owned by it.
      managed:
        roles:
          - name: repoauth
            ensure: present
            login: true
            passwordSecret:
              name: repo-auth-db-role
          # Dedicated login role for lightbridge-code-intelligence
          # (charts/lightbridge-code-intelligence), isolated from `app`/`repoauth`.
          # Owns the `codeintel` Database below; password from the basic-auth Secret
          # `lightbridge-codeintel-db-role` (ESO-provisioned, below).
          - name: codeintel
            ensure: present
            login: true
            passwordSecret:
              name: lightbridge-codeintel-db-role
          # Read-only login role for Grafana (the lightbridge-observability dashboards query Postgres
          # directly — agent runs are one-shot Jobs and can't be scraped, ADR-0046). Member of the
          # built-in `pg_read_all_data` role (PG14+) so it gets SELECT on every table with NO writes
          # and no per-table grants to maintain. Password from the basic-auth Secret below.
          - name: grafana_ro
            ensure: present
            login: true
            inRoles:
              - pg_read_all_data
            passwordSecret:
              name: lightbridge-grafana-ro-db-role
          # Dedicated login role for the Coder platform (ADR-0083). Coder
          # connects to this database via the connection URL assembled in
          # charts/coder-secrets. Password from the basic-auth Secret
          # `coder-db-role` (ESO-provisioned below).
          - name: coder
            ensure: present
            login: true
            passwordSecret:
              name: coder-db-role
          # Dedicated login role for lightbridge-governance (ADORSYS-GIS/lightbridge-governance),
          # the AI governance platform's registry + Copilot/Foundry connectors.
          # Reuses this shared CNPG cluster, same reasoning as coder (ADR-0083).
          # Owns the `governance` Database below; password from the
          # basic-auth Secret `lightbridge-governance-db-role` (ESO-provisioned,
          # below).
          - name: governance
            ensure: present
            login: true
            passwordSecret:
              name: lightbridge-governance-db-role
  # ────────────────────────────────────────────────────────────────────
  # barman-cloud ObjectStore — MODERNISED TO HETZNER OBJECT STORAGE.
  #
  # The old store pointed at the now-decommissioned MinIO (s3.ssegning.me,
  # bucket ai-ops-backups). It now uses Hetzner Object Storage (Ceph-RGW):
  # shared bucket `ssegning-k8s-state`, endpoint nbg1.your-objectstorage.com,
  # same pattern Keycloak's CNPG backup uses. NO top-level `region` field — it
  # isn't in the barmancloud ObjectStore schema (a literal there breaks ArgoCD's
  # diff: ".spec.configuration.region: field not declared in schema").
  # ⚠️ The barman-cloud plugin's defaulting webhook DOES inject an
  # `s3Credentials.region` ref → {name: lightbridge-cnpg-s3, key: s3_region_name}
  # server-side (the valid per-credential field), and reads that key at backup
  # time — so the `lightbridge-cnpg-s3` Secret MUST carry `s3_region_name`
  # (provisioned as a literal in charts/lightbridge-secrets) or every
  # ScheduledBackup fails `missing key s3_region_name`. Left undeclared here so
  # ArgoCD doesn't diff the webhook-owned default.
  # No trailing slash on destinationPath (MinIO/Ceph ListObjectsV2 quirk).
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: lightbridge-main-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      # 7-day recovery window. Was 180d, but the barman retention step
      # (barman-cloud-backup-delete / -list) scans the WHOLE catalog, and a
      # 180d catalog on Hetzner Object Storage grew big enough that Hetzner
      # rate-limited the ListObjectsV2/GetObject calls (SlowDown / GatewayTimeout
      # / 400, "reached max retries: 4") → "Unsafe to proceed with deletion due
      # to failure reading backup catalog" → every scheduled backup failed (since
      # ~2026-06-24). A 7d window keeps the catalog small → far fewer S3 calls per
      # prune → no throttling. (Paired with the 6h schedule below.)
      retentionPolicy: "7d"
      configuration:
        destinationPath: s3://ssegning-k8s-state/lightbridge-main-db
        endpointURL: https://nbg1.your-objectstorage.com
        # ⚠️ Throttle the backup UPLOAD. The retention prune above was one symptom;
        # the backup itself ALSO failed — Hetzner Object Storage returns `SlowDown`
        # on the parallel multipart UploadPart calls and barman gives up after 4
        # retries ("Backup failed uploading data ... UploadPart ... reached max
        # retries: 4"). WAL archiving (single PUTs) and Keycloak's backups to the
        # SAME bucket succeed, so it's lightbridge's parallel upload tripping the
        # per-request-rate limit, not a bucket outage. jobs:1 serialises the upload
        # (one UploadPart stream) and gzip shrinks it (fewer parts) → under the limit.
        data:
          jobs: 1
          compression: gzip
        s3Credentials:
          accessKeyId:
            name: lightbridge-cnpg-s3
            key: s3_access_key_id
          secretAccessKey:
            name: lightbridge-cnpg-s3
            key: s3_secret_access_key
  # ────────────────────────────────────────────────────────────────────
  # Scheduled backup — every 6h (was daily). CNPG cron is 6-field
  # (sec min hour dom mon dow); "0 0 */6 * * *" = 00:00 / 06:00 / 12:00 / 18:00.
  # With the 7d retention above the catalog stays small enough that the
  # post-backup retention prune doesn't get rate-limited by Hetzner S3.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: ScheduledBackup
    metadata:
      name: lightbridge-main-db-daily
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      immediate: true
      schedule: "0 0 */6 * * *"
      backupOwnerReference: self
      cluster:
        name: lightbridge-main-db
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  # ────────────────────────────────────────────────────────────────────
  # PodMonitor so Grafana Alloy scrapes the CloudNativePG per-instance
  # metrics exporter (port 9187, name "metrics"). Verbatim from the old
  # flat app. Manual PodMonitors are the recommended approach now that
  # .spec.monitoring.enablePodMonitor is deprecated.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: lightbridge-main-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      selector:
        matchLabels:
          cnpg.io/cluster: lightbridge-main-db
      podMetricsEndpoints:
        - port: metrics
          interval: 30s
  # ────────────────────────────────────────────────────────────────────
  # lightbridge-usage-db — RESTORED (reverses the usage-db half of ADR-0026).
  # lightbridge-authz-usage (crates/lightbridge-authz-usage,
  # migrations-usage/) needs a Postgres it can call `create_hypertable()` on.
  #
  # It is NOT a `Database` CR on the shared lightbridge-main-db cluster —
  # confirmed against the LIVE cluster, not just the chart: lightbridge-main-db
  # carries FIVE tenants today (database `app` — lightbridge-authz's own,
  # verified via `\dt` → accounts/api_keys/projects/budget_grants/...— plus
  # Database CRs `codeintel`/`coder`/`governance`/`repoauth` below), its image
  # is the unmodified ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  # (no imageCatalogRef), and `codeintel` has pgvector ACTIVELY INSTALLED
  # (`select extname, extversion from pg_extension` → vector 0.8.2) while
  # `pg_available_extensions` on that same cluster does not list `timescaledb`
  # at all. A `Database` CR's `extensions` field can only `CREATE EXTENSION`
  # something the running image already ships, so `timescaledb` is out on the
  # current image.
  #
  # Swapping lightbridge-main-db's image to a Timescale vendor image was
  # evaluated too (both `timescale/timescaledb` and `timescale/timescaledb-ha`
  # DO bundle pgvector — confirmed from their own Dockerfiles — so pgvector
  # parity for codeintel is not actually the blocker one might expect).
  # Rejected anyway: that image change would move ALL FIVE tenants —
  # including lightbridge-authz's own `app` database, the platform's
  # auth boundary — onto a different vendor image in one rolling operation,
  # for a feature (`usage`) that has never been live in prod before now.
  # Two concrete, checkable reasons this is not a routine image bump:
  # (1) CNPG's admission webhook makes `.spec.postgresUID`/`postgresGID`
  #     immutable once a Cluster has bootstrapped. lightbridge-main-db has
  #     neither field set today, so it runs at CNPG's own default (26, the
  #     `ghcr.io/cloudnative-pg/postgresql` convention). Timescale's
  #     Alpine-based `timescaledb` image defaults postgres to UID 70 (why
  #     THIS cluster, below, sets postgresUID/GID to 70 explicitly); the
  #     Ubuntu-based `timescaledb-ha` image creates it at UID 1000. Neither
  #     matches — an in-place swap is blocked short of re-bootstrapping,
  #     which is a new cluster + a live data migration in every way that
  #     matters, not a reuse of the existing one.
  # (2) Debian trixie (glibc) → Alpine (musl) or → Ubuntu 22.04 (a different
  #     glibc build) changes the C library backing Postgres's collations,
  #     the textbook trigger for a collation-version mismatch: existing text
  #     indexes across all five tenants (including codeintel's vector/text
  #     indexes) would need an audited REINDEX pass to rule out silently
  #     wrong comparisons post-swap.
  # Given both, a small, fully isolated dedicated cluster is the lower-risk
  # path to unblock a currently-broken service; consolidating onto
  # lightbridge-main-db is a legitimate idea to revisit deliberately later,
  # not something to fold into this fix. See the PR description for the
  # full evaluation.
  #
  # This is exactly what existed before ADR-0026 dropped it — see the
  # restore runbook at docs/cnpg-native-backup/lightbridge-usage-db-restore.yaml,
  # which still references this ClusterImageCatalog/Cluster pair and proves
  # the prior setup was live and backed up. migrations-usage/20260223000001_init_usage.sql
  # already guards this defensively (`IF EXISTS (SELECT 1 FROM
  # pg_available_extensions WHERE name = 'timescaledb') THEN CREATE
  # EXTENSION ...`), so it degrades to plain Postgres if this ever regresses
  # — but hypertable partitioning (the reason usage_events exists on
  # Timescale at all) only kicks in with the extension actually present.
  #
  # instances/storage/resources/archive_timeout mirror the pre-ADR-0026 spec
  # verbatim (dedicated cluster, not shared, so no need for main-db's later
  # max_connections/memory bump — that was sized for its shared tenants).
  #
  # Image major PINNED TO 18 (was 17 — wrong: latest TimescaleDB targets
  # Postgres 18, and pg18 also matches lightbridge-main-db's own major, so a
  # pg17 usage DB next to a pg18 estate would have been its own, unforced
  # inconsistency). Tag verified live on Docker Hub: `GET
  # https://hub.docker.com/v2/repositories/timescale/timescaledb/tags/2.29.1-pg18`
  # → exists, multi-arch (amd64/arm64/...), pushed 2026-08-04 — the latest
  # published TimescaleDB (2.29.1) built against Postgres 18. Deliberately
  # the plain `timescale/timescaledb` image, not `timescale/timescaledb-ha`:
  # the `-ha` variant bundles Patroni, pgBackRest, and Spilo glue for
  # Zalando/Patroni-style HA — all of which CNPG replaces with its own
  # controller and the barman-cloud plugin sidecar (already used below), so
  # none of that tooling is used here; it would only add ~1.5GB of unused
  # surface and move the default postgres UID to 1000 instead of the 70 this
  # Cluster is already pinned to for the plain image.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: ClusterImageCatalog
    metadata:
      name: lightbridge-usage-db
      namespace: converse
    spec:
      images:
        - major: 18
          image: timescale/timescaledb:2.29.1-pg18
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: lightbridge-usage-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      instances: 2
      imageCatalogRef:
        apiGroup: postgresql.cnpg.io
        kind: ClusterImageCatalog
        name: lightbridge-usage-db
        major: 18
      storage:
        size: "10Gi"
      plugins:
        - name: barman-cloud.cloudnative-pg.io
          enabled: true
          isWALArchiver: true
          parameters:
            barmanObjectName: lightbridge-usage-db
            serverName: lightbridge-usage-db
      postgresql:
        parameters:
          archive_timeout: "30min"
        shared_preload_libraries:
          - timescaledb
      resources:
        limits:
          cpu: 300m
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 500Mi
      postgresUID: 70
      postgresGID: 70
      bootstrap:
        initdb:
          postInitTemplateSQL:
            - CREATE EXTENSION IF NOT EXISTS timescaledb;
  # ────────────────────────────────────────────────────────────────────
  # barman-cloud ObjectStore for lightbridge-usage-db. Same Hetzner bucket +
  # throttling/retention fixes as lightbridge-main-db's ObjectStore above
  # (7d retention, jobs:1 + gzip) rather than the old 180d/unthrottled config
  # the pre-ADR-0026 setup shipped with — that config is what rate-limited
  # main-db's backups on Hetzner (see the note above); no reason to
  # reintroduce the same bug for a second cluster on the same bucket.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: barmancloud.cnpg.io/v1
    kind: ObjectStore
    metadata:
      name: lightbridge-usage-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      retentionPolicy: "7d"
      configuration:
        destinationPath: s3://ssegning-k8s-state/lightbridge-usage-db
        endpointURL: https://nbg1.your-objectstorage.com
        data:
          jobs: 1
          compression: gzip
        s3Credentials:
          accessKeyId:
            name: lightbridge-cnpg-s3
            key: s3_access_key_id
          secretAccessKey:
            name: lightbridge-cnpg-s3
            key: s3_secret_access_key
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: ScheduledBackup
    metadata:
      name: lightbridge-usage-db-daily
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      immediate: true
      schedule: "0 0 */6 * * *"
      backupOwnerReference: self
      cluster:
        name: lightbridge-usage-db
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: lightbridge-usage-db
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      selector:
        matchLabels:
          cnpg.io/cluster: lightbridge-usage-db
      podMetricsEndpoints:
        - port: metrics
          interval: 30s
  # ────────────────────────────────────────────────────────────────────
  # lightbridge-repo-auth (ADR-0047): a `repoauth` Database owned by the
  # managed role above, plus the role's basic-auth Secret (username +
  # password) consumed by BOTH CNPG (passwordSecret) and the app.
  # NOTE: the ESO `password` template braces are double-escaped so Helm's
  # `tpl` (this whole string is tpl'd) leaves `{{ .password }}` for ESO —
  # an un-escaped `{{ }}` here breaks render (CLAUDE.md tpl-brace trap).
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Database
    metadata:
      name: repoauth
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      cluster:
        name: lightbridge-main-db
      name: repoauth
      owner: repoauth
      ensure: present
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: repo-auth-db-role
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: ssegning-aws
      target:
        name: repo-auth-db-role
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          data:
            username: "repoauth"
            password: "{{ "{{ .password }}" }}"
      data:
        - secretKey: password
          remoteRef:
            key: ai/camer/digital/prod/env
            property: repo_auth_db_password
  # ────────────────────────────────────────────────────────────────────
  # lightbridge-code-intelligence: a `codeintel` Database owned by the
  # managed `codeintel` role above, plus the role's basic-auth Secret
  # (username + password) consumed by BOTH CNPG (passwordSecret) and the
  # control plane. Mirrors the repoauth pattern (ADR-0047).
  # pgvector: semantic search (charts/lightbridge-code-intelligence migration 0004) needs the
  # `vector` extension. The `codeintel` role is NOT a superuser, so its `CREATE EXTENSION` is
  # permission-denied — CNPG creates it as superuser via the Database CRD's declarative
  # `spec.extensions` (the image bundles pgvector). With it present, the migration's
  # `CREATE EXTENSION IF NOT EXISTS vector` is a no-op.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Database
    metadata:
      name: codeintel
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      cluster:
        name: lightbridge-main-db
      name: codeintel
      owner: codeintel
      ensure: present
      extensions:
        - name: vector
          ensure: present
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: lightbridge-codeintel-db-role
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: ssegning-aws
      target:
        name: lightbridge-codeintel-db-role
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          data:
            username: "codeintel"
            password: "{{ "{{ .password }}" }}"
      data:
        - secretKey: password
          remoteRef:
            key: ai/camer/digital/prod/env
            property: codeintel_db_password
  # ────────────────────────────────────────────────────────────────────
  # lightbridge-governance: a `governance` Database owned by the managed
  # `governance` role above, plus the role's basic-auth Secret (username +
  # password) consumed by CNPG (passwordSecret). Mirrors the codeintel
  # pattern above. No extensions needed -- ADR-0009: cratestack is the sole
  # persistence layer, plain tables only.
  #
  # NOTE: the lightbridge-governance chart's own ExternalSecret takes ONE
  # opaque `governance_database_url` property (a pre-assembled connection
  # string), not username+password assembled at the pod (unlike codeintel's
  # bjw-template $(DB_PASSWORD) substitution). An operator must construct
  # postgresql://governance:<governance_db_password>@lightbridge-main-db-rw.converse.svc.cluster.local:5432/governance
  # and write it into ai/camer/digital/prod/env as governance_database_url
  # once this role's password (below) is known -- see
  # charts/lightbridge-governance's own README in the lightbridge-governance
  # repo for the full property list this depends on.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Database
    metadata:
      name: governance
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      cluster:
        name: lightbridge-main-db
      name: governance
      owner: governance
      ensure: present
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: lightbridge-governance-db-role
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: ssegning-aws
      target:
        name: lightbridge-governance-db-role
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          data:
            username: "governance"
            password: "{{ "{{ .password }}" }}"
      data:
        - secretKey: password
          remoteRef:
            key: ai/camer/digital/prod/env
            property: governance_db_password
  # ────────────────────────────────────────────────────────────────────
  # grafana_ro role password (read-only DB user for the Grafana dashboards).
  # basic-auth Secret consumed by CNPG (passwordSecret on the managed role above)
  # to SET the role's password. The SAME password is also surfaced into the
  # `observability` namespace for the GrafanaDatasource (see ai-helm-values
  # environments/prod/deps/observability-secrets) — both read this one SM property.
  # ⚠️ Requires a new `codeintel_grafana_ro_db_password` property in the
  # ai/camer/digital/prod/env Secrets Manager bucket.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: lightbridge-grafana-ro-db-role
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: ssegning-aws
      target:
        name: lightbridge-grafana-ro-db-role
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          data:
            username: "grafana_ro"
            password: "{{ "{{ .password }}" }}"
      data:
        - secretKey: password
          remoteRef:
            key: ai/camer/digital/prod/env
            property: codeintel_grafana_ro_db_password
  # ────────────────────────────────────────────────────────────────────
  # Coder (ADR-0083): a `coder` Database owned by the managed `coder` role
  # above, plus the role's basic-auth Secret (username + password) consumed
  # by BOTH CNPG (passwordSecret) and the Coder app (via coder-db-url
  # assembled in charts/coder-secrets). Mirrors the repoauth pattern.
  # NOTE: the ESO `password` template braces are double-escaped so Helm's
  # `tpl` (this whole string is tpl'd) leaves `{{ .password }}` for ESO.
  # ────────────────────────────────────────────────────────────────────
  - |
    apiVersion: postgresql.cnpg.io/v1
    kind: Database
    metadata:
      name: coder
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      cluster:
        name: lightbridge-main-db
      name: coder
      owner: coder
      ensure: present
  - |
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: coder-db-role
      namespace: converse
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: ssegning-aws
      target:
        name: coder-db-role
        creationPolicy: Owner
        template:
          type: kubernetes.io/basic-auth
          data:
            username: "coder"
            password: "{{ "{{ .password }}" }}"
      data:
        - secretKey: password
          remoteRef:
            key: ai/camer/digital/prod/env
            property: coder_db_password
  # MLflow's `mlflow`/`mlflow_oidc` Database CRs + `mlflow-db-role`
