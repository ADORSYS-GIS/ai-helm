{{- /*
The API key the Rust server enforces (Authorization: Bearer <key>).
UNLIKE the Caddy sidecar pattern used by qwen3-4b/ministral-3b, this
Secret is injected as an env var (API_KEY), not mounted as a file.
The Rust server validates the Bearer token natively — no sidecar needed.
ESO pulls it from ssegning-aws ClusterSecretStore.
Wave -2: before the pod. Reuses the same vllm_local_api_key property.
*/ -}}
{{- if and .Values.apiKey.enabled .Values.apiKey.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.apiKey.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.apiKey.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.apiKey.externalSecret.secretStore | default "ssegning-aws" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.apiKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.apiKey.dataKey }}
      remoteRef:
        key: {{ required "apiKey.externalSecret.key is required" .Values.apiKey.externalSecret.key | quote }}
        property: {{ required "apiKey.externalSecret.property is required" .Values.apiKey.externalSecret.property | quote }}
{{- end }}
