[package]
name = "zimage-turbo-server"
version = "0.1.0"
edition = "2024"
description = "Self-hosted Z-Image-Turbo inference server (OpenAI /v1/images/generations)"
authors = ["AI-Helm Team"]
license = "Apache-2.0"

[features]
default = ["cuda"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

[dependencies]
# HTTP / Async
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Image processing & encoding
base64 = "0.22"
image = "0.25"

# CLI / Config
clap = { version = "4", features = ["derive", "env"] }

# ML Inference — Candle
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

# HuggingFace model download (sync API)
# v1 uses a completely different async-first API; staying on 0.4
# while the pre-seeded PVC is the primary model source.
hf-hub = "0.4"

# Tokenizers (Qwen3 format)
tokenizers = "0.21"

# Middleware support
futures-util = "0.3"

# Utilities
once_cell = "1"

[dev-dependencies]
actix-test = "0.1"
actix-http = "3"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
