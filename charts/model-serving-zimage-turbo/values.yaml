# charts/model-serving-zimage-turbo — self-hosted Z-Image-Turbo FP8
# on the home GPU. See ADR-0022 (federation) + ADR-0028 (pricing).
#
# Shape: a hybrid bjw-template chart (like charts/model-serving-ministral-3b).
#   - The bjw-template subchart (values under `modelServing:`) renders the WHOLE
#     workload: the model Deployment, the seed Job (a bjw `job` controller,
#     ArgoCD Sync hook), the Service, and the Ingress.
#   - The chart's own templates/ render only the resources bjw doesn't do
#     natively: the weights PVC and the ExternalSecrets.
#
# Sync-wave ordering (this Application's resources, on the HOME cluster):
#   -2  ExternalSecrets (api-key + hf-token)           — before any pod
#   -1  PVC (zimage-models, RWX)                     — weights volume
#    0  seed Job (download-once into the PVC)         — ArgoCD Sync hook
#    1  Deployment (model server) + Service + Ingress — mounts the PVC

global:
  labels:
    app: model-serving-zimage-turbo
    team: adorsys-gis

model:
  name: z-image-turbo
  hfRepo: Tongyi-MAI/Z-Image-Turbo
  storagePath: Z-Image-Turbo

pvc:
  enabled: true
  name: zimage-models
  storageClassName: longhorn
  accessMode: ReadWriteMany
  # ⚠️ Tongyi-MAI/Z-Image-Turbo publishes FP32 weights (~33 GB: transformer
  # 24.62 + text_encoder 8.05 + VAE 0.17), not the "FP8, ~8 GB" the model card
  # implies. `hf download --local-dir` also stages the whole repo into
  # `.cache/huggingface` before materialising the real files, so peak disk is
  # ~2× the repo — a 20Gi PVC filled solid with the model directories still
  # near-empty. 100Gi is 2x the repo plus margin (this is exactly the sizing
  # ai-helm's own charts/model-serving orchestrator converged on for this same
  # download — see docs/adr/0100-image-generation-on-the-gpu-fleet.md and
  # docs/migrations/2026-07-27-gpu-fleet-followups.md). Longhorn can grow a PVC
  # in place but never shrink one, so err high rather than resize twice.
  size: 100Gi

seedJob:
  enabled: true
  hfToken:
    enabled: true
    secretName: hf-token
    dataKey: token
    externalSecret:
      enabled: true
      secretStore: ssegning-aws
      refreshInterval: 1h
      key: ai/camer/digital/prod/env
      property: hf_token

# The API key the Rust server enforces (Authorization: Bearer <key>).
# Injected as an env var API_KEY. Reuses the existing ssegning-aws
# property `vllm_local_api_key` (same key as other self-hosted models).
apiKey:
  enabled: true
  secretName: zimage-local-api-key
  dataKey: api_key
  externalSecret:
    enabled: true
    secretStore: ssegning-aws
    refreshInterval: 1h
    key: ai/camer/digital/prod/env
    property: vllm_local_api_key

modelServing:
  global:
    fullnameOverride: z-image-turbo

  defaultPodOptions:
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoExecute
    securityContext:
      runAsNonRoot: true
      runAsUser: 1002
      seccompProfile:
        type: RuntimeDefault

  controllers:
    main:
      type: deployment
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      containers:
        model:
          image:
            repository: ghcr.io/adorsys-gis/z-image-turbo-server
            tag: v0.1.0
            pullPolicy: IfNotPresent
          env:
            MODEL_DIR: /mnt/models
            API_KEY:
              secretKeyRef:
                name: zimage-local-api-key
                key: api_key
          ports:
            - name: http
              containerPort: 8000
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8000 }
                periodSeconds: 15
                failureThreshold: 240
                timeoutSeconds: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet: { path: /health, port: 8000 }
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 3
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket: { port: 8000 }
                periodSeconds: 30
                timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1002
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "8"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: 1

    seed:
      type: job
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "0"
      pod:
        restartPolicy: OnFailure
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      job:
        backoffLimit: 6
        activeDeadlineSeconds: 7200
      containers:
        seed:
          image:
            repository: python
            tag: "3.12-slim"
            pullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              MODEL_DIR="/models/Z-Image-Turbo"
              mkdir -p "$MODEL_DIR"
              echo "Seeding Tongyi-MAI/Z-Image-Turbo -> $MODEL_DIR (skips files already present)"
              pip install --no-cache-dir -q --root-user-action=ignore "huggingface_hub[hf_xet]>=1.0"
              # --max-workers 2: `hf download` fans out over 8 workers by
              # default and hf_xet buffers per file, so peak seed memory tracks
              # the LARGEST SHARD (this repo has three ~10 GB safetensors
              # shards) × concurrent workers, not the repo total. 8 workers on
              # 10 GB shards OOM-killed this exact download at a 6-10Gi limit
              # elsewhere in the fleet; capping fan-out is the real fix (Hub
              # bandwidth, not concurrency, is the bottleneck here anyway).
              hf download Tongyi-MAI/Z-Image-Turbo --max-workers 2 --local-dir "$MODEL_DIR"
              # Reclaim the staging area. `hf download --local-dir` stages the
              # whole repo into $MODEL_DIR/.cache/huggingface before
              # materialising the real files, so it doubles steady-state disk
              # usage forever unless removed. Only after a successful download
              # (this script is `sh -ec`, so an earlier failure exits before
              # reaching this line) — an interrupted run keeps its staging area
              # and stays resumable rather than re-fetching 33 GB from scratch.
              rm -rf "$MODEL_DIR/.cache"
              echo "Seed complete."
          env:
            HF_TOKEN:
              secretKeyRef:
                name: hf-token
                key: token
          resources:
            requests: { cpu: "4", memory: 6Gi }
            # 16Gi, not the fleet-typical 6-10Gi: sized for the largest-shard ×
            # worker-count math above, not the repo total.
            limits:   { cpu: "8", memory: 16Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8000
          targetPort: 8000

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cert-cloudflare
      hosts:
        - host: z-image-turbo--poc.ssegning.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: z-image-turbo-edge-tls
          hosts:
            - z-image-turbo--poc.ssegning.com

  persistence:
    model-store:
      enabled: true
      existingClaim: zimage-models
      advancedMounts:
        main:
          model:
            - path: /mnt/models
              subPath: Z-Image-Turbo
              readOnly: true
        seed:
          seed:
            - path: /models
