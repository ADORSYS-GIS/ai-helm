apiVersion: v2
name: model-serving-deepseek-r1-1-5b
description: |
  Self-hosted LLM on the home GPU: DeepSeek-R1-Distill-Qwen-1.5B (BF16, ~1.5B
  params) served via vLLM (kserve/huggingfaceserver) with a Caddy auth-proxy
  sidecar. A reasoning model distilled from DeepSeek-R1 onto a Qwen2.5-Math-1.5B
  base — long chain-of-thought generation. BF16 fits 32K context easily on the
  12GB A2000. Weights are pre-seeded into a PVC (no per-start HuggingFace download).

  Deployed via homeCluster (ADR-0017 exception) and federated into the Hetzner
  Envoy AI Gateway as an OpenAI backend. See ADR-0022 (federation) + ADR-0029
  (serving mode) + ADR-0030 (one STS via bjw-template).
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - llm
  - vllm
  - deepseek
  - reasoning
  - r1-distill
  - inference
  - gpu
maintainers:
  - name: ai-helm

dependencies:
  # bjw-template (forked bjw-s app-template, ADR-0016) renders the WORKLOAD: a
  # single StatefulSet with TWO containers (model + Caddy proxy). Values under
  # the `modelServing:` key. Same hybrid pattern as charts/model-serving-qwen25-3b-awq
  # (own templates/ for the PVC + ExternalSecrets + Caddyfile ConfigMap).
  - name: bjw-template
    version: "4.6.2"
    repository: "file://../bjw-template"
    alias: modelServing
  - name: common
    version: '*'
    repository: "file://../common"
    tags:
      - common
      - bitnami-common