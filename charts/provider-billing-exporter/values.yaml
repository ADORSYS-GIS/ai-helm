# provider-billing-exporter — polls provider read-only billing APIs and exports
# cumulative monthly gauges to Mimir. Deployment-specific config (token secret,
# billing periods) comes from ai-helm-values per env (ADR-0056/0057); the
# defaults here are structural and render a no-op (lint-mode: ci-values).

name: provider-billing-exporter

# Off-the-shelf Python (no custom image — house rule, ADR-0040). The poller
# script is mounted from a ConfigMap and runs stdlib-only.
image: docker.io/library/python:3.12-alpine

# ── Poller behaviour ────────────────────────────────────────────────────────
poller:
  # DeepInfra API base URL (the billing endpoint is /payment/usage/tokens).
  apiUrl: https://api.deepinfra.com
  # Hostname of the API (derived from apiUrl) — used for the egress FQDN.
  apiHost: api.deepinfra.com
  # Seconds between polls. Billing data is low-frequency (delayed invoices,
  # corrections), so hourly is plenty. Each poll OVERWRITES the absolute
  # cumulative gauges, so re-polling can never double count (idempotent).
  pollInterval: 3600
  # Comma-separated UTC calendar billing periods (YYYY-MM). Empty = the previous
  # + current UTC month, computed at each poll so it rolls over automatically.
  billingPeriod: ""
  # Port the /metrics endpoint listens on.
  listenPort: 8080

# ── ESO-managed credential ──────────────────────────────────────────────────
# The DeepInfra API token is injected as DEEPINFRA_API_TOKEN from this Secret
# and is NEVER exposed as a metric label (FR-002/FR-006).
externalSecret:
  enabled: false
  secretName: ""
  secretStore: ssegning-aws
  refreshInterval: 1h
  # Each entry: {secretKey, key, property}. The token lands under secretKey
  # "token" by default (see deployment.yaml env mapping).
  data: []

# ── Scrape into Mimir ───────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 10s

# ── Resources / security ────────────────────────────────────────────────────
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
