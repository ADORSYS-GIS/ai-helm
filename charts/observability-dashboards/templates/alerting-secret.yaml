{{- /*
ESO ExternalSecret for the Discord webhook URL a GrafanaContactPoint injects
(ADR-0059). Pulls one property from the consolidated app key in `ssegning-aws`
into Secret `<webhookSecret.secretName>` key `<webhookSecret.key>`.

⚠️ Rendered for EVERY contact point with `webhookSecret.enabled`, including ones
whose contact point is `enabled: false`. That asymmetry is deliberate and was
added after hitting the problem it solves.

The rule for adding a channel is "create the property in Secrets Manager FIRST,
then enable the contact point" — because enabling one whose secret is missing can
invalidate the notification policy. But if the ExternalSecret were also gated on
the contact point being enabled, there would be NO WAY TO CHECK that the property
resolves before taking that step: the only feedback would come from the risky
action itself. Provisioning the secret independently makes the safe order
verifiable —

    kubectl get externalsecret -n observability <name>   # SecretSynced?  then flip

An ExternalSecret whose contact point is disabled is harmless: it creates a k8s
Secret nothing reads, and if the property is absent it sits visibly in
SecretSyncedError while nothing references it.

Populate: ssegning-aws  key ai/camer/digital/prod/env
          property <webhookSecret.property> = https://discord.com/api/webhooks/...
*/ -}}
{{- if .Values.alerting.enabled }}
{{- range $cp := .Values.alerting.contactPoints }}
{{- $w := $cp.webhookSecret }}
{{- if $w.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $w.secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "observability-dashboards.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $w.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $w.secretStore | default "ssegning-aws" }}
    kind: ClusterSecretStore
  target:
    name: {{ $w.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $w.key | default "url" }}
      remoteRef:
        key: {{ $w.remoteKey | quote }}
        property: {{ $w.property | quote }}
{{- end }}
{{- end }}
{{- end }}
