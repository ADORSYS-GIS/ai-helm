# Pointer to the existing Grafana the operator should manage in EXTERNAL mode.
# We do not let the operator stand up a new Grafana — the `grafana` Application
# (vanilla grafana/grafana chart) already runs one with OIDC/datasources/etc.
grafana:
  # Unique name for the Grafana CR; CRs target it via instanceSelector.
  name: grafana-external
  # In-cluster URL of the existing grafana Service.
  url: http://grafana.observability.svc.cluster.local
  # Secret holding admin credentials (must already exist; created by the
  # `grafana` app via grafana-admin ExternalSecret).
  adminSecret:
    name: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Label every Grafana CR carries. GrafanaDashboard / GrafanaFolder CRs match
  # against this via `spec.instanceSelector.matchLabels.dashboards: <value>`.
  instanceLabel:
    key: dashboards
    value: grafana-external

# Initial folder set. Each folder becomes a GrafanaFolder CR; dashboards
# placed in a folder reference it by `spec.folderRef`.
# Add new folders here as new dashboard areas appear.
# resyncPeriod makes the operator periodically re-assert each folder into
# Grafana. REQUIRED here because Grafana is stateless (emptyDir, ADR-0023): every
# Grafana pod roll wipes operator-pushed folders, and the operator's cached
# "ApplySuccessful" status otherwise leaves them un-recreated until a manual
# operator restart — which then makes folderRef dashboards fail "folder not
# found". With a resyncPeriod the folder self-heals within the period, before the
# dashboards (which already carry their own resyncPeriod) retry.
folders:
  - name: ai-gateway
    title: "AI Gateway"
    resyncPeriod: 5m
    # Folder-level RBAC: Admin=4 (full), Editor=2 (edit). Viewer is
    # intentionally omitted — denies access to admin dashboards (per-user,
    # cost-by-model, etc.) that show ALL users data. (ADR-0077)
    permissions: "{\"items\":[{\"role\":\"Admin\",\"permission\":4},{\"role\":\"Editor\",\"permission\":2}]}"
  - name: applications
    title: "Applications"
    resyncPeriod: 5m
  # Collector + tracing health (Alloy, Tempo) — purpose-built dashboards-as-code
  # for our single-binary/DaemonSet deployment, since the upstream Alloy (jsonnet
  # only) and Tempo (distributed-oriented) mixins don't fit. (GitOps/ArgoCD folder
  # removed — ArgoCD runs on the homeos cluster, not here.)
  # Landing page. Referenced by grafana.ini [users] home_page in ai-helm-values,
  # so its folder and UID are a cross-repo contract (ADR-0099).
  - name: platform
    title: "adorsys Platform"
    resyncPeriod: 5m
  - name: collectors
    title: "Collectors & Tracing"
    resyncPeriod: 5m
  # Self-hosted model serving on the GPU fleet (ADR-0094/0095).
  - name: model-serving
    title: "Model Serving (GPU fleet)"
    resyncPeriod: 5m
  - name: my-usage
    title: "My Usage"
    resyncPeriod: 5m
    # Folder-level RBAC: Admin=4 (full), Editor=2 (edit), Viewer=1 (view).
    # All authenticated users (Viewer) can see their own usage. (ADR-0077)
    permissions: "{\"items\":[{\"role\":\"Admin\",\"permission\":4},{\"role\":\"Editor\",\"permission\":2},{\"role\":\"Viewer\",\"permission\":1}]}"

# Dashboards. Each entry becomes one GrafanaDashboard CR. Supply the JSON via
# `file:` (preferred — keeps the source diffable in git), `json:` (inline) or
# `jsonRef:` (ConfigMap reference). See templates/dashboards.yaml.
dashboards:
  - name: envoy-ai-gateway-per-user
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/per-user.json
    resyncPeriod: 5m
  # Cost × model with daily granularity (stacked daily bars), default 30d window.
  - name: envoy-ai-gateway-cost-by-model
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/cost-by-model.json
    resyncPeriod: 5m
  # Per-actor (user OR repo via display_name) consumption: cost per month/day +
  # which models + which channels. Input variables: actor / azp / model.
  - name: envoy-ai-gateway-actor-consumption
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/actor-consumption.json
    resyncPeriod: 5m
  # User x tokens x cost: per-actor table (requests/tokens/cost) + per-day
  # stacked breakdowns + cost/tokens leaderboards. Filters: azp, model.
  - name: envoy-ai-gateway-user-tokens-cost
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/user-tokens-cost.json
    resyncPeriod: 5m
  # User directory / identity attribution (ADR-0063): resolves the opaque per-user
  # user_id (Keycloak sub UUID) to a real person via the read-only `keycloak`
  # Postgres datasource — a Mixed-datasource table OUTER-joining the Mimir spend
  # to user_entity, plus the raw directory lookup. Empty Name ⇒ non-human subject.
  - name: envoy-ai-gateway-user-directory
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/user-directory.json
    resyncPeriod: 5m
  # Keycloak OFFLINE grants (long-lived refresh-token sessions) resolved to
  # people + client names (ADR-0063), cross-referenced with per-user/per-azp
  # spend. Access tokens (stateless) + online sessions (in-memory) aren't in the
  # DB, so this is standing-grant visibility, not live access-token tracking.
  - name: envoy-ai-gateway-sessions-grants
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/sessions-grants.json
    resyncPeriod: 5m
  # Per-JWT (oidc_jti) consumption + last usages, email taken from the JWT claim
  # ONLY (Loki `email` label, not the Keycloak directory). Loki-backed because
  # oidc_jti is a body field, never a Mimir label (ADR-0064).
  - name: envoy-ai-gateway-jwt-tokens
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/jwt-tokens.json
    resyncPeriod: 5m
  # The gamified "App Scoreboard" (ADR-0060, Phase 3): budget-burn gauge,
  # leaderboards, token-intensity heatmap, per-actor spend histogram, daily-spend
  # heartbeat, plan-share pie, firing-alerts list, Tempo request traces, a
  # dashboard-list hub + AI-governance news/narration. Same Mimir metrics
  # (ADR-0058) + Tempo + unified alerting. $budget variable (default $3000/mo).
  - name: envoy-ai-gateway-scoreboard
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/scoreboard.json
    resyncPeriod: 5m
  # LIVE rate-limit quota: who is consuming the gateway and how much of their
  # budget, read from the limiter's per-account counters in redis-ha (ADR-0070).
  # Mimir leaderboard (prometheus-redis-exporter → gateway_ratelimit_spend_micro_usd)
  # + a direct redis-datasource census. Raw consumption (no quota-% overlay).
  - name: envoy-ai-gateway-ratelimit-quota
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/ratelimit-quota.json
    resyncPeriod: 5m
  # Auth-scoped personal usage dashboard (ADR-0077). All LogQL queries
  # filter on email="${__user.email}" — a server-controlled Grafana
  # built-in variable. No Grafana config changes needed.
  - name: envoy-ai-gateway-my-usage
    folderRef: my-usage
    file: files/envoy-ai-gateway/my-usage.json
  # Phoenix-style global chat overview (embeddings excluded), no input
  # variables. Loki/Mimir aggregates + a live Tempo trace feed reading the
  # AI Gateway ext-proc's OpenInference spans (full request/response content
  # per trace, click to open) — ADR-0077.
  - name: envoy-ai-gateway-chat-overview
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/chat-overview.json
    resyncPeriod: 5m
  # Phoenix-style per-user chat view. $user picker sourced from the Keycloak
  # read-only Postgres datasource (ADR-0063, rawSql variable). Hero is a
  # per-request Loki log (model/status/tokens/cost/latency) filtered by the
  # user's email label — metadata only. Per-user CONTENT is NOT shown: the AIEG
  # ext-proc runs before Authorino (filter #1, confirmed live), so its Tempo
  # spans carry no identity and can't be filtered per person (ADR-0079,
  # supersedes ADR-0078). Use envoy-ai-gateway-chat-overview to read content.
  - name: envoy-ai-gateway-chats-by-user
    folderRef: ai-gateway
    file: files/envoy-ai-gateway/chats-by-user.json
    resyncPeriod: 5m
  # Alloy collector health (metrics/logs/traces pipelines, OTLP receiver,
  # clustering). Targets confirmed alloy_*/prometheus_remote_storage_*/
  # loki_write_*/otelcol_receiver_* series; datasource UID hardcoded to `mimir`.
  - name: alloy-collector
    folderRef: collectors
    file: files/collectors/alloy-collector.json
    resyncPeriod: 5m
  # Tempo single-binary health (ingest, queries, flushes, S3 backend). Targets
  # confirmed tempo_*/tempodb_* series for our single-binary deployment.
  - name: tempo-single-binary
    folderRef: collectors
    file: files/collectors/tempo-single-binary.json
    resyncPeriod: 5m

  # vLLM engine internals — latency (TTFT / inter-token / prefill / e2e), token
  # throughput, queue depth, KV-cache usage, prefix-cache hit rate, preemptions.
  # Covers the `vllm:*` exporter only, i.e. the qwen3-8b-fast tier — the
  # llama.cpp tier publishes a disjoint `llamacpp:*` namespace and is NOT on this
  # board. Scraped via each model's ServiceMonitor, which must authenticate
  # because the engines require a Bearer on /metrics (ADR-0097).
  # Grafana's home page (ADR-0099). ⚠️ uid `adorsys-platform-home` is referenced
  # by grafana.ini [users] home_page in ai-helm-values — renaming it silently
  # breaks the landing page for everyone.
  - name: platform-home
    folderRef: platform
    file: files/platform/home.json
    resyncPeriod: 5m

  - name: vllm-dashboard
    folderRef: model-serving
    file: files/vllm/vllm-dashboard.json
    resyncPeriod: 5m

  # llama.cpp engine — the other half of the fleet. Its exporter publishes a
  # DISJOINT `llamacpp:*` namespace, so it cannot share the vLLM board.
  # ⚠️ Two structural differences, both verified against live Mimir:
  #   - it emits NO `model_name` label, so panels select on the scrape `job`;
  #   - it exports no histograms, so latency panels are AVERAGES, not percentiles.
  - name: llamacpp-dashboard
    folderRef: model-serving
    file: files/llamacpp/llamacpp-dashboard.json
    resyncPeriod: 5m

  # GPU fleet ↔ model attribution. Bespoke (ADR-0045 §3) because no community
  # board can know which of OUR models is on which card. The join works only
  # because the dcgm-exporter ServiceMonitor sets honorLabels: true, so DCGM's
  # own pod/namespace labels — describing the WORKLOAD, not the exporter —
  # survive the scrape.
  - name: gpu-fleet
    folderRef: model-serving
    file: files/gpu/gpu-fleet.json
    resyncPeriod: 5m

  # Commodity per-card health (clocks, temperature, power, utilisation).
  # ADOPTED community board (ADR-0045 §2): grafana.com gnetId 12239 revision 2,
  # "NVIDIA DCGM Exporter Dashboard" — NVIDIA's own, ~38M downloads. Verified
  # before adoption: all 6 metrics it queries exist in our Mimir, and it selects
  # on `instance`/`gpu` rather than the 2.x-era capitalised `Hostname` that DCGM
  # 4.x no longer emits, so its legends actually resolve. All 8 queries returned
  # live data.
  # ⚠️ VENDORED, not gnetId-imported: this chart has no gnetId source, so the
  # export was patched at vendor time — ${DS_PROMETHEUS} replaced with the mimir
  # UID and the __inputs/__requires import scaffolding stripped, since only
  # Grafana's UI importer resolves those. Re-apply that patch if you re-vendor.
  - name: nvidia-dcgm-12239
    folderRef: model-serving
    file: files/gpu/nvidia-dcgm-12239.json
    resyncPeriod: 5m

# Future: datasources, contactPoints, alertRules can land here.
datasources: []

# ---------------------------------------------------------------------------
# Unified alerting → Discord (ADR-0059). Provisioned via grafana-operator CRs
# (templates/alerting*.yaml) so it survives stateless-Grafana rolls. The
# webhook URL comes from ESO (populate the SM property below); until then the
# contact point keeps a placeholder url (rules evaluate, delivery is a no-op).
# Rules use the compact shape {datasourceUid, expr, op, threshold, ...}; the
# template expands each into Grafana's A=query / B=reduce / C=threshold model.
# Thresholds are first-pass — tune live once alerts are firing.
# ---------------------------------------------------------------------------
alerting:
  enabled: true
  resyncPeriod: 5m

  # Contact points. The FIRST is the default receiver for everything; later ones
  # are reached only via `notificationPolicy.routes` matchers below.
  contactPoints:
    # ── The DEFAULT receiver: the team channel ──────────────────────────────
    # Renamed 2026-07-27. `discord` used to be the project lead's personal
    # webhook; it is now the TEAM channel, and his moved to `discord-stephane`
    # below. The canonical name follows the canonical destination.
    #
    # It deliberately keeps the existing k8s Secret and ssegning-aws property, so
    # the switchover is a VALUE change in Secrets Manager rather than a rename
    # here: nothing is ever pointed at a property that does not exist, and there
    # is no window where the default receiver is missing and the whole policy
    # tree collapses (which is exactly what happened on 2026-07-27).
    #
    # ⚠️ ACTION: update `grafana_discord_webhook_url` in ssegning-aws to the TEAM
    # webhook. Until that value changes, alerts keep going to the lead's channel —
    # i.e. today's behaviour, not an outage.
    - name: discord
      type: discord
      settings:
        title: "{{ .CommonLabels.alertname }} [{{ .Status }}]"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
      webhookSecret:
        enabled: true
        secretName: grafana-discord-webhook
        key: url
        secretStore: ssegning-aws
        remoteKey: ai/camer/digital/prod/env
        property: grafana_discord_webhook_url
        refreshInterval: 1h

    # ── The project lead's personal channel ─────────────────────────────────
    # Was `discord` (the default) until 2026-07-27. Kept as a named destination
    # so a future route can target it deliberately; nothing routes here today.
    #
    # ⚠️ DISABLED until `grafana_discord_webhook_url_stephane` exists in
    # ssegning-aws at ai/camer/digital/prod/env. This is not merely "it will not
    # deliver": a GrafanaContactPoint whose secret is missing goes InvalidSpec,
    # and a notification-policy route naming a receiver that does not exist makes
    # Grafana reject the ENTIRE policy tree —
    #     [PUT /v1/provisioning/policies][400] receiver '...' does not exist
    # — taking the default route down with it and stopping ALL alert delivery.
    # Observed live on 2026-07-27. The chart now skips a disabled contact point,
    # its ExternalSecret and any route referencing it, so the policy stays valid
    # without it; the secret-first order still applies.
    #
    # ENABLED 2026-07-27, in the safe order: the property was created in
    # ssegning-aws and its ExternalSecret confirmed `SecretSynced=True` FIRST,
    # then this flag was flipped. Verifying that precondition is exactly why the
    # ExternalSecret renders independently of this flag.
    - name: discord-stephane
      enabled: true
      type: discord
      settings:
        title: "{{ .CommonLabels.alertname }} [{{ .Status }}]"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
      webhookSecret:
        enabled: true
        secretName: grafana-discord-webhook-stephane
        key: url
        secretStore: ssegning-aws
        remoteKey: ai/camer/digital/prod/env
        property: grafana_discord_webhook_url_stephane
        refreshInterval: 1h

  notificationPolicy:
    groupBy: [grafana_folder, alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # No child routes today: the team channel is now the DEFAULT receiver, so
    # everything already lands there and a `team: model-serving` route pointing at
    # the same destination would be redundant.
    #
    # The nine model/GPU rules still carry `team: model-serving`. That is not
    # dead weight — it is what silences and dashboard filters key on, and adding a
    # route later is a three-line change:
    #
    #   routes:
    #     - receiver: discord-stephane
    #       objectMatchers:
    #         - ["team", "=", "model-serving"]
    #
    # ⚠️ A route may only name an ENABLED contact point. The chart filters routes
    # to enabled receivers precisely because one dangling reference invalidates
    # the whole policy tree.
    routes: []

  ruleGroups:
    # ── Model serving on the GPU fleet (ADR-0094/0095) ────────────────────
    # Every rule here carries `team: model-serving`, which is what routes it to
    # the discord-gpu contact point (notificationPolicy.routes above). The label
    # is the routing key — drop it and the alert silently goes to the default
    # channel instead.
    #
    # Expressions were each run against live Mimir before being written here;
    # an alert on a metric that does not exist is worse than no alert, because
    # noDataState: OK makes it permanently, invisibly green.
    - name: model-serving-health
      folderRef: model-serving
      interval: 1m
      rules:
        # `up` is namespace-scoped rather than a list of job names so a model
        # added tomorrow is covered without touching this rule. `or vector(0)`
        # handles the case where the scrape targets vanish entirely (namespace
        # or ServiceMonitors gone) — bare min() would return no data, and
        # noDataState: OK would keep the very alert meant to catch that green.
        #
        # ⚠️ COVERS ONLY MODELS THAT EXPOSE /metrics. The `zimage` engine
        # (ADR-0100, replaced by localai per ADR-0102) had no Prometheus
        # endpoint, so the second rule below existed for structural coverage.
        # With localai metrics are back — but the second rule is kept as a
        # safety net for any future engine without /metrics.
        - uid: ms-model-down
          title: Model serving — a scraped model is down
          datasourceUid: mimir
          expr: 'min(up{namespace="inference"}) or vector(0)'
          fromSeconds: 600
          op: lt
          threshold: 1
          for: 5m
          severity: critical
          labels:
            team: model-serving
          summary: "A model on the GPU fleet is not being scraped — the pod is down, crash-looping, or its metrics endpoint is unreachable."
          description: "One model per GPU and no HA, so this is a full outage of that tier. Check `kubectl get pods -n inference` and the model-wont-load-or-oom runbook."

        # Liveness for EVERY model, including the ones with no /metrics, read
        # from kube-state-metrics instead of from the engine. One series per
        # model Deployment; 1 when the pod is Ready, 0 when it is not.
        #
        # ⚠️ Deployment-scoped on purpose. `kube_pod_status_ready` looked like
        # the obvious metric and is WRONG here: it also reports the completed
        # seed Job pods, which sit at 0 forever, so a `min()` over it would be
        # permanently firing. Verified against live Mimir before writing:
        # `kube_deployment_status_replicas_available{namespace="inference"}`
        # returns exactly the model Deployments (openmythos-27b-main,
        # qwen3-8b-fast-main at the time of writing) and nothing else.
        - uid: ms-model-unavailable
          title: Model serving — a model has no available replica
          datasourceUid: mimir
          expr: 'min(kube_deployment_status_replicas_available{namespace="inference"}) or vector(0)'
          fromSeconds: 600
          op: lt
          threshold: 1
          for: 5m
          severity: critical
          labels:
            team: model-serving
          summary: "A model Deployment on the GPU fleet has zero available replicas — it is down, crash-looping, or stuck waiting for a GPU."
          description: "Engine-independent, so it catches image-generation models too (they publish no /metrics). One model per GPU and no HA, so this is a full outage of that tier. Check `kubectl get pods -n inference`, then the model-wont-load-or-oom and model-pod-pending-no-gpu runbooks."

    - name: model-serving-saturation
      folderRef: model-serving
      interval: 1m
      rules:
        # llama.cpp defers a request when every slot is busy. Sustained
        # deferral means the tier is saturated — and there is no autoscaling,
        # so it will not clear itself.
        #
        # ⚠️ DORMANT since 2026-07-27: no model currently runs on llama.cpp
        # (OpenMythos-27B was the only one, ADR-0100). `or vector(0)` keeps this
        # a harmless flat zero rather than no-data, and it starts working again
        # by itself the moment a GGUF model is added back. Same for the
        # llamacpp-dashboard, which is intentionally empty until then.
        - uid: ms-llamacpp-queueing
          title: Model serving — llama.cpp requests queueing
          datasourceUid: mimir
          expr: "max(llamacpp:requests_deferred) or vector(0)"
          fromSeconds: 900
          op: gt
          threshold: 0
          for: 15m
          severity: warning
          labels:
            team: model-serving
          summary: "llama.cpp has been deferring requests for 15m — every slot busy; the quality tier is saturated."
        - uid: ms-vllm-queueing
          title: Model serving — vLLM requests waiting
          datasourceUid: mimir
          expr: "max(vllm:num_requests_waiting) or vector(0)"
          fromSeconds: 900
          op: gt
          threshold: 0
          for: 15m
          severity: warning
          labels:
            team: model-serving
          summary: "vLLM has had requests waiting in queue for 15m — the fast tier is saturated."
        # KV cache full forces preemption, which shows up to users as latency
        # rather than errors — worth knowing before they report it.
        - uid: ms-vllm-kv-pressure
          title: Model serving — vLLM KV cache near full
          datasourceUid: mimir
          expr: "max(vllm:kv_cache_usage_perc) or vector(0)"
          fromSeconds: 900
          op: gt
          threshold: 0.9
          for: 15m
          severity: warning
          labels:
            team: model-serving
          summary: "vLLM KV cache above 90% for 15m — requests will start being preempted, degrading latency."

    # GPU hardware. Thresholds are set against measured idle behaviour on these
    # cards (38–42 °C, ~12 W idle, 70 W cap) — not copied from a generic board.
    - name: model-serving-gpu
      folderRef: model-serving
      interval: 1m
      rules:
        - uid: ms-gpu-temp
          title: GPU — temperature high
          datasourceUid: mimir
          expr: "max(DCGM_FI_DEV_GPU_TEMP) or vector(0)"
          fromSeconds: 600
          op: gt
          threshold: 85
          for: 10m
          severity: warning
          labels:
            team: model-serving
          summary: "A GPU has been above 85°C for 10m — Ada throttles near 88°C, so throughput will drop before anything errors."
        - uid: ms-gpu-vram
          title: GPU — VRAM nearly exhausted
          datasourceUid: mimir
          expr: "max(DCGM_FI_DEV_FB_USED) or vector(0)"
          fromSeconds: 900
          op: gt
          threshold: 19500
          for: 15m
          severity: warning
          labels:
            team: model-serving
          summary: "A GPU is above 19500 of 20475 MiB — no headroom left; the next model restart or context increase will fail to allocate."
        # Remapped rows are the early warning for failing VRAM. On rented
        # hardware this is the signal to open a Hetzner ticket, not to tune.
        - uid: ms-gpu-mem-faults
          title: GPU — uncorrectable memory faults
          datasourceUid: mimir
          expr: "max(DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS) or vector(0)"
          fromSeconds: 600
          op: gt
          threshold: 0
          for: 5m
          severity: critical
          labels:
            team: model-serving
          summary: "Uncorrectable VRAM rows remapped — the card's memory is degrading. Rented hardware: raise it with Hetzner."
        # `count() or vector(0)` rather than a bare gauge: if dcgm-exporter dies
        # the series vanish, and noDataState: OK would keep this green.
        - uid: ms-gpu-telemetry-down
          title: GPU — telemetry missing
          datasourceUid: mimir
          expr: "count(DCGM_FI_DEV_GPU_TEMP) or vector(0)"
          fromSeconds: 900
          op: lt
          threshold: 2
          for: 15m
          severity: warning
          labels:
            team: model-serving
          summary: "Fewer than 2 GPUs are reporting DCGM telemetry — dcgm-exporter is down on a node, or a card has dropped off the bus."

    - name: model-serving-errors
      folderRef: model-serving
      interval: 1m
      rules:
        - uid: ms-vllm-errors
          title: Model serving — vLLM request errors
          datasourceUid: mimir
          expr: 'sum(rate(vllm:request_success_total{finished_reason="error"}[10m])) or vector(0)'
          fromSeconds: 600
          op: gt
          threshold: 0
          for: 10m
          severity: warning
          labels:
            team: model-serving
          summary: "vLLM is finishing requests with finished_reason=error — check the model pod logs."

    - name: ai-gateway-health
      folderRef: ai-gateway
      interval: 1m
      rules:
        - uid: aigw-no-traffic
          title: AI Gateway — no attributed traffic (15m)
          datasourceUid: mimir
          # `or vector(0)`: if the metric has NO series (pipeline dead / fresh
          # rollout), bare rate() returns no data → noDataState OK → the alert
          # meant to catch exactly that would stay green. Default to 0 so the
          # `< threshold` condition actually trips.
          expr: sum(rate(loki_process_custom_gen_ai_requests[15m])) or vector(0)
          fromSeconds: 1200
          op: lt
          threshold: 0.0001
          for: 15m
          severity: critical
          summary: "No AI Gateway requests recorded in 15m — gateway down or the attribution/metrics pipeline is broken."

    - name: ai-gateway-errors
      folderRef: ai-gateway
      interval: 1m
      rules:
        - uid: aigw-5xx-surge
          title: AI Gateway — 5xx surge (5m)
          datasourceUid: loki
          datasourceType: loki
          expr: 'sum(rate({service_name="envoy-ai-gateway"} | json | response_code=~"5.."[5m]))'
          fromSeconds: 600
          op: gt
          threshold: 0.2
          for: 10m
          severity: warning
          summary: "AI Gateway 5xx rate > 0.2/s for 10m."
        - uid: aigw-p95-latency
          title: AI Gateway — p95 latency high (5m)
          datasourceUid: loki
          datasourceType: loki
          expr: 'quantile_over_time(0.95, {service_name="envoy-ai-gateway"} | json | unwrap duration | __error__="" [5m]) by ()'
          fromSeconds: 600
          op: gt
          threshold: 120000
          for: 10m
          severity: warning
          summary: "AI Gateway p95 latency > 120s for 10m (LLM streaming is slow; ~40s is normal here — this catches genuinely stuck/timeout requests)."

    - name: ai-gateway-cost
      folderRef: ai-gateway
      interval: 5m
      rules:
        - uid: cost-daily-high
          title: AI Gateway — daily spend high
          datasourceUid: mimir
          expr: sum(increase(loki_process_custom_gen_ai_usage_cost_micro_usd[24h]))/1e6
          fromSeconds: 86400
          op: gt
          threshold: 300
          for: 30m
          severity: warning
          summary: "AI Gateway spend over the last 24h exceeded $300."
        - uid: cost-monthly-burn
          title: AI Gateway — monthly burn high
          datasourceUid: mimir
          expr: sum(increase(loki_process_custom_gen_ai_usage_cost_micro_usd[30d]))/1e6
          fromSeconds: 2592000
          op: gt
          threshold: 6000
          for: 1h
          severity: warning
          summary: "AI Gateway 30-day spend exceeded $6000 (budget knob — set to your actual monthly budget; run-rate ~$5k)."
        # Per-actor: fires when a SINGLE person's own rolling 30d spend crosses
        # their OWN plan's monthly cap. Free-tier budget is $30, alerted in TWO
        # TIERS — a $30 WARNING (reached budget) and a $50 CRITICAL (well over);
        # pro is $200. service/internal are uncapped by design and excluded.
        # Split into ONE RULE PER (plan, tier) so the query VALUE is the dollar
        # spend and the threshold is a real dollar figure — this lets the message
        # state the actual "$X spent of $Y budget" instead of an opaque bare
        # percentage (PromQL has no per-series threshold, so a single unified
        # rule could only compare a % and couldn't show dollars). `$values.B.Value`
        # is the reduced dollar figure; `printf "%.2f"` formats it (Grafana
        # annotation templates are Go text/template — printf is a builtin).
        - uid: cost-actor-budget-free-warn
          title: AI Gateway — free-tier actor reached budget ($30)
          datasourceUid: mimir
          expr: >-
            sum by (email, display_name)
              (increase(loki_process_custom_gen_ai_usage_cost_micro_usd{billing_plan="free"}[30d])) / 1e6
          fromSeconds: 2592000
          op: gt
          threshold: 30
          for: 0m
          severity: warning
          summary: >-
            ⚠️ {{ $labels.display_name }} ({{ $labels.email }}) has spent
            ${{ printf "%.2f" $values.B.Value }} in the last 30 days —
            reached their $30.00/month free-tier budget.
          description: >-
            Per-actor ROLLING 30-day spend (ADR-0058 precomputed Mimir metric)
            reached the free-tier monthlyBudgetUsd cap of $30 (warning tier; the
            $50 rule below escalates to critical). Value = dollars spent (trailing
            30d). ⚠️ This is cumulative trailing-30d spend, NOT the same window the
            rate limiter enforces against (ADR-0070's fixed 30-day epoch bucket in
            redis, which resets on a schedule, not rolling) — someone can be over
            budget here while their LIVE enforcement budget is well under cap.
            Check the AI Gateway — rate-limit quota dashboard for the live state.
        - uid: cost-actor-budget-free
          title: AI Gateway — free-tier actor well over budget ($50)
          datasourceUid: mimir
          expr: >-
            sum by (email, display_name)
              (increase(loki_process_custom_gen_ai_usage_cost_micro_usd{billing_plan="free"}[30d])) / 1e6
          fromSeconds: 2592000
          op: gt
          threshold: 50
          for: 0m
          severity: critical
          summary: >-
            🚨 {{ $labels.display_name }} ({{ $labels.email }}) has spent
            ${{ printf "%.2f" $values.B.Value }} in the last 30 days —
            well over their $30.00/month free-tier budget.
          description: >-
            Per-actor ROLLING 30-day spend (ADR-0058 precomputed Mimir metric)
            passed $50 — well over the free-tier monthlyBudgetUsd cap of $30
            (critical escalation of the $30 warning above). Value = dollars spent
            (trailing 30d). See the AI Gateway — actor consumption / chats-by-user
            dashboards for the breakdown. ⚠️ This is cumulative trailing-30d spend,
            NOT the same window the rate limiter enforces against (ADR-0070's fixed
            30-day epoch bucket in redis, which resets on a schedule, not rolling)
            — someone can be over here while their LIVE enforcement budget is well
            under cap. Check the AI Gateway — rate-limit quota dashboard for their
            actual current enforcement state before assuming they're blocked.
        - uid: cost-actor-budget-pro
          title: AI Gateway — pro actor over budget
          datasourceUid: mimir
          expr: >-
            sum by (email, display_name)
              (increase(loki_process_custom_gen_ai_usage_cost_micro_usd{billing_plan="pro"}[30d])) / 1e6
          fromSeconds: 2592000
          op: gt
          threshold: 200
          for: 0m
          severity: critical
          summary: >-
            🚨 {{ $labels.display_name }} ({{ $labels.email }}) has spent
            ${{ printf "%.2f" $values.B.Value }} in the last 30 days —
            over their $200.00/month pro budget.
          description: >-
            Per-actor ROLLING 30-day spend (ADR-0058 precomputed Mimir metric)
            exceeded the pro monthlyBudgetUsd cap of $200. Value = dollars spent
            (trailing 30d). Same rolling-vs-enforcement caveat as the free-tier
            rule above — check the AI Gateway — rate-limit quota dashboard for
            the live enforcement state.

    - name: stack-health
      folderRef: collectors
      interval: 1m
      rules:
        - uid: observability-component-down
          title: Observability component down
          datasourceUid: mimir
          expr: count(up{namespace="observability"} == 0) or vector(0)
          fromSeconds: 600
          op: gt
          threshold: 0
          for: 5m
          severity: critical
          summary: "One or more observability scrape targets are down (up==0)."

    - name: cluster-health
      folderRef: collectors
      interval: 1m
      rules:
        - uid: pod-crashlooping
          title: Pod crashlooping
          datasourceUid: mimir
          expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"observability|converse|envoy-gateway-system|apps|lightbridge-agents"}[15m]))
          fromSeconds: 900
          op: gt
          threshold: 3
          for: 10m
          severity: warning
          summary: "A pod restarted >3 times in 15m (crashloop)."
        - uid: node-not-ready
          title: Node not ready
          datasourceUid: mimir
          expr: min(kube_node_status_condition{condition="Ready",status="true"})
          fromSeconds: 600
          op: lt
          threshold: 1
          for: 5m
          severity: critical
          summary: "A Kubernetes node is not Ready."
        - uid: node-memory-high
          title: Node memory pressure
          datasourceUid: mimir
          expr: max(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          fromSeconds: 600
          op: gt
          threshold: 0.92
          for: 10m
          severity: warning
          summary: "A node is using >92% of memory for 10m (baseline runs ~87%)."
