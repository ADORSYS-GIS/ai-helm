{{- /*
argo-workflows App-of-Apps orchestrator — renders two child Application CRs:
  • argo-workflows-secrets — local ExternalSecrets leaf chart (single source, OCI float).
  • argo-workflows-app     — upstream Argo Workflows chart (classic Helm repo, deployed as an ArgoCD
                    source) + the ingress Certificate via the per-env kustomize
                    overlay (second source), + $values ref (third source).
No auth-proxy child — Argo Workflows has NATIVE OIDC (`server.sso` in the
app's values), giving real per-user Keycloak identity + RBAC inside the
Argo Server itself. See ADR-0085.
(The argo-workflows-db child is disabled/dead-code — no metadata DB is
needed; WorkflowTemplates/Workflows are k8s CRs. See ADR-0085.)
All target home-remote (ADR-0017 guard via argo-workflows.argocd.destinationClusterRef).
Rendered as direct Application CRs rather than an ApplicationSet because the
children are fixed + heterogeneous — see ADR-0019 (lightbridge is the canonical
example). See ADR-0085 for the Argo Workflows-specific auth/DB/S3 decisions.
*/ -}}
{{- $a := .Values.argocd -}}
{{- if .Values.secrets.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.secrets.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.secrets.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  source:
    # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
    repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.secrets.chartName | quote }}
    chart: "."
    targetRevision: {{ $a.chartVersionRange | quote }}
    helm:
      releaseName: {{ .Values.secrets.releaseName | quote }}
  destination:
    {{- include "argo-workflows.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.db.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.db.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.db.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  source:
    # OCI chart-float (ADR-0055): full chart path in repoURL + chart "." (#453).
    repoURL: {{ printf "%s/%s" $a.chartRegistry .Values.db.chartName | quote }}
    chart: "."
    targetRevision: {{ $a.chartVersionRange | quote }}
    helm:
      releaseName: {{ .Values.db.releaseName | quote }}
  destination:
    {{- include "argo-workflows.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  {{- with .Values.db.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
{{- if .Values.app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.app.appName }}
  namespace: {{ $a.namespace | default "argocd" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.app.syncWave | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  project: {{ $a.project | quote }}
  sources:
    # Source A — the upstream Argo Workflows workload (classic Helm repo, pinned — not
    # floated like the secrets leaf). releaseName stays `argo-workflows` so workload
    # resource names match the namespace. Values live in ai-helm-values
    # (ADR-0056), read via the $values ref (Source C) — not inline.
    - repoURL: {{ .Values.app.chart.repoURL | quote }}
      chart: {{ .Values.app.chart.name | quote }}
      targetRevision: {{ .Values.app.chart.targetRevision | quote }}
      helm:
        releaseName: {{ .Values.app.releaseName | quote }}
        valueFiles:
          - $values/environments/{{ $a.env | default "prod" }}/values/argo-workflows-app.yaml
        ignoreMissingValueFiles: true
    # Source B — app-scoped deps (ingress Certificate) via the per-env
    # kustomize overlay in ai-helm-values; issuer patched per environment.
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      path: {{ .Values.app.depsOverlay | quote }}
    # Source C — $values ref: the workload values file (ai-helm-values, ADR-0056).
    - repoURL: {{ $a.repoURL | quote }}
      targetRevision: {{ $a.targetRevision | quote }}
      ref: values
  destination:
    {{- include "argo-workflows.argocd.destinationClusterRef" $a.destination | nindent 4 }}
    namespace: {{ $a.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $a.syncPolicy | nindent 4 }}
{{- end }}
