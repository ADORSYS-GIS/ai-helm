# CI / reference values for the upstream Argo Workflows chart
# (https://argoproj.github.io/argo-helm, chart argo-workflows).
#
# This file serves TWO purposes:
# 1. Human reference copy — kept structurally in sync with the PRIVATE
#    ai-helm-values repo file at environments/prod/values/argo-workflows-app.yaml
#    (NOT auto-linted: the top-level repo CI loop only picks up
#    charts/<chart>/ci/*-values.yaml, and this file is named *-app.yaml).
# 2. Documentation of the exact chart schema decisions (native server.sso,
#    S3 artifact repository, RBAC kept minimal for v1).
#
# No metadata DB — Workflows/WorkflowTemplates are k8s CRs. Artifact
# repository: Hetzner Object Storage (S3-compatible), prefix
# `argo-workflows-artifacts/` inside the shared ssegning-k8s-state bucket,
# reusing the platform's existing S3 credentials.
#
# Auth: NATIVE OIDC (server.sso) — no fronting oauth2-proxy needed, unlike
# LakeFS (ADR-0085). Keycloak client `argo-workflows`; the `groups` claim is
# repointed at the same client-role-mapping pattern coder uses
# (customGroupClaimName: argo_workflows_roles) rather than real Keycloak
# realm Groups, for consistency with this repo's existing convention.
#
# RBAC kept minimal for v1: SSO is enabled and any authenticated
# camer-digital user can log in and use the default namespace-scoped
# ServiceAccount; fine-grained per-role RBAC (mapping `admin`/`viewer` from
# argo_workflows_roles to distinct ServiceAccounts via
# workflows.argoproj.io/rbac-rule) is a follow-up once real usage patterns
# emerge — do not over-build this now.

# CRDs are managed OUT-OF-BAND, not by this chart. The chart's default
# `crds.install: true` + `crds.full: true` ships the (very large) full CRDs
# via a pre-install/pre-upgrade **hook Job** that `kubectl apply`s them
# straight from raw.githubusercontent.com at EVERY sync. Under this cluster's
# default-deny-egress Cilium baseline that Job is unworkable — it races
# Cilium's FQDN-policy programming and timed out on `dial tcp
# 185.199.x.x:443` for hours, failing the whole Application sync (found live
# during ADR-0085 verification). The 8 argoproj.io CRDs are already installed
# cluster-wide as full CRDs (and `keep: true` means an uninstall never
# removes them), so the chart doesn't need to fetch them.
#
# ⚠️ Trade-off: a future argo-workflows chart-version bump that changes the
# CRD schemas will NOT auto-apply them. When bumping the chart, manually
# apply the new CRDs first from a host that has egress, e.g.:
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/argoproj/argo-helm/argo-workflows-<VER>/charts/argo-workflows/files/crds/full/
crds:
  install: false

# Run Argo in single-namespace mode (adds `--namespaced` to the server and
# controller; they operate only in the install namespace `mlops`). WITHOUT
# this the server runs cluster-scoped and the UI lists workflows across ALL
# namespaces (namespace=""), which requires cluster-wide list permission —
# but our SSO RBAC ServiceAccounts (environments/base/deps/argo-workflows/
# rbac.yaml) are bound via *namespaced* RoleBindings (mlops only), so the UI
# failed with `code:7 Permission denied, not allowed to list workflows in
# namespace ""`. In namespaced mode the UI queries `mlops`, which the SSO
# SAs are allowed. Verified live: the admin/viewer SAs CAN list workflows in
# mlops but NOT --all-namespaces. The chart's admin/edit/view aggregate
# ClusterRoles stay ClusterRoles under singleNamespace, so the rbac.yaml
# RoleBindings (roleRef ClusterRole/argo-workflows-{admin,view}) are
# unaffected. Found live during ADR-0085 verification.
singleNamespace: true

server:
  authModes:
    - sso
  sso:
    enabled: true
    issuer: "https://auth.verif.fyi/realms/camer-digital"
    clientId:
      name: argo-server-sso
      key: client-id
    clientSecret:
      name: argo-server-sso
      key: client-secret
    redirectUrl: "https://argo-workflows.mlops.ai.camer.digital/oauth2/callback"
    # No explicit scopes override: the `argo-workflows` Keycloak clientScope
    # (charts/keycloak-baseline) is a DEFAULT client scope, always included
    # in every token regardless of what's requested here — no need to name
    # it. The previous `scopes: [groups]` named a scope that doesn't exist
    # on this client at all, which made Keycloak reject the WHOLE OIDC
    # request (invalid_scope), not just omit the claim — that's why nothing
    # worked, not just RBAC. Found live during ADR-0085 verification.
    customGroupClaimName: "argo_workflows_roles"
    # NOTE: `secretWhitelist` is documented in this chart's values.yaml but
    # NOT actually templated by argo-helm 1.0.20's
    # workflow-controller-config-map.yaml (verified against the template
    # source) — setting it here would be a silent no-op. RBAC ServiceAccount
    # selection (see environments/base/deps/argo-workflows/rbac.yaml) is
    # unaffected: it works purely off the rbac-rule/rbac-rule-precedence
    # annotations, independent of secretWhitelist.
    rbac:
      enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - argo-workflows.mlops.ai.camer.digital
    tls:
      - secretName: argo-workflows-tls
        hosts:
          - argo-workflows.mlops.ai.camer.digital

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

artifactRepository:
  archiveLogs: true
  s3:
    bucket: ssegning-k8s-state
    endpoint: nbg1.your-objectstorage.com
    region: us-east-1
    keyFormat: "argo-workflows-artifacts/{{ `{{workflow.namespace}}/{{workflow.name}}/{{pod.name}}` }}"
    accessKeySecret:
      name: argo-workflows-s3-creds
      key: accesskey
    secretKeySecret:
      name: argo-workflows-s3-creds
      key: secretkey
