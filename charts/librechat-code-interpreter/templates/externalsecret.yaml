{{/*
ExternalSecret is not a bjw-common resource type, so this stays a small
custom template — everything else in this chart (Deployments, Services,
NetworkPolicies, the PVC, the package-init Job) is expressed through
bjw-template (charts/bjw-template, aliased `codeapi` — see values.yaml)
instead of hand-rolled manifests.

Target name is pinned to `codeapi-secrets` (matching codeapi.fullnameOverride
in values.yaml) so it doesn't depend on computing the bjw-template release
name here. Every key below is read via secretKeyRef by env vars under
.Values.codeapi.controllers.*.containers.*.env.
*/}}
{{- if .Values.codeApiSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codeapi-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.codeApiSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.codeApiSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: codeapi-secrets
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .Values.codeApiSecrets.remoteRefs }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        property: {{ $ref.property | quote }}
    {{- end }}
{{- end }}
