{{/*
Replaces the upstream chart's templates/secrets.yaml (which rendered a plain
Opaque Secret straight from values.yaml — committed-to-git plaintext, and would
fight ArgoCD selfHeal against an ExternalSecret targeting the same object).

Produces the SAME Secret name (`codeapi.fullname`-secrets) and the SAME keys
every other template in this chart already reads via secretKeyRef, so nothing
else needs to change: codeapi-internal-service-token, codeapi-egress-grant-secret,
codeapi-execution-manifest-private-key, redis-password, minio-access-key,
minio-secret-key. "minio-*" is a legacy name from the upstream chart's Bitnami
MinIO integration — we always run fileServer.s3.enabled=true (Hetzner Object
Storage), so these are really the S3 access/secret key.
*/}}
{{- if .Values.codeApiSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "codeapi.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeapi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.codeApiSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.codeApiSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "codeapi.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .Values.codeApiSecrets.remoteRefs }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        property: {{ $ref.property | quote }}
    {{- end }}
{{- end }}
