apiVersion: v2
name: librechat-code-interpreter
description: >-
  Self-hosted ClickHouse/code-interpreter — the sandboxed code-execution
  service behind LibreChat's Code Interpreter agent capability. Vendored and
  adapted from upstream (helm/codeapi) per ADR-0122: no bundled Redis/MinIO
  (reuses the shared redis-ha + Hetzner Object Storage), ExternalSecret-backed
  secrets instead of a plaintext Secret template, and NsJail (not KVM
  microVM) sandbox isolation.
type: application
version: 0.1.0
appVersion: "2.0.0"
keywords:
  - code-execution
  - sandbox
  - librechat
home: https://github.com/clickhouse/code-interpreter
maintainers:
  - name: adorsys-gis
    url: https://github.com/ADORSYS-GIS
